name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  game:
    name: 게임 회귀 테스트 · 이스케이프 감사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 저장 파일 이스케이프 감사
        run: npm run audit
      - name: 전체 회귀 테스트
        run: npm test

  # 클라우드 저장·검증 리더보드는 당분간 접어 두었습니다.
  # 서버를 다시 켤 때는 server/README.md의 절차대로 로컬 Wrangler 스모크를
  # 직접 돌린 뒤, 그때 이 잡을 되살리면 됩니다. (게임 CI만 돌리는 상태)
