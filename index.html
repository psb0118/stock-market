<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#17202b" />
<!-- 클라우드 저장·리더보드 Worker 주소. 비워 두면 기능이 꺼집니다. -->
<meta name="cloud-api" content="" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<title>머니 플레이그라운드</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:#f5f3ee;color:#18212f}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.side{background:#17202b;color:white;padding:20px;position:sticky;top:0;height:100vh}
.logo{font-size:19px;font-weight:800;margin-bottom:8px;white-space:nowrap}
.sub{font-size:13px;color:#cbd5e1;line-height:1.4;margin-bottom:18px}
.nav{display:grid;gap:8px}
.nav button{background:transparent;color:#dbe4ef;text-align:left}
.nav button.on{background:#f7c948;color:#17202b;font-weight:800}
button{border:0;border-radius:7px;min-height:38px;padding:0 12px;cursor:pointer;background:#1f2937;color:white}
button:disabled{opacity:.45;cursor:not-allowed}
main{padding:22px}
.breaking{display:none;margin-bottom:14px;border-radius:8px;padding:13px 14px;background:#111827;color:white;border-left:7px solid #f7c948;box-shadow:0 10px 28px #0002}
.breaking.show{display:block}
.breaking b{color:#f7c948}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.box,.card,.product,.news,.row{background:#fffdf8;border:1px solid #d8ded4;border-radius:8px;padding:14px;box-shadow:0 10px 28px #0001}
.box small{color:#667085}.box b{display:block;font-size:20px;margin-top:8px;overflow-wrap:anywhere}
.page{display:none}
.page.on{display:block}
.head{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:12px}
h1{margin:0 0 5px;font-size:28px}
h2{margin:0 0 8px}
p{margin:0;color:#667085;line-height:1.45}
.notice{background:#fff7d6;border:1px solid #edd07b;color:#604400;border-radius:8px;padding:10px 12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.top{display:flex;justify-content:space-between;gap:8px}
.pill{display:inline-flex;align-items:center;border-radius:999px;background:#edf2f7;color:#334155;font-size:12px;padding:5px 8px;white-space:nowrap}
.price{font-size:25px;font-weight:900;margin:12px 0 3px}
.up{color:#0f766e}.down{color:#b42318}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}
.mini div,.product-grid div{border:1px solid #d8ded4;background:#fafafa;border-radius:7px;padding:8px}
.mini small,.product-grid small{display:block;color:#667085;margin-bottom:5px}
.trade{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bank-trade{grid-template-columns:1fr 1fr}
.bank-trade input{grid-column:1 / -1}
.buy{background:#0f766e}.sell{background:#b42318}.ghost{background:#e7ebef;color:#18212f}
.spark{height:28px;margin-top:10px}
.spark svg{display:block;width:100%;height:28px}
.section{margin-top:22px}
.section h3{margin:0 0 10px}
.panel{background:#fffdf8;border:1px solid #d8ded4;border-radius:8px;padding:14px;box-shadow:0 10px 28px #0001}
.field{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.field label{display:grid;gap:4px;font-size:12px;color:#667085}
select{min-width:0;border:1px solid #cbd5e1;border-radius:7px;padding:0 9px;min-height:38px;background:white}
.goal{display:grid;gap:6px;margin-bottom:10px}
.goal small{color:#667085}
.bar{height:8px;background:#e7ebef;border-radius:999px;overflow:hidden}
.bar span{display:block;height:100%;background:#0f766e}
.hof{display:grid;gap:6px;font-size:13px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #f7c948;outline-offset:2px}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.product-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
input{min-width:0;border:1px solid #cbd5e1;border-radius:7px;padding:0 9px;min-height:38px}
.wide{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}
.feed,.portfolio,.info-list{display:grid;gap:10px}
.news.locked{background:#fffaf0;border-color:#e7c066}
.product.locked{opacity:.62;background:#f6f7f9}
.product.locked.holding{opacity:1;background:#fffdf8}
.news.good{border-color:#0f766e;background:#f0fdf4}
.news-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.row{display:grid;grid-template-columns:1fr repeat(4,auto);gap:10px;align-items:center}
.log-box{margin-top:20px;max-height:200px;overflow-y:auto;background:#fafafa;padding:10px;border:1px solid #d8ded4;border-radius:8px;}
.log-item{font-size:13px;color:#475569;margin-bottom:4px;font-family:monospace;}
/* 자산 대시보드 */
.dash{display:grid;gap:12px}
.dash-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.dash-top small{color:#667085}
.dash-total{display:block;font-size:clamp(22px,5vw,28px);line-height:1.25;margin-top:4px;overflow-wrap:anywhere}
.dash-meta{display:flex;gap:6px;flex-wrap:wrap}
.trend{height:118px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:6px}
.trend svg{display:block;width:100%;height:100%}
.trend-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:100%;color:#94a3b8;font-size:12px;text-align:center;line-height:1.4}
/* 알림·토스트·모달 */
.bell{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:34px;margin-top:10px;background:#22303f;font-size:13px}
.badge{display:none;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#f7c948;color:#17202b;font-size:11px;font-weight:800}
.toast-wrap{position:fixed;right:14px;bottom:18px;display:grid;gap:8px;z-index:60;max-width:320px;max-height:calc(100vh - 36px);overflow:hidden}
.toast{background:#111827;color:#fff;border-left:5px solid #f7c948;border-radius:8px;padding:10px 12px;box-shadow:0 10px 24px #0003;font-size:13px;animation:toastIn .18s ease-out}
.toast b{color:#f7c948;display:block;margin-bottom:2px}
@keyframes toastIn{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.modal{position:fixed;inset:0;background:#0b1220aa;display:none;align-items:center;justify-content:center;z-index:70;padding:16px}
.modal.on{display:flex}
.modal-box{background:#fffdf8;border-radius:12px;max-width:580px;width:100%;max-height:86vh;overflow:auto;padding:18px;box-shadow:0 24px 60px #0005}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.modal-head h2{margin:0;font-size:20px}
.modal-close{background:#e7ebef;color:#18212f;min-height:34px;flex:0 0 auto;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px}
.kpi{border:1px solid #d8ded4;background:#fafafa;border-radius:8px;padding:10px}
.kpi small{display:block;color:#667085;font-size:12px}
.kpi b{display:block;margin-top:4px;font-size:16px;overflow-wrap:anywhere}
/* 종목 도구막대 */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input{flex:1 1 170px}
.toolbar select{flex:0 0 auto}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 12px;border-radius:9px;background:#e7ebef;color:#18212f;font-size:13px}
.chip.on{background:#17202b;color:#fff}
.card .star{background:transparent;color:#cbd5e1;font-size:20px;min-height:auto;padding:0 4px;line-height:1}
.card .star.on{color:#f7c948}
/* 성과·미션·자동화 */
.mission{display:grid;gap:6px;border-bottom:1px dashed #e2e8f0;padding:8px 0}
.mission:last-child{border-bottom:0}
.mission-top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.ach{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.ach div{border:1px solid #d8ded4;border-radius:8px;padding:8px 10px;font-size:12px;background:#fafafa}
.ach div.done{border-color:#0f766e;background:#f0fdf4}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:#334155;margin:4px 12px 4px 0}
.switch input{min-height:auto}
.inline-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;align-items:end}
.inline-form label{display:grid;gap:4px;font-size:12px;color:#667085}
.journal{display:grid;gap:6px;font-size:12px}
.journal div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed #e2e8f0;padding:5px 0}
.speed{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid #2b3a4d}
.speed button{min-height:30px;padding:0 9px;background:#22303f;font-size:12px}
.speed button.on{background:#f7c948;color:#17202b;font-weight:800}
.speed span{font-size:12px;color:#cbd5e1;margin-left:auto}
#bottomBar{display:none}
@media(max-width:850px){
  main{padding-bottom:158px}
  #bottomBar{display:block;position:fixed;left:0;right:0;bottom:0;z-index:50;background:#17202b;border-top:1px solid #2b3a4d;padding:6px 8px 8px;color:#e2e8f0}
  .bb-net{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;padding:0 6px 6px;border-bottom:1px solid #2b3a4d}
  .bb-net b{font-size:15px;color:#f7c948}
  .bb-net button{min-height:26px;padding:0 8px;background:#2b3a4d;font-size:12px;color:#e2e8f0}
  .bb-tools{display:flex;gap:6px;align-items:center;margin-left:auto}
  .bb-badge{display:none;margin-left:3px;font-size:11px;color:#f7c948;font-weight:800}
  .side .speed,.side .bell{display:none}
  .bb-nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
  .bb-nav button{background:transparent;color:#cbd5e1;font-size:12px;min-height:34px}
  .bb-nav button.on{background:#f7c948;color:#17202b;font-weight:800}
  .toast-wrap{left:12px;right:12px;bottom:150px;max-width:none}
}
@media(max-width:540px){.kpis{grid-template-columns:1fr 1fr}.ach{grid-template-columns:1fr}.ach div{line-height:1.5}}
.alloc-bar{display:flex;height:14px;border-radius:999px;overflow:hidden;background:#edf2f7}
.alloc-bar span{display:block;height:100%}
.alloc-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:#475569}
.alloc-legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.dash-foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:#475569;border-top:1px dashed #e2e8f0;padding-top:10px}
.kv-row{grid-template-columns:1fr repeat(3,auto)}
.order-row{grid-template-columns:1fr repeat(3,auto)}
.app,main,.page,.panel,.section,.row{min-width:0}
.row{overflow-wrap:anywhere}
.rival-row{grid-template-columns:1fr auto auto auto;align-items:center}
@media(max-width:540px){.rival-row{grid-template-columns:1fr auto}.rival-row b{grid-column:1/-1}.rival-row button{grid-column:2;grid-row:2/4}}
@media(max-width:1200px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:850px){.app{grid-template-columns:minmax(0,1fr)}.side{min-width:0;height:auto;position:sticky;top:0;z-index:5;padding:12px 14px}.logo{font-size:18px}.sub{margin-bottom:10px;font-size:12px}.nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;overflow:visible;padding-bottom:0}.nav button{white-space:nowrap;min-height:34px;padding:0 8px;font-size:12px;background:#22303f}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.wide{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}.field{grid-template-columns:1fr}}
@media(max-width:540px){main{padding:14px;padding-bottom:158px}.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.stats .box:last-child{grid-column:1/-1}.head{display:block}.trade{grid-template-columns:1fr 1fr}}
/* 인라인 4열 행이 모바일에서 화면을 밀어내지 않도록 클래스로 전환한 행 */
@media(max-width:850px){.kv-row,.order-row{grid-template-columns:1fr 1fr}}
@media(max-width:540px){.row,.kv-row,.order-row{grid-template-columns:1fr;gap:6px}.dash{padding:12px}.dash-foot{font-size:12px}}
.cloud-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.rank{display:grid;gap:6px;margin-top:8px}
.rank-row{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:7px 9px;border-radius:7px;background:#f5f8fa;font-size:13px}
.rank-row.me{background:#e7f5ef;font-weight:700}
.rank-row b{color:#0f766e}
.alt-card{border:1px solid #d8ded4;background:#fffdf8;border-radius:8px;padding:12px;margin-bottom:8px}
/* 노동 · 생계 */
#labor-section{scroll-margin-top:18px}
.labor-summary{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.labor-summary p{font-size:12px;margin-top:4px}
.labor-progress{margin-top:10px}
.labor-progress small{display:block;margin-top:4px;font-size:11px;color:#667085}
.labor-alert{background:#fee2e2;border:1px solid #fca5a5;color:#991b1b;border-radius:8px;padding:10px 12px;margin-top:10px;font-size:13px;line-height:1.5}
.labor-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
.labor-card{border:1px solid #d8ded4;background:#fafafa;border-radius:8px;padding:10px;display:grid;gap:6px;min-width:0}
.labor-card.locked{opacity:.62}
.labor-top{display:flex;justify-content:space-between;gap:6px;align-items:center;flex-wrap:wrap}
.labor-top b{font-size:14px}
.labor-card small{font-size:12px;color:#667085}
.labor-meta{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:#667085}
.labor-card button{min-height:34px;font-size:12px}
.labor-note{font-size:11px;color:#667085;margin-top:8px}
.labor-game{display:grid;gap:10px}
.labor-track{position:relative;height:38px;border-radius:8px;background:#e7ebef;border:1px solid #cbd5e1;overflow:hidden}
.labor-target{position:absolute;top:0;bottom:0;background:#bbf7d0}
.labor-target.perfect{background:#34d399}
.labor-cursor{position:absolute;top:0;bottom:0;width:4px;margin-left:-2px;background:#111827;border-radius:2px;box-shadow:0 0 0 2px #ffffffb3}
.labor-game-meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:#475569}
.labor-game-result{font-size:13px;font-weight:700;color:#334155;min-height:20px}
#labor-stop-btn{min-height:52px;font-size:16px}
body.dark .labor-track{background:#243447;border-color:#33465c}
body.dark .labor-game-meta,body.dark .labor-game-result{color:#cbd5e1}
#laborFab{position:fixed;left:20px;right:auto;bottom:18px;z-index:55;display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 15px;border-radius:999px;background:#f7c948;color:#17202b;font-weight:800;font-size:13px;box-shadow:0 6px 20px #0003;border:1px solid #d9a900}
#laborFab.urgent{background:#fee2e2;color:#991b1b;border-color:#fca5a5;box-shadow:0 0 0 4px #f7c94855,0 6px 20px #0003}
/* 노동 버튼은 화면 왼쪽 아래에 둡니다. 데스크톱에서는 사이드바 안쪽 빈 공간에 붙여
   카드의 매수·가입 버튼을 가리지 않고, 오른쪽 아래 알림 토스트와도 겹치지 않습니다. */
@media(min-width:851px){
  .side{display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:thin}
  #laborFab{position:static;left:auto;bottom:auto;margin-top:auto;justify-content:center;flex:0 0 auto}
}
/* 노트북처럼 세로가 짧은 화면에서는 사이드바를 촘촘하게 만들어 노동 버튼과 알림이 함께 보이게 합니다. */
@media(min-width:851px) and (max-height:700px){
  .side{padding:12px 20px}
  .logo{font-size:17px;margin-bottom:4px}
  .sub{font-size:11px;margin-bottom:10px}
  .nav{gap:5px}.nav button{min-height:30px;font-size:13px}
  .speed{margin-top:8px;padding-top:8px}
  .bell{margin-top:6px;min-height:30px}
}
@media(max-width:850px){#laborFab{left:12px;right:auto;bottom:104px;min-height:40px;padding:0 13px}#labor-section{scroll-margin-top:220px}}
.alt-top{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:4px}
.alt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px;margin-top:8px;font-size:12px}
.alt-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.grade-pill{border:1px solid currentColor;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:700}
.page.on{animation:fadeUp .26s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.modal.on .modal-box{animation:popIn .18s ease}
@keyframes popIn{from{transform:scale(.98);opacity:.6}to{transform:none;opacity:1}}
body.no-anim *{animation:none!important;transition:none!important}
body.dark{background:#0b131d;color:#e2e8f0}
body.dark .box,body.dark .card,body.dark .product,body.dark .news,body.dark .row,body.dark .panel,body.dark .section,body.dark .dash,body.dark .kpi,body.dark .journal,body.dark .log-box,body.dark .alt-card,body.dark .labor-card{background:#16202c;border-color:#2a3a4d;color:#e2e8f0}
body.dark .side{background:#080f18}
body.dark .pill{background:#243447;color:#dbe4ef}
body.dark p,body.dark small,body.dark .sub,body.dark .dash-foot{color:#9fb0c3}
body.dark input,body.dark select{background:#0f1a26;color:#e2e8f0;border-color:#33465c}
body.dark .modal-box{background:#101b27;color:#e2e8f0}
body.dark .product-grid div,body.dark .mini div{background:#0f1a26;border-color:#2a3a4d}
body.dark .toast{background:#1b2a3a;color:#e2e8f0}
body.dark .trend{background:#0f1a26;border-color:#2a3a4d}
body.dark .breaking{background:#060b12}
/* ── 2026 UI 리디자인: 금융 대시보드 ───────────────────────── */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#f8fafc; --ink:#101828; --muted:#667085;
  --line:#e4e8ee; --accent:#0f766e; --accent-2:#0b5f59; --gold:#f2c14e; --navy:#0c1523;
  --danger:#b42318; --radius:12px;
}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.app{grid-template-columns:244px minmax(0,1fr)}
.side{background:linear-gradient(180deg,#0c1523 0%,#111f31 100%);padding:20px 16px;border-right:1px solid #17263a;gap:0}
.logo{font-size:18px;letter-spacing:-.02em;margin-bottom:6px;color:#fff}
.sub{font-size:12px;color:#93a3b8;line-height:1.5;margin-bottom:18px}
.nav{gap:4px}
.nav button{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 10px;border-radius:9px;background:transparent;color:#c6d2e1;font-size:13px;font-weight:600;text-align:left;transition:background .15s,color .15s}
.nav button i{width:20px;text-align:center;font-style:normal;font-size:14px;color:#8296ad}
.nav button:hover{background:#1a2a3d;color:#fff}
.nav button.on{background:var(--gold);color:#15202e}
.nav button.on i{color:#15202e}
.side-status{display:flex;align-items:center;gap:8px;margin-top:auto;padding:12px 4px 4px;border-top:1px solid #1e2e42;color:#c6d2e1;font-size:12px}
.side-status span{background:#1a2a3d;border:1px solid #27384e;border-radius:999px;padding:4px 9px;font-weight:700}

.file-label{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 14px;border-radius:8px;font-size:13px;font-weight:650;cursor:pointer}

kbd{background:#eef2f6;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:11px}

.log-box{max-height:230px;background:var(--surface-2);border-color:var(--line)}

@media(max-width:1200px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}

<script>
const START_FX=1390, START_CASH=10000000;
const FEE_STOCK = 0.0015; // 주식 수수료 0.15%
const FEE_FX = 0.01;      // 환전 수수료 1%(브론즈 기준)
const TAX_TRADE = 0.002;        // 매도 거래세 0.2%
const TAX_GAINS_RATE = 0.22;    // 양도소득세율 22%
const TAX_GAINS_FREE = 2500000; // 양도세 기본공제(연간 실현손익)
const DIVIDEND_YIELD = 0.001;   // 배당수익률(보유 평가액 대비, 120초 주기)
const MAX_EFFECTIVE_DEPOSIT = 300000000; // 이자 계산에 반영되는 실효 원금 상한(예금 폭주 방지)
const DIVIDEND_EVERY = 120;     // 배당 지급 주기(초)
const EARNINGS_EVERY = 180;     // 실적 발표 주기(초)
const SAVE_KEY = "money_playground_save";
const HOF_KEY = "money_playground_hof";

// 큰 금액을 좁은 화면에서도 읽히게 요약합니다(1.2억원 · 3.4조원).
const wonShort=n=>{
  const a=Math.abs(n);
  if(a>=1e12) return (n/1e12).toFixed(2).replace(/\.?0+$/,"")+"조원";
  if(a>=1e8) return (n/1e8).toFixed(a>=1e10?0:1).replace(/\.0$/,"")+"억원";
  if(a>=1e4) return Math.round(n/1e4).toLocaleString("ko-KR")+"만원";
  return wonFull(n);
};
// 설정의 숫자 표시 방식을 모든 화면에 동일하게 적용합니다.

// ── 자산 계산(모든 화면 공통) ──────────────────────────────────
function stockValueKRW(){
  return stocks.reduce((sum,s)=>sum + (isForeignStock(s) ? s.price*s.own*fx.usd : s.price*s.own), 0);
}
function productValueKRW(){ return products.reduce((a,p)=>a+p.amount, 0); }
// 총자산 = 현금 + 달러 환산액 + 주식 평가액 + 금융상품 평가액 + 부동산 + 실물자산 + 기업 가치
function grossAssetsKRW(){ return (state.cash||0) + (state.usd||0)*fx.usd + stockValueKRW() + productValueKRW() + estateValue() + metalValue() + companyValue(); }
// 순자산 = 총자산 - 부채(대출)
function netAssetsKRW(){ return grossAssetsKRW() - (state.loan||0); }
// 기존 함수 이름은 순자산 기준으로 유지합니다(등급·목표·랭킹 공통).
function totalAssetsKRW(){ return netAssetsKRW(); }

// ── 환생(영구 성장) ─────────────────────────────────────────
function ensureRebirth(){
  if(!state.rebirth || typeof state.rebirth!=="object") state.rebirth={count:0,points:0,spent:0,upgrades:{},bestNet:0,history:[],notified:false};
  const r=state.rebirth;
  r.count=Math.max(0,Math.floor(+r.count||0));
  r.points=Math.max(0,Math.floor(+r.points||0));
  r.spent=Math.max(0,Math.floor(+r.spent||0));
  r.bestNet=Math.max(0,+r.bestNet||0);
  if(!r.upgrades || typeof r.upgrades!=="object" || Array.isArray(r.upgrades)) r.upgrades={};
  REBIRTH_UPGRADES.forEach(u=>{ r.upgrades[u.id]=Math.max(0,Math.min(u.max,Math.floor(+r.upgrades[u.id]||0))); });
  if(!Array.isArray(r.history)) r.history=[];
  r.notified=!!r.notified;
  return r;
}
function rebirthLevel(id){
  const r=ensureRebirth(), u=REBIRTH_UPGRADES.find(x=>x.id===id);
  if(!u) return 0;
  return Math.max(0,Math.min(u.max,Math.floor(+r.upgrades[id]||0)));
}
function rebirthCost(id){
  const u=REBIRTH_UPGRADES.find(x=>x.id===id); if(!u) return Infinity;
  const lv=rebirthLevel(id);
  if(lv>=u.max) return Infinity;
  return u.base + u.step*lv;
}
function rebirthPointsFor(net){
  const v=Math.max(0,+net||0);
  if(v<REBIRTH_MIN) return 0;
  return Math.max(1,Math.floor(Math.sqrt(v/10000000)));
}
function rebirthEarnedPoints(){ return rebirthPointsFor(Math.max(totalAssetsKRW(),ensureRebirth().bestNet||0)); }
function canRebirth(){ return totalAssetsKRW()>=REBIRTH_MIN; }
function rebirthStartCash(){ return START_CASH + 2000000*rebirthLevel("start"); }
function rebirthBonus(id, per){ return 1 + per*rebirthLevel(id); }
function stockFeeRate(){ return FEE_STOCK*(1-0.1*rebirthLevel("fee")); }
function tradeTaxRate(){ return TAX_TRADE*(1-0.1*rebirthLevel("fee")); }
// 주식 감각 업그레이드: 매도 실현이익의 일정 비율을 원화 현금으로 추가 지급합니다(이익이 날 때만).
function creditStockBonus(profitKRW){
  const bonus=Math.max(0,+profitKRW||0)*0.02*rebirthLevel("stock");
  if(bonus>0) state.cash=(state.cash||0)+bonus;
  return bonus;
}
// ── 부동산·실물자산·기업 가치 ─────────────────────
function estatePrice(id){ const d=ESTATES.find(x=>x.id===id); return (state.altPrices && Number.isFinite(state.altPrices[id])) ? state.altPrices[id] : (d?d.price:0); }
function estateValue(){ return ESTATES.reduce((a,e)=>a + (state.estate&&state.estate[e.id]?state.estate[e.id].qty:0)*estatePrice(e.id),0); }
function metalPrice(id){ const d=METALS.find(x=>x.id===id); return (state.altPrices && Number.isFinite(state.altPrices[id])) ? state.altPrices[id] : (d?d.price:0); }
function metalValue(){ return METALS.reduce((a,m)=>a + ((state.metals&&state.metals[m.id]?state.metals[m.id].qty:0)||0)*metalPrice(m.id),0); }
function companyValue(){ return state.company ? Math.max(0,state.company.valuation||0) : 0; }
function currentTitle(){ return TITLES[currentGrade()]||TITLES["브론즈"]; }
function currentGrade(){
  const total=totalAssetsKRW();
  // 8단계 등급을 높은 순서로 비교해, 자산이 늘었는데 낮은 등급이 보이는 오류를 막습니다.
  for(let i=GRADES.length-1;i>=0;i--){
    if(total >= GRADE_FLOORS[GRADES[i]]) return GRADES[i];
  }
  return "브론즈";
}
function nextGradeInfo(){
  const i=gradeIndex(currentGrade());
  if(i>=GRADES.length-1) return null;
  const next=GRADES[i+1];
  return {grade:next, remain:Math.max(0, GRADE_FLOORS[next]-totalAssetsKRW())};
}

let audioCtx=null;
function beep(kind){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type="sine"; o.frequency.value=kind==="goal"?880:kind==="dividend"?660:520;
    g.gain.value=0.05;
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+0.12);
  }catch(e){}
}
const notifySeen={};
function notify(kind,title,text){
  const n=state.notify||{};
  if(n[kind]===false) return;
  // 같은 이벤트가 짧은 간격으로 반복되면 토스트·알림을 한 번만 남깁니다.
  const dedupeKey=kind+"|"+title+(kind==="stock"?"|"+(text||"").slice(0,24):"");
  const now=Date.now();
  if(notifySeen[dedupeKey] && now-notifySeen[dedupeKey]<15000) return;
  notifySeen[dedupeKey]=now;
  if(!Array.isArray(state.alerts)) state.alerts=[];
  state.alerts.unshift({at:Date.now(),kind,title,text,read:false});
  if(state.alerts.length>40) state.alerts.pop();
  showToast(title,text);
  if(n.sound) beep(kind);
  if(n.haptic && typeof navigator!=="undefined" && navigator.vibrate) navigator.vibrate(25);
  updateBell();
}
function showToast(title,text){
  const wrap=$("toastWrap"); if(!wrap || typeof wrap.appendChild!=="function") return;
  const el=document.createElement("div");
  el.className="toast";
  el.innerHTML=`<b>${title}</b>${text||""}`;
  wrap.appendChild(el);
  // 토스트는 최대 3개만 보여 줍니다(동시에 여러 이벤트가 터질 때 화면을 가리지 않도록).
  while(wrap.children && wrap.children.length>3) wrap.removeChild(wrap.children[0]);
  setTimeout(()=>{ try{ wrap.removeChild(el); }catch(e){} },4200);
}
function updateBell(){
  const unread=(state.alerts||[]).filter(a=>!a.read).length;
  const label=unread>99?"99+":String(unread);
  ["bellBadge","bbBadge"].forEach(id=>{
    const b=$(id); if(!b) return;

}

    <p class="muted-sm" style="margin-bottom:8px">최근 30건 · 설정은 저장 파일에 함께 보관됩니다.</p>

// ── 거래 저널 · 성과 분석 ────────────────────────────
function recordTrade(s,side,qty,priceNative,profitKRW){
  if(!Array.isArray(state.journal)) state.journal=[];
  const foreign=isForeignStock(s);
  const valueKRW=priceNative*qty*(foreign?fx.usd:1);
  const fee=valueKRW*stockFeeRate();
  state.feesTotal=(state.feesTotal||0)+fee;
  state.journal.unshift({at:Date.now(),name:s.name,side,qty,valueKRW,fee,profit:side==="sell"?(profitKRW||0):0});
  if(state.journal.length>200) state.journal.pop();
  bumpDaily("trades");
  checkAchievements();
  saveGame();
}
function performanceStats(){
  const j=state.journal||[];
  const sells=j.filter(x=>x.side==="sell"), buys=j.filter(x=>x.side==="buy");
  const wins=sells.filter(x=>x.profit>0);
  const realized=sells.reduce((a,x)=>a+(x.profit||0),0);
  const volume=j.reduce((a,x)=>a+(x.valueKRW||0),0);
  const buyVolume=buys.reduce((a,x)=>a+(x.valueKRW||0),0);
  const sellVolume=sells.reduce((a,x)=>a+(x.valueKRW||0),0);
  const held=stocks.filter(s=>s.realizedProfit!==0);
  const roiRows=stockReturnRows();
  return {
    trades:j.length, buys:buys.length, sells:sells.length,
    winRate:sells.length?wins.length/sells.length:0,
    realized, volume, buyVolume, sellVolume, fees:state.feesTotal||0,
    unrealized:unrealizedPL(),
    periods:periodReturns(),
    roiRows, bestRoi:roiRows[0], worstRoi:roiRows[roiRows.length-1],
    best:[...held].sort((a,b)=>b.realizedProfit-a.realizedProfit)[0],
    worst:[...held].sort((a,b)=>a.realizedProfit-b.realizedProfit)[0]
  };
}

function bestProductForAuto(){

    const r=gradeRateFor(p.id,currentGrade());
    if(!p.amount && r>rate){ rate=r; best=p; }

function saveAutoSettings(){

// 자동 매매: 보유 종목이 설정한 익절/손절선에 닿으면 전량 매도합니다.
function autoSellRules(){
  const a=state.auto||{};
  if(!a.enabled || !a.autoSell || !state.marketOpen) return 0;
  const tp=(a.takeProfit||0)/100, sl=(a.stopLoss||0)/100;
  if(tp<=0 && sl<=0) return 0;
  let sold=0;
  stocks.forEach(s=>{
    if(s.own<=0 || !s.avgBuy) return;
    const roi=(s.price-s.avgBuy)/s.avgBuy;
    if(!((tp>0&&roi>=tp)||(sl>0&&roi<=-sl))) return;
    const foreign=isForeignStock(s), count=s.own;
    const revenue=s.price*count*(1-stockFeeRate()-tradeTaxRate());
    const profit=revenue-s.avgBuy*count;
    const profitKRW=foreign?profit*fx.usd:profit;
    if(foreign){ state.usd+=revenue; s.realizedProfit+=profitKRW; }
    else { state.cash+=revenue; s.realizedProfit+=profit; }
    s.own=0; s.avgBuy=0;
    recordTrade(s,"sell",count,s.price,profitKRW);
    settleTax(profitKRW);
    creditStockBonus(profitKRW);
    addLog(`🤖 자동 매도: ${s.name} ${count}주 · ${pct(roi)}`);
    sold++;
  });
  if(sold){
    notify("order","자동 매매 실행",`${sold}종목을 익절/손절 규칙으로 매도했습니다.`);
    saveGame(); update();
  }
  return sold;
}
function autoInvest(force){
  const a=state.auto||{};
  if(!force && !a.enabled) return 0;
  if(!force && !state.marketOpen) return 0;
  const min=Math.max(0,a.minCash||0);
  const budget=state.cash-min;
  if(budget<100000) return 0;
  const stockPart=Math.max(0,Math.min(100,a.stockPct||0))*budget/100;
  let invested=0;
  if(stockPart>0){
    const list=stocks.filter(s=>s.id!=="market_etf");
    const perKRW=stockPart/list.length;
    list.forEach(s=>{
      const foreign=isForeignStock(s);
      const unitKRW=s.price*(1+stockFeeRate())*(foreign?fx.usd:1);
      const qty=Math.floor(perKRW/unitKRW);
      if(qty<=0) return;
      const costNative=qty*s.price*(1+stockFeeRate());
      if(foreign){
        if(state.usd<costNative){
          const need=costNative-state.usd;
          const krw=need*fx.usd*(1+fxFeeRate());
          if(krw>state.cash) return;
          state.cash-=krw; state.usd+=need;
        }
        state.usd-=costNative;
      }else{
        if(state.cash<costNative) return;
        state.cash-=costNative;
      }
      s.avgBuy=((s.avgBuy*s.own)+(s.price*(1+stockFeeRate()))*qty)/(s.own+qty);
      s.own+=qty;
      invested+=costNative*(foreign?fx.usd:1);
    });
  }
  // 자동 배분: 금·은과 부동산 비중(설정한 경우에만 동작, 기본 0%).
  const goldBudget=Math.max(0,state.cash-min)*((a.goldPct||0)/100);
  if(goldBudget>=metalPrice("gold")){
    const price=metalPrice("gold"), qty=Math.floor(goldBudget/price), cost=price*qty;
    if(qty>0){
      state.cash-=cost;
      const h=state.metals.gold||{qty:0,avg:0};
      h.avg=((h.avg*h.qty)+cost)/(h.qty+qty); h.qty+=qty; state.metals.gold=h;
      markDex("metals","gold"); invested+=cost;
    }
  }
  const estateBudget=Math.max(0,state.cash-min)*((a.estatePct||0)/100);
  if(estateBudget>0){
    const pick=ESTATES.filter(e=>estatePrice(e.id)<=estateBudget).sort((x,y)=>estatePrice(y.id)-estatePrice(x.id))[0];
    if(pick){
      const price=estatePrice(pick.id);
      state.cash-=price;
      const h=state.estate[pick.id]||{qty:0,avgBuy:0};
      h.avgBuy=((h.avgBuy*h.qty)+price)/(h.qty+1); h.qty++; state.estate[pick.id]=h;
      markDex("estates",pick.id); invested+=price;
    }
  }
  const remain=state.cash-min;
  if(remain>0){
    const p=bestProductForAuto();
    if(p && remain>=p.min){
      const v=Math.floor(remain/10000)*10000;
      if(v>0){
        if(p.amount===0) p.rate=gradeRateFor(p.id,currentGrade());
        state.cash-=v; p.amount+=v; invested+=v;
      }
    }
  }
  if(invested>0){
    addLog(`자동 적립 실행: ${won(invested)} 재투자`);
    notify("system","자동 적립",`${won(invested)}을 규칙대로 재투자했습니다.`);
    saveGame(); update();
  }
  return invested;
}

// ── 노동 · 생계 ───────────────────────────────────
function ensureLabor(){
  if(!state.labor || typeof state.labor!=="object") state.labor={shifts:0,earned:0,lastAt:{},warned:false};
  if(!Number.isFinite(+state.labor.shifts) || +state.labor.shifts<0) state.labor.shifts=0;
  if(!Number.isFinite(+state.labor.earned) || +state.labor.earned<0) state.labor.earned=0;
  if(!state.labor.lastAt || typeof state.labor.lastAt!=="object") state.labor.lastAt={};
  return state.labor;
}
function laborJob(id){ return LABOR_JOBS.find(j=>j.id===id)||null; }
function laborRemaining(job){
  if(!job) return 0;
  const l=ensureLabor(), last=+l.lastAt[job.id]||0;
  if(!last) return 0;
  return Math.max(0, job.cooldown*1000-(Date.now()-last));
}
// 현금과 팔 수 있는 자산이 모두 바닥난 상태인지 판정합니다.
function laborEmergency(){
  const assets=stockValueKRW()+productValueKRW()+estateValue()+metalValue()+companyValue();
  return (state.cash||0)<LABOR_MIN_CASH && assets<=0.01;
}
function laborJobCard(job){
  const l=ensureLabor(), locked=l.shifts<job.req, remain=laborRemaining(job);
  const label=locked?`🔒 노동 ${job.req}회 필요`:(remain>0?`${Math.ceil(remain/1000)}초 후`:"일하기");
  return `<article class="labor-card${locked?" locked":""}">
    <div class="labor-top"><b>${job.icon} ${job.name}</b><span class="pill">최대 +${won(job.pay)}</span></div>
    <small>${job.desc} · 타이밍 작업 3회 · 실제 ${job.cooldown}초 쿨다운</small>
    <div class="labor-meta"><span>누적 ${l.shifts}회</span><span>총 ${won(l.earned)}</span></div>
    <button class="${locked?"ghost":"buy"}" data-labor-btn="${job.id}" onclick="workLabor('${job.id}')" ${locked?"disabled":""}>${label}</button>
  </article>`;
}
// ── 노동 미니게임 ────────────────────────────────────────────
// 버튼 한 번으로 일당이 들어오지 않도록, 작업대의 표시선을 초록 구간에 맞추는
// 타이밍 작업을 3번 성공시켜야 일당이 지급됩니다.
const LABOR_ROUNDS=3;
let laborSession=null;
function laborRoundResult(job,p){
  const zone=(job&&job.zone)||.2;
  const pos=Math.max(0,Math.min(1,typeof p==="number"&&Number.isFinite(p)?p:.5));
  const d=Math.abs(pos-.5);
  const grade=d<=zone*.35?"perfect":(d<=zone?"good":"miss");
  return {grade,pos,mult:grade==="perfect"?1:(grade==="good"?.8:0)};
}
function laborShiftPay(job,results){
  const base=(job&&job.pay)||0;
  const list=(results||[]).map(r=>typeof r==="string"?r:(r&&r.grade)||"miss");
  const perfect=list.filter(g=>g==="perfect").length;
  const good=list.filter(g=>g==="good").length;
  const miss=Math.max(0,list.length-perfect-good);
  const rate=(perfect+good*.8)/LABOR_ROUNDS;
  const bonus=rebirthBonus("labor",.05);
  return {pay:Math.max(0,Math.round(base*rate*bonus/1000)*1000),perfect,good,miss,rate,bonus};
}
function laborGameHtml(job){
  const zone=(job.zone||.2)*100, perfect=zone*.35;
  const band=(left,width,cls)=>`<span class="labor-target${cls?" "+cls:""}" style="left:${left.toFixed(1)}%;width:${width.toFixed(1)}%"></span>`;
  return `<div class="labor-game">
    <p>작업대의 표시선이 초록 구간을 지나갈 때 <b>멈추기</b>를 누르세요. 작업 ${LABOR_ROUNDS}번을 마치면 일당이 지급되고, 놓친 만큼 일당이 깎입니다.</p>
    <div class="labor-track" role="img" aria-label="노동 타이밍 바">
      ${band(50-zone,zone*2,"")}${band(50-perfect,perfect*2,"perfect")}<span class="labor-cursor" id="labor-cursor" style="left:0%"></span>
    </div>
    <div class="labor-game-meta"><span>작업 <b id="labor-round">1 / ${LABOR_ROUNDS}</b></span><span id="labor-grades">⭐ 완벽 · ✅ 성공 · ❌ 실패</span></div>
    <div class="labor-game-result" id="labor-result">표시선을 초록 구간에 맞춰 주세요.</div>
    <button id="labor-stop-btn" class="buy" onclick="laborStop()">멈추기</button>
    <button class="ghost" onclick="closeLaborGame()">그만두기</button>
  </div>`;
}
function laborLoop(ts){
  const s=laborSession; if(!s) return;
  const now=typeof ts==="number"?ts:0;
  if(!s.last) s.last=now;
  const dt=Math.max(0,Math.min(.05,(now-s.last)/1000)); s.last=now;
  s.pos+=s.dir*(s.job.speed||.6)*dt;
  if(s.pos>=1){s.pos=1;s.dir=-1;}
  if(s.pos<=0){s.pos=0;s.dir=1;}
  const cur=$("labor-cursor"); if(cur&&cur.style) cur.style.left=(s.pos*100).toFixed(1)+"%";
  if(typeof requestAnimationFrame==="function") s.raf=requestAnimationFrame(laborLoop);
}
function laborAbortShift(quiet){
  const s=laborSession; if(!s) return false;
  if(s.raf && typeof cancelAnimationFrame==="function"){ try{ cancelAnimationFrame(s.raf); }catch(e){} }
  laborSession=null;
  if(!quiet) addLog("💼 노동을 중단했습니다. 일당은 지급되지 않습니다.");
  return true;
}
function laborStartShift(jobOrId){
  const job=typeof jobOrId==="string"?laborJob(jobOrId):jobOrId;
  if(!job) return false;
  // 이미 진행 중인 작업이 있으면 새 세션을 열지 않습니다(중복 시작·보상 중복 방지).
  if(laborSession) return false;
  // 표시선은 왼쪽 끝에서 출발합니다. 중앙에서 시작하면 열자마자 누르는 것으로 완벽 판정이 납니다.
  laborSession={job,round:0,results:[],pos:0,dir:1,last:0,raf:0,paid:false};
  openModal(`${job.icon} ${job.name}`,laborGameHtml(job));
  laborLoop(0);
  return true;
}
function laborStop(){
  const s=laborSession; if(!s) return false;
  return laborStopAt(s.pos);
}
function laborStopAt(p){
  const s=laborSession; if(!s || s.paid) return false;
  const r=laborRoundResult(s.job,p);
  s.results.push(r);
  s.round++;
  const roundEl=$("labor-round"); if(roundEl) roundEl.textContent=`${Math.min(s.round+1,LABOR_ROUNDS)} / ${LABOR_ROUNDS}`;
  const resEl=$("labor-result"); if(resEl) resEl.textContent=r.grade==="perfect"?"⭐ 완벽한 작업!":(r.grade==="good"?"✅ 작업 성공":"❌ 작업 실패");
  const badge=$("labor-grades"); if(badge) badge.textContent=s.results.map(x=>x.grade==="perfect"?"⭐":x.grade==="good"?"✅":"❌").join(" ");
  if(s.round<LABOR_ROUNDS){
    // 다음 회차를 다시 왼쪽 끝에서 시작해, 같은 자리 연타로 완벽을 반복하지 못하게 합니다.
    s.pos=0; s.dir=1; s.last=0;
    const cur=$("labor-cursor"); if(cur&&cur.style) cur.style.left="0%";
    return true;
  }
  return laborFinishShift();
}
function laborShowResult(job,sum,pay){
  const line=pay>0?`일당 <b>${won(pay)}</b>을 받았습니다.`:"모든 작업을 놓쳐 일당을 받지 못했습니다. 다시 도전하세요.";
  openModal(`${job.icon} ${job.name} 결과`,`
    <div class="kpis"><div class="kpi"><small>⭐ 완벽</small><b>${sum.perfect}회</b></div><div class="kpi"><small>✅ 성공</small><b>${sum.good}회</b></div><div class="kpi"><small>❌ 실패</small><b>${sum.miss}회</b></div><div class="kpi"><small>일당</small><b>${won(pay)}</b></div></div>
    <p style="margin-top:10px;font-size:13px">${line}${pay>0?` (최대 ${won(job.pay)} · 달성률 ${Math.round(sum.rate*100)}%)`:""}</p>
    <button class="buy" style="width:100%;margin-top:12px" onclick="closeLaborGame()">확인</button>`);
}
function laborFinishShift(){
  const s=laborSession; if(!s || s.paid) return false;
  // 보상 지급은 세션당 정확히 한 번만 실행합니다.
  s.paid=true;
  const job=s.job, sum=laborShiftPay(job,s.results);
  laborAbortShift(true);
  const l=ensureLabor();
  if(sum.pay<=0){
    addLog(`💼 ${job.name} 작업 실패: 일당 없음 (경력 미반영)`);
    notify("system","노동 실패",`${job.name} 작업을 모두 놓쳤습니다. 일당 없이 다시 도전할 수 있습니다.`);
    saveGame(); portfolio(); update();
    laborShowResult(job,sum,0);
    return false;
  }
  l.shifts++;
  l.earned+=sum.pay;
  l.lastAt[job.id]=Date.now();
  state.cash=(state.cash||0)+sum.pay;
  addLog(`💼 ${job.name} 노동 완료: +${won(sum.pay)} (완벽 ${sum.perfect}·성공 ${sum.good}·실패 ${sum.miss})`);
  notify("system","노동 완료",`${job.name} +${won(sum.pay)} · 최소 생활비 목표 ${won(LABOR_MIN_CASH)}`);
  saveGame(); portfolio(); update();
  laborShowResult(job,sum,sum.pay);
  return true;
}
function closeLaborGame(){ laborAbortShift(true); closeModal(); portfolio(); refreshLaborUI(); }
function workLabor(id){
  const job=laborJob(id); if(!job) return false;
  if(laborSession){ alert("이미 노동 중입니다. 진행 중인 작업을 먼저 끝내 주세요."); return false; }
  const l=ensureLabor();
  if(l.shifts<job.req){
    alert(`이 노동은 누적 ${job.req}회 노동 후 가능합니다. (현재 ${l.shifts}회)`);
    return false;
  }
  const remain=laborRemaining(job);
  if(remain>0){
    alert(`아직 쉬는 중입니다. ${Math.ceil(remain/1000)}초 후 다시 일할 수 있습니다.`);
    return false;
  }
  return laborStartShift(job);
}
function refreshLaborUI(){
  const l=ensureLabor();
  document.querySelectorAll("[data-labor-btn]").forEach(btn=>{
    const job=laborJob(btn.dataset.laborBtn); if(!job) return;
    const locked=l.shifts<job.req, remain=laborRemaining(job), busy=!!laborSession;
    btn.disabled=locked||busy;
    btn.textContent=busy?"작업 중":(locked?`🔒 노동 ${job.req}회 필요`:(remain>0?`${Math.ceil(remain/1000)}초 후`:"일하기"));
  });
  const fab=$("laborFab");
  if(fab){
    const urgent=laborEmergency();
    // 내 자산 화면에서 노동 섹션이 화면에 보이면 버튼을 숨겨 카드 조작을 가리지 않습니다.
    // 훨씬 아래로 스크롤해 섹션이 안 보이면 다시 띄워 바로 이동할 수 있게 합니다.
    const sec=$("labor-section");
    const secOnScreen=!!(activePage()==="portfolio" && sec && sec.getBoundingClientRect && sec.getBoundingClientRect().bottom>0 && sec.getBoundingClientRect().top<innerHeight);
    fab.style.display=secOnScreen?"none":"inline-flex";
    if(fab.classList) fab.classList.toggle("urgent",urgent);
    if(fab.setAttribute) fab.setAttribute("aria-label",urgent?"생계 위기 · 노동해서 생활비 벌기":"노동해서 생활비 벌기");
  }
}
function openLabor(){
  show("portfolio");
  const fab=$("laborFab"); if(fab) fab.style.display="none";
  setTimeout(()=>{
    const section=$("labor-section");
    if(section && section.scrollIntoView) section.scrollIntoView({behavior:"smooth",block:"start"});
  },60);
}

// ── 확장 자산: 부동산 · 실물자산 · 기업 ───────────────
function markDex(kind,id){
  if(!state.dex||typeof state.dex!=="object") state.dex={stocks:{},products:{},estates:{},metals:{},company:false};
  if(kind==="company"){ state.dex.company=true; return; }
  if(!state.dex[kind]||typeof state.dex[kind]!=="object") state.dex[kind]={};
  state.dex[kind][id]=true;
}
function confirmTrade(label,detail){
  const s=state.settings||{};
  if(s.confirmTrades===false) return true;
  return confirm(`[${label}]\n${detail}\n\n진행할까요?`);
}
function buyEstate(id){
  const e=ESTATES.find(x=>x.id===id); if(!e) return;
  const price=estatePrice(id);
  if(state.cash<price) return alert("현금이 부족합니다.");
  if(!confirmTrade("부동산 매수",`${e.name} 1채 · ${won(price)}`)) return;
  state.cash-=price;
  const h=state.estate[id]||{qty:0,avgBuy:0};
  h.avgBuy=((h.avgBuy*h.qty)+price)/(h.qty+1); h.qty++;
  state.estate[id]=h; markDex("estates",id);
  bumpDaily("estateBuy"); bumpDaily("altTrades");
  addLog(`🏢 부동산 매수: ${e.name} 1채 (${won(price)})`);
  notify("system","부동산 매수",`${e.name} 1채 · ${won(price)}`);
  saveGame(); portfolio(); update();
}
function sellEstate(id){
  const e=ESTATES.find(x=>x.id===id); const h=state.estate[id];
  if(!e||!h||h.qty<=0) return alert("보유한 부동산이 없습니다.");
  const price=estatePrice(id), net=Math.round(price*(1-0.03));
  if(!confirmTrade("부동산 매도",`${e.name} 1채 · ${won(net)} (거래비용 3%)`)) return;
  state.altRealized=(state.altRealized||0)+(net-(h.avgBuy||0));
  state.cash+=net; h.qty--; if(h.qty<=0) delete state.estate[id];
  bumpDaily("altTrades");
  addLog(`🏢 부동산 매도: ${e.name} 1채 (${won(net)})`);
  saveGame(); portfolio(); update();
}
function buyMetal(id){
  const m=METALS.find(x=>x.id===id); if(!m) return;
  const qty=Math.max(1,Math.floor(+($("metal-qty-"+id)?$("metal-qty-"+id).value:1)||1));
  const price=metalPrice(id), cost=Math.round(price*qty);
  if(state.cash<cost) return alert("현금이 부족합니다.");
  if(!confirmTrade("실물자산 매수",`${m.name} ${qty}${m.unit} · ${won(cost)}`)) return;
  state.cash-=cost;
  const h=state.metals[id]||{qty:0,avg:0};
  h.avg=((h.avg*h.qty)+cost)/(h.qty+qty); h.qty+=qty; state.metals[id]=h;
  markDex("metals",id); bumpDaily("altTrades");
  addLog(`🪙 ${m.name} ${qty}${m.unit} 매수 (${won(cost)})`);
  saveGame(); portfolio(); update();
}
function sellMetal(id){
  const m=METALS.find(x=>x.id===id); const h=state.metals[id];
  if(!m||!h||h.qty<=0) return alert("보유한 실물자산이 없습니다.");
  const qty=Math.min(h.qty,Math.max(1,Math.floor(+($("metal-qty-"+id)?$("metal-qty-"+id).value:1)||1)));
  const price=metalPrice(id), net=Math.round(price*qty*(1-0.01));
  if(!confirmTrade("실물자산 매도",`${m.name} ${qty}${m.unit} · ${won(net)}`)) return;
  state.altRealized=(state.altRealized||0)+(net-price*qty);
  state.cash+=net; h.qty-=qty; if(h.qty<=0) delete state.metals[id];
  bumpDaily("altTrades");
  addLog(`🪙 ${m.name} ${qty}${m.unit} 매도 (${won(net)})`);
  saveGame(); portfolio(); update();
}
function companyGradeInfo(c=state.company){
  if(!c) return {name:"미설립",index:-1,next:null,progress:0,color:"#64748b"};
  const value=Math.max(0,+c.valuation||0);
  let index=0;
  COMPANY_GRADES.forEach((g,i)=>{ if(value>=g.min) index=i; });
  const grade=COMPANY_GRADES[index], next=COMPANY_GRADES[index+1]||null;
  const progress=next?Math.max(0,Math.min(1,(value-grade.min)/(next.min-grade.min))):1;
  return {name:grade.name,index,next,progress,color:grade.color,value};
}
function foundCompany(){
  if(state.company) return alert("이미 기업을 운영 중입니다.");
  const def=COMPANY_LEVELS[0];
  if(state.cash<def.cost) return alert(`기업 설립에는 ${won(def.cost)}이 필요합니다.`);
  const name=($("company-name")?$("company-name").value.trim():"")||"나의 기업";
  if(!confirmTrade("기업 설립",`${name} · ${won(def.cost)}`)) return;
  state.cash-=def.cost;
  state.company={name,level:1,valuation:def.val,book:def.val,revenue:def.revenue,profit:def.profit,payout:.3};
  markDex("company",true);
  addLog(`🏭 기업 설립: ${name} (${won(def.cost)})`);
  notify("system","기업 설립",`${name} 설립 완료`);
  saveGame(); portfolio(); update();
}
function expandCompany(){
  const c=state.company; if(!c) return alert("먼저 기업을 설립해 주세요.");
  const def=COMPANY_LEVELS[c.level]; if(!def) return alert("최대 레벨입니다.");
  if(state.cash<def.cost) return alert(`확장 비용 ${won(def.cost)}이 부족합니다.`);
  if(!confirmTrade("사업 확장",`Lv.${c.level+1} · ${won(def.cost)}`)) return;
  state.cash-=def.cost; c.level++; c.valuation+=def.val; c.book=(c.book||c.valuation-def.val)+def.val; c.revenue+=def.revenue; c.profit+=def.profit;
  addLog(`🏭 사업 확장: Lv.${c.level} (${won(def.cost)})`);
  saveGame(); portfolio(); update();
}
function acquireRival(id){
  const c=state.company; if(!c) return alert("먼저 기업을 설립해 주세요.");
  const r=RIVALS.find(x=>x.id===id); if(!r||c.acquired&&c.acquired[id]) return;
  if(state.cash<r.cost) return alert(`인수 비용 ${won(r.cost)}이 부족합니다.`);
  if(!confirmTrade("기업 인수",`${r.name} · ${won(r.cost)}`)) return;
  state.cash-=r.cost; c.valuation+=r.boost; c.book=(c.book||c.valuation-r.boost)+r.boost; c.revenue+=Math.round(r.boost*.02); c.profit+=Math.round(r.boost*.006);
  c.acquired=Object.assign({},c.acquired,{[id]:true});
  addLog(`🤝 기업 인수: ${r.name} (+${won(r.boost)})`);
  notify("system","인수합병",`${r.name} 인수 완료`);
  checkAchievements();
  saveGame(); portfolio(); update();
}
function setCompanyPayout(v){ if(!state.company) return; state.company.payout=Math.max(0,Math.min(1,(+v||0)/100)); saveGame(); portfolio(); }
function tickAlt(){
  if(!state.altPrices||typeof state.altPrices!=="object") state.altPrices={};
  ESTATES.forEach(e=>{
    const p=estatePrice(e.id);
    const shock=Math.random()<.03?(Math.random()-.5)*.12:0;
    state.altPrices[e.id]=Math.max(Math.round(e.price*.35),Math.round(p*(1+(Math.random()-.5)*e.vol+shock)));
  });
  METALS.forEach(m=>{
    const p=metalPrice(m.id);
    state.altPrices[m.id]=Math.max(Math.round(m.price*.35*100)/100,Math.round(p*(1+(Math.random()-.5)*m.vol)*100)/100);
  });
  if(state.marketSeconds%60===0){
    let rent=0,upkeep=0;
    const rentBonus=rebirthBonus("estate",.04);
    ESTATES.forEach(e=>{ const q=(state.estate[e.id]&&state.estate[e.id].qty)||0; if(!q) return; rent+=q*estatePrice(e.id)*e.rent*rentBonus; upkeep+=q*estatePrice(e.id)*e.upkeep; });
    if(rent||upkeep){ state.cash+=rent-upkeep; addLog(`🏢 임대 수익 ${won(rent)} · 유지비 ${won(upkeep)}`); }
  }
  const c=state.company;
  if(c){
    c.revenue=Math.max(0,Math.round(c.revenue*(0.99+Math.random()*.02)));
    // 기업 가치는 장부가(설립·확장·인수 누계) 주변에서만 움직이게 해 무한 복리를 막습니다.
    const book=Math.max(10000000,c.book||c.valuation);
    c.valuation=Math.max(book*.8,Math.min(book*1.2,Math.round(c.valuation*(0.997+Math.random()*.006))));
    if(state.marketSeconds%30===0){ const pay=Math.round(c.profit*(c.payout==null?.3:c.payout)*rebirthBonus("company",.04)); state.cash+=pay; if(pay>0) addLog(`🏭 기업 배당 +${won(pay)}`); }
  }
  const eco=state.economy||(state.economy=Object.assign({},ECON_DEFAULT));
  // tickAlt는 15게임초마다 실행되므로 남은 시간도 15초씩 줄여야 합니다.
  // (기존에는 1씩 줄어 90초 표시가 실제로는 1,350초가 되는 버그가 있었습니다.)
  eco.cycleLeft=(eco.cycleLeft||0)-15;
  if(eco.cycleLeft<=0){
    const phases=["호황","중립","불황"];
    eco.phase=phases[Math.floor(Math.random()*3)];
    eco.cycleLeft=60+Math.floor(Math.random()*60);
    eco.rateAdj=eco.phase==="호황"?.004:eco.phase==="불황"?-.004:0;
    const dir=Math.random()<.5?-1:1;
    eco.baseRate=Math.max(.01,Math.min(.08,(eco.baseRate||.03)+dir*.0025));
    // 경기 국면에 따라 물가·실업률·성장률이 움직이고, 이는 시장 방향에도 반영됩니다.
    const phaseBias=eco.phase==="호황"?1:eco.phase==="불황"?-1:0;
    eco.inflation=Math.max(.005,Math.min(.08,(+eco.inflation||.025)+phaseBias*.003+(Math.random()-.5)*.002));
    eco.unemployment=Math.max(.015,Math.min(.15,(+eco.unemployment||.035)-phaseBias*.004+(Math.random()-.5)*.0015));
    eco.gdpGrowth=Math.max(-.06,Math.min(.08,(+eco.gdpGrowth||.02)+phaseBias*.007+(Math.random()-.5)*.003));
    if(eco.phase==="불황"){
      stocks.forEach(s=>applyShock(s,-(0.01+Math.random()*.025)));
      publishBreakingNews("📉 금융 위기 · 경기 침체", `경기 침체가 시작되었습니다. 물가 ${(eco.inflation*100).toFixed(1)}% · 실업률 ${(eco.unemployment*100).toFixed(1)}% · 기준금리 ${(eco.baseRate*100).toFixed(2)}%`);
      notify("economy","경제 위기",`금융 위기 · 실업률 ${(eco.unemployment*100).toFixed(1)}%`);
    } else if(eco.phase==="호황"){
      stocks.forEach(s=>applyShock(s,0.008+Math.random()*.02));
      publishBreakingNews("🚀 경기 호황", `소비와 투자가 살아납니다. 물가 ${(eco.inflation*100).toFixed(1)}% · 실업률 ${(eco.unemployment*100).toFixed(1)}% · 성장률 ${(eco.gdpGrowth*100).toFixed(1)}%`);
      notify("economy","경기 호황",`성장률 ${(eco.gdpGrowth*100).toFixed(1)}% · 기준금리 ${(eco.baseRate*100).toFixed(2)}%`);
    } else {
      publishBreakingNews("🏦 기준금리", `기준금리 ${(eco.baseRate*100).toFixed(2)}% · 경기 ${eco.phase} 국면이 시작되었습니다.`);
      notify("economy","경제 지표",`경기 ${eco.phase} · 기준금리 ${(eco.baseRate*100).toFixed(2)}%`);
    }
  }
  if(state.marketSeconds%180===0 && Math.random()<.5){
    const sector=["AI","반도체","배터리","우주","디지털 자산"][Math.floor(Math.random()*5)];
    const up=Math.random()<.5;
    stocks.filter(s=>s.theme.includes(sector)).forEach(s=>applyShock(s,(up?1:-1)*(.01+Math.random()*.03)));
    publishBreakingNews("📈 산업 뉴스", `${sector} 업종에 ${up?"매수세":"차익 실현"}가 몰리고 있습니다.`);
  }
  const gi=gradeIndex(currentGrade());
  if(gi>(state.rewardedGrade||0)){
    let reward=0;
    for(let i=(state.rewardedGrade||0)+1;i<=gi;i++) reward+=i*500000;
    state.rewardedGrade=gi; state.cash+=reward;
    addLog(`🏅 승급 보상: ${GRADES[gi]} (+${won(reward)})`);
    notify("grade","승급 보상",`${GRADES[gi]} · ${won(reward)}`);
  }
  checkSpecial();
}

function periodReturns(){

function isoWeekKey(){
  const d=new Date();
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=t.getUTCDay()||7;
  t.setUTCDate(t.getUTCDate()+4-day);
  const y=t.getUTCFullYear();
  const w=Math.ceil(((t-new Date(Date.UTC(y,0,1)))/86400000+1)/7);
  return `${y}-W${String(w).padStart(2,"0")}`;
}

function ensureWeekly(){
  const k=isoWeekKey();

  }
}

function todayKey(){ const d=new Date(); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }
function dailyMissions(){
  const seed=[...todayKey()].reduce((a,c)=>a+c.charCodeAt(0),0);
  const picks=[];
  for(let i=0;i<3;i++) picks.push(DAILY_POOL[(seed+i*2)%DAILY_POOL.length]);
  return [...new Map(picks.map(m=>[m.id,m])).values()];
}
function ensureDaily(){
  const key=todayKey();
  if(!state.daily || state.daily.date!==key || !state.daily.counts || !state.daily.claimed){
    state.daily={date:key,counts:{trades:0,dividends:0,orders:0,goals:0,deposit:0,estateBuy:0,altTrades:0},claimed:{}};
  }
  ensureWeekly();
  // 연속 접속: 날짜가 바뀐 첫 호출에서만 계산합니다.
  if(!state.streak||typeof state.streak!=="object") state.streak={days:1,last:"",best:1};
  if(state.streak.last!==key){
    const y=new Date(Date.now()-86400000);
    const yk=`${y.getFullYear()}-${y.getMonth()+1}-${y.getDate()}`;
    state.streak.days=state.streak.last===yk?Math.min(365,(state.streak.days||1)+1):1;
    state.streak.last=key;
    state.streak.best=Math.max(state.streak.best||1,state.streak.days);
    if(state.streak.days>1 && state.streak.days%3===0){
      const reward=state.streak.days%7===0?1000000:300000;
      state.cash+=reward;
      addLog(`🔥 연속 접속 ${state.streak.days}일 보상 +${won(reward)}`);
      notify("mission","연속 접속",`${state.streak.days}일 연속 · ${won(reward)}`);
    }
  }
}

    if(x.side!=="sell"||!(+x.valueKRW>0)) return best;
    return Math.max(best,(+x.profit||0)/+x.valueKRW);
  },0);
  return Math.max(open,closed);
}

function setSpeed(n){
  const v=Math.round(+n||1);
  state.speed=Math.max(1,Math.min(5,v));
  state.settings=Object.assign({},SETTINGS_DEFAULT,state.settings,{speed:state.speed});
  state.paused=false;
  saveGame(); updateSpeedUI();
  if(activePage()==="settings" && typeof settingsPage==="function") settingsPage();
}
function togglePause(){ state.paused=!state.paused; saveGame(); updateSpeedUI(); }
function cycleSpeed(){
  const i=SPEEDS.indexOf(speedNow());
  setSpeed(SPEEDS[(i+1)%SPEEDS.length]);
}
function speedNow(){ return Math.max(1,Math.min(5,Math.round(+state.speed||1))); }
// 게임 시간(초)을 현재 배속에서 실제 기다려야 하는 초로 환산합니다.
// 3배속에서 180게임초는 실제 60초이므로, 화면 카운트다운이 3초씩 건너뛰지 않습니다.
function realSeconds(gameSeconds){
  const sec=Math.max(0,Number(gameSeconds)||0);
  return Math.max(0,Math.ceil(sec/speedNow()));
}
function renderMarketBar(){
  const bar=$("marketTimeBar"); if(!bar) return;
  if(state.paused){
    bar.style.background="#fef3c7";
    bar.style.color="#92400e";
    bar.textContent="⏸ 일시정지 중 · 재개하면 시장이 다시 움직입니다.";
    return;
  }
  const cycleTime=state.marketSeconds%240;
  if(cycleTime<180){
    bar.style.background="#e0f2fe";
    bar.style.color="#0369a1";
    bar.textContent=`🟢 [개장 중] 주식 거래 가능 (다음 휴장까지 실제 ${realSeconds(180-cycleTime)}초 · ${speedNow()}x)`;
  }else{
    bar.style.background="#fee2e2";
    bar.style.color="#991b1b";
    bar.textContent=`🔴 [휴장 중] 주식 거래 제한 (다음 개장까지 실제 ${realSeconds(240-cycleTime)}초 · ${speedNow()}x) - 금융상품 이자는 정상 지급됩니다.`;
  }
}
function updateSpeedUI(){
  const label=state.paused?"⏸ 정지":`${speedNow()}x`;
  ["speedState","bbSpeed","sideSpeed"].forEach(id=>{ const el=$(id); if(el) el.textContent=label; });
  renderMarketBar();
  document.querySelectorAll("[data-speed]").forEach(b=>{
    const on=!state.paused && +b.dataset.speed===speedNow();
    b.classList.toggle("on",on);
    b.setAttribute("aria-pressed",on?"true":"false");
  });
  const pauseBtn=document.getElementById("pauseBtn");
  if(pauseBtn) pauseBtn.textContent=state.paused?"▶ 재개":"⏸ 일시정지";
}

// ── 오프라인 정산(기본 2시간, 환생 업그레이드로 연장) ──────────────
const OFFLINE_MAX_BASE=2*3600;
function offlineMaxSeconds(){ return OFFLINE_MAX_BASE + 2*3600*rebirthLevel("offline"); }
function applyOfflineProgress(){
  const now=Date.now();
  const last=state.lastSeen||0;
  state.lastSeen=now;
  if(!last || last>now) return null;
  const sec=Math.min(offlineMaxSeconds(), Math.floor((now-last)/1000));
  if(sec<120) return null;
  const periods=sec/15;
  let interest=0, loanInterest=0;
  const depositBonus=rebirthBonus("deposit",.03);
  products.forEach(p=>{
    if(p.amount<=0 || p.rate<=0) return;
    for(let i=0;i<periods;i++){
      const eff=Math.min(MAX_EFFECTIVE_DEPOSIT,p.amount>30000000?30000000+(p.amount-30000000)*0.5:p.amount);
      const add=eff*(p.rate*depositBonus*0.015);
      p.amount+=add; interest+=add;
    }
  });
  // 현금을 방치해도 자동으로 돈이 늘어나던 파킹 보너스는 제거했습니다(원인 불명 자동 수익).
  if((state.loan||0)>0){
    for(let i=0;i<periods;i++){
      const li=state.loan*((state.loanRate||0)*0.015);
      loanInterest+=li;
      if(state.cash>=li) state.cash-=li;
      else { state.loan+=li-state.cash; state.cash=0; }
    }
  }
  const divPeriods=Math.min(30, Math.floor(sec/DIVIDEND_EVERY));
  const dividends=expectedDividend()*divPeriods*rebirthBonus("dividend",.03);
  if(dividends>0){ state.cash+=dividends; state.dividendTotal=(state.dividendTotal||0)+dividends; }
  // 부동산 임대료·유지비와 기업 배당도 오프라인 동안 정산합니다(가격 변동은 제외).
  const rentPeriods=Math.floor(sec/60);
  let rent=0,upkeep=0;
  const rentBonus=rebirthBonus("estate",.04);
  ESTATES.forEach(e=>{ const q=(state.estate[e.id]&&state.estate[e.id].qty)||0; if(!q) return; rent+=q*estatePrice(e.id)*e.rent*rentBonus*rentPeriods; upkeep+=q*estatePrice(e.id)*e.upkeep*rentPeriods; });
  const companyPay=state.company?Math.round(state.company.profit*((state.company.payout==null?.3:state.company.payout))*rebirthBonus("company",.04)*sec/30):0;
  state.cash+=rent-upkeep+companyPay;
  const summary={sec,interest,dividends,loanInterest,rent,upkeep,companyPay};
  addLog(`오프라인 정산: ${Math.floor(sec/60)}분 · 이자 ${won(interest)} · 배당 ${won(dividends)}`);
  notify("system","오프라인 정산",`${Math.floor(sec/60)}분 동안 이자 ${won(interest)} · 배당 ${won(dividends)}`);
  openModal("오프라인 정산",`<div class="kpis">
    <div class="kpi"><small>경과 시간</small><b>${Math.floor(sec/60)}분</b></div>
    <div class="kpi"><small>금융상품 이자</small><b>${won(interest)}</b></div>
    <div class="kpi"><small>배당(최대 1시간)</small><b>${won(dividends)}</b></div>
    <div class="kpi"><small>대출 이자</small><b>${won(loanInterest)}</b></div>
    <div class="kpi"><small>임대 수익</small><b>${won(rent||0)}</b></div>
    <div class="kpi"><small>유지비</small><b>${won(upkeep||0)}</b></div>
    <div class="kpi"><small>기업 배당</small><b>${won(companyPay||0)}</b></div>
  </div><p style="margin-top:10px;font-size:12px;color:#667085">주가·부동산 가격 변동은 반영하지 않고 이자·배당·임대료만 정산합니다(최대 ${Math.floor(offlineMaxSeconds()/3600)}시간).</p>`);
  saveGame();
  return summary;
}

const assetHistory={points:[],peak:0};

function recordAssetHistory(){
  const v=totalAssetsKRW();
  const last=assetHistory.points[assetHistory.points.length-1];
  if(last && Math.abs(last.v-v)<1) last.t=state.marketSeconds;
  else assetHistory.points.push({t:state.marketSeconds,v});
  if(assetHistory.points.length>180) assetHistory.points.shift(); // 15초 간격 45분
  assetHistory.peak=Math.max(assetHistory.peak,v);
}

function assetTrendSVG(){
  // 기록이 2개 미만이면 선을 그리지 않습니다.
  // (시작 금액을 첫 점으로 끼워 넣으면 새로고침 직후 가짜 상승/하락 선이 보입니다.)
  if(assetHistory.points.length<2) return "";
  const vals=assetHistory.points.map(p=>p.v);
  const min=Math.min(...vals),max=Math.max(...vals),span=(max-min)||Math.max(1,Math.abs(max)*0.01);
  const w=600,h=120,step=w/Math.max(1,vals.length-1);
  const coords=vals.map((v,i)=>`${(i*step).toFixed(1)},${(h-((v-min)/span)*(h-6)-3).toFixed(1)}`).join(" ");
  const up=vals[vals.length-1]>=vals[0];
  const color=up?"#0f766e":"#b42318";
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polygon points="0,${h} ${coords} ${w},${h}" fill="${color}" opacity=".10"/><polyline points="${coords}" fill="none" stroke="${color}" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>`;
}

// 자산 배분(현금·달러·주식·금융상품). 부채는 별도 표기합니다.
function allocation(){
  const parts=[
    {label:"현금",value:Math.max(0,state.cash),color:"#0f766e"},
    {label:"달러",value:Math.max(0,(state.usd||0)*fx.usd),color:"#0369a1"},
    {label:"주식",value:Math.max(0,stockValueKRW()),color:"#b45309"},
    {label:"금융상품",value:Math.max(0,productValueKRW()),color:"#6d28d9"},
    {label:"부동산",value:Math.max(0,estateValue()),color:"#be123c"},
    {label:"금·은",value:Math.max(0,metalValue()),color:"#a16207"},
    {label:"기업",value:Math.max(0,companyValue()),color:"#0f766e"}
  ];
  const gross=parts.reduce((a,p)=>a+p.value,0);
  parts.forEach(p=>{ p.pct=gross>0?(p.value/gross)*100:0; });
  return {parts,gross};
}

// 거래 저널과 자산 배분을 함께 읽어 투자 스타일을 진단합니다.
function investmentStyle(){
  const journal=Array.isArray(state.journal)?state.journal:[];
  const buys=journal.filter(x=>x.side==="buy").length;
  const sells=journal.filter(x=>x.side==="sell").length;
  const wins=journal.filter(x=>x.side==="sell"&&(+x.profit||0)>0).length;
  const realized=journal.reduce((a,x)=>a+(x.side==="sell"?(+x.profit||0):0),0);
  const winRate=sells?wins/sells:0;
  const alloc=allocation();
  const stockPct=(alloc.parts.find(p=>p.label==="주식")||{pct:0}).pct;
  const safePct=alloc.parts.filter(p=>["현금","금융상품"].includes(p.label)).reduce((a,p)=>a+p.pct,0);
  const top=stockReturnRows()[0]||null;
  let style="관망형",desc="아직 거래 기록이 적어 성향을 판단하는 중입니다.",advice="소액으로 분산 매수해 자신의 위험 감도를 확인해 보세요.";
  if(journal.length>=3 && sells>=3 && sells/(buys+sells)>=.45 && winRate>=.5){
    style="스윙 트레이더"; desc="짧은 변동을 매매로 잡아내며 매도 승률이 높은 편입니다."; advice="수수료와 세금을 감안해 기대 수익이 충분한 거래만 남기세요.";
  } else if(journal.length>=3 && buys>=Math.max(2,sells*2)){
    style="장기 보유형"; desc="매수 후 보유 비중이 높아 기업 가치와 배당을 중시합니다."; advice="보유 종목의 실적과 배당 성장을 분기마다 점검하세요.";
  } else if(stockPct>=60){
    style="공격 성장형"; desc="주식 비중이 높아 시장 상승을 적극적으로 추종합니다."; advice="하락장을 대비해 현금·금융상품 완충을 남겨 두세요.";
  } else if(safePct>=60){
    style="안정 추구형"; desc="현금과 금융상품 비중이 높아 원금 보존을 우선합니다."; advice="물가 상승률보다 높은 금리의 상품으로 실질 수익을 지키세요.";
  } else if(journal.length>=3){
    style="균형형"; desc="주식과 안전자산을 함께 보유해 변동성을 분산하고 있습니다."; advice="자산 비중이 목표에서 벗어나면 정기적으로 리밸런싱하세요.";
  }
  return {style,desc,advice,buys,sells,winRate,realized,stockPct,safePct,top};
}

// 다음 배당까지 남은 초와 예상 배당금(원화 환산)
function secondsToDividend(){ return DIVIDEND_EVERY-(state.marketSeconds%DIVIDEND_EVERY); }
function expectedDividend(){
  return stocks.reduce((sum,s)=>{
    if(s.own<=0) return sum;
    const amount=s.price*s.own*DIVIDEND_YIELD;
    return sum+(isForeignStock(s)?amount*fx.usd:amount);
  },0);
}

// ── 가격 차트(최근 60틱 스파크라인) ───────────────────────
function sparklineSVG(s){
  const data = (s.hist && s.hist.length > 1) ? s.hist : [s.start, s.price];
  const min = Math.min(...data), max = Math.max(...data), span = (max - min) || 1;
  const w = 100, h = 28, step = w / Math.max(1, data.length - 1);
  const points = data.map((v, i) => `${(i * step).toFixed(1)},${(h - ((v - min) / span) * h).toFixed(1)}`).join(" ");
  const up = data[data.length - 1] >= data[0];
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${points}" fill="none" stroke="${up ? "#0f766e" : "#b42318"}" stroke-width="1.6"/></svg>`;
}

// ── 예약(지정가) 주문 ────────────────────────────────
function placeOrder(){
  const stockId = $("order-stock") ? $("order-stock").value : "";
  const side = $("order-side") ? $("order-side").value : "buy";
  const qty = Math.floor(+($("order-qty") ? $("order-qty").value : 0) || 0);
  const limit = +($("order-limit") ? $("order-limit").value : 0) || 0;
  const s = stock(stockId);
  if(!s) return alert("예약할 종목을 선택해 주세요.");
  if(qty <= 0 || limit <= 0) return alert("수량과 지정가를 올바르게 입력해 주세요.");
  if(side === "sell" && s.own < qty) return alert("보유 수량이 부족합니다.");
  state.orders.push({id:`o${Date.now()}${Math.floor(Math.random()*1000)}`, stockId, side, qty, limit});
  addLog(`예약 주문: ${s.name} ${side === "buy" ? "매수" : "매도"} ${qty}주 @ ${isForeignStock(s) ? usdStr(limit) : won(limit)}`);
  saveGame(); portfolio(); update();
}

function cancelOrder(oid){
  const before = state.orders.length;
  state.orders = state.orders.filter(o => o.id !== oid);
  if(state.orders.length !== before) addLog("예약 주문을 취소했습니다.");
  saveGame(); portfolio();
}

// 가격이 지정가에 도달한 주문을 체결합니다(휴장 중에는 대기).
function processOrders(){
  if(!state.marketOpen || !state.orders.length) return;
  const remain = [];
  state.orders.forEach(o => {
    const s = stock(o.stockId);
    if(!s) return;
    const hit = o.side === "buy" ? s.price <= o.limit : s.price >= o.limit;
    if(!hit){ remain.push(o); return; }
    const foreign = isForeignStock(s);
    if(o.side === "buy"){
      const cost = s.price * (1 + stockFeeRate()) * o.qty;
      if(foreign ? state.usd < cost : state.cash < cost){ remain.push(o); return; } // 잔고 부족 시 다음 틱 재시도
      if(foreign) state.usd -= cost; else state.cash -= cost;
      s.avgBuy = ((s.avgBuy * s.own) + (s.price * (1 + stockFeeRate())) * o.qty) / (s.own + o.qty);
      s.own += o.qty;
      addLog(`⏱ 예약 매수 체결: ${s.name} ${o.qty}주 @ ${foreign ? usdStr(s.price) : won(s.price)}`);
      bumpDaily("orders");
      notify("order","지정가 매수 체결",`${s.name} ${o.qty}주`);
      recordTrade(s,"buy",o.qty,s.price,0);
    } else {
      if(s.own < o.qty){ remain.push(o); return; }
      const revenue = s.price * (1 - stockFeeRate() - tradeTaxRate()) * o.qty;
      const profitTotal = revenue - (s.avgBuy * o.qty);
      const profitKRW = foreign ? profitTotal * fx.usd : profitTotal;
      if(foreign){ state.usd += revenue; s.realizedProfit += profitKRW; }
      else { state.cash += revenue; s.realizedProfit += profitTotal; }
      s.own -= o.qty;
      if(s.own === 0) s.avgBuy = 0;
      addLog(`⏱ 예약 매도 체결: ${s.name} ${o.qty}주 @ ${foreign ? usdStr(s.price) : won(s.price)}`);
      bumpDaily("orders");
      notify("order","지정가 매도 체결",`${s.name} ${o.qty}주 · ${won(profitKRW)}`);
      recordTrade(s,"sell",o.qty,s.price,profitKRW);
      settleTax(profitKRW);
      creditStockBonus(profitKRW);
    }
  });
  state.orders = remain;
}

// ── 세금 ────────────────────────────────────────
// 양도소득세: 연간 실현손익 2,500만원 공제 후 22%를 매도 시점에 원천징수합니다.
function settleTax(profitKRW){
  if(!(profitKRW > 0)) return 0;
  state.realizedYTD = (state.realizedYTD || 0) + profitKRW;
  const taxable = Math.max(0, state.realizedYTD - TAX_GAINS_FREE) - (state.taxedProfit || 0);
  if(taxable <= 0) return 0;
  const tax = taxable * TAX_GAINS_RATE;
  state.taxedProfit = (state.taxedProfit || 0) + taxable;
  state.taxPaid = (state.taxPaid || 0) + tax;
  if(state.cash >= tax){ state.cash -= tax; }
  else { state.loan = (state.loan || 0) + (tax - state.cash); state.cash = 0; } // 현금 부족분은 대출로 전환
  addLog(`양도세 원천징수: ${won(tax)} (연 누적 실현손익 ${won(state.realizedYTD)})`);
  notify("tax","양도세 원천징수",`${won(tax)}`);
  return tax;
}

// ── 신용 대출 ───────────────────────────────────
function loanPolicy(){ return LOAN_POLICY[currentGrade()] || LOAN_POLICY["브론즈"]; }

function borrowLoan(){
  const pol = loanPolicy();
  if(pol.limit <= 0) return alert("대출은 실버 등급부터 이용할 수 있습니다.");
  const avail = Math.max(0, pol.limit - (state.loan || 0));
  const amt = Math.floor((+($("loan-amt") ? $("loan-amt").value : 0) || 0) / 10000) * 10000;
  if(amt <= 0) return alert("대출 금액을 입력해 주세요.");
  if(amt > avail) return alert(`대출 한도를 초과했습니다. (가능 ${won(avail)})`);
  state.loan = (state.loan || 0) + amt;
  state.loanRate = pol.rate;
  state.loanTotal = (state.loanTotal || 0) + amt;
  state.cash += amt;
  addLog(`신용 대출 실행: ${won(amt)} (연 ${(pol.rate * 100).toFixed(1)}%)`);
  saveGame(); portfolio(); update();
}

function repayLoan(){
  const loan = state.loan || 0;
  if(loan <= 0) return alert("상환할 대출이 없습니다.");
  let amt = Math.floor((+($("loan-amt") ? $("loan-amt").value : 0) || 0) / 10000) * 10000;
  amt = Math.min(amt || loan, loan, Math.floor(state.cash));
  if(amt <= 0) return alert("상환할 현금이 부족합니다.");
  state.loan = loan - amt;
  state.cash -= amt;
  if(state.loan <= 0){ state.loan = 0; state.loanRate = 0; }
  addLog(`대출 상환: ${won(amt)} (남은 잔액 ${won(state.loan)})`);
  saveGame(); portfolio(); update();
}

// 대출 전액 상환: 입력값과 무관하게 보유 현금으로 최대한 갚습니다.
function repayLoanFull(){
  const loan=state.loan||0;
  if(loan<=0) return alert("상환할 대출이 없습니다.");
  const amt=Math.min(loan,Math.floor(state.cash));
  if(amt<=0) return alert("상환할 현금이 부족합니다.");
  state.loan=loan-amt;
  state.cash-=amt;
  if(state.loan<=0){ state.loan=0; state.loanRate=0; }
  addLog(`대출 전액 상환: ${won(amt)} (남은 잔액 ${won(state.loan)})`);
  saveGame(); portfolio(); update();
}

// ── 배당·실적 발표 ───────────────────────────────
function applyShock(s, move){
  const next = s.price * (1 + move);
  s.price = isForeignStock(s) ? Math.max(1, Math.round(next * 100) / 100) : Math.max(100, Math.round(next / 100) * 100);
  s.lastMove = move;
}

function payDividends(){
  let totalKRW = 0;
  const dividendBonus=rebirthBonus("dividend",.03);
  stocks.forEach(s => {
    if(s.own <= 0) return;
    const amount = s.price * s.own * DIVIDEND_YIELD * dividendBonus;
    if(isForeignStock(s)){ state.usd += amount; totalKRW += amount * fx.usd; }
    else { state.cash += amount; totalKRW += amount; }
  });
  if(totalKRW <= 0) return;
  state.dividendTotal = (state.dividendTotal || 0) + totalKRW;
  bumpDaily("dividends");
  addLog(`💰 배당금 지급: ${won(totalKRW)}`);
  publishBreakingNews("💰 배당 지급", `보유 주식 배당금 ${won(totalKRW)}이 지급되었습니다.`);
  notify("dividend","배당금 지급",`${won(totalKRW)}`);
}

function ensureStockFundamentals(s){
  if(!s) return;
  if(!Number.isFinite(+s.revenue)||+s.revenue<=0) s.revenue=Math.max(100000000,Math.round((+s.start||s.price||1000)*10000));
  if(!Number.isFinite(+s.opProfit)||+s.opProfit<0) s.opProfit=Math.round(s.revenue*.12);
}
function earningsSurprise(){
  if(!stocks.length) return;
  const pool=stocks.filter(s=>s.id!=="market_etf");
  const s = pool[Math.floor(Math.random() * pool.length)];
  if(!s) return;
  ensureStockFundamentals(s);
  // 매출 성장률과 영업이익률 변화가 함께 주가 방향을 결정합니다.
  const revGrowth=(Math.random()-.45)*.18;
  const marginBefore=s.opProfit/Math.max(1,s.revenue);
  const marginAfter=Math.max(.005,Math.min(.45,marginBefore+(Math.random()-.5)*.06));
  const revenue=Math.max(100000000,Math.round(s.revenue*(1+revGrowth)));
  const opProfit=Math.max(0,Math.round(revenue*marginAfter));
  const opGrowth=(opProfit-s.opProfit)/Math.max(1,s.opProfit);
  const score=revGrowth*.55+opGrowth*.45;
  const beat=score>=0;
  s.revenue=revenue; s.opProfit=opProfit;
  const move=Math.max(-.15,Math.min(.15,score*.7+(beat?.005:-.005)));
  applyShock(s, move);
  publishBreakingNews("📊 실적 발표", `${s.name} ${beat?"어닝 서프라이즈":"어닝 쇼크"}! 매출 ${won(revenue)} (${pct(revGrowth)}) · 영업이익 ${won(opProfit)} (${pct(opGrowth)}) · 주가 ${pct(move)}`);
  notify("earnings","실적 발표",`${s.name} ${beat?"서프라이즈":"쇼크"} · 주가 ${pct(move)}`);
}

function handleImport(ev){
  const file = ev.target.files && ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      applySaveData(JSON.parse(String(reader.result)));
      saveGame(); banking(); fxPage(); portfolio(); update();
      addLog("저장 파일을 불러왔습니다.");

  ev.target.value = "";
}

// ── 클라우드 저장·월간 리더보드 ─────────────────────────────────
const CLOUD_CREDS_KEY="mp_cloud_creds";
let CLOUD_API="";
try{
  const cm=document.querySelector('meta[name="cloud-api"]');
  CLOUD_API=(cm && cm.getAttribute ? (cm.getAttribute("content")||"") : "").trim().replace(/\/+$/,"");
}catch(e){ CLOUD_API=""; }
let cloudBoard=null, cloudBusy=false;

function cloudConfigured(){ return !!CLOUD_API; }
function setCloudApi(url){ CLOUD_API=String(url||"").trim().replace(/\/+$/,""); try{ portfolio(); }catch(e){} }
function cloudCreds(){
  try{ const v=JSON.parse(localStorage.getItem(CLOUD_CREDS_KEY)||"null"); return v&&v.playerId&&v.token?v:null; }catch(e){ return null; }
}
function setCloudCreds(v){
  try{ if(v) localStorage.setItem(CLOUD_CREDS_KEY,JSON.stringify(v)); else localStorage.removeItem(CLOUD_CREDS_KEY); }catch(e){}
}
function seasonKey(){ return new Date().toISOString().slice(0,7); }
function cloudErr(e){
  const map={no_api:"서버 주소가 설정되지 않았습니다.",unauthorized:"연결이 만료되었습니다. 다시 연결해 주세요.",nickname_taken:"이미 사용 중인 닉네임입니다.",rate_limited:"요청이 너무 많습니다. 잠시 후 다시 시도해 주세요.",bad_nickname:"닉네임은 한글/영문/숫자 2~16자입니다.",conflict:"서버에 더 최신 저장이 있습니다.",too_large:"저장 파일이 너무 큽니다.",bad_save:"서버가 저장 데이터를 거부했습니다.",bad_json:"요청 형식이 올바르지 않았습니다.",no_save:"서버에 저장된 진행이 없습니다."};
  if(e&&e.status===429) return map.rate_limited;
  if(e&&(map[e.code]||map[e.message])) return map[e.code]||map[e.message];
  return "네트워크 오류가 발생했습니다. 연결을 확인해 주세요.";
}

async function cloudCall(path,{method="GET",body,auth=true,timeout=8000}={}){
  if(!CLOUD_API) throw Object.assign(new Error("no_api"),{code:"no_api"});
  const creds=cloudCreds();
  const headers={"content-type":"application/json"};
  if(auth && creds) headers.authorization="Bearer "+creds.token;
  const ctrl=typeof AbortController!=="undefined"?new AbortController():null;
  const timer=ctrl?setTimeout(()=>ctrl.abort(),timeout):0;
  try{
    const res=await fetch(CLOUD_API+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body),signal:ctrl?ctrl.signal:undefined});
    const txt=await res.text();
    let data=null; try{ data=txt?JSON.parse(txt):null; }catch(e){}
    if(!res.ok){
      const err=new Error((data&&data.error)||("http_"+res.status));
      err.code=data&&data.error; err.status=res.status; err.data=data;
      throw err;
    }
    return data;
  } finally { if(timer) clearTimeout(timer); }
}

async function cloudRegister(){
  if(!CLOUD_API){ notify("system","클라우드","서버 주소가 설정되지 않았습니다."); return; }
  const input=document.getElementById("cloud-name");
  const nickname=String(input&&input.value||"").trim();
  if(!/^[\p{L}\p{N} ._-]{2,16}$/u.test(nickname)){ alert("닉네임은 한글/영문/숫자 2~16자로 입력해 주세요."); return; }
  if(cloudBusy) return;
  cloudBusy=true; cloudRenderPanel("연결 중…");
  try{
    const out=await cloudCall("/api/register",{method:"POST",auth:false,body:{nickname}});
    setCloudCreds({playerId:out.playerId,token:out.token,nickname:out.nickname});
    state.cloud=Object.assign({},state.cloud,{nickname:out.nickname,revision:0,lastSync:0});
    saveGame();
    cloudBusy=false;
    notify("system","클라우드 연결",`${out.nickname} 님으로 연결했습니다.`);
    await cloudUpload(false);
    await cloudRefreshBoard();
  }catch(e){
    cloudBusy=false;
    alert("연결하지 못했습니다: "+cloudErr(e));
    cloudRenderPanel();
  }
}

async function cloudUpload(force){
  if(!CLOUD_API){ notify("system","클라우드","서버 주소가 설정되지 않았습니다."); return; }
  if(!cloudCreds()){ notify("system","클라우드","먼저 닉네임으로 연결해 주세요."); return; }
  if(cloudBusy) return;
  cloudBusy=true; cloudRenderPanel("동기화 중…");
  try{
    const data=buildSaveData();
    const out=await cloudCall("/api/save",{method:"PUT",body:{data,revision:state.cloud.revision||0,force:!!force}});
    state.cloud=Object.assign({},state.cloud,{revision:out.revision,lastSync:Date.now()});
    saveGame();
    let extra="";
    try{ const s=await cloudSubmitScore(); if(s&&s.rank) extra=` · 순위 ${s.rank}위`; }catch(e){}
    cloudBusy=false;
    notify("system","클라우드 저장",`서버에 저장했습니다.${extra}`);
    await cloudRefreshBoard();
  }catch(e){
    cloudBusy=false;
    if(e.status===409){
      if(confirm("서버에 이 기기보다 최신 저장이 있습니다.\n확인을 누르면 이 기기 것으로 덮어쓰고, 취소하면 서버 저장을 내려받습니다.")) return cloudUpload(true);
      return cloudDownload();
    }
    notify("system","클라우드 저장 실패",cloudErr(e));
    cloudRenderPanel(cloudErr(e));
  }
}

async function cloudSubmitScore(){
  const out=await cloudCall("/api/score",{method:"POST",body:{season:seasonKey(),score:Math.round(totalAssetsKRW())}});
  state.cloud=Object.assign({},state.cloud,{rank:out.rank,best:out.best,season:out.season});
  saveGame();
  return out;
}

async function cloudDownload(){
  if(!CLOUD_API||!cloudCreds()||cloudBusy) return;
  if(!confirm("서버에 저장된 진행으로 이 기기를 덮어쓸까요?\n현재 진행은 사라집니다.")) return;
  cloudBusy=true; cloudRenderPanel("내려받는 중…");
  try{
    const out=await cloudCall("/api/save");
    if(!out||!out.data) throw Object.assign(new Error("no_save"),{code:"no_save"});
    applySaveData(out.data);
    state.cloud=Object.assign({},state.cloud,{revision:out.revision,lastSync:Date.now()});
    saveGame(); banking(); fxPage(); news(); portfolio(); update(); updateBell(); updateSpeedUI();
    cloudBusy=false;
    notify("system","클라우드 복원","서버 저장을 불러왔습니다.");
    await cloudRefreshBoard();
  }catch(e){
    cloudBusy=false;
    alert(e.code==="no_save"||e.status===404?"서버에 저장된 진행이 아직 없습니다.":"내려받지 못했습니다: "+cloudErr(e));
    cloudRenderPanel();
  }
}

async function cloudRefreshBoard(){
  if(!CLOUD_API||cloudBusy) return;
  try{

function rebirthEffectText(u,nextLevel){
  switch(u.id){
    case "start": return `시작 자금 ${won(START_CASH+2000000*nextLevel)}`;
    case "stock": return `주식 매도 이익 +${nextLevel*2}%`;
    case "deposit": return `예금·적금 이자 +${nextLevel*3}%`;
    case "dividend": return `배당금 +${nextLevel*3}%`;
    case "labor": return `노동 일당 +${nextLevel*5}%`;
    case "company": return `기업 배당 +${nextLevel*4}%`;
    case "estate": return `부동산 임대 +${nextLevel*4}%`;
    case "fee": return `수수료·거래세 ${nextLevel*10}% 감소`;
    case "private": return "프라이빗 뱅킹 해금";
    case "offline": return `오프라인 정산 ${2+2*nextLevel}시간`;
    default: return u.desc;
  }
}
function rebirthPage(){
  const r=ensureRebirth(), net=totalAssetsKRW(), pts=rebirthPointsFor(net), eligible=canRebirth();
  const progress=Math.min(100,net/REBIRTH_MIN*100);

    <section class="rebirth-hero">
      <div><small>환생 횟수</small><b>${r.count}회</b></div>

    <section class="section"><div class="section-head"><h3>환생 기록</h3></div><div class="panel stack">${history}</div></section>`;
}
function buyRebirthUpgrade(id){
  const r=ensureRebirth(), u=REBIRTH_UPGRADES.find(x=>x.id===id);
  if(!u) return false;
  const lv=rebirthLevel(id), cost=rebirthCost(id);
  if(lv>=u.max) return false;
  if(r.points<cost) return alert("환생 포인트가 부족합니다.");
  r.points-=cost; r.spent=(r.spent||0)+cost; r.upgrades[id]=lv+1;
  saveGame(); rebirthPage(); update();
  notify("rebirth","영구 업그레이드",`${u.name} Lv.${lv+1}`);
  return true;
}
function confirmRebirth(){

    <div class="kpis" style="margin-top:10px"><div class="kpi"><small>현재 순자산</small><b>${won(net)}</b></div><div class="kpi"><small>예상 포인트</small><b>${pts} P</b></div><div class="kpi"><small>새 시작 자금</small><b>${won(rebirthStartCash())}</b></div></div>

function rebirthNow(skipConfirm){
  const net=totalAssetsKRW();
  if(net<REBIRTH_MIN) return alert("순자산 1억원을 달성해야 환생할 수 있습니다.");
  if(!skipConfirm){
    const cb=document.getElementById("rebirth-check");
    if(!cb||!cb.checked) return alert("확인에 체크해 주세요.");
    if(!confirm("환생하면 현재 진행이 초기화됩니다. 계속할까요?")) return;
  }
  const pts=rebirthPointsFor(net), r=ensureRebirth();
  r.count++; r.points+=pts; r.bestNet=Math.max(r.bestNet||0,net); r.notified=false;
  r.history.unshift({at:Date.now(),net,points:pts,count:r.count});
  if(r.history.length>20) r.history.pop();
  resetRunForRebirth();
  closeModal();
  saveGame();
  notify("rebirth","환생 완료",`${r.count}회차 · +${pts}P · 시작 자금 ${won(rebirthStartCash())}`);
  goPage("rebirth"); update();
}
