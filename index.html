<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#17202b" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<title>머니 플레이그라운드</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:#f5f3ee;color:#18212f}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.side{background:#17202b;color:white;padding:20px;position:sticky;top:0;height:100vh}
.logo{font-size:21px;font-weight:800;margin-bottom:8px}
.sub{font-size:13px;color:#cbd5e1;line-height:1.4;margin-bottom:18px}
.nav{display:grid;gap:8px}
.nav button{background:transparent;color:#dbe4ef;text-align:left}
.nav button.on{background:#f7c948;color:#17202b;font-weight:800}
button{border:0;border-radius:7px;min-height:38px;padding:0 12px;cursor:pointer;background:#1f2937;color:white}
button:disabled{opacity:.45;cursor:not-allowed}
main{padding:22px}
.breaking{display:none;margin-bottom:14px;border-radius:8px;padding:13px 14px;background:#111827;color:white;border-left:7px solid #f7c948;box-shadow:0 10px 28px #0002}
.breaking.show{display:block}
.breaking b{color:#f7c948}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.box,.card,.product,.news,.row{background:#fffdf8;border:1px solid #d8ded4;border-radius:8px;padding:14px;box-shadow:0 10px 28px #0001}
.box small{color:#667085}.box b{display:block;font-size:20px;margin-top:8px}
.page{display:none}
.page.on{display:block}
.head{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:12px}
h1{margin:0 0 5px;font-size:28px}
h2{margin:0 0 8px}
p{margin:0;color:#667085;line-height:1.45}
.notice{background:#fff7d6;border:1px solid #edd07b;color:#604400;border-radius:8px;padding:10px 12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.top{display:flex;justify-content:space-between;gap:8px}
.pill{display:inline-flex;align-items:center;border-radius:999px;background:#edf2f7;color:#334155;font-size:12px;padding:5px 8px;white-space:nowrap}
.price{font-size:25px;font-weight:900;margin:12px 0 3px}
.up{color:#0f766e}.down{color:#b42318}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}
.mini div,.product-grid div{border:1px solid #d8ded4;background:#fafafa;border-radius:7px;padding:8px}
.mini small,.product-grid small{display:block;color:#667085;margin-bottom:5px}
.trade{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bank-trade{grid-template-columns:1fr 1fr}
.bank-trade input{grid-column:1 / -1}
.buy{background:#0f766e}.sell{background:#b42318}.ghost{background:#e7ebef;color:#18212f}
.spark{height:28px;margin-top:10px}
.spark svg{display:block;width:100%;height:28px}
.section{margin-top:22px}
.section h3{margin:0 0 10px}
.panel{background:#fffdf8;border:1px solid #d8ded4;border-radius:8px;padding:14px;box-shadow:0 10px 28px #0001}
.field{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.field label{display:grid;gap:4px;font-size:12px;color:#667085}
select{min-width:0;border:1px solid #cbd5e1;border-radius:7px;padding:0 9px;min-height:38px;background:white}
.goal{display:grid;gap:6px;margin-bottom:10px}
.goal small{color:#667085}
.bar{height:8px;background:#e7ebef;border-radius:999px;overflow:hidden}
.bar span{display:block;height:100%;background:#0f766e}
.hof{display:grid;gap:6px;font-size:13px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #f7c948;outline-offset:2px}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.product-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
input{min-width:0;border:1px solid #cbd5e1;border-radius:7px;padding:0 9px;min-height:38px}
.wide{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}
.feed,.portfolio,.info-list{display:grid;gap:10px}
.news.locked{background:#fffaf0;border-color:#e7c066}
.product.locked{opacity:.62;background:#f6f7f9}
.product.locked.holding{opacity:1;background:#fffdf8}
.news.good{border-color:#0f766e;background:#f0fdf4}
.news-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.row{display:grid;grid-template-columns:1fr repeat(4,auto);gap:10px;align-items:center}
.log-box{margin-top:20px;max-height:200px;overflow-y:auto;background:#fafafa;padding:10px;border:1px solid #d8ded4;border-radius:8px;}
.log-item{font-size:13px;color:#475569;margin-bottom:4px;font-family:monospace;}
/* 자산 대시보드 */
.dash{display:grid;gap:12px}
.dash-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.dash-top small{color:#667085}
.dash-total{display:block;font-size:clamp(22px,5vw,28px);line-height:1.25;margin-top:4px;overflow-wrap:anywhere}
.dash-meta{display:flex;gap:6px;flex-wrap:wrap}
.trend{height:118px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:6px}
.trend svg{display:block;width:100%;height:100%}
.trend-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:100%;color:#94a3b8;font-size:12px;text-align:center;line-height:1.4}
/* 알림·토스트·모달 */
.bell{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:34px;margin-top:10px;background:#22303f;font-size:13px}
.badge{display:none;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#f7c948;color:#17202b;font-size:11px;font-weight:800}
.toast-wrap{position:fixed;right:14px;bottom:18px;display:grid;gap:8px;z-index:60;max-width:320px}
.toast{background:#111827;color:#fff;border-left:5px solid #f7c948;border-radius:8px;padding:10px 12px;box-shadow:0 10px 24px #0003;font-size:13px;animation:toastIn .18s ease-out}
.toast b{color:#f7c948;display:block;margin-bottom:2px}
@keyframes toastIn{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.modal{position:fixed;inset:0;background:#0b1220aa;display:none;align-items:center;justify-content:center;z-index:70;padding:16px}
.modal.on{display:flex}
.modal-box{background:#fffdf8;border-radius:12px;max-width:580px;width:100%;max-height:86vh;overflow:auto;padding:18px;box-shadow:0 24px 60px #0005}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.modal-head h2{margin:0;font-size:20px}
.modal-close{background:#e7ebef;color:#18212f;min-height:34px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px}
.kpi{border:1px solid #d8ded4;background:#fafafa;border-radius:8px;padding:10px}
.kpi small{display:block;color:#667085;font-size:12px}
.kpi b{display:block;margin-top:4px;font-size:16px;overflow-wrap:anywhere}
/* 종목 도구막대 */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input{flex:1 1 170px}
.toolbar select{flex:0 0 auto}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 12px;border-radius:9px;background:#e7ebef;color:#18212f;font-size:13px}
.chip.on{background:#17202b;color:#fff}
.card .star{background:transparent;color:#cbd5e1;font-size:20px;min-height:auto;padding:0 4px;line-height:1}
.card .star.on{color:#f7c948}
/* 성과·미션·자동화 */
.mission{display:grid;gap:6px;border-bottom:1px dashed #e2e8f0;padding:8px 0}
.mission:last-child{border-bottom:0}
.mission-top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.ach{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.ach div{border:1px solid #d8ded4;border-radius:8px;padding:8px 10px;font-size:12px;background:#fafafa}
.ach div.done{border-color:#0f766e;background:#f0fdf4}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:#334155;margin:4px 12px 4px 0}
.switch input{min-height:auto}
.inline-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;align-items:end}
.inline-form label{display:grid;gap:4px;font-size:12px;color:#667085}
.journal{display:grid;gap:6px;font-size:12px}
.journal div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed #e2e8f0;padding:5px 0}
.speed{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid #2b3a4d}
.speed button{min-height:30px;padding:0 9px;background:#22303f;font-size:12px}
.speed button.on{background:#f7c948;color:#17202b;font-weight:800}
.speed span{font-size:12px;color:#cbd5e1;margin-left:auto}
#bottomBar{display:none}
@media(max-width:850px){
  main{padding-bottom:126px}
  #bottomBar{display:block;position:fixed;left:0;right:0;bottom:0;z-index:50;background:#17202bee;border-top:1px solid #2b3a4d;padding:6px 8px 8px;color:#e2e8f0}
  .bb-net{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;padding:0 6px 6px;border-bottom:1px solid #2b3a4d}
  .bb-net b{font-size:15px;color:#f7c948}
  .bb-net button{min-height:26px;padding:0 8px;background:#2b3a4d;font-size:12px;color:#e2e8f0}
  .bb-tools{display:flex;gap:6px;align-items:center;margin-left:auto}
  .bb-badge{display:none;margin-left:3px;font-size:11px;color:#f7c948;font-weight:800}
  .side .speed,.side .bell{display:none}
  .bb-nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
  .bb-nav button{background:transparent;color:#cbd5e1;font-size:12px;min-height:34px}
  .bb-nav button.on{background:#f7c948;color:#17202b;font-weight:800}
  .toast-wrap{left:12px;right:12px;bottom:104px;max-width:none}
}
@media(max-width:540px){.kpis{grid-template-columns:1fr 1fr}.ach{grid-template-columns:1fr}.ach div{line-height:1.5}}
.alloc-bar{display:flex;height:14px;border-radius:999px;overflow:hidden;background:#edf2f7}
.alloc-bar span{display:block;height:100%}
.alloc-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:#475569}
.alloc-legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.dash-foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:#475569;border-top:1px dashed #e2e8f0;padding-top:10px}
.kv-row{grid-template-columns:1fr repeat(3,auto)}
.order-row{grid-template-columns:1fr repeat(3,auto)}
.app,main,.page,.panel,.section,.row{min-width:0}
.row{overflow-wrap:anywhere}
@media(max-width:1024px){.stats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:850px){.app{grid-template-columns:minmax(0,1fr)}.side{min-width:0;height:auto;position:sticky;top:0;z-index:5;padding:12px 14px}.logo{font-size:18px}.sub{margin-bottom:10px;font-size:12px}.nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.nav button{white-space:nowrap;min-height:34px;background:#22303f}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.wide{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}.field{grid-template-columns:1fr}}
@media(max-width:540px){main{padding:14px}.stats{grid-template-columns:minmax(0,1fr)}.head{display:block}.trade{grid-template-columns:1fr 1fr}}
/* 인라인 4열 행이 모바일에서 화면을 밀어내지 않도록 클래스로 전환한 행 */
@media(max-width:850px){.kv-row,.order-row{grid-template-columns:1fr 1fr}}
@media(max-width:540px){.row,.kv-row,.order-row{grid-template-columns:1fr;gap:6px}.dash{padding:12px}.dash-foot{font-size:12px}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo">머니 플레이그라운드</div>
    <div class="sub">기본 자금 1,000만원으로 시작하는 주식·금융 시뮬레이션</div>
    <div class="nav" id="nav"></div>
    <div class="speed" aria-label="게임 속도">
      <button data-speed="1" onclick="setSpeed(1)">1x</button>
      <button data-speed="3" onclick="setSpeed(3)">3x</button>
      <button data-speed="10" onclick="setSpeed(10)">10x</button>
      <button onclick="togglePause()" aria-label="일시정지">⏸</button>
      <span id="speedState">1x</span>
    </div>
    <button class="bell" onclick="openNotifModal()" aria-label="알림">🔔 알림 <span class="badge" id="bellBadge">0</span></button>
  </aside>
  <main>
    <div id="breaking" class="breaking" role="status" aria-live="polite"></div>

    <section class="stats">
      <div class="box"><small>현금 (원화)</small><b id="cash"></b></div>
      <div class="box"><small>보유 달러 (USD)</small><b id="usdCash"></b></div>
      <div class="box"><small>주식 평가액</small><b id="stockValue"></b></div>
      <div class="box"><small>금융상품 평가액</small><b id="productValue"></b></div>
      <div class="box"><small>순자산 (대출 차감)</small><b id="totalValue"></b></div>
    </section>

    <div class="notice" id="marketTimeBar" style="background:#e0f2fe; border-color:#7dd3fc; color:#0369a1; font-weight:bold;">
      시장 상태 계산 중...
    </div>

    <section id="domestic" class="page on"></section>
    <section id="foreign" class="page"></section>
    <section id="mega" class="page"></section>
    <section id="special" class="page"></section>
    <section id="watch" class="page"></section>
    <section id="banking" class="page"></section>
    <section id="fx" class="page"></section>
    <section id="news" class="page"></section>
    <section id="portfolio" class="page"></section>
  </main>
</div>

<div id="toastWrap" class="toast-wrap" role="status" aria-live="polite"></div>
<div id="modalRoot" class="modal" role="dialog" aria-modal="true" aria-hidden="true"></div>
<div id="bottomBar">
  <div class="bb-net"><span>순자산</span><b id="bottomNet">-</b><span class="bb-tools">
    <button onclick="openNotifModal()" aria-label="알림">🔔<span id="bbBadge" class="bb-badge">0</span></button>
    <button id="bbSpeed" onclick="cycleSpeed()">1x</button>
    <button onclick="togglePause()" aria-label="일시정지">⏸</button>
  </span></div>
  <div class="bb-nav">
    <button data-page="domestic" onclick="quickNav('domestic')">국내</button>
    <button data-page="watch" onclick="quickNav('watch')">관심</button>
    <button data-page="banking" onclick="quickNav('banking')">예금</button>
    <button data-page="news" onclick="quickNav('news')">뉴스</button>
    <button data-page="portfolio" onclick="quickNav('portfolio')">자산</button>
  </div>
</div>

<script>
const START_FX=1390, START_CASH=10000000;
const FEE_STOCK = 0.0015; // 주식 수수료 0.15%
const FEE_FX = 0.01;      // 환전 수수료 1%(브론즈 기준)
const TAX_TRADE = 0.002;        // 매도 거래세 0.2%
const TAX_GAINS_RATE = 0.22;    // 양도소득세율 22%
const TAX_GAINS_FREE = 2500000; // 양도세 기본공제(연간 실현손익)
const DIVIDEND_YIELD = 0.004;   // 배당수익률(보유 평가액 대비)
const DIVIDEND_EVERY = 120;     // 배당 지급 주기(초)
const EARNINGS_EVERY = 180;     // 실적 발표 주기(초)
const SAVE_KEY = "money_playground_save";
const HOF_KEY = "money_playground_hof";
// 달성 목표(총자산 기준)와 일시금 보상
const MILESTONES = [
  {id:"m30", target:30000000, reward:500000, label:"총자산 3,000만원 달성"},
  {id:"m100", target:100000000, reward:2000000, label:"총자산 1억원 달성"},
  {id:"m200", target:200000000, reward:5000000, label:"총자산 2억원 달성"},
  {id:"m500", target:500000000, reward:15000000, label:"총자산 5억원 달성"}
];
// 등급별 신용 대출 한도·금리(연). 브론즈는 대출 불가
const LOAN_POLICY = {
  브론즈:{limit:0, rate:0},
  실버:{limit:10000000, rate:0.12},
  골드:{limit:30000000, rate:0.09},
  플래티넘:{limit:100000000, rate:0.06}
};
// 등급별 환전 수수료 우대
const GRADE_FX_FEE = {브론즈:0.010, 실버:0.009, 골드:0.007, 플래티넘:0.005};
const fxFeeRate = () => (GRADE_FX_FEE[currentGrade()] != null ? GRADE_FX_FEE[currentGrade()] : FEE_FX);
const pages=[["domestic","국내 주식"],["foreign","해외 주식"],["mega","초대형주"],["special","특별 주식"],["watch","관심종목"],["banking","예금·적금"],["fx","환율"],["news","뉴스 속보"],["portfolio","내 자산"]];

// 전면 교체된 주식 종목 데이터 리스트
const stockDefinitions = [
["future_ai","미래AI전자","203010","국내","domestic",92000,.0012,.035,"AI 메모리·반도체"],
["hanbit_semi","한빛반도체","203020","국내","domestic",310000,.0015,.040,"HBM·데이터센터"],
["core_net","코어네트웍스","203030","국내","domestic",235000,.0008,.036,"검색·클라우드"],
["next_energy","넥스트에너지","203040","국내","domestic",62000,.0005,.045,"플랫폼·콘텐츠"],
["aurora_bio","오로라바이오","203050","국내","domestic",395000,.0009,.042,"배터리"],
["nova_sys","Nova Systems","NVSS","해외","foreign",210*START_FX,.0010,.032,"스마트폰·서비스"],
["titan_tech","Titan Tech","TTCH","해외","foreign",505*START_FX,.0013,.030,"AI·클라우드"],
["quantum_lab","Quantum Labs","QLAB","해외","foreign",195*START_FX,.0020,.050,"AI GPU"],
["skynet_gl","SkyNet Global","SKGL","해외","foreign",325*START_FX,.0011,.065,"전기차·로봇"],
["helios_dyn","Helios Dynamics","HLDY","해외","foreign",190*START_FX,.0010,.035,"검색·AI"],
["infinite_hd","Infinite Holdings","IFHD","초대형","mega",510*START_FX,.0006,.022,"복합 지주회사"],
["atlas_ind","Atlas Industries","ATID","초대형","mega",790*START_FX,.0009,.038,"반도체 장비"],
["prime_cap","Prime Capital","PRCP","초대형","mega",235*START_FX,.0012,.036,"파운드리"],
["lunar_mob","Lunar Mobility","LNMB","특별","special",21*START_FX,.0018,.095,"우주 산업"],
["hyper_vis","HyperVision","HPVS","특별","special",255*START_FX,.0014,.085,"디지털 자산"],
["deep_forge","DeepForge","DPFG","특별","special",125*START_FX,.0016,.075,"AI 데이터 분석"],
["zero_orbit","Zero Orbit","ZROR","특별","special",85*START_FX,.0015,.090,"위성 통신"],
["market_etf","시장지수 ETF","KIDX","국내","domestic",10000,.0,.010,"시장지수"]
];

let stocks = stockDefinitions.map(x=>{
  const isForeign = ["foreign","mega","special"].includes(x[4]);
  let initPrice = isForeign ? Math.round(x[5]/START_FX) : Math.round(x[5]/100)*100;
  return {id:x[0],name:x[1],ticker:x[2],market:x[3],group:x[4],price:initPrice,start:initPrice,drift:x[6],vol:x[7],theme:x[8],own:0,lastMove:0,avgBuy:0,realizedProfit:0,hist:[initPrice]};
});

// 가입 금액(amount)과 별개로, 가입 당시 확정된 연이율(rate)을 함께 보관합니다.

// ── 자산 등급 시스템 ───────────────────────────────────────────
// 등급은 총자산(현금 + 달러 환산액 + 주식 평가액 + 금융상품)으로 결정됩니다.
const GRADES=["브론즈","실버","골드","플래티넘"];
const GRADE_FLOORS={브론즈:0, 실버:30000000, 골드:100000000, 플래티넘:200000000};
// 등급별 상품 이율(연). 상위 등급일수록 같은 상품의 이율이 높습니다.
const GRADE_RATES={
  브론즈:{deposit:.012, saving:.020},
  실버:{deposit:.020, saving:.030, parking:.018},
  골드:{deposit:.030, saving:.045, parking:.024, bond:.040},
  플래티넘:{deposit:.042, saving:.058, parking:.028, bond:.065, etf:.085, pension:.070}
};
// 상품별 해금 등급: 브론즈는 예금·적금만, 실버는 파킹, 골드는 채권, 플래티넘이 ETF·연금
const PRODUCT_UNLOCK={deposit:"브론즈", saving:"브론즈", parking:"실버", bond:"골드", etf:"플래티넘", pension:"플래티넘"};
const FOREIGN_GROUPS=["foreign","mega","special"];
const isForeignStock=s=>FOREIGN_GROUPS.includes(s.group);
const gradeIndex=g=>GRADES.indexOf(g);
const unlockLabel=id=>`${PRODUCT_UNLOCK[id]} 등급부터 가입 가능`;
const gradeRateFor=(id,g)=>(GRADE_RATES[g]&&GRADE_RATES[g][id])||0;
const canJoin=id=>gradeIndex(currentGrade())>=gradeIndex(PRODUCT_UNLOCK[id]);

const state={
  cash:START_CASH,

  tick:0,
  news:[],
  logs:[],
  marketSeconds: 0, // 시장 시간관리를 위한 초단위 세컨즈

// anchor는 아주 천천히 움직이는 환율 추세선입니다(완만한 추세용).
const fx={usd:START_FX, anchor:START_FX};
const $=id=>document.getElementById(id);
const won=n=>Math.round(n).toLocaleString("ko-KR")+"원";
// 큰 금액을 좁은 화면에서도 읽히게 요약합니다(1.2억원 · 3.4조원).
const wonShort=n=>{
  const a=Math.abs(n);
  if(a>=1e12) return (n/1e12).toFixed(2).replace(/\.?0+$/,"")+"조원";
  if(a>=1e8) return (n/1e8).toFixed(a>=1e10?0:1).replace(/\.0$/,"")+"억원";
  if(a>=1e4) return Math.round(n/1e4).toLocaleString("ko-KR")+"만원";
  return won(n);
};
const usdStr=n=>n.toFixed(2)+" USD";
const pct=n=>(n>=0?"+":"")+(n*100).toFixed(2)+"%";

// ── 자산 계산(모든 화면 공통) ──────────────────────────────────
function stockValueKRW(){
  return stocks.reduce((sum,s)=>sum + (isForeignStock(s) ? s.price*s.own*fx.usd : s.price*s.own), 0);
}
function productValueKRW(){ return products.reduce((a,p)=>a+p.amount, 0); }
// 순자산 = 현금 + 달러 환산액 + 주식 평가액 + 금융상품 평가액 - 대출 잔액
function totalAssetsKRW(){ return state.cash + (state.usd||0)*fx.usd + stockValueKRW() + productValueKRW() - (state.loan||0); }
function currentGrade(){
  const total=totalAssetsKRW();
  if(total >= GRADE_FLOORS["플래티넘"]) return "플래티넘";
  if(total >= GRADE_FLOORS["골드"]) return "골드";
  if(total >= GRADE_FLOORS["실버"]) return "실버";
  return "브론즈";
}
function nextGradeInfo(){
  const i=gradeIndex(currentGrade());
  if(i>=GRADES.length-1) return null;
  const next=GRADES[i+1];
  return {grade:next, remain:Math.max(0, GRADE_FLOORS[next]-totalAssetsKRW())};
}

// ── 시장 지수 · 관심종목 ─────────────────────────────
function marketIndex(){
  const list=stocks.filter(s=>s.id!=="market_etf");
  if(!list.length) return 1000;
  return 1000*list.reduce((a,s)=>a+s.price/s.start,0)/list.length;
}
const stockView={query:"",sort:"default",watchOnly:false};
const SORT_OPTIONS=[["default","기본 순서"],["name","이름순"],["price","가격 높은순"],["change","등락 높은순"],["own","보유 많은순"]];
const isWatched=id=>(state.watch||[]).includes(id);
const stockPriceKRW=s=>s.price*(isForeignStock(s)?fx.usd:1);

function toggleWatch(id){
  if(!Array.isArray(state.watch)) state.watch=[];
  state.watch=isWatched(id)?state.watch.filter(x=>x!==id):[...state.watch,id];
  saveGame();
  ["domestic","foreign","mega","special","watch"].forEach(g=>{ if($("grid-"+g)) applyStockView(g); });
  update();
}

function visibleStocks(group){
  let list=group==="watch"?stocks.filter(s=>isWatched(s.id)):stocks.filter(s=>s.group===group);
  const q=(stockView.query||"").trim().toLowerCase();
  if(q) list=list.filter(s=>`${s.name} ${s.ticker} ${s.theme} ${s.market}`.toLowerCase().includes(q));
  if(stockView.watchOnly) list=list.filter(s=>isWatched(s.id));
  if(stockView.sort==="name") list.sort((a,b)=>a.name.localeCompare(b.name,"ko"));
  else if(stockView.sort==="price") list.sort((a,b)=>stockPriceKRW(b)-stockPriceKRW(a));
  else if(stockView.sort==="change") list.sort((a,b)=>b.lastMove-a.lastMove);
  else if(stockView.sort==="own") list.sort((a,b)=>b.own-a.own);
  return list;
}
function applyStockView(group){
  const box=$("grid-"+group); if(!box) return;
  const list=visibleStocks(group);
  box.innerHTML=list.length?list.map(card).join("")
    :`<div class="row" style="grid-template-columns:1fr"><b>조건에 맞는 종목이 없습니다</b><span>검색어를 지우거나 필터를 해제해 보세요.</span></div>`;
  const count=$("count-"+group); if(count) count.textContent=list.length+"개";
}

// ── 알림 · 토스트 · 모달 ─────────────────────────────
let audioCtx=null;
function beep(kind){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type="sine"; o.frequency.value=kind==="goal"?880:kind==="dividend"?660:520;
    g.gain.value=0.05;
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+0.12);
  }catch(e){}
}
function notify(kind,title,text){
  const n=state.notify||{};
  if(n[kind]===false) return;
  if(!Array.isArray(state.alerts)) state.alerts=[];
  state.alerts.unshift({at:Date.now(),kind,title,text,read:false});
  if(state.alerts.length>40) state.alerts.pop();
  showToast(title,text);
  if(n.sound) beep(kind);
  if(n.haptic && typeof navigator!=="undefined" && navigator.vibrate) navigator.vibrate(25);
  updateBell();
}
function showToast(title,text){
  const wrap=$("toastWrap"); if(!wrap || typeof wrap.appendChild!=="function") return;
  const el=document.createElement("div");
  el.className="toast";
  el.innerHTML=`<b>${title}</b>${text||""}`;
  wrap.appendChild(el);
  // 토스트는 최대 3개만 보여 줍니다(동시에 여러 이벤트가 터질 때 화면을 가리지 않도록).
  while(wrap.children && wrap.children.length>3) wrap.removeChild(wrap.children[0]);
  setTimeout(()=>{ try{ wrap.removeChild(el); }catch(e){} },4200);
}
function updateBell(){
  const unread=(state.alerts||[]).filter(a=>!a.read).length;
  const label=unread>99?"99+":String(unread);
  ["bellBadge","bbBadge"].forEach(id=>{
    const b=$(id); if(!b) return;
    b.textContent=label;
    b.style.display=unread?"inline-flex":"none";
  });
}
function openModal(title,html){
  const root=$("modalRoot"); if(!root) return;
  root.innerHTML=`<div class="modal-box" role="document"><div class="modal-head"><h2>${title}</h2><button class="modal-close" onclick="closeModal()">닫기</button></div>${html}</div>`;
  root.classList.add("on");
  if(typeof root.setAttribute==="function") root.setAttribute("aria-hidden","false");
}
function closeModal(){
  const root=$("modalRoot"); if(!root) return;
  root.classList.remove("on");
  if(typeof root.setAttribute==="function") root.setAttribute("aria-hidden","true");
  root.innerHTML="";
}
function setNotify(k,v){ state.notify[k]=v; saveGame(); updateBell(); }
function openNotifModal(){
  (state.alerts||[]).forEach(a=>{ a.read=true; });
  updateBell();
  const n=state.notify||{};
  const sw=(k,label)=>`<label class="switch"><input type="checkbox" ${n[k]?"checked":""} onchange="setNotify('${k}',this.checked)">${label}</label>`;
  const rows=(state.alerts||[]).slice(0,30).map(a=>`<div class="journal" style="margin-bottom:8px"><div><b>${a.title}</b><span>${new Date(a.at).toLocaleTimeString("ko-KR")}</span></div><small style="color:#667085">${a.text||""}</small></div>`).join("")||"<p>아직 알림이 없습니다.</p>";
  openModal("알림 센터",`
    <div style="margin-bottom:12px">${sw("order","지정가 체결")}${sw("dividend","배당")}${sw("goal","목표·업적")}${sw("grade","등급 변동")}${sw("tax","세금")}${sw("sound","효과음")}${sw("haptic","진동")}</div>
    <p style="margin-bottom:8px;color:#667085;font-size:12px">최근 30건 · 저장 파일에 함께 보관됩니다.</p>
    ${rows}`);

// ── 거래 저널 · 성과 분석 ────────────────────────────
function recordTrade(s,side,qty,priceNative,profitKRW){
  if(!Array.isArray(state.journal)) state.journal=[];
  const foreign=isForeignStock(s);
  const valueKRW=priceNative*qty*(foreign?fx.usd:1);
  const fee=valueKRW*FEE_STOCK;
  state.feesTotal=(state.feesTotal||0)+fee;
  state.journal.unshift({at:Date.now(),name:s.name,side,qty,valueKRW,fee,profit:side==="sell"?(profitKRW||0):0});
  if(state.journal.length>200) state.journal.pop();
  bumpDaily("trades");
  checkAchievements();
  saveGame();
}
function performanceStats(){
  const j=state.journal||[];
  const sells=j.filter(x=>x.side==="sell");
  const wins=sells.filter(x=>x.profit>0);
  const realized=sells.reduce((a,x)=>a+(x.profit||0),0);
  const volume=j.reduce((a,x)=>a+(x.valueKRW||0),0);
  const held=stocks.filter(s=>s.realizedProfit!==0);
  return {
    trades:j.length, sells:sells.length,
    winRate:sells.length?wins.length/sells.length:0,
    realized, volume, fees:state.feesTotal||0,
    best:[...held].sort((a,b)=>b.realizedProfit-a.realizedProfit)[0],
    worst:[...held].sort((a,b)=>a.realizedProfit-b.realizedProfit)[0]
  };
}

// ── 자동 적립 ─────────────────────────────────
function bestProductForAuto(){
  let best=null,rate=-1;
  products.forEach(p=>{
    if(!canJoin(p.id)) return;
    const r=gradeRateFor(p.id,currentGrade());
    if(!p.amount && r>rate){ rate=r; best=p; }
  });
  return best;
}
function saveAutoSettings(){
  const enabled=$("auto-enabled") ? $("auto-enabled").checked : true;
  const pct=+($("auto-pct")?$("auto-pct").value:60)||0;
  const min=+($("auto-min")?$("auto-min").value:0)||0;
  state.auto=Object.assign({},state.auto,{enabled:true,stockPct:Math.max(0,Math.min(100,pct)),minCash:Math.max(0,min),every:60});
  saveGame(); portfolio(); update();
  notify("system","자동 적립",`주식 ${state.auto.stockPct}% · 최소 현금 ${won(state.auto.minCash)}로 켰습니다.`);
}
function disableAuto(){
  state.auto=Object.assign({},state.auto,{enabled:false});
  saveGame(); portfolio(); update();
  notify("system","자동 적립","규칙을 껐습니다.");
}
function autoInvest(force){
  const a=state.auto||{};
  if(!force && !a.enabled) return 0;
  if(!force && !state.marketOpen) return 0;
  const min=Math.max(0,a.minCash||0);
  const budget=state.cash-min;
  if(budget<100000) return 0;
  const stockPart=Math.max(0,Math.min(100,a.stockPct||0))*budget/100;
  let invested=0;
  if(stockPart>0){
    const list=stocks.filter(s=>s.id!=="market_etf");
    const perKRW=stockPart/list.length;
    list.forEach(s=>{
      const foreign=isForeignStock(s);
      const unitKRW=s.price*(1+FEE_STOCK)*(foreign?fx.usd:1);
      const qty=Math.floor(perKRW/unitKRW);
      if(qty<=0) return;
      const costNative=qty*s.price*(1+FEE_STOCK);
      if(foreign){
        if(state.usd<costNative){
          const need=costNative-state.usd;
          const krw=need*fx.usd*(1+fxFeeRate());
          if(krw>state.cash) return;
          state.cash-=krw; state.usd+=need;
        }
        state.usd-=costNative;
      }else{
        if(state.cash<costNative) return;
        state.cash-=costNative;
      }
      s.avgBuy=((s.avgBuy*s.own)+(s.price*(1+FEE_STOCK))*qty)/(s.own+qty);
      s.own+=qty;
      invested+=costNative*(foreign?fx.usd:1);
    });
  }
  const remain=state.cash-min;
  if(remain>0){
    const p=bestProductForAuto();
    if(p && remain>=p.min){
      const v=Math.floor(remain/10000)*10000;
      if(v>0){
        if(p.amount===0) p.rate=gradeRateFor(p.id,currentGrade());
        state.cash-=v; p.amount+=v; invested+=v;
      }
    }
  }
  if(invested>0){
    addLog(`자동 적립 실행: ${won(invested)} 재투자`);
    notify("system","자동 적립",`${won(invested)}을 규칙대로 재투자했습니다.`);
    saveGame(); update();
  }
  return invested;
}

// ── 일일 미션 · 업적 ───────────────────────────────
const DAILY_POOL=[
  {id:"trades",label:"주식 5회 거래",target:5,reward:300000},
  {id:"dividends",label:"배당 2회 수령",target:2,reward:200000},
  {id:"orders",label:"지정가 주문 1회 체결",target:1,reward:250000},
  {id:"goals",label:"목표 1개 달성",target:1,reward:500000},
  {id:"deposit",label:"금융상품 1회 가입",target:1,reward:150000}
];
function todayKey(){ const d=new Date(); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }
function dailyMissions(){
  const seed=[...todayKey()].reduce((a,c)=>a+c.charCodeAt(0),0);
  const picks=[];
  for(let i=0;i<3;i++) picks.push(DAILY_POOL[(seed+i*2)%DAILY_POOL.length]);
  return [...new Map(picks.map(m=>[m.id,m])).values()];
}
function ensureDaily(){
  const key=todayKey();
  if(!state.daily || state.daily.date!==key || !state.daily.counts || !state.daily.claimed){
    state.daily={date:key,counts:{trades:0,dividends:0,orders:0,goals:0,deposit:0},claimed:{}};
  }
}
function bumpDaily(k,n=1){
  ensureDaily();
  state.daily.counts[k]=(state.daily.counts[k]||0)+n;
}
function claimDaily(id){
  ensureDaily();
  const m=DAILY_POOL.find(x=>x.id===id); if(!m) return;
  const d=state.daily;
  if(d.claimed[id]) return;
  if((d.counts[id]||0)<m.target) return alert("아직 조건을 채우지 못했습니다.");
  d.claimed[id]=true;
  state.cash+=m.reward;
  addLog(`오늘의 미션 완료: ${m.label} (+${won(m.reward)})`);
  notify("goal","미션 보상",`${m.label} 완료! ${won(m.reward)} 지급`);
  saveGame(); portfolio(); update();
}
const ACHIEVEMENTS=[
  {id:"first_trade",label:"첫 거래",reward:100000,done:()=>(state.journal||[]).length>0},
  {id:"first_div",label:"첫 배당 수령",reward:100000,done:()=>(state.dividendTotal||0)>0},
  {id:"ten_stocks",label:"10종목 동시 보유",reward:500000,done:()=>stocks.filter(s=>s.own>0).length>=10},
  {id:"no_debt",label:"대출 전액 상환",reward:200000,done:()=>(state.loanTotal||0)>0 && (state.loan||0)===0},
  {id:"silver",label:"실버 등급",reward:200000,done:()=>gradeIndex(currentGrade())>=1},
  {id:"gold",label:"골드 등급",reward:500000,done:()=>gradeIndex(currentGrade())>=2},
  {id:"platinum",label:"플래티넘 등급",reward:1000000,done:()=>gradeIndex(currentGrade())>=3},
  {id:"billion",label:"순자산 10억",reward:2000000,done:()=>totalAssetsKRW()>=1000000000}
];
function checkAchievements(){
  ACHIEVEMENTS.forEach(a=>{
    if((state.achievements||{})[a.id]) return;
    let ok=false;
    try{ ok=!!a.done(); }catch(e){ ok=false; }
    if(!ok) return;
    state.achievements[a.id]=true;
    state.cash+=a.reward;
    addLog(`업적 달성: ${a.label} (+${won(a.reward)})`);
    notify("goal","업적 달성",`${a.label} · ${won(a.reward)}`);
  });
}

function setSpeed(n){

function updateSpeedUI(){

  });
}

// ── 오프라인 정산(최대 2시간) ─────────────────────
const OFFLINE_MAX=2*3600;
function applyOfflineProgress(){
  const now=Date.now();
  const last=state.lastSeen||0;
  state.lastSeen=now;
  if(!last) return null;
  const sec=Math.min(OFFLINE_MAX, Math.floor((now-last)/1000));
  if(sec<120) return null;
  const periods=sec/15;
  let interest=0, loanInterest=0;
  products.forEach(p=>{
    if(p.amount<=0 || p.rate<=0) return;
    for(let i=0;i<periods;i++){
      const eff=p.amount>30000000?30000000+(p.amount-30000000)*0.5:p.amount;
      const add=eff*(p.rate*0.015);
      p.amount+=add; interest+=add;
    }
  });
  const parking=state.cash>500000?state.cash*0.00002*periods:0;
  state.cash+=parking;
  if((state.loan||0)>0){
    for(let i=0;i<periods;i++){
      const li=state.loan*((state.loanRate||0)*0.015);
      loanInterest+=li;
      if(state.cash>=li) state.cash-=li;
      else { state.loan+=li-state.cash; state.cash=0; }
    }
  }
  const divPeriods=Math.min(30, Math.floor(sec/DIVIDEND_EVERY));
  const dividends=expectedDividend()*divPeriods;
  if(dividends>0){ state.cash+=dividends; state.dividendTotal=(state.dividendTotal||0)+dividends; }
  const summary={sec,interest,dividends,loanInterest,parking};
  addLog(`오프라인 정산: ${Math.floor(sec/60)}분 · 이자 ${won(interest)} · 배당 ${won(dividends)}`);
  notify("system","오프라인 정산",`${Math.floor(sec/60)}분 동안 이자 ${won(interest)} · 배당 ${won(dividends)}`);
  openModal("오프라인 정산",`<div class="kpis">
    <div class="kpi"><small>경과 시간</small><b>${Math.floor(sec/60)}분</b></div>
    <div class="kpi"><small>금융상품 이자</small><b>${won(interest)}</b></div>
    <div class="kpi"><small>배당(최대 1시간)</small><b>${won(dividends)}</b></div>
    <div class="kpi"><small>대출 이자</small><b>${won(loanInterest)}</b></div>
  </div><p style="margin-top:10px;font-size:12px;color:#667085">주가 변동은 반영하지 않고 이자·배당만 정산합니다(최대 2시간).</p>`);
  saveGame();
  return summary;
}

// ── 자산 추이·배분 ──────────────────────────────────
// 추이 데이터는 저장 파일에 넣지 않고 메모리에만 쌓습니다(저장/불러오기 호환 유지).
const assetHistory={points:[],peak:0};

function recordAssetHistory(){
  const v=totalAssetsKRW();
  const last=assetHistory.points[assetHistory.points.length-1];
  if(last && Math.abs(last.v-v)<1) last.t=state.marketSeconds;
  else assetHistory.points.push({t:state.marketSeconds,v});
  if(assetHistory.points.length>180) assetHistory.points.shift(); // 15초 간격 45분
  assetHistory.peak=Math.max(assetHistory.peak,v);
}

function assetTrendSVG(){
  // 기록이 2개 미만이면 선을 그리지 않습니다.
  // (시작 금액을 첫 점으로 끼워 넣으면 새로고침 직후 가짜 상승/하락 선이 보입니다.)
  if(assetHistory.points.length<2) return "";
  const vals=assetHistory.points.map(p=>p.v);
  const min=Math.min(...vals),max=Math.max(...vals),span=(max-min)||Math.max(1,Math.abs(max)*0.01);
  const w=600,h=120,step=w/Math.max(1,vals.length-1);
  const coords=vals.map((v,i)=>`${(i*step).toFixed(1)},${(h-((v-min)/span)*(h-6)-3).toFixed(1)}`).join(" ");
  const up=vals[vals.length-1]>=vals[0];
  const color=up?"#0f766e":"#b42318";
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polygon points="0,${h} ${coords} ${w},${h}" fill="${color}" opacity=".10"/><polyline points="${coords}" fill="none" stroke="${color}" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>`;
}

// 자산 배분(현금·달러·주식·금융상품). 부채는 별도 표기합니다.
function allocation(){
  const parts=[
    {label:"현금",value:Math.max(0,state.cash),color:"#0f766e"},
    {label:"달러",value:Math.max(0,(state.usd||0)*fx.usd),color:"#0369a1"},
    {label:"주식",value:Math.max(0,stockValueKRW()),color:"#b45309"},
    {label:"금융상품",value:Math.max(0,productValueKRW()),color:"#6d28d9"}
  ];
  const gross=parts.reduce((a,p)=>a+p.value,0);
  parts.forEach(p=>{ p.pct=gross>0?(p.value/gross)*100:0; });
  return {parts,gross};
}

// 다음 배당까지 남은 초와 예상 배당금(원화 환산)
function secondsToDividend(){ return DIVIDEND_EVERY-(state.marketSeconds%DIVIDEND_EVERY); }
function expectedDividend(){
  return stocks.reduce((sum,s)=>{
    if(s.own<=0) return sum;
    const amount=s.price*s.own*DIVIDEND_YIELD;
    return sum+(isForeignStock(s)?amount*fx.usd:amount);
  },0);
}

// ── 가격 차트(최근 60틱 스파크라인) ───────────────────────
function sparklineSVG(s){
  const data = (s.hist && s.hist.length > 1) ? s.hist : [s.start, s.price];
  const min = Math.min(...data), max = Math.max(...data), span = (max - min) || 1;
  const w = 100, h = 28, step = w / Math.max(1, data.length - 1);
  const points = data.map((v, i) => `${(i * step).toFixed(1)},${(h - ((v - min) / span) * h).toFixed(1)}`).join(" ");
  const up = data[data.length - 1] >= data[0];
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${points}" fill="none" stroke="${up ? "#0f766e" : "#b42318"}" stroke-width="1.6"/></svg>`;
}

// ── 예약(지정가) 주문 ────────────────────────────────
function placeOrder(){
  const stockId = $("order-stock") ? $("order-stock").value : "";
  const side = $("order-side") ? $("order-side").value : "buy";
  const qty = Math.floor(+($("order-qty") ? $("order-qty").value : 0) || 0);
  const limit = +($("order-limit") ? $("order-limit").value : 0) || 0;
  const s = stock(stockId);
  if(!s) return alert("예약할 종목을 선택해 주세요.");
  if(qty <= 0 || limit <= 0) return alert("수량과 지정가를 올바르게 입력해 주세요.");
  if(side === "sell" && s.own < qty) return alert("보유 수량이 부족합니다.");
  state.orders.push({id:`o${Date.now()}${Math.floor(Math.random()*1000)}`, stockId, side, qty, limit});
  addLog(`예약 주문: ${s.name} ${side === "buy" ? "매수" : "매도"} ${qty}주 @ ${isForeignStock(s) ? usdStr(limit) : won(limit)}`);
  saveGame(); portfolio(); update();
}

function cancelOrder(oid){
  const before = state.orders.length;
  state.orders = state.orders.filter(o => o.id !== oid);
  if(state.orders.length !== before) addLog("예약 주문을 취소했습니다.");
  saveGame(); portfolio();
}

// 가격이 지정가에 도달한 주문을 체결합니다(휴장 중에는 대기).
function processOrders(){
  if(!state.marketOpen || !state.orders.length) return;
  const remain = [];
  state.orders.forEach(o => {
    const s = stock(o.stockId);
    if(!s) return;
    const hit = o.side === "buy" ? s.price <= o.limit : s.price >= o.limit;
    if(!hit){ remain.push(o); return; }
    const foreign = isForeignStock(s);
    if(o.side === "buy"){
      const cost = s.price * (1 + FEE_STOCK) * o.qty;
      if(foreign ? state.usd < cost : state.cash < cost){ remain.push(o); return; } // 잔고 부족 시 다음 틱 재시도
      if(foreign) state.usd -= cost; else state.cash -= cost;
      s.avgBuy = ((s.avgBuy * s.own) + (s.price * (1 + FEE_STOCK)) * o.qty) / (s.own + o.qty);
      s.own += o.qty;
      addLog(`⏱ 예약 매수 체결: ${s.name} ${o.qty}주 @ ${foreign ? usdStr(s.price) : won(s.price)}`);
      bumpDaily("orders");
      notify("order","지정가 매수 체결",`${s.name} ${o.qty}주`);
      recordTrade(s,"buy",o.qty,s.price,0);
    } else {
      if(s.own < o.qty){ remain.push(o); return; }
      const revenue = s.price * (1 - FEE_STOCK - TAX_TRADE) * o.qty;
      const profitTotal = revenue - (s.avgBuy * o.qty);
      const profitKRW = foreign ? profitTotal * fx.usd : profitTotal;
      if(foreign){ state.usd += revenue; s.realizedProfit += profitKRW; }
      else { state.cash += revenue; s.realizedProfit += profitTotal; }
      s.own -= o.qty;
      if(s.own === 0) s.avgBuy = 0;
      addLog(`⏱ 예약 매도 체결: ${s.name} ${o.qty}주 @ ${foreign ? usdStr(s.price) : won(s.price)}`);
      bumpDaily("orders");
      notify("order","지정가 매도 체결",`${s.name} ${o.qty}주 · ${won(profitKRW)}`);
      recordTrade(s,"sell",o.qty,s.price,profitKRW);
      settleTax(profitKRW);
    }
  });
  state.orders = remain;
}

// ── 세금 ────────────────────────────────────────
// 양도소득세: 연간 실현손익 2,500만원 공제 후 22%를 매도 시점에 원천징수합니다.
function settleTax(profitKRW){
  if(!(profitKRW > 0)) return 0;
  state.realizedYTD = (state.realizedYTD || 0) + profitKRW;
  const taxable = Math.max(0, state.realizedYTD - TAX_GAINS_FREE) - (state.taxedProfit || 0);
  if(taxable <= 0) return 0;
  const tax = taxable * TAX_GAINS_RATE;
  state.taxedProfit = (state.taxedProfit || 0) + taxable;
  state.taxPaid = (state.taxPaid || 0) + tax;
  if(state.cash >= tax){ state.cash -= tax; }
  else { state.loan = (state.loan || 0) + (tax - state.cash); state.cash = 0; } // 현금 부족분은 대출로 전환
  addLog(`양도세 원천징수: ${won(tax)} (연 누적 실현손익 ${won(state.realizedYTD)})`);
  notify("tax","양도세 원천징수",`${won(tax)}`);
  return tax;
}

// ── 신용 대출 ───────────────────────────────────
function loanPolicy(){ return LOAN_POLICY[currentGrade()] || LOAN_POLICY["브론즈"]; }

function borrowLoan(){
  const pol = loanPolicy();
  if(pol.limit <= 0) return alert("대출은 실버 등급부터 이용할 수 있습니다.");
  const avail = Math.max(0, pol.limit - (state.loan || 0));
  const amt = Math.floor((+($("loan-amt") ? $("loan-amt").value : 0) || 0) / 10000) * 10000;
  if(amt <= 0) return alert("대출 금액을 입력해 주세요.");
  if(amt > avail) return alert(`대출 한도를 초과했습니다. (가능 ${won(avail)})`);
  state.loan = (state.loan || 0) + amt;
  state.loanRate = pol.rate;
  state.loanTotal = (state.loanTotal || 0) + amt;
  state.cash += amt;
  addLog(`신용 대출 실행: ${won(amt)} (연 ${(pol.rate * 100).toFixed(1)}%)`);
  saveGame(); portfolio(); update();
}

function repayLoan(){
  const loan = state.loan || 0;
  if(loan <= 0) return alert("상환할 대출이 없습니다.");
  let amt = Math.floor((+($("loan-amt") ? $("loan-amt").value : 0) || 0) / 10000) * 10000;
  amt = Math.min(amt || loan, loan, Math.floor(state.cash));
  if(amt <= 0) return alert("상환할 현금이 부족합니다.");
  state.loan = loan - amt;
  state.cash -= amt;
  if(state.loan <= 0){ state.loan = 0; state.loanRate = 0; }
  addLog(`대출 상환: ${won(amt)} (남은 잔액 ${won(state.loan)})`);
  saveGame(); portfolio(); update();
}

// 대출 전액 상환: 입력값과 무관하게 보유 현금으로 최대한 갚습니다.
function repayLoanFull(){
  const loan=state.loan||0;
  if(loan<=0) return alert("상환할 대출이 없습니다.");
  const amt=Math.min(loan,Math.floor(state.cash));
  if(amt<=0) return alert("상환할 현금이 부족합니다.");
  state.loan=loan-amt;
  state.cash-=amt;
  if(state.loan<=0){ state.loan=0; state.loanRate=0; }
  addLog(`대출 전액 상환: ${won(amt)} (남은 잔액 ${won(state.loan)})`);
  saveGame(); portfolio(); update();
}

// ── 배당·실적 발표 ───────────────────────────────
function applyShock(s, move){
  const next = s.price * (1 + move);
  s.price = isForeignStock(s) ? Math.max(1, Math.round(next * 100) / 100) : Math.max(100, Math.round(next / 100) * 100);
  s.lastMove = move;
}

function payDividends(){
  let totalKRW = 0;
  stocks.forEach(s => {
    if(s.own <= 0) return;
    const amount = s.price * s.own * DIVIDEND_YIELD;
    if(isForeignStock(s)){ state.usd += amount; totalKRW += amount * fx.usd; }
    else { state.cash += amount; totalKRW += amount; }
  });
  if(totalKRW <= 0) return;
  state.dividendTotal = (state.dividendTotal || 0) + totalKRW;
  bumpDaily("dividends");
  addLog(`💰 배당금 지급: ${won(totalKRW)}`);
  publishBreakingNews("💰 배당 지급", `보유 주식 배당금 ${won(totalKRW)}이 지급되었습니다.`);
  notify("dividend","배당금 지급",`${won(totalKRW)}`);
}

function earningsSurprise(){
  if(!stocks.length) return;
  const s = stocks[Math.floor(Math.random() * stocks.length)];
  const beat = Math.random() < 0.5;
  const move = (beat ? 1 : -1) * (0.05 + Math.random() * 0.10);
  applyShock(s, move);
  publishBreakingNews("📊 실적 발표", `${s.name} ${beat ? "어닝 서프라이즈" : "어닝 쇼크"}! 주가가 발표 직후 ${pct(move)} 변동했습니다.`);
}

function handleImport(ev){
  const file = ev.target.files && ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      applySaveData(JSON.parse(String(reader.result)));
      saveGame(); banking(); fxPage(); portfolio(); update();
      addLog("저장 파일을 불러왔습니다.");
      alert("저장 파일을 불러왔습니다.");
    } catch(e) {
      alert("저장 파일을 읽을 수 없습니다. 형식을 확인해 주세요.");
    }
  };
  reader.readAsText(file);
  ev.target.value = "";
}

  // 저장 데이터를 먼저 불러온 뒤 화면을 그려야 잠금 상태·보유 현황·등급이 올바르게 표시됩니다.
  loadGame();
  state.lastGrade=currentGrade();
  applyOfflineProgress();
  banking();fxPage();news();portfolio();
  update();
  recordAssetHistory();
  ensureDaily(); checkAchievements(); updateSpeedUI(); updateBell();

  // 1초 드라이버: 배속(1x/3x/10x)·일시정지를 한곳에서 처리합니다.
  setInterval(gameLoop,1000);
  setInterval(()=>saveGame(),10000);
  if(typeof window!=="undefined" && window.addEventListener){
    window.addEventListener("beforeunload",()=>{ try{ saveGame(); }catch(e){} });
  }
  if(typeof navigator!=="undefined" && "serviceWorker" in navigator && typeof location!=="undefined" && location.protocol.startsWith("http")){
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
}

function gameLoop(){
  if(state.paused){ updateSpeedUI(); return; }
  const n=Math.max(1,Math.min(10,state.speed||1));
  for(let i=0;i<n;i++){
    tickSeconds();
    if(state.marketSeconds%5===0){ tickMarket(); updateFX(); }
    if(state.marketSeconds%7===0) marketEventsAndNews();
    if(state.marketSeconds%15===0) interest();
  }
  update();
}

function addLog(text) {
  const now = new Date();
  const timeStr = `[${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}]`;
  state.logs.unshift(`${timeStr} ${text}`);
  if(state.logs.length > 20) state.logs.pop();
  saveGame();
}

function buildSaveData() {
  return {
    costBasisIncludesFee: true, // 평단가가 매수 수수료를 포함한 취득원가 형식인지 표시(구버전 데이터 마이그레이션용)
    state: state,
    fx: fx,
    stocks: stocks.map(s => ({id:s.id, own:s.own, price:s.price, avgBuy:s.avgBuy, realizedProfit:s.realizedProfit, lastMove:s.lastMove})),
    products: products.map(p => ({id:p.id, amount:p.amount, rate:p.rate}))
  };
}

function saveGame() {
  state.lastSeen=Date.now();
  localStorage.setItem(SAVE_KEY, JSON.stringify(buildSaveData()));
}

function loadGame() {
  const raw = localStorage.getItem(SAVE_KEY);
  if(!raw) return;
  try {
    applySaveData(JSON.parse(raw));
  } catch(e) {
    console.error("저장 데이터 로드 실패", e);
  }
}

// localStorage와 파일 불러오기가 같은 경로를 쓰도록 저장 데이터 적용을 한 곳에 모읍니다.
function applySaveData(data) {
  if(!data || typeof data !== "object") throw new Error("잘못된 저장 데이터");
  if(data.state) Object.assign(state, data.state);
  if(data.fx) Object.assign(fx, data.fx);
  if(data.stocks) {
    data.stocks.forEach(ls => {
      let s = stocks.find(x => x.id === ls.id);
      if(!s) return;
      s.own = ls.own || 0;
      s.price = ls.price || s.start;
      s.avgBuy = ls.avgBuy || 0;
      // 구버전 저장 데이터의 평단가에는 매수 수수료가 빠져 있으므로 취득원가로 한 번만 환산
      if(data.costBasisIncludesFee !== true && s.avgBuy > 0) s.avgBuy *= (1 + FEE_STOCK);
      s.realizedProfit = ls.realizedProfit || 0;
      s.lastMove = ls.lastMove || 0;
    });
  }
  if(data.products) {
    data.products.forEach(lp => {
      let p = products.find(x => x.id === lp.id);
      if(!p) return;
      p.amount = lp.amount || 0;
      // 구버전 저장 데이터에는 rate가 없으므로, 가입 중이면 현재 등급 이율로 확정해 줍니다.
      // 현재 등급이 해당 상품을 열 수 없으면 그 상품의 해금 등급 이율로 확정해 이자가 0이 되지 않도록 함
      p.rate = (Number.isFinite(lp.rate) && lp.rate > 0) ? lp.rate
        : (p.amount > 0 ? (gradeRateFor(p.id, currentGrade()) || gradeRateFor(p.id, PRODUCT_UNLOCK[p.id])) : 0);
    });
  }
  // 새 기능 필드 기본값 보정(구버전 세이브 대응)
  if(!Array.isArray(state.orders)) state.orders = [];
  if(!state.goals || typeof state.goals !== "object") state.goals = {};
  ["loan","loanRate","realizedYTD","taxedProfit","taxPaid"].forEach(k => {
    if(!Number.isFinite(state[k])) state[k] = 0;
  });
  if(!Number.isFinite(fx.anchor)) fx.anchor = fx.usd || START_FX; // 구버전 저장 대응
  // 신규 기능 필드 기본값 보정
  if(!Array.isArray(state.watch)) state.watch=[];
  if(!Array.isArray(state.journal)) state.journal=[];
  if(!Array.isArray(state.alerts)) state.alerts=[];
  if(!state.achievements || typeof state.achievements!=="object") state.achievements={};
  ["loanTotal","dividendTotal","feesTotal"].forEach(k=>{ if(!Number.isFinite(state[k])) state[k]=0; });
  const NOTIFY_DEFAULT={order:true,dividend:true,goal:true,grade:true,tax:true,sound:false,haptic:false};
  state.notify=Object.assign({},NOTIFY_DEFAULT,(state.notify&&typeof state.notify==="object")?state.notify:{});
  const AUTO_DEFAULT={enabled:false,stockPct:60,minCash:1000000,every:60};
  state.auto=Object.assign({},AUTO_DEFAULT,(state.auto&&typeof state.auto==="object")?state.auto:{});
  if(!state.daily || typeof state.daily!=="object") state.daily={date:"",counts:{},claimed:{}};
  if(!Number.isFinite(state.speed) || state.speed<1) state.speed=1;
  if(typeof state.paused!=="boolean") state.paused=false;
  if(!Number.isFinite(state.seasonBase) || state.seasonBase<=0) state.seasonBase=totalAssetsKRW();
  if(!Number.isFinite(state.seasonBaseIndex) || state.seasonBaseIndex<=0) state.seasonBaseIndex=marketIndex();
  state.lastGrade=currentGrade();
}

function clearGame(skipConfirm) {
  if(!skipConfirm && !confirm("정말로 모든 게임 데이터를 삭제하고 처음부터 시작하시겠습니까?")) return;
  localStorage.removeItem(SAVE_KEY);
  state.cash = START_CASH;
  state.usd = 0;
  state.tick = 0;
  state.news = [];
  state.logs = [];
  state.marketSeconds = 0;
  state.marketOpen = true;
  state.currentEvent = null;
  state.eventTimer = 0;
  state.loan = 0;
  state.loanRate = 0;
  state.orders = [];
  state.goals = {};
  state.realizedYTD = 0;
  state.taxedProfit = 0;
  state.taxPaid = 0;
  state.watch = [];
  state.journal = [];
  state.alerts = [];
  state.achievements = {};
  state.loanTotal = 0;
  state.dividendTotal = 0;
  state.feesTotal = 0;
  state.daily = {date:"",counts:{},claimed:{}};
  state.paused = false;
  state.speed = 1;
  state.auto = Object.assign({},state.auto,{enabled:false});
  state.seasonBase = START_CASH;
  fx.usd = START_FX;
  fx.anchor = START_FX;
  stocks.forEach(s=>{
    s.price = s.start;
    s.own = 0;
    s.lastMove = 0;
    s.avgBuy = 0;
    s.realizedProfit = 0;
    s.hist = [s.start];
  });
  products.forEach(p => { p.amount = 0; p.rate = 0; });
  state.seasonBaseIndex = marketIndex();
  state.lastGrade = currentGrade();
  assetHistory.points=[];
  assetHistory.peak=0;
  recordAssetHistory();
  ensureDaily(); updateSpeedUI(); updateBell();
  addLog("게임 초기화가 수행되었습니다.");
  news();
  banking();
  portfolio();
  update();
}

// 상품 카드의 부제(현재 등급 이율 또는 잠금 안내)
function productSubText(p, unlocked, held){
  return `${p.type} · ${unlocked ? `현재 등급 연 ${(gradeRateFor(p.id, currentGrade())*100).toFixed(1)}%` : `🔒 ${unlockLabel(p.id)}${held?" · 보유 중(이자는 확정 이율로 유지)":""}`}`;
}

// 배너와 해금 상태만 갱신합니다. 금융 화면을 다시 그리지 않으므로 입력 중인 금액이 보존됩니다.
function refreshBankingState(){
  products.forEach(p=>{
    const card=document.querySelector(`[data-card="${p.id}"]`);
    if(!card) return;
    const unlocked=canJoin(p.id), held=p.amount>0;
    card.className="product"+(unlocked ? "" : (held ? " locked holding" : " locked"));
    const sub=card.querySelector(`[data-sub="${p.id}"]`);
    if(sub) sub.textContent=productSubText(p, unlocked, held);
    const input=document.getElementById(`prod-${p.id}`);
    if(input) input.disabled=!unlocked;
    const joinBtn=card.querySelector(`[data-join="${p.id}"]`);
    if(joinBtn) joinBtn.disabled=!unlocked;
  });
  const gb=document.getElementById("gradeBanner");
  if(gb) gb.innerHTML=gradeBannerHTML();
}

// 등급 안내 배너: 현재 등급, 총자산, 다음 등급까지 남은 금액

  const next=nextGradeInfo();
  return `🏅 현재 등급: <b>${currentGrade()}</b> · 총자산 ${won(totalAssetsKRW())}` +
    (next ? ` · 다음 등급 <b>${next.grade}</b>까지 ${won(next.remain)}` : " · 최고 등급입니다") +

  return `<article class="product${stateClass}" data-card="${p.id}">

    <p data-sub="${p.id}">${productSubText(p, unlocked, held)}</p>

  $("fx").innerHTML=`<div class="head"><div><h1>환율 거래소</h1><p>원화와 달러를 환전할 수 있습니다. <span id="fxFeeDesc">환전 시 ${(fxFeeRate()*100).toFixed(1)}%의 환전 수수료가 적용됩니다.</span></p></div></div>
  <div class="product">
  <div class="price" id="fxPrice"></div>
  <p style="margin-bottom:15px; color:#b42318;">※ 환전 버튼 클릭 시 현재 환율에 수수료가 적용되어 즉시 처리됩니다.</p>
  <div class="trade">
  <input id="krw" type="number" placeholder="환전할 원화 금액 입력">
  <button class="buy" onclick="toUSD()">달러 환전</button>
  <input id="usd" type="number" placeholder="환전할 달러 금액 입력">
  <button class="sell" onclick="toKRW()">원화 환전</button>
  </div></div>`;
  updateFX();
}

function updateFX(){
  let baseVol = 0.0035;
  if(state.currentEvent === "FX_SURGE") baseVol = 0.010; // 환율 급등 이벤트 발동 시 변동성 확대
  
  // 완만한 추세선(anchor)이 아주 느리게 움직이고, 실제 환율은 그 추세선을 따라갑니다.
  // 추세는 시작 환율 ±12% 안으로 제한하고 복원력도 두어, 폭주 없이 방향성만 남깁니다.
  fx.anchor = fx.anchor + (Math.random() - 0.5) * 0.004 * fx.anchor + (START_FX - fx.anchor) * 0.0003;
  fx.anchor = Math.max(START_FX * 0.88, Math.min(START_FX * 1.12, fx.anchor));

  let revert = ((fx.anchor - fx.usd) / fx.anchor) * 0.05;
  let changeRate = (Math.random() - 0.5) * baseVol + revert;
  fx.usd = Math.max(1000, Math.round(fx.usd * (1 + changeRate)));
  
  let e=document.getElementById("fxPrice");
  if(e) e.textContent="1 USD = "+fx.usd.toLocaleString()+"원";
  let fd=document.getElementById("fxFeeDesc");
  if(fd) fd.textContent=`환전 시 ${(fxFeeRate()*100).toFixed(1)}%의 환전 수수료가 적용됩니다(${currentGrade()} 등급 우대).`;
}

function toUSD(){
  let v=+($("krw").value||0);
  if(v<=0||v>state.cash)return alert("원화 현금이 부족하거나 잘못된 액수입니다.");
  
  let dynamicFx = fx.usd * (1 + fxFeeRate()); // 등급별 우대 수수료 적용(달러를 비싸게 삼)
  let netUsd = v / dynamicFx;
  
  state.cash-=v; 
  state.usd+=netUsd; 
  addLog(`달러 환전: 원화 ${won(v)} -> ${usdStr(netUsd)} (환율: ${fx.usd}원, 수수료 ${(fxFeeRate()*100).toFixed(1)}%)`);
  update();
}

function toKRW(){
  let v=+($("usd").value||0);
  if(v<=0||v>state.usd)return alert("달러 잔고가 부족하거나 잘못된 액수입니다.");
  
  let dynamicFx = fx.usd * (1 - fxFeeRate()); // 등급별 우대 수수료 적용(원화를 적게 받음)
  let netKrw = v * dynamicFx;
  
  state.usd-=v; 
  state.cash+=netKrw; 
  addLog(`원화 환전: 달러 ${usdStr(v)} -> ${won(netKrw)} (환율: ${fx.usd}원, 수수료 ${(fxFeeRate()*100).toFixed(1)}%)`);
  update();
}

function stock(id){return stocks.find(s=>s.id==id)}
function product(id){return products.find(p=>p.id==id)}
function activePage(){return document.querySelector(".page.on")?.id}

function checkMarketOpen() {
  if(!state.marketOpen) {
    alert("현재는 휴장 상태입니다! (휴장 중에는 주식 매매가 불가능합니다)");
    return false;
  }
  return true;
}

function buy(id){
  if(!checkMarketOpen()) return;
  let s=stock(id);
  const isForeign = ["foreign","mega","special"].includes(s.group);
  
  if(isForeign){
    let cost = s.price * (1 + FEE_STOCK);
    if(state.usd < cost) return alert("수수료 포함 달러(USD) 잔고가 부족합니다.");
    state.usd -= cost;
    s.avgBuy = ((s.avgBuy * s.own) + (s.price * (1 + FEE_STOCK))) / (s.own + 1);
    s.own += 1;
    addLog(`${s.name} 1주 매수 (${usdStr(s.price)}, 수수료 포함)`);
  }else{
    let cost = s.price * (1 + FEE_STOCK);
    if(state.cash < cost) return alert("수수료 포함 원화 현금이 부족합니다.");
    state.cash -= cost;
    s.avgBuy = ((s.avgBuy * s.own) + (s.price * (1 + FEE_STOCK))) / (s.own + 1);
    s.own += 1;
    addLog(`${s.name} 1주 매수 (${won(s.price)}, 수수료 포함)`);
  }
  recordTrade(s,"buy",1,s.price,0);
  saveGame();
  update();
}

function sell(id){
  if(!checkMarketOpen()) return;
  let s=stock(id);
  if(s.own<=0)return alert("보유 주식이 없습니다.");
  const isForeign = ["foreign","mega","special"].includes(s.group);
  
  let revenue = s.price * (1 - FEE_STOCK - TAX_TRADE); // 수수료 0.15% + 거래세 0.2%
  // 평단가가 매수 수수료를 포함한 취득원가이므로 실현손익 = 순수취금액 - 취득원가
  let profit = revenue - s.avgBuy;
  const profitKRW = isForeign ? profit * fx.usd : profit;
  
  if(isForeign) {
    state.usd += revenue;
    s.realizedProfit += (profit * fx.usd);
    addLog(`${s.name} 1주 매도 (${usdStr(s.price)}, 실현손익: ${won(profit * fx.usd)})`);
  } else {
    state.cash += revenue;
    s.realizedProfit += profit;
    addLog(`${s.name} 1주 매도 (${won(s.price)}, 실현손익: ${won(profit)})`);
  }
  recordTrade(s,"sell",1,s.price,profitKRW);
  settleTax(profitKRW);
  
  s.own -= 1;
  if(s.own === 0) s.avgBuy = 0;
  saveGame();
  update();
}

function fullBuy(id){
  if(!checkMarketOpen()) return;
  let s=stock(id);
  const isForeign = ["foreign","mega","special"].includes(s.group);
  
  if(isForeign){
    let singleCost = s.price * (1 + FEE_STOCK);
    let count = Math.floor(state.usd / singleCost);
    if(count<=0) return alert("달러(USD) 잔고가 부족합니다.");
    state.usd -= singleCost * count;
    s.avgBuy = ((s.avgBuy * s.own) + (s.price * (1 + FEE_STOCK)) * count) / (s.own + count);
    s.own += count;
    addLog(`${s.name} ${count}주 풀매수`);
  }else{
    let singleCost = s.price * (1 + FEE_STOCK);
    let count = Math.floor(state.cash / singleCost);
    if(count<=0) return alert("원화 현금이 부족합니다.");
    state.cash -= singleCost * count;
    s.avgBuy = ((s.avgBuy * s.own) + (s.price * (1 + FEE_STOCK)) * count) / (s.own + count);
    s.own += count;
    addLog(`${s.name} ${count}주 풀매수`);
  }
  recordTrade(s,"buy",count,s.price,0);
  saveGame();
  update();
}

function fullSell(id){
  if(!checkMarketOpen()) return;
  let s=stock(id);
  if(s.own<=0)return alert("매도할 주식이 없습니다.");
  const isForeign = ["foreign","mega","special"].includes(s.group);
  
  let count = s.own;
  let revenue = (s.price * count) * (1 - FEE_STOCK - TAX_TRADE); // 수수료 + 거래세
  // 취득원가(매수 수수료 포함) 기준으로 실현손익 계산
  let profitTotal = revenue - (s.avgBuy * count);
  const profitKRW = isForeign ? profitTotal * fx.usd : profitTotal;
  
  if(isForeign){
    state.usd += revenue;
    s.realizedProfit += (profitTotal * fx.usd);
    addLog(`${s.name} ${count}주 풀매도 (${usdStr(s.price)}, 실현손익: ${won(profitTotal * fx.usd)})`);
  }else{
    state.cash += revenue;
    s.realizedProfit += profitTotal;
    addLog(`${s.name} ${count}주 풀매도 (${won(s.price)}, 실현손익: ${won(profitTotal)})`);
  }
  recordTrade(s,"sell",count,s.price,profitKRW);
  settleTax(profitKRW);
  s.own=0;
  s.avgBuy=0;
  saveGame();
  update();
}

function join(id){
  if(!canJoin(id)) return alert(`${unlockLabel(id)}합니다. (현재 등급: ${currentGrade()})`);
  let p=product(id),v=Math.max(p.min,Math.floor((+$("prod-"+id).value||p.min)/10000)*10000);
  if(v>state.cash)return alert("현금이 부족합니다.");
  // 가입 시점 이율은 현금을 빼기 전 등급으로 확정합니다.
  // 현금을 먼저 빼면 총자산이 줄어 등급이 내려가고, 상위 등급 전용 상품(채권·ETF·연금)은 이율이 0으로 굳습니다.
  if(p.amount===0) p.rate=gradeRateFor(id, currentGrade());
  state.cash-=v;
  p.amount+=v;
  addLog(`${p.name} 가입: ${won(v)} (확정 연 ${(p.rate*100).toFixed(1)}%)`);
  bumpDaily("deposit");
  saveGame();
  update();
}

function leave(id){
  let p=product(id);
  if(p.amount<=0)return alert("해지할 금액이 없습니다.");
  state.cash+=p.amount;
  addLog(`${p.name} 해지: ${won(p.amount)} 원금 회수`);
  p.amount=0;
  p.rate=0; // 해지하면 확정 이율도 초기화(다시 가입할 때 그 시점 등급 이율로 확정)
  saveGame();
  update();
}

function tickSeconds() {
  state.marketSeconds++;
  
  // 3분(180초) 개장 후 1분(60초) 휴장 순환 시스템
  let cycleTime = state.marketSeconds % 240;
  if (cycleTime < 180) {
    if(!state.marketOpen) {
      state.marketOpen = true;
      addLog("📢 시장이 개장되었습니다! 주식 거래가 가능합니다.");
    }
    let remain = 180 - cycleTime;
    $("marketTimeBar").style.background = "#e0f2fe";
    $("marketTimeBar").style.color = "#0369a1";
    $("marketTimeBar").textContent = `🟢 [개장 중] 주식 거래 가능 (다음 휴장까지 ${remain}초 남음)`;
  } else {
    if(state.marketOpen) {
      state.marketOpen = false;
      addLog("🔒 시장이 마감(휴장)되었습니다. 당분간 주식 거래가 제한됩니다.");
    }
    let remain = 240 - cycleTime;
    $("marketTimeBar").style.background = "#fee2e2";
    $("marketTimeBar").style.color = "#991b1b";
    $("marketTimeBar").textContent = `🔴 [휴장 중] 주식 거래 제한 (다음 개장까지 ${remain}초 남음) - 금융상품 이자는 정상 지급됩니다.`;
  }

  // 이벤트 잔여 타이머 감소 처리
  if(state.currentEvent) {
    state.eventTimer--;
    if(state.eventTimer <= 0) {
      addLog(`클린업: '${state.currentEvent}' 대형 트렌드 시장 이벤트가 종료되었습니다.`);
      state.currentEvent = null;
    }
  }

  // 배당 지급·실적 발표·목표 판정
  if(state.marketSeconds % DIVIDEND_EVERY === 0) payDividends();
  if(state.marketSeconds % EARNINGS_EVERY === 0) earningsSurprise();

  // 자산 추이 기록(15초 간격, 최근 45분)
  if(state.marketSeconds % 15 === 0) recordAssetHistory();

  if(state.marketSeconds % 5 === 0){
    checkGoals();
    checkAchievements();
    ensureDaily();
  }
  // 자동 적립 규칙
  if(state.auto && state.auto.enabled && state.marketSeconds % Math.max(15,state.auto.every||60) === 0){
    autoInvest();
  }
}

function tickMarket(){
  state.tick++;
  const idx=marketIndex();
  stocks.forEach(s=>{
    let old=s.price;
    // 시장지수 ETF는 랜덤워크 대신 지수(1,000 기준)를 10배로 추종합니다.
    if(s.id==="market_etf"){
      s.price=Math.max(100,Math.round(idx*10/100)*100);
      s.lastMove=(s.price-old)/old;
      s.hist.push(s.price); if(s.hist.length>60) s.hist.shift();
      return;
    }
    let noise=(Math.random()-.50)*s.vol;
    
    // 기본 크래시 및 급등 확률 기본 밸런스 조정
    let crash=Math.random()<.10 ? -(Math.random()*.10+.02) : 0;
    let surge=Math.random()<.08 ? Math.random()*.09+.02 : 0;
    
    // 장기 성장 유동성 바이어스
    let longBias=.0015+Math.random()*.002;
    let recovery=s.price<s.start ? .004 : 0;
    
    // [시장 대형 이벤트 시스템 반영]
    if(state.currentEvent === "AI_BOOM" && (s.theme.includes("AI") || s.theme.includes("반도체"))) {
      longBias += 0.025;
      if(Math.random() < 0.2) surge += 0.05;
    }
    if(state.currentEvent === "SEMI_STRONG" && s.theme.includes("반도체")) {
      longBias += 0.03;
    }
    if(state.currentEvent === "MARKET_CRASH") {
      longBias -= 0.04;
      if(Math.random() < 0.3) crash -= 0.06;
    }
    if(state.currentEvent === "BUBBLE_SHOCK") {
      longBias -= 0.02;
      noise *= 1.8; // 변동성 극한 확장
    }

    let next=s.price*(1+noise+crash+surge+longBias+recovery);
    
    // 연도 및 진행별 하방 지지선 하향 조정으로 무조건적인 우상향 제거, 리스크 강화
    let softFloor=s.start*(0.4 + state.tick*.0002);
    
    const isForeign = ["foreign","mega","special"].includes(s.group);
    if(isForeign){
      s.price=Math.max(1,Math.round(Math.max(next,softFloor)*100)/100);
    }else{
      s.price=Math.max(100,Math.round(Math.max(next,softFloor)/100)*100);
    }
    s.lastMove=(s.price-old)/old;
    s.hist.push(s.price);
    if(s.hist.length > 60) s.hist.shift();
  });
  processOrders();
  update();
}

function marketEventsAndNews() {
  // 15% 확률로 시장 빅 트렌드 이벤트 발생
  if(!state.currentEvent && Math.random() < 0.15) {
    const evs = ["AI_BOOM", "SEMI_STRONG", "FX_SURGE", "MARKET_CRASH", "BUBBLE_SHOCK"];
    state.currentEvent = evs[Math.floor(Math.random() * evs.length)];
    state.eventTimer = 25 + Math.floor(Math.random() * 35); // 25~60초간 지속
    
    let evText = "";
    if(state.currentEvent === "AI_BOOM") evText = "🔥 초거대 글로벌 인공지능 호황기가 도래하며 관련 테마주가 유례없는 초강세를 보입니다!";
    if(state.currentEvent === "SEMI_STRONG") evText = "🛠️ 전세계 반도체 공급 부족 심화! 반도체 생산 공급망 테마군에 자금이 집중됩니다.";
    if(state.currentEvent === "FX_SURGE") evText = "🇺🇸 달러 자본 독주 체제 가동으로 원/달러 환율이 급격한 변동성을 동반하여 요동칩니다.";
    if(state.currentEvent === "MARKET_CRASH") evText = "📉 긴축 공포 확산! 글로벌 거시 경제 위기로 시장 전체 자산군에 무차별 폭락 쇼크가 몰아칩니다.";
    if(state.currentEvent === "BUBBLE_SHOCK") evText = "⚠️ 고점 과열 지적에 따른 차익 실현 버블 조정 구간 진입. 시장 변동성이 극대화됩니다.";
    
    publishBreakingNews("🌟 대형 경제 기류 발생", evText);

    // 속보 내용이 실제 가격에 반영되도록 관련 종목에 즉시 충격을 줍니다.
    if(state.currentEvent === "SEMI_STRONG"){
      stocks.filter(s=>s.theme.includes("반도체")).forEach(s=>applyShock(s, 0.03+Math.random()*0.05));
    }
    if(state.currentEvent === "AI_BOOM"){
      stocks.filter(s=>s.theme.includes("AI")||s.theme.includes("반도체")).forEach(s=>applyShock(s, 0.03+Math.random()*0.05));
    }
    if(state.currentEvent === "MARKET_CRASH" || state.currentEvent === "BUBBLE_SHOCK"){
      stocks.forEach(s=>applyShock(s, -(0.03+Math.random()*0.06)));
    }
    if(state.currentEvent === "FX_SURGE"){
      fx.usd = Math.round(fx.usd * 1.03);
    }
    return;
  }

  // 일반 종목 속보 뉴스 생성
  if(stocks.length === 0) return;
  let sorted=[...stocks].sort((a,b)=>Math.abs(b.lastMove)-Math.abs(a.lastMove));
  let s=sorted[0];
  if(!s) return;
  let up=s.lastMove>=0;
  let reasons=up?["공격적인 분기 실적 기대감이 커지며","해외 기관들의 대규모 순매수세가 포착되며","신규 특허 취득 및 상용화 파트너십 소식에","장기 공급 계약 모멘텀이 시장에서 조명받으며"]:["고점 돌파 실패에 따른 실망 매물이 가중되며","단기 변동성 오버슈팅에 의한 매도세 유출로","일부 루머성 악재 지적에 거래 심리가 냉각되며","해외 거시 리스크 부담이 반영되며"];
  // 속보 내용이 실제 가격에도 반영되도록 같은 방향으로 소폭 충격을 가합니다.
  applyShock(s, (up?1:-1) * (0.004 + Math.random()*0.012));
  let text=`${s.name} (${s.ticker}) 측은 ${reasons[Math.floor(Math.random()*reasons.length)]} 전일 대비 ${pct(s.lastMove)} ${up?"상승":"하락"} 흐름을 연출 중입니다.`;
  publishBreakingNews("시황 속보", text);
}

function publishBreakingNews(title, text){
  let fullText = `[${title}] ${text}`;
  state.news.unshift(fullText);
  state.news=state.news.slice(0,25); // 최대 25개 저장
  
  const box=$("breaking");
  if(box){
    box.innerHTML=`<b>${title}</b> ${text}`;
    box.classList.add("show");
    setTimeout(()=>box.classList.remove("show"),5500);
  }
  if(activePage()=="news") news();
}

function interest(){
  products.forEach(p=>{
    if(p.amount > 0) {
      let principal = p.amount;
      let effectiveAmount = principal;
      
      // 적금 몰빵 방지 및 구간 효율 저하 밸런싱 (3000만원 초과 분은 이자율 절반 감소)
      if(principal > 30000000) {
        let excess = principal - 30000000;
        effectiveAmount = 30000000 + (excess * 0.5);
      }
      
      // 15초 단위 반영 스케일: 연이율 × 0.015 (예금 4.2% → 15초당 0.063%, 시간당 약 +16%)
      let calculatedInterest = effectiveAmount * (p.rate * 0.015); 
      p.amount += calculatedInterest;
    }
  });
  
  // 파킹 통장 미가입 현금 방치자 소량 구제 메커니즘 (현금 보유액의 0.002% 파킹 보너스 지급)
  // 예금 상품보다 확실히 낮은 수익률로, 현금을 방치하는 것이 최선의 선택이 되지 않도록 조정
  if(state.cash > 500000) {
    let parkingBonus = state.cash * 0.00002;
    state.cash += parkingBonus;
  }

  // 대출 이자(15초 단위): 연이율 × 0.015, 현금이 부족하면 대출 잔액에 가산
  if(state.loan > 0) {
    let loanInterest = state.loan * ((state.loanRate || 0) * 0.015);
    if(state.cash >= loanInterest) state.cash -= loanInterest;
    else { state.loan += loanInterest - state.cash; state.cash = 0; }
  }
  
  update();
}

function update(){
  // 모든 화면이 같은 총자산 계산을 쓰도록 한 곳으로 통일했습니다.
  let svWon=stockValueKRW();
  let pv=productValueKRW();

  $("cash").textContent=won(state.cash);
  let u=$("usdCash");if(u)u.textContent=usdStr(state.usd||0);
  $("stockValue").textContent=won(svWon);
  $("productValue").textContent=won(pv);
  $("totalValue").textContent=won(totalAssetsKRW());

  stocks.forEach(s=>{
    let c=(s.price-s.start)/s.start;
    const isForeign = ["foreign","mega","special"].includes(s.group);
    // 관심종목 페이지 등 같은 종목 카드가 여러 곳에 있을 수 있어 전부 갱신합니다.
    document.querySelectorAll(`[data-price="${s.id}"]`).forEach(pe=>{
      pe.textContent=isForeign ? usdStr(s.price) : won(s.price);
      pe.className="price "+(s.lastMove>=0?"up":"down");
    });
    document.querySelectorAll(`[data-change="${s.id}"]`).forEach(ce=>{
      ce.textContent="시작가 대비 "+pct(c)+" · 최근 "+pct(s.lastMove);
      ce.className=c>=0?"up":"down";
    });
    document.querySelectorAll(`[data-avg="${s.id}"]`).forEach(ae=>{
      ae.textContent = s.own > 0 ? (isForeign ? usdStr(s.avgBuy) : won(s.avgBuy)) : "-";
    });
    document.querySelectorAll(`[data-roipct="${s.id}"]`).forEach(re=>{
      if(s.own > 0 && s.avgBuy > 0) {
        const currentRoi = (s.price - s.avgBuy) / s.avgBuy;
        re.textContent = pct(currentRoi);
        re.className = currentRoi >= 0 ? "up" : "down";
      } else {
        re.textContent = "0%";
        re.className = "";
      }
    });
    document.querySelectorAll(`[data-own="${s.id}"]`).forEach(el=>{ el.textContent=s.own+"주"; });
    document.querySelectorAll(`[data-maxbuy="${s.id}"]`).forEach(mb=>{
      const singleCost = s.price * (1 + FEE_STOCK);
      mb.textContent=isForeign ? Math.floor(state.usd/singleCost)+"주" : Math.floor(state.cash/singleCost)+"주";
    });
    document.querySelectorAll(`[data-maxsell="${s.id}"]`).forEach(ms=>{ ms.textContent=s.own+"주"; });
    document.querySelectorAll(`[data-spark="${s.id}"]`).forEach(sp=>{ sp.innerHTML=sparklineSVG(s); });
  });

  products.forEach(p=>{
    let e=document.querySelector(`[data-prod="${p.id}"]`);
    if(e)e.textContent=won(p.amount);
    let le=document.querySelector(`[data-locked="${p.id}"]`);
    if(le)le.textContent=p.rate>0 ? `연 ${(p.rate*100).toFixed(1)}%` : "미가입";
  });

  // 금융 화면에서는 배너·해금 상태만 갱신해 입력 중인 금액을 보존합니다.
  if(activePage()==="banking") refreshBankingState();

  const bn=$("bottomNet");
  if(bn) bn.textContent=wonShort(totalAssetsKRW());

  const grade=currentGrade();
  if(state.lastGrade && state.lastGrade!==grade) notify("grade","등급 변동",`${state.lastGrade} → ${grade}`);
  state.lastGrade=grade;

  // 내 자산 화면은 입력·클릭 중에 다시 그리지 않습니다(5초마다 재렌더로 입력이 끊기는 문제 방지).
  if(activePage()=="portfolio"){
    const pf=document.getElementById("portfolio");
    const hovered=pf && typeof pf.matches==="function" && pf.matches(":hover");
    const focused=pf && document.activeElement && typeof pf.contains==="function" && pf.contains(document.activeElement);
    if(!hovered && !focused) portfolio();
  }
}

init();
</script>
