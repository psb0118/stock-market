let loopsStarted=false;
function startLoops(){
  if(loopsStarted) return;
  loopsStarted=true;
  setInterval(gameLoop,1000);
  setInterval(refreshLaborUI,1000);
  // 자동 저장은 설정을 따르되 타이머는 하나만 돌립니다.
  setInterval(()=>{ if(!state.settings || state.settings.autoSave!==false) saveGame(); },10000);
}
function gameLoop(){
  cloudAutoTick();
  if(state.paused){ updateSpeedUI(); return; }
  const n=Math.max(1,Math.min(5,Math.round(state.speed)||1));
  for(let i=0;i<n;i++){
    tickSeconds();
    if(state.marketSeconds%15===0) tickAlt();
    if(state.marketSeconds%5===0){ tickMarket(); updateFX(); }
    if(state.marketSeconds%7===0) marketEventsAndNews();
    if(state.marketSeconds%15===0) interest();
  }
  update();
}

function addLog(text) {
  const now = new Date();
  const timeStr = `[${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}]`;
  state.logs.unshift(`${timeStr} ${text}`);
  if(state.logs.length > 20) state.logs.pop();
  saveGame();
}

function buildSaveData() {
  return {
    costBasisIncludesFee: true, // 평단가가 매수 수수료를 포함한 취득원가 형식인지 표시(구버전 데이터 마이그레이션용)
    state: state,
    fx: fx,
    stocks: stocks.map(s => ({id:s.id, own:s.own, price:s.price, avgBuy:s.avgBuy, realizedProfit:s.realizedProfit, lastMove:s.lastMove, revenue:s.revenue, opProfit:s.opProfit})),
    products: products.map(p => ({id:p.id, amount:p.amount, rate:p.rate, bank:p.bank||null, startedAt:Number.isFinite(p.startedAt)?p.startedAt:null, matured:!!p.matured}))
  };
}

// 같은 오리진의 다른 탭이 저장하면 이 탭은 자동 저장을 멈춥니다(마지막 탭이 덮어쓰는 사고 방지).
let multiTab=false;
function handleExternalSave(){
  if(multiTab) return;
  multiTab=true;
  state.paused=true;
  updateSpeedUI();
  notify("system","다른 탭 감지","다른 탭에서 이미 플레이 중입니다. 이 탭은 자동 저장을 멈췄습니다. 계속하려면 새로고침해 주세요.");
}
function saveGame() {
  if(multiTab) return;
  state.lastSeen=Date.now();
  localStorage.setItem(SAVE_KEY, JSON.stringify(buildSaveData()));
}

function loadGame() {
  const raw = localStorage.getItem(SAVE_KEY);
  if(!raw) return;
  try {
    applySaveData(JSON.parse(raw));
  } catch(e) {
    console.error("저장 데이터 로드 실패", e);
  }
}

// localStorage와 파일 불러오기가 같은 경로를 쓰도록 저장 데이터 적용을 한 곳에 모읍니다.
function applySaveData(data) {
  if(!data || typeof data !== "object") throw new Error("잘못된 저장 데이터");
  if(data.state) Object.assign(state, data.state);
  if(data.fx) Object.assign(fx, data.fx);
  if(data.stocks) {
    data.stocks.forEach(ls => {
      let s = stocks.find(x => x.id === ls.id);
      if(!s) return;
      s.own = ls.own || 0;
      s.price = ls.price || s.start;
      s.avgBuy = ls.avgBuy || 0;
      // 구버전 저장 데이터의 평단가에는 매수 수수료가 빠져 있으므로 취득원가로 한 번만 환산
      if(data.costBasisIncludesFee !== true && s.avgBuy > 0) s.avgBuy *= (1 + FEE_STOCK);
      s.realizedProfit = ls.realizedProfit || 0;
      s.lastMove = ls.lastMove || 0;
      if(Number.isFinite(+ls.revenue)&&+ls.revenue>0) s.revenue=+ls.revenue;
      if(Number.isFinite(+ls.opProfit)&&+ls.opProfit>=0) s.opProfit=+ls.opProfit;
    });
  }
  if(data.products) {
    data.products.forEach(lp => {
      let p = products.find(x => x.id === lp.id);
      if(!p) return;
      p.amount = lp.amount || 0;
      // 구버전 저장 데이터에는 rate가 없으므로, 가입 중이면 현재 등급 이율로 확정해 줍니다.
      // 현재 등급이 해당 상품을 열 수 없으면 그 상품의 해금 등급 이율로 확정해 이자가 0이 되지 않도록 함
      p.rate = (Number.isFinite(lp.rate) && lp.rate > 0) ? lp.rate
        : (p.amount > 0 ? (gradeRateFor(p.id, currentGrade()) || gradeRateFor(p.id, PRODUCT_UNLOCK[p.id])) : 0);
      p.bank=lp.bank||null;
      p.startedAt=Number.isFinite(lp.startedAt)?lp.startedAt:null;
      p.matured=!!lp.matured;
    });
  }
  // 새 기능 필드 기본값 보정(구버전 세이브 대응)
  if(!Array.isArray(state.orders)) state.orders = [];
  if(!state.goals || typeof state.goals !== "object") state.goals = {};
  ["loan","loanRate","realizedYTD","taxedProfit","taxPaid"].forEach(k => {
    if(!Number.isFinite(state[k])) state[k] = 0;
  });
  if(!Number.isFinite(fx.anchor)) fx.anchor = fx.usd || START_FX; // 구버전 저장 대응
  // 신규 기능 필드 기본값 보정
  if(!Array.isArray(state.watch)) state.watch=[];
  if(!Array.isArray(state.journal)) state.journal=[];
  if(!Array.isArray(state.alerts)) state.alerts=[];
  if(!state.achievements || typeof state.achievements!=="object") state.achievements={};
  ["loanTotal","dividendTotal","feesTotal"].forEach(k=>{ if(!Number.isFinite(state[k])) state[k]=0; });
  state.notify=Object.assign({},NOTIFY_DEFAULT,(state.notify&&typeof state.notify==="object")?state.notify:{});
  Object.keys(NOTIFY_DEFAULT).forEach(k=>{ if(k!=="sound"&&k!=="haptic") state.notify[k]=state.notify[k]!==false; });
  const AUTO_DEFAULT={enabled:false,stockPct:60,minCash:1000000,every:60,goldPct:0,estatePct:0,autoSell:false,takeProfit:20,stopLoss:10};
  state.auto=Object.assign({},AUTO_DEFAULT,(state.auto&&typeof state.auto==="object")?state.auto:{});
  state.auto.goldPct=Math.max(0,Math.min(100,+state.auto.goldPct||0));
  state.auto.estatePct=Math.max(0,Math.min(100,+state.auto.estatePct||0));
  const LABOR_DEFAULT={shifts:0,earned:0,lastAt:{},warned:false};
  state.labor=Object.assign({},LABOR_DEFAULT,(state.labor&&typeof state.labor==="object")?state.labor:{});
  state.labor.shifts=Math.max(0,Math.floor(+state.labor.shifts||0));
  state.labor.earned=Math.max(0,+state.labor.earned||0);
  if(!state.labor.lastAt||typeof state.labor.lastAt!=="object") state.labor.lastAt={};
  LABOR_JOBS.forEach(j=>{ const t=+state.labor.lastAt[j.id]; if(!Number.isFinite(t)||t<0) delete state.labor.lastAt[j.id]; });
  state.labor.warned=!!state.labor.warned;
  if(!Number.isFinite(+state.rewardedGrade)) state.rewardedGrade=gradeIndex(currentGrade());
  if(!Number.isFinite(+state.targetGoal)||+state.targetGoal<=0) state.targetGoal=1000000000;
  if(!state.daily || typeof state.daily!=="object") state.daily={date:"",counts:{},claimed:{}};
  if(!Number.isFinite(state.speed) || state.speed<1) state.speed=1;
  state.speed=Math.max(1,Math.min(5,Math.round(state.speed)));
  // 새 설정 항목 기본값·타입 보정(잘못된 값이 들어와도 게임이 멈추지 않게)
  state.settings=Object.assign({},SETTINGS_DEFAULT,(state.settings&&typeof state.settings==="object")?state.settings:{});
  state.settings.speed=state.speed;
  state.settings.theme=state.settings.theme==="dark"?"dark":"light";
  state.settings.numberFormat=state.settings.numberFormat==="short"?"short":"full";
  ["confirmTrades","animations","effects","autoSave"].forEach(k=>{ state.settings[k]=state.settings[k]!==false; });
  ensureRebirth();
  if(!state.ui || typeof state.ui!=="object") state.ui={assetTab:"overview"};
  if(!["overview","stocks","finance","estate","metals","company","journal","growth"].includes(state.ui.assetTab)) state.ui.assetTab="overview";
  ["cash","usd","loan","peakNet","altRealized"].forEach(k=>{ if(!Number.isFinite(+state[k]) || +state[k]<0) state[k]=0; });
  if(typeof state.paused!=="boolean") state.paused=false;
  if(!Number.isFinite(state.seasonBase) || state.seasonBase<=0) state.seasonBase=totalAssetsKRW();
  if(!Number.isFinite(state.seasonBaseIndex) || state.seasonBaseIndex<=0) state.seasonBaseIndex=marketIndex();
  const CLOUD_DEFAULT={nickname:"", auto:false, lastSync:0, revision:0, rank:0, best:0, season:""};
  state.cloud=Object.assign({},CLOUD_DEFAULT,(state.cloud&&typeof state.cloud==="object")?state.cloud:{});
  delete state.cloud.token; // 기기 토큰은 localStorage에만 둠(내보내기 파일에 포함 금지)
  // 확장 자산 기본값/정규화(구버전 세이브 호환)
  if(!state.estate||typeof state.estate!=="object") state.estate={};
  ESTATES.forEach(e=>{ const h=state.estate[e.id]; if(!h||typeof h!=="object") { delete state.estate[e.id]; return; } h.qty=Math.max(0,Math.floor(+h.qty||0)); h.avgBuy=Math.max(0,+h.avgBuy||0); if(!h.qty) delete state.estate[e.id]; });
  if(!state.metals||typeof state.metals!=="object") state.metals={};
  METALS.forEach(m=>{ const h=state.metals[m.id]; if(!h||typeof h!=="object"){ state.metals[m.id]={qty:0,avg:0}; return; } h.qty=Math.max(0,+h.qty||0); h.avg=Math.max(0,+h.avg||0); });
  if(!state.altPrices||typeof state.altPrices!=="object") state.altPrices={};
  ESTATES.forEach(e=>{ if(!Number.isFinite(state.altPrices[e.id])||state.altPrices[e.id]<=0) state.altPrices[e.id]=e.price; });
  METALS.forEach(m=>{ if(!Number.isFinite(state.altPrices[m.id])||state.altPrices[m.id]<=0) state.altPrices[m.id]=m.price; });
  if(state.company && typeof state.company==="object"){
    const c=state.company;
    c.level=Math.max(1,Math.min(COMPANY_LEVELS.length,Math.floor(+c.level||1)));
    c.valuation=Math.max(0,+c.valuation||COMPANY_LEVELS[0].val);
    c.revenue=Math.max(0,+c.revenue||0); c.profit=Math.max(0,+c.profit||0);
    c.payout=Math.max(0,Math.min(1,Number.isFinite(+c.payout)?+c.payout:.3));
    if(!c.acquired||typeof c.acquired!=="object"||Array.isArray(c.acquired)) c.acquired={};
    if(typeof c.name!=="string") c.name="나의 기업";
  } else state.company=null;
  state.economy=Object.assign({},ECON_DEFAULT,(state.economy&&typeof state.economy==="object")?state.economy:{});
  ["baseRate","inflation","unemployment","gdpGrowth","cycleLeft","rateAdj"].forEach(k=>{ if(!Number.isFinite(+state.economy[k])) state.economy[k]=ECON_DEFAULT[k]; });
  if(!["호황","중립","불황"].includes(state.economy.phase)) state.economy.phase="중립";
  if(!state.weekly||typeof state.weekly!=="object"||!state.weekly.counts) state.weekly={key:"",counts:{},claimed:{}};
  if(!state.special||typeof state.special!=="object") state.special={};
  if(!state.streak||typeof state.streak!=="object") state.streak={days:1,last:"",best:1};
  if(!state.dex||typeof state.dex!=="object") state.dex={stocks:{},products:{},estates:{},metals:{},company:false};
  ["stocks","products","estates","metals"].forEach(k=>{ if(!state.dex[k]||typeof state.dex[k]!=="object") state.dex[k]={}; });
  state.dex.company=!!state.dex.company;
  if(state.company && !Number.isFinite(state.company.book)) state.company.book=state.company.valuation;
  if(!state.journalFilter||typeof state.journalFilter!=="object") state.journalFilter={q:"",side:"all"};
  state.peakNet=Math.max(Number.isFinite(+state.peakNet)?+state.peakNet:0,totalAssetsKRW());
  if(!Number.isFinite(+state.altRealized)) state.altRealized=0;
  state.lastGrade=currentGrade();
}

  state.weekly={key:"",counts:{},claimed:{}}; state.special={}; state.streak={days:1,last:"",best:1};
  state.dex={stocks:{},products:{},estates:{},metals:{},company:false}; state.peakNet=START_CASH; state.altRealized=0;

// 상품 카드의 부제(현재 등급 이율 또는 잠금 안내)
function productSubText(p, unlocked, held){
  const term=p.term>0?` · 만기 실제 ${realSeconds(p.term)}초 · 보너스 ${(p.bonus*100).toFixed(1)}%`:" · 수시 입출금";
  const bank=BANKS.find(b=>b.id===p.bank);
  return `${p.type} · ${unlocked ? `현재 등급 연 ${(gradeRateFor(p.id, currentGrade())*100).toFixed(1)}%` : `🔒 ${unlockLabel(p.id)}${held?" · 보유 중(이자는 확정 이율로 유지)":""}`}${term}${bank?` · ${bank.name}`:""}`;
}

// 배너와 해금 상태만 갱신합니다. 금융 화면을 다시 그리지 않으므로 입력 중인 금액이 보존됩니다.
function refreshBankingState(){
  products.forEach(p=>{
    const card=document.querySelector(`[data-card="${p.id}"]`);
    if(!card) return;
    const unlocked=canJoin(p.id), held=p.amount>0;
    card.className="product"+(unlocked ? "" : (held ? " locked holding" : " locked"));
    const sub=card.querySelector(`[data-sub="${p.id}"]`);
    if(sub) sub.textContent=productSubText(p, unlocked, held);
    const input=document.getElementById(`prod-${p.id}`);
    if(input) input.disabled=!unlocked;
    const maturity=card.querySelector(`[data-maturity="${p.id}"]`);
    if(maturity) maturity.value=productMaturityText(p);
    const joinBtn=card.querySelector(`[data-join="${p.id}"]`);
    if(joinBtn) joinBtn.disabled=!unlocked;
  });
  const gb=document.getElementById("gradeBanner");
  if(gb) gb.innerHTML=gradeBannerHTML();
}

// 등급 안내 배너: 현재 등급, 총자산, 다음 등급까지 남은 금액
function gradeBannerHTML(){
  const next=nextGradeInfo();
  return `🏅 현재 등급: <b>${currentGrade()}</b> · 총자산 ${won(totalAssetsKRW())}` +
    (next ? ` · 다음 등급 <b>${next.grade}</b>까지 ${won(next.remain)}` : " · 최고 등급입니다") +
    `<br><span style="font-size:12px;">등급이 높을수록 같은 상품의 이율이 높습니다. 가입 시점의 이율은 이후 등급이 바뀌어도 유지됩니다.</span>`;
}

function productMaturityText(p){
  if(p.amount<=0) return "미가입";
  if(p.term<=0) return "수시";
  if(p.matured) return "만기 완료";
  // startedAt이 0인 경우(게임 시작 직후 가입)도 '지금 가입'으로 잘못 해석하지 않도록 null만 검사합니다.
  const start=p.startedAt!=null?p.startedAt:state.marketSeconds;
  const gameLeft=Math.max(0,p.term-(state.marketSeconds-start));
  return `실제 ${realSeconds(gameLeft)}초 남음`;
}

// 상품 카드: 현재 등급 이율과 가입 당시 확정 이율을 함께 보여줍니다.
function productCard(p){
  const unlocked=canJoin(p.id);
  const held=p.amount>0;
  // 보유 중인 상품은 등급이 내려가도 이자가 계속 되므로 흐리게 처리하지 않습니다.
  const stateClass=unlocked ? "" : (held ? " locked holding" : " locked");
  return `<article class="product${stateClass}" data-card="${p.id}">
    <h2>${p.name}</h2>
    <p data-sub="${p.id}">${productSubText(p, unlocked, held)}</p>
    <div class="product-grid">
      <div><small>가입액</small><b data-prod="${p.id}">${won(p.amount)}</b></div>
      <div><small>최소 금액</small><b>${won(p.min)}</b></div>
      <div><small>확정 이율</small><b data-locked="${p.id}">${p.rate>0?`연 ${(p.rate*100).toFixed(1)}%`:"미가입"}</b></div>
      <div><small>위험도</small><b>${p.risk}</b></div>
    </div>
    <div class="trade bank-trade">
      <input id="prod-${p.id}" type="number" value="${p.min}" step="10000" ${unlocked?"":"disabled"}>
      <button class="buy" data-join="${p.id}" onclick="join('${p.id}')" ${unlocked?"":"disabled"}>가입</button>
      <button class="sell" onclick="leave('${p.id}')">해지</button>
    </div>
    <div class="inline-form" style="margin-top:8px">
      <label>은행<select id="bank-${p.id}" ${unlocked?"":"disabled"}>${BANKS.map(b=>`<option value="${b.id}" ${(p.bank||"hanbit")===b.id?"selected":""}>${b.name} (${b.mult>1?"+":""}${((b.mult-1)*100).toFixed(0)}%)</option>`).join("")}</select></label>
      <label>만기 상태<input id="maturity-${p.id}" data-maturity="${p.id}" value="${productMaturityText(p)}" readonly></label>
    </div>
  </article>`;
}

function updateFX(){
  let baseVol = 0.0035;
  if(state.currentEvent === "FX_SURGE") baseVol = 0.010; // 환율 급등 이벤트 발동 시 변동성 확대
  
  // 완만한 추세선(anchor)이 아주 느리게 움직이고, 실제 환율은 그 추세선을 따라갑니다.
  // 추세는 시작 환율 ±12% 안으로 제한하고 복원력도 두어, 폭주 없이 방향성만 남깁니다.
  fx.anchor = fx.anchor + (Math.random() - 0.5) * 0.004 * fx.anchor + (START_FX - fx.anchor) * 0.0003;
  fx.anchor = Math.max(START_FX * 0.88, Math.min(START_FX * 1.12, fx.anchor));

  let revert = ((fx.anchor - fx.usd) / fx.anchor) * 0.05;
  let changeRate = (Math.random() - 0.5) * baseVol + revert;
  fx.usd = Math.max(1000, Math.round(fx.usd * (1 + changeRate)));
  
  let e=document.getElementById("fxPrice");
  if(e) e.textContent="1 USD = "+fx.usd.toLocaleString()+"원";
  let fd=document.getElementById("fxFeeDesc");
  if(fd) fd.textContent=`환전 시 ${(fxFeeRate()*100).toFixed(1)}%의 환전 수수료가 적용됩니다(${currentGrade()} 등급 우대).`;
}

function toUSD(){
  let v=+($("krw").value||0);
  if(v<=0||v>state.cash)return alert("원화 현금이 부족하거나 잘못된 액수입니다.");
  
  let dynamicFx = fx.usd * (1 + fxFeeRate()); // 등급별 우대 수수료 적용(달러를 비싸게 삼)
  let netUsd = v / dynamicFx;
  
  state.cash-=v; 
  state.usd+=netUsd; 
  addLog(`달러 환전: 원화 ${won(v)} -> ${usdStr(netUsd)} (환율: ${fx.usd}원, 수수료 ${(fxFeeRate()*100).toFixed(1)}%)`);
  update();
}

function toKRW(){
  let v=+($("usd").value||0);
  if(v<=0||v>state.usd)return alert("달러 잔고가 부족하거나 잘못된 액수입니다.");
  
  let dynamicFx = fx.usd * (1 - fxFeeRate()); // 등급별 우대 수수료 적용(원화를 적게 받음)
  let netKrw = v * dynamicFx;
  
  state.usd-=v; 
  state.cash+=netKrw; 
  addLog(`원화 환전: 달러 ${usdStr(v)} -> ${won(netKrw)} (환율: ${fx.usd}원, 수수료 ${(fxFeeRate()*100).toFixed(1)}%)`);
  update();
}

function stock(id){return stocks.find(s=>s.id==id)}
function product(id){return products.find(p=>p.id==id)}
function activePage(){return document.querySelector(".page.on")?.id}

function checkMarketOpen() {
  if(!state.marketOpen) {
    alert("현재는 휴장 상태입니다! (휴장 중에는 주식 매매가 불가능합니다)");
    return false;
  }
  return true;
}

function buy(id){
  if(!checkMarketOpen()) return;
  let s=stock(id);
  const isForeign = ["foreign","mega","special"].includes(s.group);
  if(!confirmTrade("매수",`${s.name} 1주 · ${isForeign?usdStr(s.price*(1+stockFeeRate())):won(s.price*(1+stockFeeRate()))}`)) return;
  
  if(isForeign){
    let cost = s.price * (1 + stockFeeRate());
    if(state.usd < cost) return alert("수수료 포함 달러(USD) 잔고가 부족합니다.");
    state.usd -= cost;
    s.avgBuy = ((s.avgBuy * s.own) + (s.price * (1 + stockFeeRate()))) / (s.own + 1);
    s.own += 1;
    addLog(`${s.name} 1주 매수 (${usdStr(s.price)}, 수수료 포함)`);
  }else{
    let cost = s.price * (1 + stockFeeRate());
    if(state.cash < cost) return alert("수수료 포함 원화 현금이 부족합니다.");
    state.cash -= cost;
    s.avgBuy = ((s.avgBuy * s.own) + (s.price * (1 + stockFeeRate()))) / (s.own + 1);
    s.own += 1;
    addLog(`${s.name} 1주 매수 (${won(s.price)}, 수수료 포함)`);
  }
  markDex("stocks",s.id);
  recordTrade(s,"buy",1,s.price,0);
  saveGame();
  update();
}

function sell(id){
  if(!checkMarketOpen()) return;
  let s=stock(id);
  if(s.own<=0)return alert("보유 주식이 없습니다.");
  const isForeign = ["foreign","mega","special"].includes(s.group);
  if(!confirmTrade("매도",`${s.name} 1주 · ${isForeign?usdStr(s.price*(1-stockFeeRate()-tradeTaxRate())):won(s.price*(1-stockFeeRate()-tradeTaxRate()))}`)) return;
  
  let revenue = s.price * (1 - stockFeeRate() - tradeTaxRate()); // 수수료 0.15% + 거래세 0.2%
  // 평단가가 매수 수수료를 포함한 취득원가이므로 실현손익 = 순수취금액 - 취득원가
  let profit = revenue - s.avgBuy;
  const profitKRW = isForeign ? profit * fx.usd : profit;
  
  if(isForeign) {
    state.usd += revenue;
    s.realizedProfit += (profit * fx.usd);
    addLog(`${s.name} 1주 매도 (${usdStr(s.price)}, 실현손익: ${won(profit * fx.usd)})`);
  } else {
    state.cash += revenue;
    s.realizedProfit += profit;
    addLog(`${s.name} 1주 매도 (${won(s.price)}, 실현손익: ${won(profit)})`);
  }
  recordTrade(s,"sell",1,s.price,profitKRW);
  settleTax(profitKRW);
  creditStockBonus(profitKRW);
  
  s.own -= 1;
  if(s.own === 0) s.avgBuy = 0;
  saveGame();
  update();
}

function fullBuy(id){
  if(!checkMarketOpen()) return;
  let s=stock(id);
  const isForeign = ["foreign","mega","special"].includes(s.group);
  if(!confirmTrade("전액 매수",`${s.name} · 보유 가능 수량 전부`)) return;
  
  if(isForeign){
    let singleCost = s.price * (1 + stockFeeRate());
    let count = Math.floor(state.usd / singleCost);
    if(count<=0) return alert("달러(USD) 잔고가 부족합니다.");
    state.usd -= singleCost * count;
    s.avgBuy = ((s.avgBuy * s.own) + (s.price * (1 + stockFeeRate())) * count) / (s.own + count);
    s.own += count;
    addLog(`${s.name} ${count}주 풀매수`);
  }else{
    let singleCost = s.price * (1 + stockFeeRate());
    let count = Math.floor(state.cash / singleCost);
    if(count<=0) return alert("원화 현금이 부족합니다.");
    state.cash -= singleCost * count;
    s.avgBuy = ((s.avgBuy * s.own) + (s.price * (1 + stockFeeRate())) * count) / (s.own + count);
    s.own += count;
    addLog(`${s.name} ${count}주 풀매수`);
  }
  recordTrade(s,"buy",count,s.price,0);
  saveGame();
  update();
}

function fullSell(id){
  if(!checkMarketOpen()) return;
  let s=stock(id);
  if(s.own<=0)return alert("매도할 주식이 없습니다.");
  const isForeign = ["foreign","mega","special"].includes(s.group);
  if(!confirmTrade("전액 매도",`${s.name} ${s.own}주 전부`)) return;
  
  let count = s.own;
  let revenue = (s.price * count) * (1 - stockFeeRate() - tradeTaxRate()); // 수수료 + 거래세
  // 취득원가(매수 수수료 포함) 기준으로 실현손익 계산
  let profitTotal = revenue - (s.avgBuy * count);
  const profitKRW = isForeign ? profitTotal * fx.usd : profitTotal;
  
  if(isForeign){
    state.usd += revenue;
    s.realizedProfit += (profitTotal * fx.usd);
    addLog(`${s.name} ${count}주 풀매도 (${usdStr(s.price)}, 실현손익: ${won(profitTotal * fx.usd)})`);
  }else{
    state.cash += revenue;
    s.realizedProfit += profitTotal;
    addLog(`${s.name} ${count}주 풀매도 (${won(s.price)}, 실현손익: ${won(profitTotal)})`);
  }
  recordTrade(s,"sell",count,s.price,profitKRW);
  settleTax(profitKRW);
  creditStockBonus(profitKRW);
  s.own=0;
  s.avgBuy=0;
  saveGame();
  update();
}

function join(id){
  if(!canJoin(id)) return alert(`${unlockLabel(id)}합니다. (현재 등급: ${currentGrade()})`);
  let p=product(id),v=Math.max(p.min,Math.floor((+$("prod-"+id).value||p.min)/10000)*10000);
  if(v>state.cash)return alert("현금이 부족합니다.");
  // 가입 시점 이율은 현금을 빼기 전 등급으로 확정합니다.
  // 현금을 먼저 빼면 총자산이 줄어 등급이 내려가고, 상위 등급 전용 상품(채권·ETF·연금)은 이율이 0으로 굳습니다.
  const bankEl=$("bank-"+id);
  const bank=BANKS.find(b=>b.id===(bankEl&&bankEl.value))||BANKS[0];
  if(p.amount===0){
    p.rate=gradeRateFor(id,currentGrade())*(bank.mult||1)*(1+((state.economy&&state.economy.rateAdj)||0));
    p.bank=bank.id; p.bankMult=bank.mult||1;
    p.startedAt=state.marketSeconds; p.matured=!(p.term>0);
  }
  state.cash-=v;
  p.amount+=v;
  markDex("products",id);
  addLog(`${p.name} 가입: ${won(v)} (${bank.name} 확정 연 ${(p.rate*100).toFixed(1)}%)`);
  bumpDaily("deposit");
  saveGame();
  update();
}

function leave(id){
  let p=product(id);
  if(p.amount<=0)return alert("해지할 금액이 없습니다.");
  // 만기 전 해지에는 원금의 0.5% 중도해지 페널티를 적용합니다(파킹·ETF는 예외).
  const early=p.term>0 && p.startedAt!=null && !p.matured;
  const penalty=early?p.amount*0.005:0;
  if(early && !confirm(`${p.name}을(를) 만기 전에 해지하면 ${won(penalty)}의 페널티가 적용됩니다. 계속할까요?`)) return;
  state.cash+=p.amount-penalty;
  addLog(`${p.name} 해지: ${won(p.amount-penalty)} 회수${penalty?` (페널티 ${won(penalty)})`:""}`);
  p.amount=0; p.rate=0; p.startedAt=null; p.matured=false; p.bank=null;
  saveGame();
  update();
}

function tickSeconds() {
  state.marketSeconds++;
  
  // 3분(180초) 개장 후 1분(60초) 휴장 순환 시스템
  // 남은 시간 표시는 renderMarketBar가 현재 배속을 반영한 실제 초로 처리합니다.
  const cycleTime = state.marketSeconds % 240;
  if (cycleTime < 180) {
    if(!state.marketOpen) {
      state.marketOpen = true;
      addLog("📢 시장이 개장되었습니다! 주식 거래가 가능합니다.");
    }
  } else {
    if(state.marketOpen) {
      state.marketOpen = false;
      addLog("🔒 시장이 마감(휴장)되었습니다. 당분간 주식 거래가 제한됩니다.");
    }
  }
  renderMarketBar();

  // 이벤트 잔여 타이머 감소 처리
  if(state.currentEvent) {
    state.eventTimer--;
    if(state.eventTimer <= 0) {
      addLog(`클린업: '${state.currentEvent}' 대형 트렌드 시장 이벤트가 종료되었습니다.`);
      state.currentEvent = null;
    }
  }

  // 배당 지급·실적 발표·목표 판정
  if(state.marketSeconds % DIVIDEND_EVERY === 0) payDividends();
  if(state.marketSeconds % EARNINGS_EVERY === 0) earningsSurprise();

  // 자산 추이 기록(15초 간격, 최근 45분)
  if(state.marketSeconds % 15 === 0) recordAssetHistory();

  if(state.marketSeconds % 5 === 0){
    checkGoals();
    checkAchievements();
    ensureDaily();
  }
  // 자동 매매(익절/손절) → 매도가 없을 때만 자동 적립을 실행합니다.
  if(state.auto && state.auto.enabled && state.marketSeconds % Math.max(15,state.auto.every||60) === 0){
    if(!autoSellRules()) autoInvest();
  }
}

function economicMarketBias(){
  const e=state.economy||{};
  const growth=Number.isFinite(+e.gdpGrowth)?+e.gdpGrowth:ECON_DEFAULT.gdpGrowth;
  const inflation=Number.isFinite(+e.inflation)?+e.inflation:ECON_DEFAULT.inflation;
  const unemployment=Number.isFinite(+e.unemployment)?+e.unemployment:ECON_DEFAULT.unemployment;
  const rate=Number.isFinite(+e.baseRate)?+e.baseRate:ECON_DEFAULT.baseRate;
  const phase=e.phase==="호황"?1:e.phase==="불황"?-1:0;
  // 성장률은 우호적, 물가·실업률·금리 상승은 할인율과 소비 위축으로 부정적입니다.
  return growth*.00015 + phase*.0002 - (inflation-ECON_DEFAULT.inflation)*.0003 - (unemployment-ECON_DEFAULT.unemployment)*.0015 - (rate-ECON_DEFAULT.baseRate)*.0005;
}
function tickMarket(){
  state.tick++;
  const idx=marketIndex();
  stocks.forEach(s=>{
    let old=s.price;
    // 시장지수 ETF는 랜덤워크 대신 지수(1,000 기준)를 10배로 추종합니다.
    if(s.id==="market_etf"){
      s.price=Math.max(100,Math.round(idx*10/100)*100);
      s.lastMove=(s.price-old)/old;
      s.hist.push(s.price); if(s.hist.length>60) s.hist.shift();
      return;
    }
    let noise=(Math.random()-.50)*s.vol;
    
    // 기본 크래시 및 급등 확률: 5초 틱에서 기대 상승/하락을 서로 상쇄합니다.
    let crash=Math.random()<.04 ? -(Math.random()*.04+.01) : 0;
    let surge=Math.random()<.04 ? Math.random()*.04+.01 : 0;
    
    // 장기 성장 유동성 바이어스(시간 압축 대비 완만하게)
    let longBias=.0003+Math.random()*.0002+economicMarketBias();
    let recovery=s.price<s.start ? .001 : 0;
    
    // [시장 대형 이벤트 시스템 반영]
    if(state.currentEvent === "AI_BOOM" && (s.theme.includes("AI") || s.theme.includes("반도체"))) {
      longBias += 0.025;
      if(Math.random() < 0.2) surge += 0.05;
    }
    if(state.currentEvent === "SEMI_STRONG" && s.theme.includes("반도체")) {
      longBias += 0.03;
    }
    if(state.currentEvent === "MARKET_CRASH") {
      longBias -= 0.04;
      if(Math.random() < 0.3) crash -= 0.06;
    }
    if(state.currentEvent === "BUBBLE_SHOCK") {
      longBias -= 0.02;
      noise *= 1.8; // 변동성 극한 확장
    }
    // 시작가 대비 1.6배를 넘으면 차익 실현 압력으로 과열을 식힙니다.
    if(s.price > s.start*1.6) longBias -= .002;

    let next=s.price*(1+noise+crash+surge+longBias+recovery);
    // 한 종목이 몇 시간 만에 수십 배가 되는 것을 막는 상한(시작가 2.2배)입니다.
    next=Math.min(next, s.start*2.2);
    
    // 연도 및 진행별 하방 지지선 하향 조정으로 무조건적인 우상향 제거, 리스크 강화
    // 시간이 지날수록 하한선이 무한히 올라가 모든 종목을 강제로 상승시키던 문제를 막습니다.
    // 시작가의 40%에서 출발해 최대 80%까지만 완만히 올라가고, 그 뒤로는 고정됩니다.
    let softFloor=s.start*(0.4 + Math.min(0.4, state.tick*.0002));
    
    const isForeign = ["foreign","mega","special"].includes(s.group);
    if(isForeign){
      s.price=Math.max(1,Math.round(Math.max(next,softFloor)*100)/100);
    }else{
      s.price=Math.max(100,Math.round(Math.max(next,softFloor)/100)*100);
    }
    s.lastMove=(s.price-old)/old;
    s.hist.push(s.price);
    if(s.hist.length > 60) s.hist.shift();
  });
  processOrders();
  update();
}

function marketEventsAndNews() {
  // 15% 확률로 시장 빅 트렌드 이벤트 발생
  if(!state.currentEvent && Math.random() < 0.15) {
    const evs = ["AI_BOOM", "SEMI_STRONG", "FX_SURGE", "FX_CRASH", "MARKET_CRASH", "BUBBLE_SHOCK"];
    state.currentEvent = evs[Math.floor(Math.random() * evs.length)];
    state.eventTimer = 25 + Math.floor(Math.random() * 35); // 25~60초간 지속
    
    let evText = "";
    if(state.currentEvent === "AI_BOOM") evText = "🔥 초거대 글로벌 인공지능 호황기가 도래하며 관련 테마주가 유례없는 초강세를 보입니다!";
    if(state.currentEvent === "SEMI_STRONG") evText = "🛠️ 전세계 반도체 공급 부족 심화! 반도체 생산 공급망 테마군에 자금이 집중됩니다.";
    if(state.currentEvent === "FX_SURGE") evText = "🇺🇸 달러 자본 독주 체제 가동으로 원/달러 환율이 급격한 변동성을 동반하여 요동칩니다.";
    if(state.currentEvent === "FX_CRASH") evText = "💵 달러 약세 전환으로 원/달러 환율이 급락하고 있습니다.";
    if(state.currentEvent === "MARKET_CRASH") evText = "📉 긴축 공포 확산! 글로벌 거시 경제 위기로 시장 전체 자산군에 무차별 폭락 쇼크가 몰아칩니다.";
    if(state.currentEvent === "BUBBLE_SHOCK") evText = "⚠️ 고점 과열 지적에 따른 차익 실현 버블 조정 구간 진입. 시장 변동성이 극대화됩니다.";
    
    publishBreakingNews("🌟 대형 경제 기류 발생", evText);

    // 속보 내용이 실제 가격에 반영되도록 관련 종목에 즉시 충격을 줍니다.
    if(state.currentEvent === "SEMI_STRONG"){
      stocks.filter(s=>s.theme.includes("반도체")).forEach(s=>applyShock(s, 0.03+Math.random()*0.05));
    }
    if(state.currentEvent === "AI_BOOM"){
      stocks.filter(s=>s.theme.includes("AI")||s.theme.includes("반도체")).forEach(s=>applyShock(s, 0.03+Math.random()*0.05));
    }
    if(state.currentEvent === "MARKET_CRASH" || state.currentEvent === "BUBBLE_SHOCK"){
      stocks.forEach(s=>applyShock(s, -(0.03+Math.random()*0.06)));
    }
    if(state.currentEvent === "FX_SURGE"){
      fx.usd = Math.round(fx.usd * 1.03);
    }
    if(state.currentEvent === "FX_CRASH"){
      fx.usd = Math.round(fx.usd * 0.97);
    }
    return;
  }

  // 일반 종목 속보 뉴스 생성
  if(stocks.length === 0) return;
  let sorted=[...stocks].sort((a,b)=>Math.abs(b.lastMove)-Math.abs(a.lastMove));
  let s=sorted[0];
  if(!s) return;
  let up=s.lastMove>=0;
  let reasons=up?["공격적인 분기 실적 기대감이 커지며","해외 기관들의 대규모 순매수세가 포착되며","신규 특허 취득 및 상용화 파트너십 소식에","장기 공급 계약 모멘텀이 시장에서 조명받으며"]:["고점 돌파 실패에 따른 실망 매물이 가중되며","단기 변동성 오버슈팅에 의한 매도세 유출로","일부 루머성 악재 지적에 거래 심리가 냉각되며","해외 거시 리스크 부담이 반영되며"];
  // 속보 내용이 실제 가격에도 반영되도록 같은 방향으로 소폭 충격을 가합니다.
  applyShock(s, (up?1:-1) * (0.004 + Math.random()*0.012));
  let text=`${s.name} (${s.ticker}) 측은 ${reasons[Math.floor(Math.random()*reasons.length)]} 전일 대비 ${pct(s.lastMove)} ${up?"상승":"하락"} 흐름을 연출 중입니다.`;
  publishBreakingNews("시황 속보", text);
}

function publishBreakingNews(title, text){
  let fullText = `[${title}] ${text}`;
  state.news.unshift(fullText);
  state.news=state.news.slice(0,25); // 최대 25개 저장
  
  const box=$("breaking");
  if(box){
    box.innerHTML=`<b>${title}</b> ${text}`;
    box.classList.add("show");
    setTimeout(()=>box.classList.remove("show"),5500);
  }
  if(activePage()=="news") news();
}

function interest(){
  const depositBonus=rebirthBonus("deposit",.03);
  products.forEach(p=>{
    if(p.amount > 0) {
      let principal = p.amount;
      let effectiveAmount = principal;
      
      // 적금 몰빵 방지 및 구간 효율 저하 밸런싱 (3000만원 초과 분은 이자율 절반 감소)
      if(principal > 30000000) {
        let excess = principal - 30000000;
        effectiveAmount = 30000000 + (excess * 0.5);
      }
      // 3억원을 넘는 예금은 이자 계산 기준 원금을 3억원으로 제한합니다.
      effectiveAmount = Math.min(MAX_EFFECTIVE_DEPOSIT, effectiveAmount);
      
      // 15초 단위 반영 스케일: 연이율 × 0.015 (예금 4.2% → 15초당 0.063%, 시간당 약 +16%)
      let calculatedInterest = effectiveAmount * (p.rate * depositBonus * 0.015);
      p.amount += calculatedInterest;
    }
  });

  // 만기 보너스: 가입 시점부터 term초가 지나면 한 번만 지급합니다.
  products.forEach(p=>{
    if(p.amount>0 && p.term>0 && p.startedAt!=null && !p.matured && state.marketSeconds-p.startedAt>=p.term){
      const bonus=p.amount*(p.bonus||0);
      p.amount+=bonus; p.matured=true;
      addLog(`🎁 만기 보너스: ${p.name} +${won(bonus)}`);
      notify("maturity","만기 보너스",`${p.name} +${won(bonus)}`);
    }
  });

  // 대출 이자(15초 단위): 연이율 × 0.015, 현금이 부족하면 대출 잔액에 가산
  if(state.loan > 0) {
    let loanInterest = state.loan * ((state.loanRate || 0) * 0.015);
    if(state.cash >= loanInterest) state.cash -= loanInterest;
    else {
      state.loan += loanInterest - state.cash; state.cash = 0;
      notify("loan","대출 이자 증가","현금이 부족해 이자가 대출 잔액에 더해졌습니다.");
    }
  }
  
  update();
}

function update(){
  // 모든 화면이 같은 총자산 계산을 쓰도록 한 곳으로 통일했습니다.
  let svWon=stockValueKRW();
  let pv=productValueKRW();

  $("cash").textContent=won(state.cash);
  let u=$("usdCash");if(u)u.textContent=usdStr(state.usd||0);
  $("stockValue").textContent=won(svWon);
  $("productValue").textContent=won(pv);
  $("totalValue").textContent=won(totalAssetsKRW());

  stocks.forEach(s=>{
    let c=(s.price-s.start)/s.start;
    const isForeign = ["foreign","mega","special"].includes(s.group);
    // 관심종목 페이지 등 같은 종목 카드가 여러 곳에 있을 수 있어 전부 갱신합니다.
    document.querySelectorAll(`[data-price="${s.id}"]`).forEach(pe=>{
      pe.textContent=isForeign ? usdStr(s.price) : won(s.price);
      pe.className="price "+(s.lastMove>=0?"up":"down");
    });
    document.querySelectorAll(`[data-change="${s.id}"]`).forEach(ce=>{
      ce.textContent="시작가 대비 "+pct(c)+" · 최근 "+pct(s.lastMove);
      ce.className=c>=0?"up":"down";
    });
    document.querySelectorAll(`[data-avg="${s.id}"]`).forEach(ae=>{
      ae.textContent = s.own > 0 ? (isForeign ? usdStr(s.avgBuy) : won(s.avgBuy)) : "-";
    });
    document.querySelectorAll(`[data-roipct="${s.id}"]`).forEach(re=>{
      if(s.own > 0 && s.avgBuy > 0) {
        const currentRoi = (s.price - s.avgBuy) / s.avgBuy;
        re.textContent = pct(currentRoi);
        re.className = currentRoi >= 0 ? "up" : "down";
      } else {
        re.textContent = "0%";
        re.className = "";
      }
    });
    document.querySelectorAll(`[data-own="${s.id}"]`).forEach(el=>{ el.textContent=s.own+"주"; });
    document.querySelectorAll(`[data-maxbuy="${s.id}"]`).forEach(mb=>{
      const singleCost = s.price * (1 + stockFeeRate());
      mb.textContent=isForeign ? Math.floor(state.usd/singleCost)+"주" : Math.floor(state.cash/singleCost)+"주";
    });
    document.querySelectorAll(`[data-maxsell="${s.id}"]`).forEach(ms=>{ ms.textContent=s.own+"주"; });
    document.querySelectorAll(`[data-spark="${s.id}"]`).forEach(sp=>{ sp.innerHTML=sparklineSVG(s); });
  });

  products.forEach(p=>{
    let e=document.querySelector(`[data-prod="${p.id}"]`);
    if(e)e.textContent=won(p.amount);
    let le=document.querySelector(`[data-locked="${p.id}"]`);
    if(le)le.textContent=p.rate>0 ? `연 ${(p.rate*100).toFixed(1)}%` : "미가입";
  });

  // 금융 화면에서는 배너·해금 상태만 갱신해 입력 중인 금액을 보존합니다.
  if(activePage()==="banking") refreshBankingState();

  state.peakNet=Math.max(state.peakNet||0,totalAssetsKRW());
  const bn=$("bottomNet");
  if(bn) bn.textContent=wonShort(totalAssetsKRW());
  const sg=$("sideGrade"); if(sg) sg.textContent=currentGrade();
  refreshLaborUI();

  const grade=currentGrade();
  if(state.lastGrade && state.lastGrade!==grade) notify("grade","등급 변동",`${state.lastGrade} → ${grade}`);
  state.lastGrade=grade;
  const rb=ensureRebirth();
  if(!rb.notified && canRebirth()){ rb.notified=true; notify("rebirth","환생 가능",`순자산 ${wonShort(totalAssetsKRW())} · 환생 화면에서 영구 업그레이드를 확인하세요.`); saveGame(); }

  // 입력·클릭 중에는 다시 그리지 않습니다(5초마다 재렌더로 입력이 끊기는 문제 방지).
  const livePage=activePage();
  if(["portfolio","dashboard","realestate","company","economy"].includes(livePage)){
    const pf=document.getElementById(livePage);
    const hovered=pf && typeof pf.matches==="function" && pf.matches(":hover");
    const focused=pf && document.activeElement && typeof pf.contains==="function" && pf.contains(document.activeElement);
    if(!hovered && !focused){
      if(livePage==="portfolio") portfolio();
      else if(livePage==="dashboard") dashboardPage();
      else if(livePage==="realestate") realestatePage();
      else if(livePage==="company") companyPage();
      else if(livePage==="economy") economyPage();
    }
  }
}

init();

// 노동 미니게임은 스페이스·엔터로도 멈출 수 있습니다(버튼에 포커스가 있을 때는 기본 클릭에 맡깁니다).
if(typeof document!=="undefined" && typeof document.addEventListener==="function"){
  document.addEventListener("keydown",e=>{
    if(!laborSession) return;
    const tag=e.target&&e.target.tagName?String(e.target.tagName).toUpperCase():"";
    if(tag==="BUTTON"||tag==="INPUT"||tag==="SELECT"||tag==="TEXTAREA") return;
    if(e.key===" "||e.key==="Enter"){ e.preventDefault(); laborStop(); }
  });
}
</script>
