<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#17202b" />
<!-- 클라우드 저장·리더보드 Worker 주소. 비워 두면 기능이 꺼집니다. -->
<meta name="cloud-api" content="" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<title>머니 플레이그라운드</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:#f5f3ee;color:#18212f}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.side{background:#17202b;color:white;padding:20px;position:sticky;top:0;height:100vh}
.logo{font-size:19px;font-weight:800;margin-bottom:8px;white-space:nowrap}
.sub{font-size:13px;color:#cbd5e1;line-height:1.4;margin-bottom:18px}
.nav{display:grid;gap:8px}
.nav button{background:transparent;color:#dbe4ef;text-align:left}
.nav button.on{background:#f7c948;color:#17202b;font-weight:800}
button{border:0;border-radius:7px;min-height:38px;padding:0 12px;cursor:pointer;background:#1f2937;color:white}
button:disabled{opacity:.45;cursor:not-allowed}
main{padding:22px}
/* 시황 속보는 문서 흐름에서 빼서 화면이 위아래로 밀리지 않게 합니다(작은 오버레이 알림). */
.breaking{display:none;position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:80;margin:0;width:max-content;max-width:min(560px,calc(100vw - 24px));pointer-events:none;border-radius:8px;padding:13px 14px;background:#111827;color:white;border-left:7px solid #f7c948;box-shadow:0 10px 28px #0005}
.breaking.show{display:block;animation:toastIn .18s ease-out}
.breaking b{color:#f7c948}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.box,.card,.product,.news,.row{background:#fffdf8;border:1px solid #d8ded4;border-radius:8px;padding:14px;box-shadow:0 10px 28px #0001}
.box small{color:#667085}.box b{display:block;font-size:20px;margin-top:8px;overflow-wrap:anywhere}
.page{display:none}
.page.on{display:block}
.head{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:12px}
h1{margin:0 0 5px;font-size:28px}
h2{margin:0 0 8px}
p{margin:0;color:#667085;line-height:1.45}
.notice{background:#fff7d6;border:1px solid #edd07b;color:#604400;border-radius:8px;padding:10px 12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:12px}
.top{display:flex;justify-content:space-between;gap:8px}
.pill{display:inline-flex;align-items:center;border-radius:999px;background:#edf2f7;color:#334155;font-size:12px;padding:5px 8px;white-space:nowrap}
.price{font-size:25px;font-weight:900;margin:12px 0 3px}
.up{color:#0f766e}.down{color:#b42318}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}
.mini div,.product-grid div{border:1px solid #d8ded4;background:#fafafa;border-radius:7px;padding:8px}
.mini small,.product-grid small{display:block;color:#667085;margin-bottom:5px}
.trade{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.trade.trade-qty{grid-template-columns:minmax(64px,1fr) 1fr 1fr}
.trade .qty-input{width:100%}
.quick-trade{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.holding-card .quick-trade{grid-template-columns:1fr 1fr 1fr}
.quick-trade button{min-height:32px;font-size:12px;padding:0 6px}
.bank-trade{grid-template-columns:1fr 1fr}
.bank-trade input{grid-column:1 / -1}
.buy{background:#0f766e}.sell{background:#b42318}.ghost{background:#e7ebef;color:#18212f}
.spark{height:28px;margin-top:10px;position:relative;cursor:crosshair}
.spark svg{display:block;width:100%;height:28px}
.spark-tip{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);z-index:6;background:#111827;color:#fff;border:1px solid #334155;border-radius:6px;padding:4px 7px;font-size:11px;line-height:1.35;white-space:nowrap;pointer-events:none;box-shadow:0 4px 14px #0003}
.spark-tip.on{display:block}
.spark-tip b{color:#f7c948}
.trade.trade-sell-only{grid-template-columns:minmax(64px,1fr) 1fr}
.holding-mini{grid-template-columns:repeat(2,minmax(0,1fr))}
.holding-mini b{font-size:13px;overflow-wrap:anywhere}
.section{margin-top:22px}
.section h3{margin:0 0 10px}
.panel{background:#fffdf8;border:1px solid #d8ded4;border-radius:8px;padding:14px;box-shadow:0 10px 28px #0001}
.field{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.field label{display:grid;gap:4px;font-size:12px;color:#667085}
select{min-width:0;border:1px solid #cbd5e1;border-radius:7px;padding:0 9px;min-height:38px;background:white}
.goal{display:grid;gap:6px;margin-bottom:10px}
.goal small{color:#667085}
.bar{height:8px;background:#e7ebef;border-radius:999px;overflow:hidden}
.bar span{display:block;height:100%;background:#0f766e}
.hof{display:grid;gap:6px;font-size:13px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #f7c948;outline-offset:2px}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.product-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
input{min-width:0;border:1px solid #cbd5e1;border-radius:7px;padding:0 9px;min-height:38px}
.wide{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}
.feed,.portfolio,.info-list{display:grid;gap:10px}
.news.locked{background:#fffaf0;border-color:#e7c066}
.product.locked{opacity:.62;background:#f6f7f9}
.product.locked.holding{opacity:1;background:#fffdf8}
.news.good{border-color:#0f766e;background:#f0fdf4}
.news-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.row{display:grid;grid-template-columns:1fr repeat(4,auto);gap:10px;align-items:center}
.log-box{margin-top:20px;max-height:200px;overflow-y:auto;background:#fafafa;padding:10px;border:1px solid #d8ded4;border-radius:8px;}
.log-item{font-size:13px;color:#475569;margin-bottom:4px;font-family:monospace;}
/* 자산 대시보드 */
.dash{display:grid;gap:12px}
.dash-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.dash-top small{color:#667085}
.dash-total{display:block;font-size:clamp(22px,5vw,28px);line-height:1.25;margin-top:4px;overflow-wrap:anywhere}
.dash-meta{display:flex;gap:6px;flex-wrap:wrap}
.trend{height:118px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:6px}
.trend svg{display:block;width:100%;height:100%}
.trend-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:100%;color:#94a3b8;font-size:12px;text-align:center;line-height:1.4}
/* 알림·토스트·모달 */
.bell{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:34px;margin-top:10px;background:#22303f;font-size:13px}
.badge{display:none;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#f7c948;color:#17202b;font-size:11px;font-weight:800}
.toast-wrap{position:fixed;right:14px;bottom:18px;display:grid;gap:8px;z-index:60;max-width:320px;max-height:calc(100vh - 36px);overflow:hidden}
.toast{background:#111827;color:#fff;border-left:5px solid #f7c948;border-radius:8px;padding:10px 12px;box-shadow:0 10px 24px #0003;font-size:13px;animation:toastIn .18s ease-out}
.toast b{color:#f7c948;display:block;margin-bottom:2px}
@keyframes toastIn{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.modal{position:fixed;inset:0;background:#0b1220aa;display:none;align-items:center;justify-content:center;z-index:70;padding:16px}
.modal.on{display:flex}
.modal-box{background:#fffdf8;border-radius:12px;max-width:580px;width:100%;max-height:86vh;overflow:auto;padding:18px;box-shadow:0 24px 60px #0005}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.modal-head h2{margin:0;font-size:20px}
.modal-close{background:#e7ebef;color:#18212f;min-height:34px;flex:0 0 auto;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px}
.kpi{border:1px solid #d8ded4;background:#fafafa;border-radius:8px;padding:10px}
.kpi small{display:block;color:#667085;font-size:12px}
.kpi b{display:block;margin-top:4px;font-size:16px;overflow-wrap:anywhere}
/* 종목 도구막대 */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input{flex:1 1 170px}
.toolbar select{flex:0 0 auto}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 12px;border-radius:9px;background:#e7ebef;color:#18212f;font-size:13px}
.chip.on{background:#17202b;color:#fff}
.card .star{background:transparent;color:#cbd5e1;font-size:20px;min-height:auto;padding:0 4px;line-height:1}
.card .star.on{color:#f7c948}
/* 성과·미션·자동화 */
.mission{display:grid;gap:6px;border-bottom:1px dashed #e2e8f0;padding:8px 0}
.mission:last-child{border-bottom:0}
.mission-top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.ach{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.ach div{border:1px solid #d8ded4;border-radius:8px;padding:8px 10px;font-size:12px;background:#fafafa}
.ach div.done{border-color:#0f766e;background:#f0fdf4}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:#334155;margin:4px 12px 4px 0}
.switch input{min-height:auto}
.inline-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;align-items:end}
.inline-form label{display:grid;gap:4px;font-size:12px;color:#667085}
.journal{display:grid;gap:6px;font-size:12px}
.journal div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed #e2e8f0;padding:5px 0}
.speed{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid #2b3a4d}
.speed button{min-height:30px;padding:0 9px;background:#22303f;font-size:12px}
.speed button.on{background:#f7c948;color:#17202b;font-weight:800}
.speed span{font-size:12px;color:#cbd5e1;margin-left:auto}
#bottomBar{display:none}
@media(max-width:850px){
  main{padding-bottom:158px}
  #bottomBar{display:block;position:fixed;left:0;right:0;bottom:0;z-index:50;background:#17202b;border-top:1px solid #2b3a4d;padding:6px 8px 8px;color:#e2e8f0}
  .bb-net{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;padding:0 6px 6px;border-bottom:1px solid #2b3a4d}
  .bb-net b{font-size:15px;color:#f7c948}
  .bb-net button{min-height:26px;padding:0 8px;background:#2b3a4d;font-size:12px;color:#e2e8f0}
  .bb-tools{display:flex;gap:6px;align-items:center;margin-left:auto}
  .bb-badge{display:none;margin-left:3px;font-size:11px;color:#f7c948;font-weight:800}
  .side .speed,.side .bell{display:none}
  .bb-nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
  .bb-nav button{background:transparent;color:#cbd5e1;font-size:12px;min-height:34px;white-space:nowrap;padding:0 4px}
  .bb-nav button.on{background:#f7c948;color:#17202b;font-weight:800}
  .toast-wrap{left:12px;right:12px;bottom:150px;max-width:none}
  .breaking{left:12px;right:12px;top:8px;transform:none;width:auto;max-width:none}
}
@media(max-width:540px){.kpis{grid-template-columns:1fr 1fr}.ach{grid-template-columns:1fr}.ach div{line-height:1.5}}
.alloc-bar{display:flex;height:14px;border-radius:999px;overflow:hidden;background:#edf2f7}
.alloc-bar span{display:block;height:100%}
.alloc-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:#475569}
.alloc-legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.dash-foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:#475569;border-top:1px dashed #e2e8f0;padding-top:10px}
.kv-row{grid-template-columns:1fr repeat(3,auto)}
.order-row{grid-template-columns:1fr repeat(3,auto)}
.app,main,.page,.panel,.section,.row{min-width:0}
.row{overflow-wrap:anywhere}
.rival-row{grid-template-columns:1fr auto auto auto;align-items:center}
@media(max-width:540px){.rival-row{grid-template-columns:1fr auto}.rival-row b{grid-column:1/-1}.rival-row button{grid-column:2;grid-row:2/4}}
@media(max-width:1200px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:850px){.app{grid-template-columns:minmax(0,1fr)}.side{min-width:0;height:auto;position:sticky;top:0;z-index:5;padding:12px 14px}.logo{font-size:18px}.sub{margin-bottom:10px;font-size:12px}.nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;overflow:visible;padding-bottom:0}.nav button{white-space:nowrap;min-height:34px;padding:0 8px;font-size:12px;background:#22303f}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.wide{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}.field{grid-template-columns:1fr}}
@media(max-width:540px){main{padding:14px;padding-bottom:158px}.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.stats .box:last-child{grid-column:1/-1}.head{display:block}.trade{grid-template-columns:1fr 1fr}.quick-trade{grid-template-columns:1fr 1fr 1fr}}
/* 인라인 4열 행이 모바일에서 화면을 밀어내지 않도록 클래스로 전환한 행 */
@media(max-width:850px){.kv-row,.order-row{grid-template-columns:1fr 1fr}}
@media(max-width:540px){.row,.kv-row,.order-row{grid-template-columns:1fr;gap:6px}.dash{padding:12px}.dash-foot{font-size:12px}}
.cloud-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.rank{display:grid;gap:6px;margin-top:8px}
.rank-row{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:7px 9px;border-radius:7px;background:#f5f8fa;font-size:13px}
.rank-row.me{background:#e7f5ef;font-weight:700}
.rank-row b{color:#0f766e}
.alt-card{border:1px solid #d8ded4;background:#fffdf8;border-radius:8px;padding:12px;margin-bottom:8px}
/* 노동 · 생계 */
#labor-section{scroll-margin-top:18px}
.labor-summary{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.labor-summary p{font-size:12px;margin-top:4px}
.labor-progress{margin-top:10px}
.labor-progress small{display:block;margin-top:4px;font-size:11px;color:#667085}
.labor-alert{background:#fee2e2;border:1px solid #fca5a5;color:#991b1b;border-radius:8px;padding:10px 12px;margin-top:10px;font-size:13px;line-height:1.5}
.labor-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
.labor-card{border:1px solid #d8ded4;background:#fafafa;border-radius:8px;padding:10px;display:grid;gap:6px;min-width:0}
.labor-card.locked{opacity:.62}
.labor-top{display:flex;justify-content:space-between;gap:6px;align-items:center;flex-wrap:wrap}
.labor-top b{font-size:14px}
.labor-card small{font-size:12px;color:#667085}
.labor-meta{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:#667085}
.labor-card button{min-height:34px;font-size:12px}
.labor-note{font-size:11px;color:#667085;margin-top:8px}
.labor-game{display:grid;gap:10px}
.labor-track{position:relative;height:38px;border-radius:8px;background:#e7ebef;border:1px solid #cbd5e1;overflow:hidden}
.labor-target{position:absolute;top:0;bottom:0;background:#bbf7d0}
.labor-target.perfect{background:#34d399}
.labor-cursor{position:absolute;top:0;bottom:0;width:4px;margin-left:-2px;background:#111827;border-radius:2px;box-shadow:0 0 0 2px #ffffffb3}
.labor-game-meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:#475569}
.labor-game-result{font-size:13px;font-weight:700;color:#334155;min-height:20px}
#labor-stop-btn{min-height:52px;font-size:16px}
body.dark .labor-track{background:#243447;border-color:#33465c}
body.dark .labor-game-meta,body.dark .labor-game-result{color:#cbd5e1}
#laborFab{position:fixed;left:20px;right:auto;bottom:18px;z-index:55;display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 15px;border-radius:999px;background:#f7c948;color:#17202b;font-weight:800;font-size:13px;box-shadow:0 6px 20px #0003;border:1px solid #d9a900}
#laborFab.urgent{background:#fee2e2;color:#991b1b;border-color:#fca5a5;box-shadow:0 0 0 4px #f7c94855,0 6px 20px #0003}
/* 노동 버튼은 화면 왼쪽 아래에 둡니다. 데스크톱에서는 사이드바 안쪽 빈 공간에 붙여
   카드의 매수·가입 버튼을 가리지 않고, 오른쪽 아래 알림 토스트와도 겹치지 않습니다. */
@media(min-width:851px){
  .side{display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:thin}
  #laborFab{position:static;left:auto;bottom:auto;margin-top:auto;justify-content:center;flex:0 0 auto}
}
/* 노트북처럼 세로가 짧은 화면에서는 사이드바를 촘촘하게 만들어 노동 버튼과 알림이 함께 보이게 합니다. */
@media(min-width:851px) and (max-height:700px){
  .side{padding:12px 20px}
  .logo{font-size:17px;margin-bottom:4px}
  .sub{font-size:11px;margin-bottom:10px}
  .nav{gap:5px}.nav button{min-height:30px;font-size:13px}
  .speed{margin-top:8px;padding-top:8px}
  .bell{margin-top:6px;min-height:30px}
}
@media(max-width:850px){#laborFab{left:12px;right:auto;bottom:104px;min-height:40px;padding:0 13px}#labor-section{scroll-margin-top:220px}}
.alt-top{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:4px}
.alt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px;margin-top:8px;font-size:12px}
.alt-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.grade-pill{border:1px solid currentColor;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:700}
.page.on{animation:fadeUp .26s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.modal.on .modal-box{animation:popIn .18s ease}
@keyframes popIn{from{transform:scale(.98);opacity:.6}to{transform:none;opacity:1}}
body.no-anim *{animation:none!important;transition:none!important}
body.dark{background:#0b131d;color:#e2e8f0}
body.dark .box,body.dark .card,body.dark .product,body.dark .news,body.dark .row,body.dark .panel,body.dark .section,body.dark .dash,body.dark .kpi,body.dark .journal,body.dark .log-box,body.dark .alt-card,body.dark .labor-card{background:#16202c;border-color:#2a3a4d;color:#e2e8f0}
body.dark .side{background:#080f18}
body.dark .pill{background:#243447;color:#dbe4ef}
body.dark p,body.dark small,body.dark .sub,body.dark .dash-foot{color:#9fb0c3}
body.dark input,body.dark select{background:#0f1a26;color:#e2e8f0;border-color:#33465c}
body.dark .modal-box{background:#101b27;color:#e2e8f0}
body.dark .product-grid div,body.dark .mini div{background:#0f1a26;border-color:#2a3a4d}
body.dark .toast{background:#1b2a3a;color:#e2e8f0}
body.dark .trend{background:#0f1a26;border-color:#2a3a4d}
body.dark .breaking{background:#060b12}
/* ── 2026 UI 리디자인: 금융 대시보드 ───────────────────────── */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#f8fafc; --ink:#101828; --muted:#667085;
  --line:#e4e8ee; --accent:#0f766e; --accent-2:#0b5f59; --gold:#f2c14e; --navy:#0c1523;
  --danger:#b42318; --radius:12px;
}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.app{grid-template-columns:244px minmax(0,1fr)}
.side{background:linear-gradient(180deg,#0c1523 0%,#111f31 100%);padding:20px 16px;border-right:1px solid #17263a;gap:0}
.logo{font-size:18px;letter-spacing:-.02em;margin-bottom:6px;color:#fff}
.sub{font-size:12px;color:#93a3b8;line-height:1.5;margin-bottom:18px}
.nav{gap:4px}
.nav button{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 10px;border-radius:9px;background:transparent;color:#c6d2e1;font-size:13px;font-weight:600;text-align:left;transition:background .15s,color .15s}
.nav button i{width:20px;text-align:center;font-style:normal;font-size:14px;color:#8296ad}
.nav button:hover{background:#1a2a3d;color:#fff}
.nav button.on{background:var(--gold);color:#15202e}
.nav button.on i{color:#15202e}
.side-status{display:flex;align-items:center;gap:8px;margin-top:auto;padding:12px 4px 4px;border-top:1px solid #1e2e42;color:#c6d2e1;font-size:12px}
.side-status span{background:#1a2a3d;border:1px solid #27384e;border-radius:999px;padding:4px 9px;font-weight:700}
.bell{background:#1a2a3d;border:1px solid #27384e;color:#e6edf6;min-height:34px;font-size:12px;margin-top:8px;justify-content:center}
#laborFab{background:var(--gold);border:0;color:#15202e;font-weight:800;box-shadow:none;margin-top:8px;border-radius:9px;min-height:42px;width:100%}
#laborFab:hover{background:#ffd166}
main{padding:26px 30px 44px;min-width:0}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.page-head h1{font-size:26px;letter-spacing:-.03em;margin:2px 0 4px}
.page-head p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.eyebrow{font-size:10px;letter-spacing:.14em;color:var(--accent);font-weight:800}
.page-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel,.box,.card,.product,.news,.row,.dash{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 1px 2px #1018280a}
.panel{padding:18px}
.section{margin-top:18px}
.section h3{font-size:14px;margin:0 0 10px;letter-spacing:-.01em}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.section-head h3{margin:0}
.sub-title{font-size:14px;margin:16px 0 8px}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px}
.stats.hidden{display:none}
.box{padding:14px 16px}
.box small{font-size:11px;letter-spacing:.02em;color:var(--muted)}
.box b{font-size:20px;margin-top:6px;letter-spacing:-.02em;overflow-wrap:anywhere}
button{min-height:38px;border-radius:8px;font-weight:650;font-size:13px;padding:0 14px;transition:background .15s,transform .06s,opacity .15s}
button:active{transform:translateY(1px)}
button.small,.ghost.small{min-height:30px;padding:0 10px;font-size:12px;border-radius:7px}
.buy{background:var(--accent)}.buy:hover{background:var(--accent-2)}
.sell{background:var(--danger)}.sell:hover{background:#971b12}
.ghost{background:#eef1f5;color:#26364a;border:1px solid var(--line)}.ghost:hover{background:#e4e9ef}
input,select{min-height:40px;border:1px solid #d5dbe3;border-radius:8px;background:#fff;padding:0 11px;font-size:13px;color:var(--ink)}
input:focus,select:focus{outline:2px solid #f2c14e66;border-color:#c9a53d}
.pill{background:#f1f4f7;border:1px solid #e4e8ee;color:#475467;font-size:11px;font-weight:650;padding:5px 9px}
.notice{background:#f8fafc;border:1px solid var(--line);color:#475467;font-size:12px;border-radius:10px;padding:11px 13px;margin-bottom:12px}
.market-day{background:#eaf6ff;border-color:#bae6fd;color:#0b4a6f;font-weight:700;line-height:1.45;padding:8px 11px;word-break:keep-all;overflow-wrap:break-word}
.toast.toast-ipo{cursor:pointer;border-left-color:#38bdf8}
.toast.toast-ipo b{color:#7dd3fc}
.breaking{border-radius:10px;border-left:4px solid var(--gold);box-shadow:none;padding:12px 14px;font-size:13px}
.page.on{animation:fadeUp .18s ease}
.subtabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);margin:0 0 14px;padding-bottom:2px}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:0 0 auto;min-height:36px;padding:0 13px;background:transparent;color:var(--muted);border-radius:8px 8px 0 0;font-size:13px;border-bottom:2px solid transparent}
.subtabs button:hover{background:#eef2f6;color:var(--ink)}
.subtabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:800;background:transparent}
.atab-panel[hidden]{display:none}
.kpi-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;display:flex;flex-direction:column;gap:5px}
.metric small{font-size:11px;color:var(--muted);font-weight:650}
.metric b{font-size:22px;letter-spacing:-.03em;overflow-wrap:anywhere}
.metric .delta{font-size:11px;color:var(--muted)}
.dash{padding:18px}
.dash-total{font-size:30px;letter-spacing:-.04em}
.trend{height:150px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px}
.alloc-legend{font-size:11px;color:var(--muted);gap:10px}
.dash-foot{font-size:11px;color:var(--muted);border-top:1px solid var(--line)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.breakdown{display:grid;gap:6px}
.breakdown-row{display:grid;grid-template-columns:1fr auto 14px;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 14px;background:var(--surface);border:1px solid var(--line);border-radius:9px;color:var(--ink);font-size:13px;text-align:left}
.breakdown-row:hover{background:#f7fafc;border-color:#cfd8e3}
.breakdown-row b{font-size:14px}.breakdown-row i{font-style:normal;color:#98a2b3}
.market-snap{display:grid;gap:2px;padding:8px 18px}
.snap-row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:13px}
.snap-row:last-child{border-bottom:0}.snap-row span{color:var(--muted)}
.holding-row{display:grid;grid-template-columns:1.5fr repeat(3,minmax(90px,1fr));gap:12px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line);font-size:12px;min-width:0}
.holding-row:last-child{border-bottom:0}
.holding-row>div,.holding-row>span{min-width:0;overflow-wrap:anywhere}
.holding-row small{display:block;color:var(--muted);font-size:11px;margin-bottom:2px}
.holding-row b{font-size:13px}
.holding-row.compact{grid-template-columns:1.4fr 1fr 1fr auto;padding:9px 0}
.holding-main b{font-size:14px}
.stack{display:grid;gap:0}
.asset-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:12px}
.asset-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:12px}
.asset-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.asset-head b{font-size:15px}.asset-head small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.asset-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;color:var(--muted)}
.asset-grid b{display:block;color:var(--ink);font-size:13px;margin-top:2px}
.button-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.qty-input{width:80px;min-height:38px}
.empty-state{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:18px 4px;color:var(--muted)}
.empty-state b{color:var(--ink);font-size:14px}.empty-state p{margin:0;font-size:12px;max-width:420px}
.empty-state.small{padding:12px 4px}
.muted-sm{color:var(--muted);font-size:12px;line-height:1.5}
.news-feed{display:grid;gap:0}
.news-line{padding:11px 0;border-bottom:1px dashed var(--line);font-size:13px;line-height:1.6}
.news-line:last-child{border-bottom:0}
.settings-section{margin-top:20px}
.settings-section h3{font-size:14px;margin:0 0 8px}
.setting-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:13px 0;border-bottom:1px solid var(--line)}
.setting-row:last-child{border-bottom:0}
.setting-copy b{display:block;font-size:13px}.setting-copy small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.setting-control{flex:0 0 auto;display:flex;gap:6px;align-items:center}
.toggle{position:relative;display:inline-flex;width:42px;height:24px;flex:0 0 auto}
.toggle input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
.toggle span{width:100%;height:100%;background:#d5dbe3;border-radius:999px;transition:background .15s}
.toggle span::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px #0002}
.toggle input:checked+span{background:var(--accent)}
.toggle input:checked+span::after{transform:translateX(18px)}
.notify-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.notify-toggle{display:flex;align-items:center;gap:8px;font-size:12px;color:#344054;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:42px}
.notify-toggle input{min-height:auto;width:16px;height:16px;accent-color:var(--accent)}
.seg{display:inline-flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border-radius:0;background:transparent;color:var(--muted);min-height:36px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff}
.speed-seg button{min-width:52px;font-weight:800}
.rebirth-btn{background:linear-gradient(135deg,#0f766e,#0b5f59);color:#fff;min-height:44px;padding:0 20px;font-size:14px;box-shadow:0 6px 18px #0f766e33}
.rebirth-btn:disabled{background:#cfd8e3;color:#667085;box-shadow:none}
.rebirth-hero{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:linear-gradient(135deg,#0c1523,#17293d);border-radius:14px;padding:18px;color:#fff}
.rebirth-hero div{display:flex;flex-direction:column;gap:5px}
.rebirth-hero small{color:#93a3b8;font-size:11px}.rebirth-hero b{font-size:20px;letter-spacing:-.02em}
.preview-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.preview-grid div{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.preview-grid small{display:block;color:var(--muted);font-size:11px;margin-bottom:3px}.preview-grid b{font-size:12px;line-height:1.45}
.upgrade-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.upgrade-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:8px}
.upgrade-card.maxed{border-color:#b7e4cf;background:#f7fdf9}
.upgrade-head{display:flex;justify-content:space-between;gap:8px;align-items:center}
.upgrade-head b{font-size:13px}
.upgrade-card p{margin:0;font-size:12px;color:var(--muted);line-height:1.5;min-height:34px}
.upgrade-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--accent)}
.company-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}
.company-head h2{margin:8px 0 0;font-size:20px}
.company-value{text-align:right}.company-value small{display:block;color:var(--muted);font-size:11px}.company-value b{font-size:20px}
.file-label{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 14px;border-radius:8px;font-size:13px;font-weight:650;cursor:pointer}
.file-label input{display:none}
.field-label{display:grid;gap:5px;font-size:12px;color:var(--muted)}
.check{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:#344054;min-height:38px}
.check input{min-height:auto;width:16px;height:16px;accent-color:var(--accent)}
.inline-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:end}
.inline-form label{display:grid;gap:4px;font-size:11px;color:var(--muted)}
kbd{background:#eef2f6;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:11px}
.modal-box{max-width:620px;border-radius:14px;padding:20px;max-height:88vh}
.modal-head h2{font-size:19px}
.modal-close{background:#eef1f5;color:#26364a}
.toast{background:#0c1523;border-left:3px solid var(--gold);border-radius:10px;font-size:12px}
.toast-wrap{max-width:340px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.kpi{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:11px}
.kpi small{font-size:11px}.kpi b{font-size:15px;margin-top:3px}
.toolbar input{min-height:40px}
.chip{background:#eef1f5;border:1px solid var(--line);min-height:40px}
.chip.on{background:var(--ink);border-color:var(--ink)}
.stats .box b{font-variant-numeric:tabular-nums}
.dash-total,.metric b,.holding-row b,.kpi b{font-variant-numeric:tabular-nums}
.mission-top small{color:var(--muted)}
.bar{background:#edf1f5;height:7px}
.journal{font-size:12px}
.log-box{max-height:230px;background:var(--surface-2);border-color:var(--line)}
body.dark{--bg:#0a121c;--surface:#121d2a;--surface-2:#0f1a26;--ink:#e6edf6;--muted:#94a6ba;--line:#243447}
body.dark .panel,body.dark .box,body.dark .card,body.dark .product,body.dark .news,body.dark .row,body.dark .dash,body.dark .asset-card,body.dark .metric,body.dark .upgrade-card,body.dark .settings-section .panel{background:var(--surface);border-color:var(--line)}
body.dark .notice,body.dark .kpi,body.dark .preview-grid div,body.dark .notify-toggle,body.dark .log-box,body.dark .trend,body.dark .breakdown-row,body.dark .holding-row{background:var(--surface-2);border-color:var(--line)}
body.dark .subtabs button:hover,body.dark .ghost{background:#1b2a3a;color:#dbe4ef;border-color:var(--line)}
body.dark input,body.dark select{background:#0f1a26;border-color:#2a3a4d;color:#e6edf6}
body.dark .toast{background:#1b2a3a}
body.no-effects *{box-shadow:none!important}
@media(max-width:1200px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:980px){.two-col{grid-template-columns:1fr}.side{width:auto}}
@media(max-width:850px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;z-index:40;height:auto;display:block;padding:10px 14px 8px;border-right:0;border-bottom:1px solid #1e2e42}
  .logo{font-size:16px;margin:0 0 2px}
  .sub{display:none}
  .nav{display:flex;gap:6px;overflow-x:auto;padding:8px 34px 4px 0;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav button{flex:0 0 auto;min-height:34px;padding:0 11px;gap:5px;background:#182738;color:#c6d2e1;border-radius:999px;font-size:12px}
  .nav button i{display:none}
  .nav button.on{background:var(--gold);color:#15202e}
  .side-status{display:none}
  .side .bell{display:none}
  main{padding:16px 14px 150px}
  #laborFab{display:none}
  .page-head h1{font-size:22px}
  .page-head{align-items:flex-start;gap:8px}
  .stats{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .stats::-webkit-scrollbar{display:none}
  .stats .box{flex:0 0 150px;padding:11px 12px}
  .stats .box b{font-size:16px}
  .kpi-strip{grid-template-columns:1fr 1fr}
  .metric b{font-size:18px}
  .holding-row{grid-template-columns:1fr 1fr;gap:8px}
  .holding-main{grid-column:1/-1}
  .holding-row.compact{grid-template-columns:1fr auto;gap:6px}
  .holding-row.compact b:first-child{grid-column:1/-1}
  .two-col{grid-template-columns:1fr}
  .setting-row{flex-direction:column;align-items:flex-start;gap:8px}
  .setting-control{width:100%}
  .setting-control select,.setting-control .seg{width:100%}
  .setting-control .seg button{flex:1}
  .notify-grid{grid-template-columns:1fr 1fr}
  .upgrade-grid{grid-template-columns:1fr}
  .rebirth-hero{grid-template-columns:1fr 1fr;padding:14px}
  .rebirth-hero b{font-size:17px}
  .preview-grid{grid-template-columns:1fr}
  .asset-cards{grid-template-columns:1fr}
  .modal-box{max-height:92vh}
  .modal-box .notify-grid{grid-template-columns:1fr 1fr;gap:6px}
  .modal-box .notify-toggle{font-size:11px;padding:7px 8px;min-height:38px}
  .toast-wrap{left:12px;right:12px;bottom:150px;max-width:none}
  .breaking{left:12px;right:12px;top:8px;transform:none;width:auto;max-width:none}
}
@media(max-width:360px){
  .nav{flex-wrap:wrap;overflow:visible;gap:4px;padding-right:0}
  .nav button{min-height:30px;padding:0 8px;font-size:11px}
  .speed-seg{display:flex;width:100%}
  .speed-seg button{flex:1 1 0;min-width:0;padding:0 2px;font-size:12px}
  .subtabs{flex-wrap:wrap;overflow:visible;gap:2px;padding-bottom:4px}
  .subtabs button{min-height:32px;padding:0 8px;font-size:11px;border-radius:6px;border-bottom:0}
  .subtabs button.on{background:#e7f3f1;color:var(--accent);border-bottom:0}
  .bb-nav{gap:2px}
  .bb-nav button{font-size:11px;padding:0 1px}
  .bb-net{font-size:11px;gap:4px;padding-left:2px;padding-right:2px}
  .bb-net b{font-size:14px}
  .bb-tools{gap:3px}
  .bb-net button{padding:0 5px;min-height:26px}
}
@media(max-width:540px){
  .stats{grid-template-columns:1fr 1fr}
  .stats .box:last-child{grid-column:1/-1}
  .kpi-strip{grid-template-columns:1fr 1fr}
  .rebirth-hero{grid-template-columns:1fr 1fr}
  .notify-grid{grid-template-columns:1fr}
  .subtabs button{padding:0 10px}
}
/* ── 수급 · 실적 캘린더 · 리스크 · 챌린지 · 모바일 거래 ── */
.flow-line{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:#667085;min-width:0}
.flow-line span{white-space:nowrap}
.flow-line b{font-variant-numeric:tabular-nums;color:#334155}
.intel-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:8px;margin-top:8px}
.intel-row{display:flex;justify-content:space-between;gap:8px;border:1px solid #e4e8ee;border-radius:8px;padding:8px 9px;min-width:0;font-size:12px}
.intel-row b{overflow-wrap:anywhere}
.calendar-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;border-bottom:1px dashed #e4e8ee;padding:8px 0;font-size:12px;min-width:0}
.calendar-row:last-child{border-bottom:0}
.calendar-row b{overflow-wrap:anywhere}
.disclosure{padding:8px 0;border-bottom:1px dashed #e4e8ee;font-size:12px;line-height:1.55}
.disclosure:last-child{border-bottom:0}
.disclosure small{display:block;color:#667085;margin-top:2px}
.tax-lots{display:grid;gap:6px;margin-top:8px}
.lot-row{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,auto);gap:8px;align-items:center;border:1px solid #e4e8ee;border-radius:8px;padding:8px 9px;font-size:12px;min-width:0}
.lot-row b{overflow-wrap:anywhere}
.tax-account-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(160px,100%),1fr));gap:8px;margin-top:10px}
@media(max-width:520px){
  .section-head.tax-sec-head{flex-wrap:wrap;align-items:flex-start;gap:4px}
  .section-head.tax-sec-head h3{flex:1 1 100%}
  .section-head.tax-sec-head .pill{max-width:100%;white-space:normal}
}
.tax-account-card{border:1px solid #e4e8ee;border-radius:9px;padding:10px;display:grid;gap:5px;min-width:0;background:#fafafa;font-size:12px}
.tax-account-card.on{border-color:#0f766e;background:#f0fdf4}
.tax-account-card small{display:block;color:#667085;font-size:10px}
.tax-account-card b,.tax-account-card span{overflow-wrap:anywhere}

// 예) 1,000원 → -30% = 700원, 다음 날 변동률은 700원을 기준으로 적용됩니다.
const MARKET_DAY_SECONDS=600;
function marketDayIndex(sec){ return Math.floor(Math.max(0,Number.isFinite(+sec)?+sec:0)/MARKET_DAY_SECONDS); }
function marketDayNumber(){ return marketDayIndex(state.marketSeconds)+1; }
// 이번 하루가 끝날 때까지 남은 게임 초(방금 시작한 날은 600초입니다).
function marketDaySecondsLeft(){
  const sec=Math.max(0,+state.marketSeconds||0);
  const mod=sec%MARKET_DAY_SECONDS;
  return mod===0?MARKET_DAY_SECONDS:MARKET_DAY_SECONDS-mod;
}
function clockText(sec){
  const total=Math.max(0,Math.round(+sec||0));
  const m=Math.floor(total/60), s=total%60;
  return m?`${m}분 ${s}초`:`${s}초`;
}
// 주식 화면 상단에 지금 며칠째인지와 다음 날까지 남은 실제 시간을 보여 줍니다.
function marketDayText(){
  const offer=state.ipo&&state.ipo.offer;
  const tail=offer?` · 📢 ${offer.name} 청약 중`:"";
  const clock=`다음 날까지 실제 ${clockText(realSeconds(marketDaySecondsLeft()))} (${speedNow()}x)`;
  return `📅 ${marketDayNumber()}일차 · ${clock}${state.paused?" · 일시정지":""}${tail}`;
}
function marketDayBarHTML(){ return `<div class="notice market-day" data-market-day>${marketDayText()}</div>`; }

function dayChangePct(s){
  const base=(+s.prevClose>0)?+s.prevClose:(+s.start>0?s.start:1);
  return (s.price-base)/base;
}
// 전일 종가 기준 ±30%를 넘지 않도록 가격을 자릅니다. 국내 주식은 1원 단위로 맞춰
// 호가 단위 반올림 때문에 상한·하한을 살짝 넘는 일도 막습니다.
function clampDailyPrice(s,v){
  const prev=(+s.prevClose>0)?+s.prevClose:((+s.price>0)?+s.price:(+s.start>0?s.start:1));
  const foreign=["foreign","mega","special"].includes(s.group);
  const floor=foreign?0.01:1;
  const lo=Math.max(floor,prev*(1-MAX_DAILY_MOVE));
  const hi=Math.max(lo,prev*(1+MAX_DAILY_MOVE));
  const target=Math.min(hi,Math.max(lo,Number.isFinite(+v)?+v:lo));
  if(foreign) return Math.min(hi,Math.max(lo,Math.round(target*100)/100));
  return Math.max(1,Math.min(hi,Math.round(target)));
}
// 국내 주식 호가 단위: 가격이 낮아질수록 촘촘하게 해 복리 하락이 반올림으로 멈추지 않게 합니다.
function domesticTickSize(price){
  if(price>=10000) return 100;
  if(price>=1000) return 10;
  return 1;
}
// 시작가 대비 하한·상한을 두지 않습니다. 복리 하락/상승이 계속 이어지고,
// 0원이 되지 않도록 최소 1원(해외 0.01달러)만 지킵니다.
function clampStockPrice(s,v){
  const raw=(Number.isFinite(+v)&&+v>0)?+v:1;
  const p=Math.min(1e12,raw); // 사실상 무제한. 숫자 폭주만 막는 안전 상한입니다.
  if(["foreign","mega","special"].includes(s.group)) return Math.max(0.01,Math.round(p*100)/100);
  const tick=domesticTickSize(p);
  return Math.max(1,Math.round(p/tick)*tick);
}
// 그날 시장 전체에 적용되는 변동률(경기·금리·이벤트 반영).
// 장기 보유 보상이 너무 낮지 않도록 시장 자체에 완만한 우상향 드리프트를 둡니다.
function dailyMarketReturn(){
  const e=state.economy||{};
  const phase=e.phase==="호황"?1:e.phase==="불황"?-1:0;
  let r=(Math.random()-.48)*.06 + .0018;
  r += phase*.006;
  r += ((Number.isFinite(+e.gdpGrowth)?+e.gdpGrowth:.02)-.02)*.6;
  r -= ((Number.isFinite(+e.baseRate)?+e.baseRate:.03)-.03)*.8;
  if(state.currentEvent==="AI_BOOM") r+=.015;
  if(state.currentEvent==="SEMI_STRONG") r+=.01;
  if(state.currentEvent==="MARKET_CRASH") r-=.03;
  if(state.currentEvent==="BUBBLE_SHOCK") r-=.015;
  return Math.max(-.3,Math.min(.3,r));
}
// 종목별 하루 변동률: 시장 변동 + 종목 고유 성장 드리프트 + 변동성 + 가끔 뉴스성 급등·급락
function dailyStockReturn(s, marketR){
  const dayVol=Math.max(.015,Math.min(.12,.02+(+s.vol||.02)*2.2));
  const trend=Math.max(0,Math.min(.0025,+s.drift||0));
  let r=marketR + .0015 + trend*.7 + (Math.random()-.485)*2*dayVol;
  if(Math.random()<.05) r += (Math.random()<.5?-1:1)*(.06+Math.random()*.14);
  return Math.max(-MAX_DAILY_MOVE,Math.min(MAX_DAILY_MOVE,r));
}

// anchor는 아주 천천히 움직이는 환율 추세선입니다(완만한 추세용).
const fx={usd:START_FX, anchor:START_FX};
const $=id=>document.getElementById(id);
const wonFull=n=>Math.round(n).toLocaleString("ko-KR")+"원";
// 큰 금액을 좁은 화면에서도 읽히게 요약합니다(1.2억원 · 3.4조원).
const wonShort=n=>{
  const a=Math.abs(n);
  if(a>=1e12) return (n/1e12).toFixed(2).replace(/\.?0+$/,"")+"조원";
  if(a>=1e8) return (n/1e8).toFixed(a>=1e10?0:1).replace(/\.0$/,"")+"억원";
  if(a>=1e4) return Math.round(n/1e4).toLocaleString("ko-KR")+"만원";
  return wonFull(n);
};
// 설정의 숫자 표시 방식을 모든 화면에 동일하게 적용합니다.
const won=n=>(state.settings&&state.settings.numberFormat==="short")?wonShort(n):wonFull(n);
const usdStr=n=>n.toFixed(2)+" USD";
const pct=n=>(n>=0?"+":"")+(n*100).toFixed(2)+"%";

// ── 자산 계산(모든 화면 공통) ──────────────────────────────────
function stockValueKRW(){
  return stocks.reduce((sum,s)=>sum + (isForeignStock(s) ? s.price*s.own*fx.usd : s.price*s.own), 0);
}
function productValueKRW(){ return products.reduce((a,p)=>a+p.amount, 0); }
// 총자산 = 현금 + 달러 환산액 + 주식 평가액 + 금융상품 평가액 + 부동산 + 실물자산 + 기업 가치
function grossAssetsKRW(){ return (state.cash||0) + (state.usd||0)*fx.usd + stockValueKRW() + productValueKRW() + estateValue() + metalValue() + companyValue() + bondValueKRW() + shortValueKRW(); }
// 순자산 = 총자산 - 부채(대출)
function netAssetsKRW(){ return grossAssetsKRW() - (state.loan||0); }
// 기존 함수 이름은 순자산 기준으로 유지합니다(등급·목표·랭킹 공통).
function totalAssetsKRW(){ return netAssetsKRW(); }

// ── 환생(영구 성장) ─────────────────────────────────────────
function ensureRebirth(){
  if(!state.rebirth || typeof state.rebirth!=="object") state.rebirth={count:0,points:0,spent:0,upgrades:{},bestNet:0,history:[],notified:false};
  const r=state.rebirth;
  r.count=Math.max(0,Math.floor(+r.count||0));
  r.points=Math.max(0,Math.floor(+r.points||0));
  r.spent=Math.max(0,Math.floor(+r.spent||0));
  r.bestNet=Math.max(0,+r.bestNet||0);
  if(!r.upgrades || typeof r.upgrades!=="object" || Array.isArray(r.upgrades)) r.upgrades={};
  REBIRTH_UPGRADES.forEach(u=>{ r.upgrades[u.id]=Math.max(0,Math.min(u.max,Math.floor(+r.upgrades[u.id]||0))); });
  if(!Array.isArray(r.history)) r.history=[];
  r.notified=!!r.notified;
  return r;
}
function rebirthLevel(id){
  const r=ensureRebirth(), u=REBIRTH_UPGRADES.find(x=>x.id===id);
  if(!u) return 0;
  return Math.max(0,Math.min(u.max,Math.floor(+r.upgrades[id]||0)));
}
function rebirthCost(id){
  const u=REBIRTH_UPGRADES.find(x=>x.id===id); if(!u) return Infinity;
  const lv=rebirthLevel(id);
  if(lv>=u.max) return Infinity;
  return u.base + u.step*lv;
}
function rebirthPointsFor(net){
  const v=Math.max(0,+net||0);
  if(v<REBIRTH_MIN) return 0;
  return Math.max(1,Math.floor(Math.sqrt(v/10000000)));
}
function rebirthEarnedPoints(){ return rebirthPointsFor(Math.max(totalAssetsKRW(),ensureRebirth().bestNet||0)); }
function canRebirth(){ return totalAssetsKRW()>=REBIRTH_MIN; }
function rebirthStartCash(){ return START_CASH + 2000000*rebirthLevel("start"); }
function rebirthBonus(id, per){ return 1 + per*rebirthLevel(id); }
function stockFeeRate(){ return FEE_STOCK*(1-0.1*rebirthLevel("fee")); }
function tradeTaxRate(){ return TAX_TRADE*(1-0.1*rebirthLevel("fee")); }
// 주식 감각 업그레이드: 매도 실현이익의 일정 비율을 원화 현금으로 추가 지급합니다(이익이 날 때만).
function creditStockBonus(profitKRW){
  const bonus=Math.max(0,+profitKRW||0)*0.02*rebirthLevel("stock");
  if(bonus>0) state.cash=(state.cash||0)+bonus;
  return bonus;
}
// ── 부동산·실물자산·기업 가치 ─────────────────────
function estatePrice(id){ const d=ESTATES.find(x=>x.id===id); return (state.altPrices && Number.isFinite(state.altPrices[id])) ? state.altPrices[id] : (d?d.price:0); }
function estateValue(){ return ESTATES.reduce((a,e)=>a + (state.estate&&state.estate[e.id]?state.estate[e.id].qty:0)*estatePrice(e.id),0); }
function metalPrice(id){ const d=METALS.find(x=>x.id===id); return (state.altPrices && Number.isFinite(state.altPrices[id])) ? state.altPrices[id] : (d?d.price:0); }
function metalValue(){ return METALS.reduce((a,m)=>a + ((state.metals&&state.metals[m.id]?state.metals[m.id].qty:0)||0)*metalPrice(m.id),0); }
function companyValue(){
  const c=state.company; if(!c) return 0;
  // 상장해 지분을 팔았으면 내가 가진 지분만큼만 내 자산입니다.
  const own=c.listed?Math.max(0,Math.min(100,+c.listed.ownPct||0))/100:1;
  return Math.max(0,+c.valuation||0)*own;
}
// 공매도 평가손익: 진입가와 현재가의 차이(주식을 빌려 판 뒤 되사야 하므로 가격이 오르면 손실).
function shortValueKRW(){
  return (Array.isArray(state.shorts)?state.shorts:[]).reduce((a,p)=>{
    const s=stock(p.stockId); if(!s) return a;
    return a + (p.entry - s.price) * p.qty * (isForeignStock(s)?fx.usd:1);
  },0);
}
// 금리연동 채권 가격: 기준금리가 내려가면 오르고, 올라가면 내려갑니다.
function bondUnitPrice(){
  const rate=Math.max(.005,(state.economy&&+state.economy.baseRate)||.03);
  return Math.round(Math.max(60000,Math.min(200000,BOND.face*(.045/rate))));
}
function bondValueKRW(){ const b=state.bonds||{}; return Math.max(0,+b.qty||0)*bondUnitPrice(); }
function currentTitle(){ return TITLES[currentGrade()]||TITLES["브론즈"]; }
function currentGrade(){
  const total=totalAssetsKRW();
  // 8단계 등급을 높은 순서로 비교해, 자산이 늘었는데 낮은 등급이 보이는 오류를 막습니다.
  for(let i=GRADES.length-1;i>=0;i--){
    if(total >= GRADE_FLOORS[GRADES[i]]) return GRADES[i];
  }
  return "브론즈";
}
function nextGradeInfo(){
  const i=gradeIndex(currentGrade());
  if(i>=GRADES.length-1) return null;
  const next=GRADES[i+1];
  return {grade:next, remain:Math.max(0, GRADE_FLOORS[next]-totalAssetsKRW())};
}

// ── 시장 지수 · 관심종목 ─────────────────────────────
function marketIndex(){
  const list=stocks.filter(s=>!isIndexFund(s));
  if(!list.length) return 1000;
  return 1000*list.reduce((a,s)=>a+s.price/s.start,0)/list.length;
}
const stockView={query:"",sort:"default",watchOnly:false};
const SORT_OPTIONS=[["default","기본 순서"],["name","이름순"],["price","가격 높은순"],["change","등락 높은순"],["own","보유 많은순"]];
const isWatched=id=>(state.watch||[]).includes(id);
const stockPriceKRW=s=>s.price*(isForeignStock(s)?fx.usd:1);

function toggleWatch(id){
  if(!Array.isArray(state.watch)) state.watch=[];
  state.watch=isWatched(id)?state.watch.filter(x=>x!==id):[...state.watch,id];
  saveGame();
  ["domestic","foreign","mega","special","watch"].forEach(g=>{ if($("grid-"+g)) applyStockView(g); });
  update();
}

function visibleStocks(group){
  let list=group==="watch"?stocks.filter(s=>isWatched(s.id)):stocks.filter(s=>s.group===group);
  const q=(stockView.query||"").trim().toLowerCase();
  if(q) list=list.filter(s=>`${s.name} ${s.ticker} ${s.theme} ${s.market}`.toLowerCase().includes(q));
  if(stockView.watchOnly) list=list.filter(s=>isWatched(s.id));
  if(stockView.sort==="name") list.sort((a,b)=>a.name.localeCompare(b.name,"ko"));
  else if(stockView.sort==="price") list.sort((a,b)=>stockPriceKRW(b)-stockPriceKRW(a));
  else if(stockView.sort==="change") list.sort((a,b)=>dayChangePct(b)-dayChangePct(a));
  else if(stockView.sort==="own") list.sort((a,b)=>b.own-a.own);
  return list;
}
function applyStockView(group){
  const box=$("grid-"+group); if(!box) return;
  const list=visibleStocks(group);
  box.innerHTML=list.length?list.map(s=>card(s,group)).join("")
    :`<div class="row" style="grid-template-columns:1fr"><b>조건에 맞는 종목이 없습니다</b><span>검색어를 지우거나 필터를 해제해 보세요.</span></div>`;
  const count=$("count-"+group); if(count) count.textContent=list.length+"개";
}

// ── 알림 · 토스트 · 모달 ─────────────────────────────
let audioCtx=null;
function beep(kind){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type="sine"; o.frequency.value=kind==="goal"?880:kind==="dividend"?660:520;
    g.gain.value=0.05;
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+0.12);
  }catch(e){}
}
const notifySeen={};
function notify(kind,title,text){
  const n=state.notify||{};
  if(n.master===true) return;      // 모든 알림 끄기
  if(n[kind]===false) return;      // 종류별 끄기
  if(n.toast===false && n.center===false) return; // 둘 다 끄면 기록도 토스트도 남기지 않습니다.
  // 같은 이벤트가 짧은 간격으로 반복되면 토스트·알림을 한 번만 남깁니다.
  const dedupeKey=kind+"|"+title+(kind==="stock"?"|"+(text||"").slice(0,24):"");
  const now=Date.now();
  if(notifySeen[dedupeKey] && now-notifySeen[dedupeKey]<15000) return;
  notifySeen[dedupeKey]=now;
  if(n.center!==false){
    if(!Array.isArray(state.alerts)) state.alerts=[];
    state.alerts.unshift({at:Date.now(),kind,title,text,read:false});
    if(state.alerts.length>40) state.alerts.pop();
    updateBell();
  }
  if(n.toast!==false) showToast(title,text);
  if(n.sound) beep(kind);
  if(n.haptic && typeof navigator!=="undefined" && navigator.vibrate) navigator.vibrate(25);
}
function toastDurationMs(){
  return Math.max(2000,Math.min(8000,Math.round(+((state.notify||{}).toastMs)||4200)));
}
function toastLimit(){
  return Math.max(1,Math.min(5,Math.round(+((state.notify||{}).toastMax)||3)));
}
function showToast(title,text,opts){
  const wrap=$("toastWrap"); if(!wrap || typeof wrap.appendChild!=="function") return;
  const el=document.createElement("div");
  el.className="toast"+((opts&&opts.className)?" "+opts.className:"");
  el.innerHTML=`<b>${title}</b>${text||""}`;
  if(opts&&typeof opts.onClick==="function"){
    el.onclick=opts.onClick;
    el.style.cursor="pointer";
    if(typeof el.setAttribute==="function") el.setAttribute("role","button");
  }
  wrap.appendChild(el);
  // 설정한 개수만 보여 줍니다(넘치면 오래된 토스트부터 사라집니다).
  // 공모주처럼 놓치면 안 되는 알림은 다른 토스트에 밀리지 않도록 마지막에 지웁니다.
  const limit=toastLimit();
  while(wrap.children && wrap.children.length>limit){
    let victim=null;
    for(let i=0;i<wrap.children.length;i++){
      const c=wrap.children[i];
      const pinned=c&&String(c.className||"").split(/\s+/).includes("toast-ipo");
      if(!pinned){ victim=c; break; }
    }
    if(!victim) break; // 공모주 알림만 남아 있으면 일반 알림을 잠시 보류합니다.
    wrap.removeChild(victim);
  }
  const ms=(opts&&Number.isFinite(+opts.durationMs))?Math.max(2000,Math.min(20000,+opts.durationMs)):toastDurationMs();
  setTimeout(()=>{ try{ wrap.removeChild(el); }catch(e){} },ms);
}
// 알림 설정과 관계없이 반드시 보여 주는 알림입니다(공모주 청약처럼 놓치면 참여 기회가 사라지는 이벤트).
// 토스트는 fixed 오버레이라 문서 흐름을 밀지 않고, 누르면 해당 화면으로 이동합니다.
function notifyAlways(title,text,opts){
  const n=state.notify||{};
  if(n.center!==false){
    if(!Array.isArray(state.alerts)) state.alerts=[];
    state.alerts.unshift({at:Date.now(),kind:"system",title,text,read:false});
    if(state.alerts.length>40) state.alerts.pop();
    updateBell();
  }
  showToast(title,text,Object.assign({className:"toast-ipo",durationMs:Math.max(8000,toastDurationMs())},opts||{}));
  if(n.sound) beep("system");
  if(n.haptic && typeof navigator!=="undefined" && navigator.vibrate) navigator.vibrate(25);
}
// 지금 설정한 표시 시간·최대 개수를 한 줄로 보여 줍니다.
function toastPreviewLabel(){
  const sec=(toastDurationMs()/1000).toFixed(1).replace(/\.0$/,"");
  return `${sec}초 · ${toastLimit()}개`;
}
// 설정 화면의 '토스트 미리보기' — 현재 설정 그대로 토스트를 띄워 확인합니다.
// (알림을 꺼 둔 상태에서도 미리보기는 보여 줍니다. 설정을 확인하는 용도이기 때문입니다.)
function previewToasts(){
  const n=toastLimit();
  const sec=(toastDurationMs()/1000).toFixed(1).replace(/\.0$/,"");
  for(let i=1;i<=n;i++) showToast(`토스트 미리보기 ${i}/${n}`, `지금 설정은 ${sec}초 동안 최대 ${n}개입니다.`);
  return n;
}
function updateBell(){
  const n=state.notify||{};
  // 알림 센터 기록을 끈 상태(또는 모든 알림 끄기)면 종 아이콘의 배지를 숨깁니다.
  const centerOn=n.center!==false && n.master!==true;
  const unread=(state.alerts||[]).filter(a=>!a.read).length;
  const label=unread>99?"99+":String(unread);
  ["bellBadge","bbBadge"].forEach(id=>{
    const b=$(id); if(!b) return;
    b.textContent=label;
    b.style.display=(centerOn && unread)?"inline-flex":"none";
  });
}
function openModal(title,html){

  root.innerHTML=`<div class="modal-box" role="document"><div class="modal-head"><h2>${title}</h2><button class="modal-close" onclick="closeModal()">닫기</button></div>${html}</div>`;
  root.classList.add("on");
  if(typeof root.setAttribute==="function") root.setAttribute("aria-hidden","false");
}
function closeModal(){
  laborAbortShift(true);
  const root=$("modalRoot"); if(!root) return;
  root.classList.remove("on");
  if(typeof root.setAttribute==="function") root.setAttribute("aria-hidden","true");
  root.innerHTML="";
}
function setNotify(k,v){
  if(!state.notify || typeof state.notify!=="object") state.notify=Object.assign({},NOTIFY_DEFAULT);
  state.notify[k]=!!v;
  saveGame(); updateBell();
  // 모든 알림 끄기는 다른 스위치 상태까지 보여야 하므로 설정 화면을 다시 그립니다.
  if(k==="master"){ try{ if(activePage()==="settings") settingsPage(); }catch(e){} }
}
// 종류별 알림을 한 번에 켜고 끕니다.
function setAllNotify(on){
  if(!state.notify || typeof state.notify!=="object") state.notify=Object.assign({},NOTIFY_DEFAULT);
  NOTIFY_KINDS.forEach(([k])=>{ state.notify[k]=!!on; });
  saveGame(); updateBell();
  try{ if(activePage()==="settings") settingsPage(); }catch(e){}
}
function openNotifModal(){
  (state.alerts||[]).forEach(a=>{ a.read=true; });
  updateBell();
  const n=state.notify||{};
  const sw=(k,label)=>`<label class="notify-toggle"><input type="checkbox" ${n[k]!==false?"checked":""} onchange="setNotify('${k}',this.checked)"><span>${label}</span></label>`;
  const rows=(state.alerts||[]).slice(0,30).map(a=>`<div class="journal" style="margin-bottom:8px"><div><b>${a.title}</b><span>${new Date(a.at).toLocaleTimeString("ko-KR")}</span></div><small class="muted-sm">${a.text||""}</small></div>`).join("")||`<p class="muted-sm">아직 알림이 없습니다.</p>`;
  const masterOff=n.master===true;
  openModal("알림 센터",`
    ${masterOff?`<p class="muted-sm" style="margin-bottom:8px;color:#b42318"><b>모든 알림이 꺼져 있습니다.</b> 아래에서 다시 켜거나 설정에서 한 번에 켤 수 있습니다.</p>`:""}
    <div class="notify-grid" style="margin-bottom:12px">${NOTIFY_KINDS.map(([k,l])=>sw(k,l)).join("")}</div>
    <p class="muted-sm" style="margin-bottom:8px">최근 30건 · 설정은 저장 파일에 함께 보관됩니다.</p>
    ${rows}<button class="ghost" style="width:100%;margin-top:8px" onclick="closeModal();openSettings()">알림 설정 열기</button>`);
}

// ── 거래 저널 · 성과 분석 ────────────────────────────
function recordTrade(s,side,qty,priceNative,profitKRW){
  if(!Array.isArray(state.journal)) state.journal=[];
  const foreign=isForeignStock(s);
  const valueKRW=priceNative*qty*(foreign?fx.usd:1);
  const fee=valueKRW*stockFeeRate();
  state.feesTotal=(state.feesTotal||0)+fee;
  state.journal.unshift({at:Date.now(),name:s.name,side,qty,valueKRW,fee,profit:side==="sell"?(profitKRW||0):0});
  if(state.journal.length>200) state.journal.pop();
  bumpDaily("trades");
  checkAchievements();
  saveGame();
}
function performanceStats(){
  const j=state.journal||[];
  const sells=j.filter(x=>x.side==="sell"), buys=j.filter(x=>x.side==="buy");
  const wins=sells.filter(x=>x.profit>0);
  const realized=sells.reduce((a,x)=>a+(x.profit||0),0);
  const volume=j.reduce((a,x)=>a+(x.valueKRW||0),0);
  const buyVolume=buys.reduce((a,x)=>a+(x.valueKRW||0),0);
  const sellVolume=sells.reduce((a,x)=>a+(x.valueKRW||0),0);
  const held=stocks.filter(s=>s.realizedProfit!==0);
  const roiRows=stockReturnRows();
  return {
    trades:j.length, buys:buys.length, sells:sells.length,
    winRate:sells.length?wins.length/sells.length:0,
    realized, volume, buyVolume, sellVolume, fees:state.feesTotal||0,
    unrealized:unrealizedPL(),
    periods:periodReturns(),
    roiRows, bestRoi:roiRows[0], worstRoi:roiRows[roiRows.length-1],
    best:[...held].sort((a,b)=>b.realizedProfit-a.realizedProfit)[0],
    worst:[...held].sort((a,b)=>a.realizedProfit-b.realizedProfit)[0]
  };
}

// ── 자동 적립 ─────────────────────────────────
function bestProductForAuto(){
  let best=null,rate=-1;
  products.forEach(p=>{
    if(!canJoin(p.id)) return;
    const r=gradeRateFor(p.id,currentGrade());
    if(!p.amount && r>rate){ rate=r; best=p; }
  });
  return best;
}
function saveAutoSettings(){
  const pct=+($("auto-pct")?$("auto-pct").value:60)||0;
  const min=+($("auto-min")?$("auto-min").value:0)||0;
  const goldPct=+($("auto-gold")?$("auto-gold").value:0)||0;
  const estatePct=+($("auto-estate")?$("auto-estate").value:0)||0;
  const every=Math.max(15,Math.min(300,Math.round(+($("auto-every")?$("auto-every").value:60)||60)));
  const autoSell=$("auto-sell")?$("auto-sell").checked:false;
  const takeProfit=Math.max(0,Math.min(200,+($("auto-tp")?$("auto-tp").value:20)||0));
  const stopLoss=Math.max(0,Math.min(100,+($("auto-sl")?$("auto-sl").value:10)||0));
  const rebalance=$("auto-reb")?$("auto-reb").checked:!!(state.auto||{}).rebalance;
  const rebStockPct=Math.max(0,Math.min(100,+($("auto-reb-pct")?$("auto-reb-pct").value:60)||0));
  const rebBand=Math.max(2,Math.min(20,Math.round(+($("auto-reb-band")?$("auto-reb-band").value:5)||5)));
  const taxAware=$("auto-tax")?$("auto-tax").checked:!!(state.auto||{}).taxAware;
  const taxBudget=Math.max(0,Math.floor(+($("auto-tax-budget")?$("auto-tax-budget").value:((state.auto||{}).taxBudget||0))||0));
  state.auto=Object.assign({},state.auto,{enabled:true,stockPct:Math.max(0,Math.min(100,pct)),minCash:Math.max(0,min),goldPct:Math.max(0,Math.min(100,goldPct)),estatePct:Math.max(0,Math.min(100,estatePct)),every,autoSell,takeProfit,stopLoss,rebalance,rebStockPct,rebBand,taxAware,taxBudget});
  saveGame(); if(activePage()==="settings") settingsPage(); else portfolio(); update();
  notify("system","자동 투자",`주식 ${state.auto.stockPct}% · 최소 현금 ${won(state.auto.minCash)} · ${state.auto.every}초 주기${state.auto.autoSell?` · 익절 ${state.auto.takeProfit}%/손절 ${state.auto.stopLoss}%`:''}`);
}
function disableAuto(){
  state.auto=Object.assign({},state.auto,{enabled:false});
  saveGame(); if(activePage()==="settings") settingsPage(); else portfolio(); update();
  notify("system","자동 투자","규칙을 껐습니다.");

// 자동 매매: 보유 종목이 설정한 익절/손절선에 닿으면 전량 매도합니다.
function autoSellRules(){
  const a=state.auto||{};
  if(!a.enabled || !a.autoSell || !state.marketOpen) return 0;
  const tp=(a.takeProfit||0)/100, sl=(a.stopLoss||0)/100;
  if(tp<=0 && sl<=0) return 0;
  let sold=0;
  const acct=state.tax.mode;
  stocks.forEach(s=>{
    const count=accountQty(s,acct), avg=accountAvgBuy(s,acct);
    if(count<=0 || !avg) return;
    const roi=(s.price-avg)/avg;
    if(!((tp>0&&roi>=tp)||(sl>0&&roi<=-sl))) return;
    if(!marketSellShares(s,count,acct)) return;
    addLog(`🤖 자동 매도: ${s.name} ${count}주 · ${pct(roi)} · ${taxModeLabel(acct)}`);
    sold++;
  });
  if(sold){
    notify("order","자동 매매 실행",`${sold}종목을 익절/손절 규칙으로 매도했습니다.`);
    saveGame(); update();
  }
  return sold;
}
function autoInvest(force){
  const a=state.auto||{};
  if(!force && !a.enabled) return 0;
  if(!force && !state.marketOpen) return 0;
  const min=Math.max(0,a.minCash||0);
  const budget=state.cash-min;
  if(budget<100000) return 0;
  const stockPart=Math.max(0,Math.min(100,a.stockPct||0))*budget/100;
  let invested=0;
  if(stockPart>0){
    const list=stocks.filter(s=>!isIndexFund(s));
    const perKRW=stockPart/list.length;
    list.forEach(s=>{
      const foreign=isForeignStock(s);
      const unitKRW=s.price*(1+stockFeeRate())*(foreign?fx.usd:1);
      const qty=Math.floor(perKRW/unitKRW);
      if(qty<=0) return;
      const costNative=qty*s.price*(1+stockFeeRate()), acct=state.tax.mode, principalKRW=qty*s.price*(foreign?fx.usd:1);
      if(!canTaxContribute(acct,principalKRW)) return;
      if(foreign){
        if(state.usd<costNative){
          const need=costNative-state.usd;
          const krw=need*fx.usd*(1+fxFeeRate());
          if(krw>state.cash) return;
          state.cash-=krw; state.usd+=need;
        }
      }else if(state.cash<costNative) return;
      if(!marketBuyShares(s,qty,acct)) return;
      invested+=principalKRW;
    });
  }
  // 자동 배분: 금·은과 부동산 비중(설정한 경우에만 동작, 기본 0%).
  const goldBudget=Math.max(0,state.cash-min)*((a.goldPct||0)/100);
  if(goldBudget>=metalPrice("gold")){
    const price=metalPrice("gold"), qty=Math.floor(goldBudget/price), cost=price*qty;
    if(qty>0){
      state.cash-=cost;
      const h=state.metals.gold||{qty:0,avg:0};
      h.avg=((h.avg*h.qty)+cost)/(h.qty+qty); h.qty+=qty; state.metals.gold=h;
      markDex("metals","gold"); invested+=cost;
    }
  }
  const estateBudget=Math.max(0,state.cash-min)*((a.estatePct||0)/100);
  if(estateBudget>0){
    const pick=ESTATES.filter(e=>estatePrice(e.id)<=estateBudget).sort((x,y)=>estatePrice(y.id)-estatePrice(x.id))[0];
    if(pick){
      const price=estatePrice(pick.id);
      state.cash-=price;
      const h=state.estate[pick.id]||{qty:0,avgBuy:0};
      h.avgBuy=((h.avgBuy*h.qty)+price)/(h.qty+1); h.qty++; state.estate[pick.id]=h;
      markDex("estates",pick.id); invested+=price;
    }
  }
  const remain=state.cash-min;
  if(remain>0){
    const p=bestProductForAuto();
    if(p && remain>=p.min){
      const v=Math.floor(remain/10000)*10000;
      if(v>0){
        if(p.amount===0) p.rate=gradeRateFor(p.id,currentGrade());
        state.cash-=v; p.amount+=v; invested+=v;
      }
    }
  }
  if(invested>0){
    addLog(`자동 적립 실행: ${won(invested)} 재투자`);
    notify("system","자동 적립",`${won(invested)}을 규칙대로 재투자했습니다.`);
    saveGame(); update();
  }
  return invested;
}

// ── 노동 · 생계 ───────────────────────────────────
function ensureLabor(){
  if(!state.labor || typeof state.labor!=="object") state.labor={shifts:0,earned:0,lastAt:{},warned:false,xp:0,points:0,stamina:100,skills:{focus:0,stamina:0,service:0}};
  const l=state.labor;
  if(!Number.isFinite(+l.shifts) || +l.shifts<0) l.shifts=0;
  if(!Number.isFinite(+l.earned) || +l.earned<0) l.earned=0;
  if(!l.lastAt || typeof l.lastAt!=="object") l.lastAt={};
  l.xp=Math.max(0,+l.xp||0); l.points=Math.max(0,Math.floor(+l.points||0));
  if(!l.skills || typeof l.skills!=="object") l.skills={focus:0,stamina:0,service:0};
  ["focus","stamina","service"].forEach(k=>{ l.skills[k]=Math.max(0,Math.min(5,Math.floor(+l.skills[k]||0))); });
  const staminaMax=100+20*(l.skills.stamina||0);
  l.stamina=Math.max(0,Math.min(staminaMax,Number.isFinite(+l.stamina)?+l.stamina:staminaMax));
  if(!Number.isFinite(+l.restAt)) l.restAt=0;
  return l;
}
function laborCareerLevel(){ return 1+Math.floor(ensureLabor().xp/120); }
function laborStaminaMax(){ const l=ensureLabor(); return 100+20*(l.skills.stamina||0); }
function laborCondition(){
  const l=ensureLabor(), ratio=Math.max(0,Math.min(1,l.stamina/Math.max(1,laborStaminaMax())));
  // 컨디션 40% 이상은 정상 지급, 그 아래로 떨어지면 일당·속도에 불이익이 생깁니다.
  return ratio>=.4?1:Math.max(.55,.55+.45*(ratio/.4));
}
function laborZoneFor(job){ return Math.max(.05,Math.min(.45,(job&&job.zone||.2)*(1+.06*(ensureLabor().skills.focus||0)))); }
function laborSkillCost(id){ const l=ensureLabor(), lv=l.skills[id]||0; return 1+lv; }
function buyLaborSkill(id){
  if(!["focus","stamina","service"].includes(id)) return false;
  const l=ensureLabor(), lv=l.skills[id]||0, cost=laborSkillCost(id);
  if(lv>=5) return alert("이미 최고 레벨입니다.");
  if(l.points<cost) return alert(`스킬 포인트가 부족합니다. (필요 ${cost}P)`);
  l.points-=cost; l.skills[id]=lv+1;
  if(id==="stamina") l.stamina=Math.min(laborStaminaMax(),l.stamina+20);
  addLog(`💪 노동 스킬 강화: ${id} Lv.${lv+1}`);
  saveGame(); portfolio(); update();
  notify("system","노동 스킬",`${id} Lv.${lv+1}`);
  return true;
}
function restLabor(){
  const l=ensureLabor();
  const wait=Math.max(0,30000-(Date.now()-(+l.restAt||0)));
  if(wait>0) return alert(`아직 휴식 중입니다. ${Math.ceil(wait/1000)}초 후 다시 쉴 수 있습니다.`);
  if(l.stamina>=laborStaminaMax()) return alert("컨디션이 이미 최상입니다.");
  l.restAt=Date.now();
  l.stamina=Math.min(laborStaminaMax(),l.stamina+30);
  addLog(`🛌 휴식: 컨디션 +30 (${Math.round(l.stamina)}/${laborStaminaMax()})`);
  saveGame(); portfolio(); update();
  return true;
}
function recoverLaborCondition(){
  const l=ensureLabor();
  l.stamina=Math.min(laborStaminaMax(),l.stamina+2);
}
function laborJob(id){ return LABOR_JOBS.find(j=>j.id===id)||null; }
function laborRemaining(job){
  if(!job) return 0;
  const l=ensureLabor(), last=+l.lastAt[job.id]||0;
  if(!last) return 0;
  return Math.max(0, job.cooldown*1000-(Date.now()-last));
}
// 현금과 팔 수 있는 자산이 모두 바닥난 상태인지 판정합니다.
function laborEmergency(){
  const assets=stockValueKRW()+productValueKRW()+estateValue()+metalValue()+companyValue();
  return (state.cash||0)<LABOR_MIN_CASH && assets<=0.01;
}
function laborJobCard(job){
  const l=ensureLabor(), locked=l.shifts<job.req, remain=laborRemaining(job);
  const label=locked?`🔒 노동 ${job.req}회 필요`:(remain>0?`${Math.ceil(remain/1000)}초 후`:"일하기");

    <div class="labor-top"><b>${job.icon} ${job.name}</b><span class="pill">최대 +${won(job.pay)}</span></div>
    <small>${job.desc} · 난이도 ${"★".repeat(job.diff||1)}${"☆".repeat(Math.max(0,5-(job.diff||1)))} · 실제 ${job.cooldown}초</small>
    <div class="labor-meta"><span>누적 ${l.shifts}회</span><span>총 ${won(l.earned)}</span></div>
    <button class="${locked?"ghost":"buy"}" data-labor-btn="${job.id}" onclick="workLabor('${job.id}')" ${locked?"disabled":""}>${label}</button>
  </article>`;
}
// ── 노동 미니게임 ────────────────────────────────────────────
// 버튼 한 번으로 일당이 들어오지 않도록, 작업대의 표시선을 초록 구간에 맞추는
// 타이밍 작업을 3번 성공시켜야 일당이 지급됩니다.
const LABOR_ROUNDS=3;
let laborSession=null;
function laborRoundResult(job,p){
  const zone=(job&&job.zone)||.2;
  const pos=Math.max(0,Math.min(1,typeof p==="number"&&Number.isFinite(p)?p:.5));
  const d=Math.abs(pos-.5);
  const grade=d<=zone*.35?"perfect":(d<=zone?"good":"miss");
  return {grade,pos,mult:grade==="perfect"?1:(grade==="good"?.8:0)};
}
function laborShiftPay(job,results,condition){
  const base=(job&&job.pay)||0;
  const list=(results||[]).map(r=>typeof r==="string"?r:(r&&r.grade)||"miss");
  const perfect=list.filter(g=>g==="perfect").length;
  const good=list.filter(g=>g==="good").length;
  const miss=Math.max(0,list.length-perfect-good);
  const rate=(perfect+good*.8)/LABOR_ROUNDS;
  const bonus=rebirthBonus("labor",.05);
  const l=ensureLabor();
  // 컨디션은 지급액에, 서비스 스킬은 추가 보너스에 반영합니다. 기존 호출(2개 인자)은 100% 컨디션입니다.
  const cond=condition==null?1:Math.max(.55,Math.min(1.2,+condition||0));
  const skill=1+.02*(l.skills.service||0);
  return {pay:Math.max(0,Math.round(base*rate*bonus*cond*skill/1000)*1000),perfect,good,miss,rate,bonus,condition:cond,skill};
}
function laborGameHtml(job){
  const zone=laborZoneFor(job)*100, perfect=zone*.35;
  const band=(left,width,cls)=>`<span class="labor-target${cls?" "+cls:""}" style="left:${left.toFixed(1)}%;width:${width.toFixed(1)}%"></span>`;
  return `<div class="labor-game">
    <p>작업대의 표시선이 초록 구간을 지나갈 때 <b>멈추기</b>를 누르세요. 작업 ${LABOR_ROUNDS}번을 마치면 일당이 지급되고, 놓친 만큼 일당이 깎입니다. 회차가 진행될수록 피로가 쌓여 빨라지고, 실패하면 다음 작업은 더 빨라집니다.</p>
    <div class="labor-track" role="img" aria-label="노동 타이밍 바">
      ${band(50-zone,zone*2,"")}${band(50-perfect,perfect*2,"perfect")}<span class="labor-cursor" id="labor-cursor" style="left:0%"></span>
    </div>
    <div class="labor-game-meta"><span>작업 <b id="labor-round">1 / ${LABOR_ROUNDS}</b></span><span>피로 <b id="labor-fatigue">0%</b></span><span id="labor-grades">⭐ 완벽 · ✅ 성공 · ❌ 실패</span></div>
    <div class="labor-game-result" id="labor-result">표시선을 초록 구간에 맞춰 주세요.</div>
    <button id="labor-stop-btn" class="buy" onclick="laborStop()">멈추기</button>
    <button class="ghost" onclick="closeLaborGame()">그만두기</button>
  </div>`;
}
function laborSpeedMultiplier(s){
  const list=(s&&s.results)||[];
  const misses=list.filter(r=>r&&r.grade==="miss").length;
  // 회차가 쌓일수록 피로가 오르고, 실수하면 다음 작업이 더 빨라집니다.
  // 컨디션이 낮으면 손이 떨려 표시선이 조금 더 빨라집니다.
  return (1 + .14*list.length + .18*misses)*(1+(1-laborCondition())*.25);
}
function laborLoop(ts){
  const s=laborSession; if(!s) return;
  const now=typeof ts==="number"?ts:0;
  if(!s.last) s.last=now;
  const dt=Math.max(0,Math.min(.05,(now-s.last)/1000)); s.last=now;
  s.pos+=s.dir*(s.job.speed||.6)*laborSpeedMultiplier(s)*dt;
  if(s.pos>=1){s.pos=1;s.dir=-1;}
  if(s.pos<=0){s.pos=0;s.dir=1;}
  const cur=$("labor-cursor"); if(cur&&cur.style) cur.style.left=(s.pos*100).toFixed(1)+"%";
  if(typeof requestAnimationFrame==="function") s.raf=requestAnimationFrame(laborLoop);
}
function laborAbortShift(quiet){
  const s=laborSession; if(!s) return false;
  if(s.raf && typeof cancelAnimationFrame==="function"){ try{ cancelAnimationFrame(s.raf); }catch(e){} }
  laborSession=null;
  if(!quiet) addLog("💼 노동을 중단했습니다. 일당은 지급되지 않습니다.");
  return true;
}
function laborStartShift(jobOrId){
  const job=typeof jobOrId==="string"?laborJob(jobOrId):jobOrId;
  if(!job) return false;
  // 이미 진행 중인 작업이 있으면 새 세션을 열지 않습니다(중복 시작·보상 중복 방지).
  if(laborSession) return false;
  // 표시선은 왼쪽 끝에서 출발합니다. 중앙에서 시작하면 열자마자 누르는 것으로 완벽 판정이 납니다.
  laborSession={job,round:0,results:[],pos:0,dir:1,last:0,raf:0,paid:false};
  openModal(`${job.icon} ${job.name}`,laborGameHtml(job));
  laborLoop(0);
  return true;
}
function laborStop(){
  const s=laborSession; if(!s) return false;
  return laborStopAt(s.pos);
}
function laborStopAt(p){
  const s=laborSession; if(!s || s.paid) return false;
  const r=laborRoundResult({...s.job,zone:laborZoneFor(s.job)},p);
  s.results.push(r);
  s.round++;
  const roundEl=$("labor-round"); if(roundEl) roundEl.textContent=`${Math.min(s.round+1,LABOR_ROUNDS)} / ${LABOR_ROUNDS}`;
  const fatigueEl=$("labor-fatigue"); if(fatigueEl) fatigueEl.textContent=`${Math.round((laborSpeedMultiplier(s)-1)*100)}%`;
  const resEl=$("labor-result"); if(resEl) resEl.textContent=r.grade==="perfect"?"⭐ 완벽한 작업!":(r.grade==="good"?"✅ 작업 성공":"❌ 작업 실패");
  const badge=$("labor-grades"); if(badge) badge.textContent=s.results.map(x=>x.grade==="perfect"?"⭐":x.grade==="good"?"✅":"❌").join(" ");
  if(s.round<LABOR_ROUNDS){

    s.pos=0; s.dir=1; s.last=0;
    const cur=$("labor-cursor"); if(cur&&cur.style) cur.style.left="0%";

  }

}
function laborShowResult(job,sum,pay){

    <p style="margin-top:10px;font-size:13px">${line}${pay>0?` (최대 ${won(job.pay)} · 달성률 ${Math.round(sum.rate*100)}%)`:""}</p>
    <button class="buy" style="width:100%;margin-top:12px" onclick="closeLaborGame()">확인</button>`);

function laborFinishShift(){
  const s=laborSession; if(!s || s.paid) return false;
  // 보상 지급은 세션당 정확히 한 번만 실행합니다.
  s.paid=true;
  const job=s.job, l=ensureLabor();
  const condition=laborCondition();
  const sum=laborShiftPay(job,s.results,condition);
  laborAbortShift(true);
  // 컨디션 소모와 경력 XP는 성공·실패와 관계없이 실제 작업을 마친 만큼 반영합니다.
  const staminaCost=Math.max(4,12+(job.diff||1)*3-(l.skills.stamina||0));
  l.stamina=Math.max(0,l.stamina-staminaCost);
  const beforeLevel=laborCareerLevel();
  const gainedXp=18+(job.diff||1)*6+sum.perfect*4;
  l.xp+=gainedXp;
  const afterLevel=laborCareerLevel();
  if(afterLevel>beforeLevel){ l.points+=(afterLevel-beforeLevel); notify("system","노동 경력 상승",`Lv.${afterLevel} · 스킬 포인트 +${afterLevel-beforeLevel}`); }
  if(sum.pay<=0){
    // 기본 노동은 바로 재도전할 수 있지만, 고임금 노동은 실패해도 현장 복귀 시간이 필요합니다.
    if((job.req||0)>0) l.lastAt[job.id]=Date.now();
    const retry=(job.req||0)>0?`${job.cooldown}초 뒤 다시 도전할 수 있습니다.`:"일당 없이 바로 다시 도전할 수 있습니다.";
    addLog(`💼 ${job.name} 작업 실패: 일당 없음 (경력 XP·컨디션은 반영)`);
    notify("system","노동 실패",`${job.name} 작업을 모두 놓쳤습니다. ${retry}`);
    saveGame(); portfolio(); update();
    laborShowResult(job,sum,0);
    return false;
  }
  l.shifts++;
  l.earned+=sum.pay;
  l.lastAt[job.id]=Date.now();
  state.cash=(state.cash||0)+sum.pay;
  addLog(`💼 ${job.name} 노동 완료: +${won(sum.pay)} (완벽 ${sum.perfect}·성공 ${sum.good}·실패 ${sum.miss}, 컨디션 ${Math.round(condition*100)}%)`);
  notify("system","노동 완료",`${job.name} +${won(sum.pay)} · 컨디션 ${Math.round(l.stamina)}/${laborStaminaMax()} · 경력 Lv.${laborCareerLevel()}`);
  saveGame(); portfolio(); update();
  laborShowResult(job,sum,sum.pay);
  return true;
}

function workLabor(id){

// ── 주문 체결 공통 ─────────────────────────────
// 예약 주문·자동 리밸런싱이 같은 수수료/세금/기록 경로를 쓰도록 모았습니다.
function marketBuyShares(s,qty,account){
  ensureAdvancedState();
  qty=Math.floor(+qty||0); if(!s||qty<=0) return false;
  const acct=TAX_ACCOUNTS.includes(account)?account:state.tax.mode, foreign=isForeignStock(s);
  const unit=s.price*(1+stockFeeRate()), cost=unit*qty, principalKRW=s.price*qty*(foreign?fx.usd:1);
  if(!canTaxContribute(acct,principalKRW)) return false;
  if(foreign ? state.usd<cost : state.cash<cost) return false;
  if(foreign) state.usd-=cost; else state.cash-=cost;
  s.avgBuy=((s.avgBuy*s.own)+unit*qty)/(s.own+qty);
  s.own+=qty;
  addTaxContribution(acct,principalKRW);
  addTaxLot(s,qty,unit,acct);
  recordTrade(s,"buy",qty,s.price,0);
  return true;
}
function simulateFifoBasis(s,qty,account){
  const acct=TAX_ACCOUNTS.includes(account)?account:state.tax.mode;
  const lots=ensureTaxLots(s).filter(l=>l.account===acct).map(l=>({qty:l.qty,price:l.price}));
  let left=Math.max(0,Math.floor(+qty||0)), basis=0;
  while(left>0&&lots.length){
    const l=lots[0], take=Math.min(left,l.qty);
    basis+=take*l.price; l.qty-=take; left-=take;
    if(l.qty<=0) lots.shift();
  }
  if(left>0) basis+=left*Math.max(0,+s.avgBuy||+s.price||0);
  return basis;
}
function taxPreviewFor(s,qty,account){
  ensureAdvancedState();
  qty=Math.floor(+qty||0);
  const acct=TAX_ACCOUNTS.includes(account)?account:state.tax.mode;
  const available=s?accountQty(s,acct):0;
  if(!s||qty<=0) return {ok:false,reason:"수량을 입력해 주세요.",account:acct,available};
  if(qty>available) return {ok:false,reason:`${taxModeLabel(acct)}에 매도 가능한 수량은 ${available}주입니다.`,account:acct,available};
  const foreign=isForeignStock(s);
  const revenue=s.price*(1-stockFeeRate()-tradeTaxRate())*qty;
  const basis=simulateFifoBasis(s,qty,acct);
  const profit=revenue-basis, profitKRW=foreign?profit*fx.usd:profit;
  const projection=taxProjection(profitKRW,acct);
  const revenueKRW=foreign?revenue*fx.usd:revenue;
  return {ok:true,account:acct,available,qty,revenue,revenueKRW,basis,profit,profitKRW,tax:projection.tax,taxable:projection.taxable,carryUsed:projection.carryUsed,deferred:projection.deferred,netKRW:revenueKRW-projection.tax};
}
function marketSellShares(s,qty,account){
  ensureAdvancedState();
  qty=Math.floor(+qty||0);
  const acct=TAX_ACCOUNTS.includes(account)?account:state.tax.mode;
  if(!s||qty<=0||accountQty(s,acct)<qty) return false;
  const foreign=isForeignStock(s);
  const revenue=s.price*(1-stockFeeRate()-tradeTaxRate())*qty;
  // FIFO 로트의 취득원가를 세금·실현손익 계산에 사용합니다.
  const profit=revenue-consumeTaxLots(s,qty,acct);
  const profitKRW=foreign?profit*fx.usd:profit;
  if(foreign){ state.usd+=revenue; s.realizedProfit+=profitKRW; } else { state.cash+=revenue; s.realizedProfit+=profit; }
  s.own-=qty; if(s.own===0) s.avgBuy=0;
  recordTrade(s,"sell",qty,s.price,profitKRW);
  settleTax(profitKRW,acct); creditStockBonus(profitKRW);
  return true;
}

function ensureShorts(){ if(!Array.isArray(state.shorts)) state.shorts=[]; return state.shorts; }
function shortStock(stockId,qty){
  if(!checkMarketOpen()) return;
  const s=stock(stockId); if(!s) return alert("종목을 선택해 주세요.");
  if(isIndexFund(s)) return alert("지수 ETF는 공매도할 수 없습니다.");
  qty=Math.floor(+qty||0);
  if(qty<=0) return alert("공매도 수량을 입력해 주세요.");
  const foreign=isForeignStock(s);
  const valueKRW=s.price*qty*(foreign?fx.usd:1);
  const marginNeed=valueKRW*0.3;
  const cashKRW=state.cash+(state.usd||0)*fx.usd;
  if(cashKRW<marginNeed) return alert(`공매도에는 포지션의 30%(${won(marginNeed)}) 이상의 현금이 필요합니다.`);
  if(!confirmTrade("공매도",`${s.name} ${qty}주 @ ${foreign?usdStr(s.price):won(s.price)} · 증거금 ${won(marginNeed)}`)) return;
  const proceeds=s.price*qty*(1-stockFeeRate());
  if(foreign) state.usd+=proceeds; else state.cash+=proceeds;
  ensureShorts().push({id:`sh${Date.now()}${Math.floor(Math.random()*1000)}`,stockId,qty,entry:s.price,margin:marginNeed,at:state.marketSeconds});
  addLog(`🔻 공매도: ${s.name} ${qty}주 @ ${foreign?usdStr(s.price):won(s.price)}`);
  notify("order","공매도 실행",`${s.name} ${qty}주`);
  saveGame(); update(); if(activePage()==="short") shortPage();
}
function coverShort(id,qty,force){
  const pos=ensureShorts().find(p=>p.id===id); if(!pos) return;
  const s=stock(pos.stockId); if(!s) return;
  qty=Math.min(Math.floor(+qty||pos.qty)||pos.qty,pos.qty);
  const foreign=isForeignStock(s);
  const cost=s.price*qty*(1+stockFeeRate());
  if(!force && (foreign ? state.usd<cost : state.cash<cost)) return alert("환매에 필요한 현금이 부족합니다.");
  if(foreign){
    if(state.usd<cost){
      const need=(cost-state.usd)*fx.usd;
      if(state.cash>=need){ state.cash-=need; }
      else { const short=need-state.cash; state.cash=0; state.loan=(state.loan||0)+short; state.loanRate=state.loanRate||0.08; addLog(`⚠️ 환매 부족분 ${won(short)}이 대출로 전환되었습니다.`); }
      state.usd=cost;
    }
    state.usd-=cost;
  } else {
    if(state.cash<cost){ const short=Math.max(0,cost-state.cash); state.cash=0; state.loan=(state.loan||0)+short; state.loanRate=state.loanRate||0.08; addLog(`⚠️ 환매 부족분 ${won(short)}이 대출로 전환되었습니다.`); }
    else state.cash-=cost;
  }
  const pnl=(pos.entry-s.price)*qty*(1-stockFeeRate());
  const pnlKRW=foreign?pnl*fx.usd:pnl;
  state.shortRealized=(state.shortRealized||0)+pnlKRW;
  pos.qty-=qty;
  if(pos.qty<=0) state.shorts=ensureShorts().filter(p=>p.id!==id);
  addLog(`${force?"⚠️ 강제 청산":"🔺 공매도 환매"}: ${s.name} ${qty}주 · 실현손익 ${won(pnlKRW)}`);
  notify("order",force?"마진콜 · 강제 청산":"공매도 환매",`${s.name} ${qty}주 · ${won(pnlKRW)}`);
  saveGame(); update(); if(activePage()==="short") shortPage();
}
function coverShortAll(){ ensureShorts().slice().forEach(p=>coverShort(p.id,p.qty)); }
// 가격이 진입가 대비 30% 오르면 증거금이 녹아 강제 청산됩니다.
function checkShortMargins(){
  ensureShorts().slice().forEach(p=>{
    const s=stock(p.stockId); if(!s) return;
    if(s.price>=p.entry*1.3) coverShort(p.id,p.qty,true);
  });
}

function ensureBonds(){ if(!state.bonds||typeof state.bonds!=="object") state.bonds={qty:0,avg:0}; const b=state.bonds; b.qty=Math.max(0,+b.qty||0); b.avg=Math.max(0,+b.avg||0); return b; }
function buyBond(qty){
  const b=ensureBonds(); qty=Math.floor(+qty||0);
  if(qty<=0) return alert("매수 수량을 입력해 주세요.");
  const price=bondUnitPrice(), cost=price*qty*(1+BOND.fee);
  if(state.cash<cost) return alert(`채권 매수에는 ${won(cost)}이 필요합니다.`);
  state.cash-=cost;
  b.avg=((b.avg*b.qty)+price*qty)/(b.qty+qty);
  b.qty+=qty;
  addLog(`📜 채권 매수: ${qty}구좌 @ ${won(price)}`);
  saveGame(); banking(); update();
}
function sellBond(qty){
  const b=ensureBonds(); qty=Math.min(Math.floor(+qty||0)||b.qty,b.qty);
  if(qty<=0) return alert("보유한 채권이 없습니다.");
  const price=bondUnitPrice();
  const revenue=price*qty*(1-BOND.fee);
  state.cash+=revenue;
  b.qty-=qty; if(b.qty===0) b.avg=0;
  addLog(`📜 채권 매도: ${qty}구좌 @ ${won(price)} (${won(revenue)})`);

}
