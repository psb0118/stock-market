body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:#f5f3ee;color:#18212f}

.box,.card,.product,.news,.row{background:#fffdf8;border:1px solid #d8ded4;border-radius:8px;padding:14px;box-shadow:0 10px 28px #0001}

p{margin:0;color:#667085;line-height:1.45}

.top{display:flex;justify-content:space-between;gap:8px}

.up{color:var(--up)}.down{color:var(--down)}

.spark-tip.on{display:block}
/* 스크린리더 전용 텍스트와 건너뛰기 링크 */

   카드의 매수·가입 버튼을 가리지 않고, 오른쪽 아래 알림 토스트와도 겹치지 않습니다. */

body.no-anim *{animation:none!important;transition:none!important}

/* ── 2026 UI 리디자인: 금융 대시보드 ───────────────────────── */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#f8fafc; --ink:#101828; --muted:#667085;
  --line:#e4e8ee; --accent:#0f766e; --accent-2:#0b5f59; --gold:#f2c14e; --navy:#0c1523;
  --danger:#b42318; --radius:12px; --up:#d92d20; --down:#1d4ed8;
}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.app{grid-template-columns:244px minmax(0,1fr)}
.side{background:linear-gradient(180deg,#0c1523 0%,#111f31 100%);padding:20px 16px;border-right:1px solid #17263a;gap:0}
.logo{font-size:18px;letter-spacing:-.02em;margin-bottom:6px;color:#fff}
.sub{font-size:12px;color:#93a3b8;line-height:1.5;margin-bottom:18px}
.nav{gap:4px}
.nav button{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 10px;border-radius:9px;background:transparent;color:#c6d2e1;font-size:13px;font-weight:600;text-align:left;transition:background .15s,color .15s}
.nav button i{width:20px;text-align:center;font-style:normal;font-size:14px;color:#8296ad}
.nav button:hover{background:#1a2a3d;color:#fff}
.nav button.on{background:var(--gold);color:#15202e}
.nav button.on i{color:#15202e}
.side-status{display:flex;align-items:center;gap:8px;margin-top:auto;padding:12px 4px 4px;border-top:1px solid #1e2e42;color:#c6d2e1;font-size:12px}
.side-status span{background:#1a2a3d;border:1px solid #27384e;border-radius:999px;padding:4px 9px;font-weight:700}
.bell{background:#1a2a3d;border:1px solid #27384e;color:#e6edf6;min-height:34px;font-size:12px;margin-top:8px;justify-content:center}
#laborFab{background:var(--gold);border:0;color:#15202e;font-weight:800;box-shadow:none;margin-top:8px;border-radius:9px;min-height:42px;width:100%}
#laborFab:hover{background:#ffd166}
main{padding:26px 30px 44px;min-width:0}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.page-head h1{font-size:26px;letter-spacing:-.03em;margin:2px 0 4px}
.page-head p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.eyebrow{font-size:10px;letter-spacing:.14em;color:var(--accent);font-weight:800}
.page-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel,.box,.card,.product,.news,.row,.dash{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 1px 2px #1018280a}
.panel{padding:18px}
.section{margin-top:18px}
.section h3{font-size:14px;margin:0 0 10px;letter-spacing:-.01em}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.section-head h3{margin:0}
.sub-title{font-size:14px;margin:16px 0 8px}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px}
.stats.hidden{display:none}
.box{padding:14px 16px}
.box small{font-size:11px;letter-spacing:.02em;color:var(--muted)}
.box b{font-size:20px;margin-top:6px;letter-spacing:-.02em;overflow-wrap:anywhere}
button{min-height:38px;border-radius:8px;font-weight:650;font-size:13px;padding:0 14px;transition:background .15s,transform .06s,opacity .15s}
button:active{transform:translateY(1px)}
button.small,.ghost.small{min-height:30px;padding:0 10px;font-size:12px;border-radius:7px}
.buy{background:var(--accent)}.buy:hover{background:var(--accent-2)}
.sell{background:var(--danger)}.sell:hover{background:#971b12}
.ghost{background:#eef1f5;color:#26364a;border:1px solid var(--line)}.ghost:hover{background:#e4e9ef}
input,select{min-height:40px;border:1px solid #d5dbe3;border-radius:8px;background:#fff;padding:0 11px;font-size:13px;color:var(--ink)}
input:focus,select:focus{outline:2px solid #f2c14e66;border-color:#c9a53d}
.pill{background:#f1f4f7;border:1px solid #e4e8ee;color:#475467;font-size:11px;font-weight:650;padding:5px 9px}
.notice{background:#f8fafc;border:1px solid var(--line);color:#475467;font-size:12px;border-radius:10px;padding:11px 13px;margin-bottom:12px}
.market-day{background:#eaf6ff;border-color:#bae6fd;color:#0b4a6f;font-weight:700;line-height:1.45;padding:8px 11px;word-break:keep-all;overflow-wrap:break-word}
.toast.toast-ipo{cursor:pointer;border-left-color:#38bdf8}
.toast.toast-ipo b{color:#7dd3fc}
.breaking{border-radius:10px;border-left:4px solid var(--gold);box-shadow:none;padding:12px 14px;font-size:13px}
.page.on{animation:fadeUp .18s ease}
.subtabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);margin:0 0 14px;padding-bottom:2px}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:0 0 auto;min-height:36px;padding:0 13px;background:transparent;color:var(--muted);border-radius:8px 8px 0 0;font-size:13px;border-bottom:2px solid transparent}
.subtabs button:hover{background:#eef2f6;color:var(--ink)}
.subtabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:800;background:transparent}
.atab-panel[hidden]{display:none}
.kpi-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;display:flex;flex-direction:column;gap:5px}
.metric small{font-size:11px;color:var(--muted);font-weight:650}
.metric b{font-size:22px;letter-spacing:-.03em;overflow-wrap:anywhere}
.metric .delta{font-size:11px;color:var(--muted)}
.dash{padding:18px}
.dash-total{font-size:30px;letter-spacing:-.04em}
.trend{height:150px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px}
.alloc-legend{font-size:11px;color:var(--muted);gap:10px}
.dash-foot{font-size:11px;color:var(--muted);border-top:1px solid var(--line)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.breakdown{display:grid;gap:6px}
.breakdown-row{display:grid;grid-template-columns:1fr auto 14px;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 14px;background:var(--surface);border:1px solid var(--line);border-radius:9px;color:var(--ink);font-size:13px;text-align:left}
.breakdown-row:hover{background:#f7fafc;border-color:#cfd8e3}
.breakdown-row b{font-size:14px}.breakdown-row i{font-style:normal;color:#98a2b3}
.market-snap{display:grid;gap:2px;padding:8px 18px}
.snap-row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:13px}
.snap-row:last-child{border-bottom:0}.snap-row span{color:var(--muted)}
.holding-row{display:grid;grid-template-columns:1.5fr repeat(3,minmax(90px,1fr));gap:12px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line);font-size:12px;min-width:0}
.holding-row:last-child{border-bottom:0}
.holding-row>div,.holding-row>span{min-width:0;overflow-wrap:anywhere}
.holding-row small{display:block;color:var(--muted);font-size:11px;margin-bottom:2px}
.holding-row b{font-size:13px}
.holding-row.compact{grid-template-columns:1.4fr 1fr 1fr auto;padding:9px 0}
.holding-main b{font-size:14px}
.stack{display:grid;gap:0}
.asset-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:12px}
.asset-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:12px}
.asset-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.asset-head b{font-size:15px}.asset-head small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.asset-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;color:var(--muted)}
.asset-grid b{display:block;color:var(--ink);font-size:13px;margin-top:2px}
.metal-trade-row{display:grid;grid-template-columns:minmax(76px,1fr) auto auto auto;gap:6px;align-items:end}

.button-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.empty-state{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:18px 4px;color:var(--muted)}
.empty-state b{color:var(--ink);font-size:14px}.empty-state p{margin:0;font-size:12px;max-width:420px}
.empty-state.small{padding:12px 4px}
.muted-sm{color:var(--muted);font-size:12px;line-height:1.5}
.news-feed{display:grid;gap:0}
.news-line{padding:11px 0;border-bottom:1px dashed var(--line);font-size:13px;line-height:1.6}

.settings-section{margin-top:20px}
.settings-section h3{font-size:14px;margin:0 0 8px}

.setting-row:last-child{border-bottom:0}
.setting-copy b{display:block;font-size:13px}.setting-copy small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.setting-control{flex:0 0 auto;display:flex;gap:6px;align-items:center}
.toggle{position:relative;display:inline-flex;width:42px;height:24px;flex:0 0 auto}
.toggle input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
.toggle span{width:100%;height:100%;background:#d5dbe3;border-radius:999px;transition:background .15s}
.toggle span::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px #0002}
.toggle input:checked+span{background:var(--accent)}

const INTEREST_PERIOD=0.0035;
const FEE_STOCK = 0.0015; // 주식 수수료 0.15%
const FEE_FX = 0.01;      // 환전 수수료 1%(브론즈 기준)
const TAX_TRADE = 0.002;        // 매도 거래세 0.2%
const TAX_GAINS_RATE = 0.22;    // 양도소득세율 22%
const TAX_GAINS_FREE = 2500000; // 양도세 기본공제(연간 실현손익)
const TAX_ACCOUNTS=["general","isa","pension"];
const TAX_ACCOUNT_LIMITS={general:Infinity, isa:20000000, pension:18000000}; // 계좌별 연간 납입한도
const TAX_YEAR_SECONDS=18000; // 게임 30일 = 1세금연도
const SAVE_VERSION=4;

// ── 공유 시장 ──────────────────────────────────────
// 시세·뉴스·경제의 난수를 전역 시드와 게임 시각으로 고정했습니다. 모두 0초에서 시작하므로,
// 같은 게임 시각(며칠째 · 몇 초)에 있는 플레이어는 누구나 정확히 같은 가격과 이벤트를 봅니다.
// 즉 서버 없이도 모든 플레이어의 시장이 동일합니다.
const WORLD_SEED=20261126;
function worldHash(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
// FNV 해시를 그대로 쓰면 마지막 글자만 다른 키(날짜·종목)의 값이 거의 붙어 나옵니다.
// mulberry32 한 단계로 섞어 0~1 난수를 고르게 만듭니다.
function worldRand(...parts){
  let a=worldHash(WORLD_SEED+"|"+parts.join("|"));
  a=(a+0x6D2B79F5)|0;
  let t=Math.imul(a^(a>>>15),1|a);
  t=(t+Math.imul(t^(t>>>7),61|t))^t;
  return ((t^(t>>>14))>>>0)/4294967296;
}
// 같은 게임 시각에 같은 값을 보는 공용 난수(0~1).
// 매 틱 수백 번 호출되므로, 공통 접두사(WORLD_SEED|scope|tick|)의 해시를 한 번만 구하고
// 이어서 해싱합니다. worldRand와 완전히 같은 값을 돌려줍니다(문자열 생성만 제거).
function worldHashAppend(h,str){
  for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); }
  return h;
}
let _wtKey=null, _wtHash=0;
function worldTickRand(scope,...parts){
  const tick=Math.max(0,Math.floor(+state.marketSeconds||0));
  const key=scope+"|"+tick;
  if(_wtKey!==key){ _wtKey=key; _wtHash=worldHash(WORLD_SEED+"|"+scope+"|"+tick+"|"); }
  let h=_wtHash;
  for(let i=0;i<parts.length;i++){
    if(i) h=worldHashAppend(h,"|");
    h=worldHashAppend(h,String(parts[i]));
  }
  h=(h+0x6D2B79F5)|0;
  let t=Math.imul(h^(h>>>15),1|h);
  t=(t+Math.imul(t^(t>>>7),61|t))^t;
  return ((t^(t>>>14))>>>0)/4294967296;
}

  const sec=Math.max(0,+state.marketSeconds||0);

  return mod===0?MARKET_DAY_SECONDS:MARKET_DAY_SECONDS-mod;
}

  const floor=foreign?0.01:1;
  const total=stockPriceBounds(s);
  const lo=Math.max(floor,total.lo,Math.min(prev*(1-MAX_DAILY_LOSS),total.hi));
  const hi=Math.min(total.hi,Math.max(prev*(1+MAX_DAILY_GAIN),total.lo));
  const target=Math.min(hi,Math.max(lo,Number.isFinite(+v)?+v:lo));
  if(foreign) return Math.min(hi,Math.max(lo,Math.round(target*100)/100));
  const tick=domesticTickSize(target);
  return Math.min(hi,Math.max(lo,Math.round(target/tick)*tick));
}
// 국내 주식 호가 단위: 가격이 낮아질수록 촘촘하게 해 복리 하락이 반올림으로 멈추지 않게 합니다.
function domesticTickSize(price){
  if(price>=10000) return 100;
  if(price>=1000) return 10;
  return 1;
}
// 시작가 대비 -60%~+200%를 넘지 않도록 가격을 자릅니다. 0원이 되지 않도록
// 최소 1원(해외 0.01달러)도 함께 지킵니다.
function clampStockPrice(s,v){
  const raw=(Number.isFinite(+v)&&+v>0)?+v:1;
  const total=stockPriceBounds(s);
  const p=Math.min(total.hi,Math.max(total.lo,raw));
  if(["foreign","mega","special"].includes(s.group)) return Math.min(total.hi,Math.max(total.lo,Math.round(p*100)/100));
  const tick=domesticTickSize(p);
  return Math.min(total.hi,Math.max(total.lo,Math.round(p/tick)*tick));
}
// 그날 시장 전체에 적용되는 변동률(경기·금리·이벤트 반영).
// 장기 보유 보상이 너무 낮지 않도록 시장 자체에 완만한 우상향 드리프트를 둡니다.
function dailyMarketReturn(day){
  const d=Number.isFinite(+day)?+day:marketDayIndex(state.marketSeconds);
  const e=state.economy||{};
  const phase=e.phase==="호황"?1:e.phase==="불황"?-1:0;
  // 시장은 완만한 우상향(하루 +0.2%p 안팎)을 기본으로 합니다. 예전에는 하루 평균이 거의 0이라
  // 오래 들고 있어도 자산이 줄어드는 느낌이 강했습니다.
  // 난수는 전역 시드+날짜로 고정해, 모든 플레이어가 같은 날에 같은 시장 변동률을 봅니다.
  let r=(worldRand("mkt",d)-.47)*.045 + .0036;
  // 경기 국면은 방향만 살짝 더합니다. 금리·성장률을 그대로 넣으면 기준금리 평균(4.5%)이
  // 매일 -0.5%씩 시장을 끌어내려 장기 하락 드리프트가 생겼습니다.
  r += phase*.002;
  return Math.max(-.08,Math.min(.08,r));
}
// 종목별 하루 변동률: 시장 변동 + 종목 고유 성장 드리프트 + 변동성 + 가끔 뉴스성 급등·급락
function dailyStockReturn(s, marketR, day){
  const d=Number.isFinite(+day)?+day:marketDayIndex(state.marketSeconds);
  const dayVol=Math.max(.012,Math.min(.09,.018+(+s.vol||.02)*1.8));
  const trend=Math.max(0,Math.min(.0025,+s.drift||0));
  const start=(+s.start>0)?+s.start:((+s.price>0)?+s.price:1);
  const totalRatio=(+s.price>0)?+s.price/start:1;
  // 시작가에서 멀어질수록 기준 범위(1.05배)로 천천히 되돌아오게 해 장기 추세가 한쪽으로 폭주하지 않게 합니다.
  const reversion=Math.max(-.08,Math.min(.10,-Math.log(Math.max(.01,totalRatio)/1.05)*.03));
  // 종목별 난수도 (날짜, 종목)으로 고정해 모든 플레이어의 같은 날 시세가 동일합니다.
  let r=marketR + .0018 + trend*.5 + reversion + (worldRand("stk",d,s.id,1)-.485)*2*dayVol;
  if(worldRand("stk",d,s.id,2)<.04) r += (worldRand("stk",d,s.id,3)<.5?-1:1)*(.04+worldRand("stk",d,s.id,4)*.08);
  return Math.max(-MAX_DAILY_LOSS,Math.min(MAX_DAILY_GAIN,r));
}

// anchor는 아주 천천히 움직이는 환율 추세선입니다(완만한 추세용).
const fx={usd:START_FX, anchor:START_FX};
const $=id=>document.getElementById(id);
const wonFull=n=>Math.round(n).toLocaleString("ko-KR")+"원";
// 큰 금액을 좁은 화면에서도 읽히게 요약합니다(1.2억원 · 3.4조원).
const wonShort=n=>{
  const a=Math.abs(n);
  if(a>=1e12) return (n/1e12).toFixed(2).replace(/\.?0+$/,"")+"조원";
  if(a>=1e8) return (n/1e8).toFixed(a>=1e10?0:1).replace(/\.0$/,"")+"억원";
  if(a>=1e4) return Math.round(n/1e4).toLocaleString("ko-KR")+"만원";
  return wonFull(n);
};
// 설정의 숫자 표시 방식을 모든 화면에 동일하게 적용합니다.
const won=n=>(state.settings&&state.settings.numberFormat==="short")?wonShort(n):wonFull(n);
const usdStr=n=>n.toFixed(2)+" USD";
const pct=n=>(n>=0?"+":"")+(n*100).toFixed(2)+"%";

// ── 자산 계산(모든 화면 공통) ──────────────────────────────────
function stockValueKRW(){
  return stocks.reduce((sum,s)=>sum + (isForeignStock(s) ? s.price*s.own*fx.usd : s.price*s.own), 0);
}
function productValueKRW(){ return products.reduce((a,p)=>a+p.amount, 0); }
// 자산 화면과 상단 요약이 같은 숫자를 쓰도록 모든 자산 항목을 한 곳에서 계산합니다.
// 공매도 평가손익처럼 음수가 될 수 있는 항목도 총자산에 그대로 반영합니다.
function assetBreakdown(){
  const cash=+state.cash||0;
  const usd=(+state.usd||0)*fx.usd;
  const stock=stockValueKRW();
  const product=productValueKRW();
  const estate=estateValue();
  const metal=metalValue();
  const company=companyValue();
  const bonds=bondValueKRW();
  const shorts=shortValueKRW();
  const gross=cash+usd+stock+product+estate+metal+company+bonds+shorts;
  const debt=Math.max(0,+state.loan||0);
  const taxPaid=Math.max(0,+state.taxPaid||0)+Math.max(0,+state.tradeTaxPaid||0);
  return {cash,usd,stock,product,estate,metal,company,bonds,shorts,gross,debt,net:gross-debt,taxPaid};
}
const AUTO_INCOME_MODES=[["auto","자동 지급"],["manual","모아 받기"],["off","받지 않음"]];
// 구버전 저장이나 잘못된 값이 들어와도 자동 수익 설정이 항상 쓸 수 있는 형태가 되게 합니다.
function ensureAutoIncome(){
  if(!state.autoIncome || typeof state.autoIncome!=="object" || Array.isArray(state.autoIncome)){
    state.autoIncome={mode:"auto",pending:0,detail:{},skipped:0};
  }
  const a=state.autoIncome;
  if(!AUTO_INCOME_MODES.some(m=>m[0]===a.mode)) a.mode="auto";
  a.pending=Math.max(0,+a.pending||0);
  a.skipped=Math.max(0,+a.skipped||0);
  if(!a.detail || typeof a.detail!=="object" || Array.isArray(a.detail)) a.detail={};
  return a;
}
function autoIncomeMode(){ return ensureAutoIncome().mode; }
function autoIncomeModeLabel(mode){
  const hit=AUTO_INCOME_MODES.find(m=>m[0]===(mode||autoIncomeMode()));
  return hit?hit[1]:AUTO_INCOME_MODES[0][1];
}
// 자동 수익 한 건을 설정에 맞게 처리합니다. 자동 지급이면 현금으로 넣고,
// 모아 받기면 대기액에 쌓고, 받지 않음이면 지급하지 않고 누적만 기록합니다.
function creditAutoIncome(amount,label){
  const v=Math.round((+amount||0)*100)/100;
  if(!(v>0)) return 0;
  const a=ensureAutoIncome();
  if(a.mode==="off"){ a.skipped+=v; return 0; }
  if(a.mode==="manual"){
    const key=String(label||"기타");
    a.pending+=v;
    a.detail[key]=(+a.detail[key]||0)+v;
    return 0;
  }
  state.cash+=v;
  return v;
}
// 로그에서 실제로 현금에 들어왔는지, 모아 두었는지, 받지 않았는지 구분합니다.
function autoIncomeNote(paid){
  return paid>0?"":` (${autoIncomeMode()==="off"?"받지 않음":"모아 둠"})`;
}
function collectAutoIncome(){
  const a=ensureAutoIncome();
  const amount=Math.round(a.pending);
  if(amount<=0) return 0;
  state.cash+=amount;
  a.pending=0; a.detail={};
  addLog(`💰 모아 둔 자동 수익 ${won(amount)} 수령`);
  saveGame(); update();
  return amount;
}
function setAutoIncomeMode(mode){
  if(!AUTO_INCOME_MODES.some(m=>m[0]===mode)) return;
  ensureAutoIncome().mode=mode;
  saveGame(); update();
  try{ if(activePage()==="settings") settingsPage(); }catch(e){}
}
// 자동 수익 항목과 15초 평균을 한곳에서 계산해 화면·설정 창이 같은 숫자를 쓰게 합니다.
function autoIncomeParts(){
  const parts=[];
  const b=state.bonds||{};
  if((+b.qty||0)>0) parts.push({label:"채권 이자",per15:(+b.qty||0)*BOND.face*BOND.coupon*0.015,every:15});
  const c=state.company;
  if(c){
    const own=c.listed?Math.max(0,Math.min(100,+c.listed.ownPct||0))/100:1;
    const pay=Math.max(0,+c.profit||0)*(c.payout==null?.3:c.payout)*rebirthBonus("company",.04)*own;
    if(pay>0) parts.push({label:"기업 배당",per15:pay/2,every:30});
    if((+c.upkeep||0)>0) parts.push({label:"기업 유지비",per15:-(+c.upkeep||0)/2,every:30});
  }
  const rentBonus=rebirthBonus("estate",.04);
  let rent=0, upkeep=0;
  ESTATES.forEach(e=>{
    const qty=((state.estate&&state.estate[e.id])||{}).qty||0; if(!qty) return;
    const price=estatePrice(e.id);
    rent+=qty*price*e.rent*rentBonus; upkeep+=qty*price*e.upkeep;
  });
  if(rent>0) parts.push({label:"임대 수익",per15:rent/4,every:60});
  if(upkeep>0) parts.push({label:"임대 유지비",per15:-upkeep/4,every:60});
  const dividendBonus=rebirthBonus("dividend",.03);
  const dividend=expectedDividend()*dividendBonus;
  if(dividend>0){
    // 해외 주식 배당은 달러로 들어오므로 현금 카드에서 구분해 알려 줍니다.
    const foreignDividend=stocks.reduce((sum,s)=>sum+(s.own>0&&isForeignStock(s)?s.price*s.own*DIVIDEND_YIELD:0),0)*dividendBonus*fx.usd;
    parts.push({label:"주식 배당",per15:dividend/8,every:120,usd:foreignDividend>0});
  }
  return parts;
}
// 현금이 저절로 늘어나는 자동 수익을 한눈에 보여 줍니다. 실제 지급 주기가 달라
// 15초 평균으로 환산해 표시하고, 어디서 나온 돈인지 title에도 적습니다.
function cashFlowSummary(){
  const parts=autoIncomeParts();
  const per15=parts.reduce((sum,p)=>sum+p.per15,0);
  const title=parts.length
    ? parts.map(p=>`${p.label} · ${p.every}초마다 ${p.per15>=0?"+":"-"}${won(Math.abs(p.per15)*p.every/15)}`).join("\n")
    : "아무것도 하지 않을 때 현금을 늘리거나 줄이는 보유 자산이 없습니다.";
  const a=ensureAutoIncome(), mode=a.mode;
  const someUsd=parts.some(p=>p.usd);
  if(mode==="off"){
    return {mode,parts,per15,text:`자동 수익 꺼짐${parts.length?` · 15초 ${won(per15)} 포기`: ""}`,
      title:title+"\n받지 않음으로 설정되어 자동 수익이 현금에 들어오지 않습니다."};
  }
  if(mode==="manual"){
    return {mode,parts,per15,
      text:a.pending>=1?`모아 둔 자동 수익 ${won(a.pending)}`:(parts.length?`자동 수익 모아 두는 중 ${per15>=0?"+":""}${won(per15)}/15초`:"자동 수익 없음"),
      title:title+"\n모아 받기로 설정되어 현금 대신 대기액에 쌓입니다."};
  }
  if(!parts.length) return {mode,parts,per15,text:"자동 수익 없음",title};
  // 수익 없이 유지비만 나가는 경우를 수익처럼 표시하지 않습니다.
  if(!parts.some(p=>p.per15>0)) return {mode,parts,per15,title,text:`자동 수익 없음 · 자동 비용 15초 ${won(per15)}`};
  return {mode,parts,per15,title,
    text:`자동 수익 15초 평균 ${per15>=0?"+":""}${won(per15)}${someUsd?" (일부 달러)":""}`};
}
// 현금 카드의 문구를 눌러 여는 자동 수익 설정 창입니다.
function openAutoIncome(){
  const a=ensureAutoIncome(), flow=cashFlowSummary();
  const rows=flow.parts.map(p=>`<div class="holding-row compact"><b>${escHtml(p.label)}${p.usd?" (달러)":""}</b><span>${p.every}초마다</span><span class="${p.per15>=0?"up":"down"}">${p.per15>=0?"+":"-"}${won(Math.abs(p.per15)*p.every/15)}</span></div>`).join("");
  const detail=Object.keys(a.detail).filter(k=>+a.detail[k]>0)
    .map(k=>`<div class="holding-row compact"><b>${escHtml(k)}</b><span class="muted-sm">모아 둠</span><span>${won(a.detail[k])}</span></div>`).join("");
  openModal("자동 수익 설정",`
    <p class="muted-sm">기업·주식 배당, 채권 이자, 임대료처럼 아무것도 하지 않아도 들어오는 수익의 처리 방법입니다. 임대 유지비·대출 이자처럼 나가는 돈은 설정과 관계없이 그대로 차감됩니다.</p>
    <div class="button-row" style="margin-top:10px">${AUTO_INCOME_MODES.map(([id,label])=>`<button class="${a.mode===id?"buy":"ghost"}" onclick="setAutoIncomeMode('${id}');openAutoIncome()">${label}</button>`).join("")}</div>
    <div class="kpis" style="margin-top:12px">
      <div class="kpi"><small>15초 평균</small><b class="${flow.per15>=0?"up":"down"}">${flow.per15>=0?"+":""}${won(flow.per15)}</b></div>
      <div class="kpi"><small>모아 둔 금액</small><b>${won(a.pending)}</b></div>
      <div class="kpi"><small>받지 않은 누적</small><b>${won(a.skipped)}</b></div>
    </div>
    ${rows||`<p class="muted-sm" style="margin-top:8px">지금은 자동으로 들어오는 수익이 없습니다.</p>`}
    ${detail?`<h4 style="margin:12px 0 6px;font-size:13px">모아 둔 내역</h4>${detail}`:""}
    <p class="muted-sm" style="margin-top:8px">현재 설정: <b>${autoIncomeModeLabel()}</b> · 현금 카드의 문구를 눌러 언제든 바꿀 수 있습니다.</p>
    <div class="button-row" style="margin-top:10px">
      <button class="buy" onclick="collectAutoIncome();openAutoIncome()" ${a.pending>=1?"":"disabled"}>모아 둔 수익 받기</button>
      <button class="ghost" onclick="closeModal()">닫기</button>
    </div>`);
}
// 총자산 = 현금 + 달러 환산액 + 주식 + 금융상품 + 부동산 + 실물자산 + 기업 + 채권 + 공매도 평가손익
function grossAssetsKRW(){ return assetBreakdown().gross; }
// 순자산 = 총자산 - 부채(대출)
function netAssetsKRW(){ return grossAssetsKRW() - (state.loan||0); }
// 기존 함수 이름은 순자산 기준으로 유지합니다(등급·목표·랭킹 공통).
function totalAssetsKRW(){ return netAssetsKRW(); }

// 고액 자산 관리 수수료: 10억원 초과분 0.01%/60초, 100억원 초과분 0.02%/60초(구간별 합산).
function wealthFeeDue(net=totalAssetsKRW()){
  const n=Math.max(0,+net||0), free=WEALTH_FEE.free;
  if(n<=free) return 0;
  const first=Math.min(n,WEALTH_FEE.tiers[1].from)-free;
  const second=Math.max(0,n-WEALTH_FEE.tiers[1].from);
  return Math.round(first*WEALTH_FEE.tiers[0].rate + second*WEALTH_FEE.tiers[1].rate);
}
function wealthFeeRateText(net){
  return Math.max(0,+net||0)>WEALTH_FEE.tiers[1].from?"0.02%" : "0.01%";
}
function chargeWealthFee(){
  const due=wealthFeeDue();
  if(due<1) return 0;
  const paid=Math.min(due,Math.max(0,+state.cash||0));
  if(paid<=0) return 0;
  state.cash-=paid;
  state.wealthFeePaid=Math.max(0,+state.wealthFeePaid||0)+paid;
  state.wealthFeeAt=state.marketSeconds;
  if(state.marketSeconds%600===0 && paid>=1000){
    notify("tax","자산 관리 수수료",`${won(paid)} 차감 · 누적 ${won(state.wealthFeePaid)}`);
  }
  return paid;
}

// ── 환생(영구 성장) ─────────────────────────────────────────
function ensureRebirth(){
  if(!state.rebirth || typeof state.rebirth!=="object") state.rebirth={count:0,points:0,spent:0,upgrades:{},bestNet:0,history:[],notified:false};
  const r=state.rebirth;
  r.count=Math.max(0,Math.floor(+r.count||0));
  r.points=Math.max(0,Math.floor(+r.points||0));
  r.spent=Math.max(0,Math.floor(+r.spent||0));
  r.bestNet=Math.max(0,+r.bestNet||0);
  if(!r.upgrades || typeof r.upgrades!=="object" || Array.isArray(r.upgrades)) r.upgrades={};
  REBIRTH_UPGRADES.forEach(u=>{ r.upgrades[u.id]=Math.max(0,Math.min(u.max,Math.floor(+r.upgrades[u.id]||0))); });
  if(!Array.isArray(r.history)) r.history=[];
  r.notified=!!r.notified;
  return r;
}
function rebirthLevel(id){
  const r=ensureRebirth(), u=REBIRTH_UPGRADES.find(x=>x.id===id);
  if(!u) return 0;
  return Math.max(0,Math.min(u.max,Math.floor(+r.upgrades[id]||0)));
}
function rebirthCost(id){
  const u=REBIRTH_UPGRADES.find(x=>x.id===id); if(!u) return Infinity;
  const lv=rebirthLevel(id);
  if(lv>=u.max) return Infinity;
  return u.base + u.step*lv;
}
function rebirthPointsFor(net){
  const v=Math.max(0,+net||0);
  if(v<REBIRTH_MIN) return 0;
  return Math.max(1,Math.floor(Math.sqrt(v/10000000)));
}
function canRebirth(){ return totalAssetsKRW()>=REBIRTH_MIN; }
function rebirthStartCash(){ return START_CASH + 2000000*rebirthLevel("start"); }
function rebirthBonus(id, per){ return 1 + per*rebirthLevel(id); }
function stockFeeRate(){ return FEE_STOCK*(1-0.1*rebirthLevel("fee")); }
function tradeTaxRate(){ return TAX_TRADE*(1-0.1*rebirthLevel("fee")); }
// 주식 감각 업그레이드: 매도 실현이익의 일정 비율을 원화 현금으로 추가 지급합니다(이익이 날 때만).
function creditStockBonus(profitKRW){
  const bonus=Math.max(0,+profitKRW||0)*0.02*rebirthLevel("stock");
  if(bonus>0) state.cash=(state.cash||0)+bonus;
  return bonus;
}
// ── 부동산·실물자산·기업 가치 ─────────────────────
function estatePrice(id){ const d=ESTATES.find(x=>x.id===id); return (state.altPrices && Number.isFinite(state.altPrices[id])) ? state.altPrices[id] : (d?d.price:0); }
function estateValue(){ return ESTATES.reduce((a,e)=>a + (state.estate&&state.estate[e.id]?state.estate[e.id].qty:0)*estatePrice(e.id),0); }
function metalPrice(id){ const d=METALS.find(x=>x.id===id); return (state.altPrices && Number.isFinite(state.altPrices[id])) ? state.altPrices[id] : (d?d.price:0); }
function metalValue(){ return METALS.reduce((a,m)=>a + ((state.metals&&state.metals[m.id]?state.metals[m.id].qty:0)||0)*metalPrice(m.id),0); }
function companyValue(){

}

function visibleStocks(group){

  if(q) list=list.filter(s=>`${s.name} ${s.ticker} ${s.theme} ${s.market}`.toLowerCase().includes(q));

let audioCtx=null;

  try{

    o.type="sine"; o.frequency.value=kind==="goal"?880:kind==="dividend"?660:520;
    g.gain.value=0.05;

  }catch(e){}
}
const notifySeen={};
function notify(kind,title,text){
  if(OFFLINE_REPLAY) return;
  const n=state.notify||{};
  if(n.master===true) return;      // 모든 알림 끄기
  if(n[kind]===false) return;      // 종류별 끄기
  // 화면을 보지 않는 사용자에게도 알림을 전달합니다.
  const liveEl=$("liveRegion"); if(liveEl) liveEl.textContent=[title,text].filter(Boolean).join(" ");
  // 같은 이벤트가 짧은 간격으로 반복되면 토스트·알림을 한 번만 남깁니다.
  const dedupeKey=kind+"|"+title+(kind==="stock"?"|"+(text||"").slice(0,24):"");
  const now=Date.now();
  if(notifySeen[dedupeKey] && now-notifySeen[dedupeKey]<15000) return;
  notifySeen[dedupeKey]=now;
  // 화면 토스트·알림 센터를 모두 끈 상태라도, 앱 밖 알림을 켜 두었으면 전달합니다.
  if(PUSH_KINDS.includes(kind)) sendPushNotification(title,text,{tag:kind});
  if(n.toast===false && n.center===false) return; // 둘 다 끄면 기록도 토스트도 남기지 않습니다.
  if(n.center!==false){
    if(!Array.isArray(state.alerts)) state.alerts=[];
    state.alerts.unshift({at:Date.now(),kind,title,text,read:false});
    if(state.alerts.length>40) state.alerts.pop();
    updateBell();
  }
  if(n.toast!==false) showToast(title,text);
  if(n.sound) beep(kind);

}

async function enablePushNotifications(){

      showToast("알림 권한 확인 필요","브라우저 알림 창이 보이지 않으면 주소창 왼쪽 사이트 설정에서 알림을 허용해 주세요.");

  }

function sendPushNotification(title,text,opts){
  if(!pushEnabled()) return Promise.resolve(false);
  const visible=typeof document!=="undefined" && document.visibilityState!=="hidden";
  if(visible && !(opts&&opts.force)) return Promise.resolve(false);
  const tag="mpg-"+((opts&&opts.tag)||"alert");
  const body=String(text==null?"":text);
  const options={body,icon:"icon.svg",badge:"icon.svg",tag,data:{url:(opts&&opts.url)||"./"}};
  const fallback=()=>{
    try{ new window.Notification(title,{body,icon:"icon.svg",tag}); return true; }
    catch(e){ return false; }
  };
  try{
    if(navigator.serviceWorker && navigator.serviceWorker.ready){
      return Promise.resolve(navigator.serviceWorker.ready)
        .then(reg=>{
          if(reg && typeof reg.showNotification==="function") return reg.showNotification(title,options).then(()=>true);
          return fallback();
        })
        .catch(()=>fallback());
    }
  }catch(e){}
  return Promise.resolve(fallback());
}
function toastDurationMs(){

}
function toastLimit(){

}
function showToast(title,text,opts){

  el.innerHTML=`<b>${escHtml(title)}</b>${escHtml(text||"")}`;

    for(let i=0;i<wrap.children.length;i++){
      const c=wrap.children[i];
      const pinned=c&&String(c.className||"").split(/\s+/).includes("toast-ipo");
      if(!pinned){ victim=c; break; }
    }
    if(!victim) break; // 공모주 알림만 남아 있으면 일반 알림을 잠시 보류합니다.
    wrap.removeChild(victim);
  }
  const ms=(opts&&Number.isFinite(+opts.durationMs))?Math.max(2000,Math.min(20000,+opts.durationMs)):toastDurationMs();
  setTimeout(()=>{ try{ wrap.removeChild(el); }catch(e){} },ms);
}

function modalKeydown(ev){
  const root=$("modalRoot"); if(!root || !root.classList || !root.classList.contains("on")) return;
  if(ev.key==="Escape"){ ev.preventDefault(); closeModal(); return; }
  if(ev.key!=="Tab") return;
  const nodes=root.querySelectorAll?root.querySelectorAll("button,input,select,textarea,a[href]"):[];
  const focusables=[...nodes].filter(el=>el && !el.disabled);
  if(!focusables.length) return;
  const first=focusables[0], last=focusables[focusables.length-1];
  if(ev.shiftKey && document.activeElement===first){ ev.preventDefault(); if(last.focus) last.focus(); }
  else if(!ev.shiftKey && document.activeElement===last){ ev.preventDefault(); if(first.focus) first.focus(); }
}

function recordTrade(s,side,qty,priceNative,profitKRW){
  if(!Array.isArray(state.journal)) state.journal=[];
  const foreign=isForeignStock(s);
  const valueKRW=priceNative*qty*(foreign?fx.usd:1);
  const fee=valueKRW*stockFeeRate();
  state.feesTotal=(state.feesTotal||0)+fee;
  state.journal.unshift({at:Date.now(),name:s.name,side,qty,valueKRW,fee,profit:side==="sell"?(profitKRW||0):0});
  if(state.journal.length>200) state.journal.pop();
  bumpDaily("trades");
  checkAchievements();
  saveGame();
}
function performanceStats(){
  const j=state.journal||[];
  const sells=j.filter(x=>x.side==="sell"), buys=j.filter(x=>x.side==="buy");
  const wins=sells.filter(x=>x.profit>0);
  const realized=sells.reduce((a,x)=>a+(x.profit||0),0);
  const volume=j.reduce((a,x)=>a+(x.valueKRW||0),0);
  const buyVolume=buys.reduce((a,x)=>a+(x.valueKRW||0),0);
  const sellVolume=sells.reduce((a,x)=>a+(x.valueKRW||0),0);
  const held=stocks.filter(s=>s.realizedProfit!==0);
  const roiRows=stockReturnRows();
  return {
    trades:j.length, buys:buys.length, sells:sells.length,
    winRate:sells.length?wins.length/sells.length:0,
    realized, volume, buyVolume, sellVolume, fees:state.feesTotal||0,
    unrealized:unrealizedPL(),
    periods:periodReturns(),
    roiRows, bestRoi:roiRows[0], worstRoi:roiRows[roiRows.length-1],
    best:[...held].sort((a,b)=>b.realizedProfit-a.realizedProfit)[0],
    worst:[...held].sort((a,b)=>a.realizedProfit-b.realizedProfit)[0]
  };
}

function bestProductForAuto(){
  let best=null,rate=-1;
  products.forEach(p=>{
    if(!canJoin(p.id)) return;

    if(!p.amount && r>rate){ rate=r; best=p; }

}

function saveAutoSettings(enable){
  const pct=+($("auto-pct")?$("auto-pct").value:60)||0;
  const min=+($("auto-min")?$("auto-min").value:0)||0;
  const goldPct=+($("auto-gold")?$("auto-gold").value:0)||0;
  const estatePct=+($("auto-estate")?$("auto-estate").value:0)||0;

  const takeProfit=Math.max(0,Math.min(200,+($("auto-tp")?$("auto-tp").value:20)||0));
  const stopLoss=Math.max(0,Math.min(100,+($("auto-sl")?$("auto-sl").value:10)||0));

  // 이제는 "규칙 저장"과 "자동 투자 켜기"를 분리합니다. enable를 넘기지 않으면 켜짐/꺼짐 상태를 그대로 둡니다.

// 자동 매매: 보유 종목이 설정한 익절/손절선에 닿으면 전량 매도합니다.
function autoSellRules(){
  const a=state.auto||{};
  if(!a.enabled || !a.autoSell || !state.marketOpen) return 0;
  const tp=(a.takeProfit||0)/100, sl=(a.stopLoss||0)/100;
  if(tp<=0 && sl<=0) return 0;
  let sold=0;
  const acct=state.tax.mode;
  stocks.forEach(s=>{
    const count=accountQty(s,acct), avg=accountAvgBuy(s,acct);
    if(count<=0 || !avg) return;
    const roi=(s.price-avg)/avg;
    if(!((tp>0&&roi>=tp)||(sl>0&&roi<=-sl))) return;
    if(!marketSellShares(s,count,acct)) return;
    addLog(`🤖 자동 매도: ${s.name} ${count}주 · ${pct(roi)} · ${taxModeLabel(acct)}`);
    sold++;
  });
  if(sold){
    notify("order","자동 매매 실행",`${sold}종목을 익절/손절 규칙으로 매도했습니다.`);
    saveGame(); update();
  }
  return sold;
}
function autoInvest(force){
  const a=state.auto||{};
  if(!force && !a.enabled) return 0;
  if(!force && !state.marketOpen) return 0;
  const min=Math.max(0,a.minCash||0);
  const budget=state.cash-min;
  if(budget<100000) return 0;
  const stockPart=Math.max(0,Math.min(100,a.stockPct||0))*budget/100;
  let invested=0;
  if(stockPart>0){
    const list=stocks.filter(s=>!isIndexFund(s));
    const perKRW=stockPart/list.length;
    list.forEach(s=>{
      const foreign=isForeignStock(s);
      const unitKRW=s.price*(1+stockFeeRate())*(foreign?fx.usd:1);
      const qty=Math.floor(perKRW/unitKRW);
      if(qty<=0) return;
      const costNative=qty*s.price*(1+stockFeeRate()), acct=state.tax.mode, principalKRW=qty*s.price*(foreign?fx.usd:1);
      if(!canTaxContribute(acct,principalKRW)) return;
      if(foreign){
        if(state.usd<costNative){
          const need=costNative-state.usd;
          const krw=need*fx.usd*(1+fxFeeRate());
          if(krw>state.cash) return;
          state.cash-=krw; state.usd+=need;
        }
      }else if(state.cash<costNative) return;
      if(!marketBuyShares(s,qty,acct)) return;
      invested+=principalKRW;
    });
  }
  // 자동 배분: 금·은과 부동산 비중(설정한 경우에만 동작, 기본 0%).
  const goldBudget=Math.max(0,state.cash-min)*((a.goldPct||0)/100);
  if(goldBudget>=metalPrice("gold")){
    const price=metalPrice("gold"), qty=Math.floor(goldBudget/price), cost=price*qty;
    if(qty>0){
      state.cash-=cost;
      const h=state.metals.gold||{qty:0,avg:0};
      h.avg=((h.avg*h.qty)+cost)/(h.qty+qty); h.qty+=qty; state.metals.gold=h;
      markDex("metals","gold"); invested+=cost;
    }
  }
  const estateBudget=Math.max(0,state.cash-min)*((a.estatePct||0)/100);
  if(estateBudget>0){
    const pick=ESTATES.filter(e=>estatePrice(e.id)<=estateBudget).sort((x,y)=>estatePrice(y.id)-estatePrice(x.id))[0];
    if(pick){
      const price=estatePrice(pick.id);
      state.cash-=price;
      const h=state.estate[pick.id]||{qty:0,avgBuy:0};
      h.avgBuy=((h.avgBuy*h.qty)+price)/(h.qty+1); h.qty++; state.estate[pick.id]=h;
      markDex("estates",pick.id); invested+=price;
    }
  }
  const remain=state.cash-min;
  if(remain>0){
    const p=bestProductForAuto();
    if(p && remain>=p.min){
      const v=Math.floor(remain/10000)*10000;
      if(v>0){
        if(p.amount===0) p.rate=gradeRateFor(p.id,currentGrade());
        state.cash-=v; p.amount+=v; invested+=v;
      }
    }
  }
  if(invested>0){
    addLog(`자동 적립 실행: ${won(invested)} 재투자`);
    notify("system","자동 적립",`${won(invested)}을 규칙대로 재투자했습니다.`);
    saveGame(); update();
  }
  return invested;
}

// ── 노동 · 생계 ───────────────────────────────────
function ensureLabor(){
  if(!state.labor || typeof state.labor!=="object") state.labor={shifts:0,earned:0,lastAt:{},warned:false,xp:0,points:0,stamina:100,skills:{focus:0,stamina:0,service:0}};
  const l=state.labor;
  if(!Number.isFinite(+l.shifts) || +l.shifts<0) l.shifts=0;
  if(!Number.isFinite(+l.earned) || +l.earned<0) l.earned=0;
  if(!l.lastAt || typeof l.lastAt!=="object") l.lastAt={};
  l.xp=Math.max(0,+l.xp||0); l.points=Math.max(0,Math.floor(+l.points||0));
  if(!l.skills || typeof l.skills!=="object") l.skills={focus:0,stamina:0,service:0};
  ["focus","stamina","service"].forEach(k=>{ l.skills[k]=Math.max(0,Math.min(5,Math.floor(+l.skills[k]||0))); });
  const staminaMax=100+20*(l.skills.stamina||0);
  l.stamina=Math.max(0,Math.min(staminaMax,Number.isFinite(+l.stamina)?+l.stamina:staminaMax));
  if(!Number.isFinite(+l.restAt)) l.restAt=0;
  if(+l.restAt>Date.now()) l.restAt=0; // 저장 파일의 미래 시각으로 휴식이 잠기지 않게 합니다.
  return l;
}
function laborCareerLevel(){ return 1+Math.floor(ensureLabor().xp/120); }
function laborStaminaMax(){ const l=ensureLabor(); return 100+20*(l.skills.stamina||0); }
function laborCondition(){
  const l=ensureLabor(), ratio=Math.max(0,Math.min(1,l.stamina/Math.max(1,laborStaminaMax())));
  // 컨디션 40% 이상은 정상 지급, 그 아래로 떨어지면 일당·속도에 불이익이 생깁니다.
  return ratio>=.4?1:Math.max(.55,.55+.45*(ratio/.4));
}
function laborBeginnerHelp(){
  // 환생 뒤에는 영구 업그레이드가 있으므로 초보자 도움을 다시 켜지 않습니다.
  if(ensureRebirth().count>0) return false;
  if(state.settings && state.settings.beginnerMode===false) return false;
  return ensureLabor().shifts<10;
}
function laborZoneFor(job){ return Math.max(.05,Math.min(.45,(job&&job.zone||.2)*(1+.06*(ensureLabor().skills.focus||0))*(laborBeginnerHelp()?1.2:1))); }
function laborSkillCost(id){ const l=ensureLabor(), lv=l.skills[id]||0; return 1+lv; }
function buyLaborSkill(id){
  if(!["focus","stamina","service"].includes(id)) return false;
  const l=ensureLabor(), lv=l.skills[id]||0, cost=laborSkillCost(id);
  if(lv>=5) return alert("이미 최고 레벨입니다.");
  if(l.points<cost) return alert(`스킬 포인트가 부족합니다. (필요 ${cost}P)`);
  l.points-=cost; l.skills[id]=lv+1;
  if(id==="stamina") l.stamina=Math.min(laborStaminaMax(),l.stamina+20);

const LABOR_ROUNDS=3;

function laborRoundResult(job,p){

function laborShiftPay(job,results,condition){
  const base=(job&&job.pay)||0;
  const list=(results||[]).map(r=>typeof r==="string"?r:(r&&r.grade)||"miss");
  const perfect=list.filter(g=>g==="perfect").length;
  const good=list.filter(g=>g==="good").length;
  const miss=Math.max(0,list.length-perfect-good);

  const career=Math.min(2.5,1+0.06*Math.max(0,laborCareerLevel()-1));

// 기억 게임은 순서가 길어질수록 보여 주는 시간도 늘립니다. 예전에는 길이와

let laborKeyRef=null;
function laborKeydown(ev){

function laborRenderTap(){

function laborRenderMemory(){

function laborMakeMath(){

  const rnd=(min,max)=>min+Math.floor(Math.random()*(max-min+1));
  const a=rnd(7,19), b=rnd(3,13), c=rnd(2,11), d=rnd(2,9);
  const patterns=[
    {text:`${a} × ${b} + ${c} × ${d} = ?`,answer:a*b+c*d},
    {text:`${a} × ${b} − ${c} = ?`,answer:a*b-c},
    {text:`(${a} + ${b}) × ${c} = ?`,answer:(a+b)*c},
    {text:`${a} × (${b} + ${c}) − ${d} = ?`,answer:a*(b+c)-d},
    {text:`${a*b} ÷ ${a} + ${c} × ${d} = ?`,answer:b+c*d}
  ];
  const q=patterns[Math.floor(Math.random()*patterns.length)];
  const ans=q.answer;

function laborShowResult(job,sum,pay){
  const line=pay>0?`일당 <b>${won(pay)}</b>을 받았습니다.`:(job.req>0?`모든 작업을 놓쳐 일당을 받지 못했습니다. ${job.cooldown}초 뒤 다시 도전할 수 있습니다.`:"모든 작업을 놓쳐 일당을 받지 못했습니다. 다시 도전하세요.");
  openModal(`${job.icon} ${job.name} 결과`,`
    <div class="kpis"><div class="kpi"><small>⭐ 완벽</small><b>${sum.perfect}회</b></div><div class="kpi"><small>✅ 성공</small><b>${sum.good}회</b></div><div class="kpi"><small>❌ 실패</small><b>${sum.miss}회</b></div><div class="kpi"><small>일당</small><b>${won(pay)}</b></div></div>
    <p style="margin-top:10px;font-size:13px">${line}${pay>0?` (최대 ${won(job.pay)} · 달성률 ${Math.round(sum.rate*100)}%)`:""}</p>
    <button class="buy" style="width:100%;margin-top:12px" onclick="closeLaborGame()">확인</button>`);
}
function laborFinishShift(){
  const s=laborSession; if(!s || s.paid) return false;
  // 보상 지급은 세션당 정확히 한 번만 실행합니다.
  s.paid=true;
  const job=s.job, l=ensureLabor();
  const condition=laborCondition();
  const sum=laborShiftPay(job,s.results,condition);
  laborAbortShift(true);
  // 컨디션 소모와 경력 XP는 성공·실패와 관계없이 실제 작업을 마친 만큼 반영합니다.
  const staminaCost=Math.max(4,12+(job.diff||1)*3-(l.skills.stamina||0));
  l.stamina=Math.max(0,l.stamina-staminaCost);
  const beforeLevel=laborCareerLevel();
  const gainedXp=18+(job.diff||1)*6+sum.perfect*4;
  l.xp+=gainedXp;
  const afterLevel=laborCareerLevel();
  if(afterLevel>beforeLevel){ l.points+=(afterLevel-beforeLevel); notify("system","노동 경력 상승",`Lv.${afterLevel} · 스킬 포인트 +${afterLevel-beforeLevel}`); }
  if(sum.pay<=0){
    // 기본 노동은 바로 재도전할 수 있지만, 고임금 노동은 실패해도 현장 복귀 시간이 필요합니다.
    if((job.req||0)>0) l.lastAt[job.id]=Date.now();
    const retry=(job.req||0)>0?`${job.cooldown}초 뒤 다시 도전할 수 있습니다.`:"일당 없이 바로 다시 도전할 수 있습니다.";
    addLog(`💼 ${job.name} 작업 실패: 일당 없음 (경력 XP·컨디션은 반영)`);
    notify("system","노동 실패",`${job.name} 작업을 모두 놓쳤습니다. ${retry}`);
    if(!OFFLINE_REPLAY){ saveGame(); portfolio(); update(); }
    laborShowResult(job,sum,0);
    return false;
  }
  l.shifts++;
  l.earned+=sum.pay;
  l.lastAt[job.id]=Date.now();
  state.cash=(state.cash||0)+sum.pay;
  addLog(`💼 ${job.name} 노동 완료: +${won(sum.pay)} (완벽 ${sum.perfect}·성공 ${sum.good}·실패 ${sum.miss}, 컨디션 ${Math.round(condition*100)}%)`);
  notify("system","노동 완료",`${job.name} +${won(sum.pay)} · 컨디션 ${Math.round(l.stamina)}/${laborStaminaMax()} · 경력 Lv.${laborCareerLevel()}`);
  if(!OFFLINE_REPLAY){ saveGame(); portfolio(); update(); }
  laborShowResult(job,sum,sum.pay);
  return true;
}
function closeLaborGame(){ laborAbortShift(true); closeModal(); portfolio(); refreshLaborUI(); }
function workLabor(id){
  const job=laborJob(id); if(!job) return false;
  if(laborSession){ alert("이미 노동 중입니다. 진행 중인 작업을 먼저 끝내 주세요."); return false; }

    alert(`아직 쉬는 중입니다. ${Math.ceil(remain/1000)}초 후 다시 일할 수 있습니다.`);

function refreshLaborUI(){

function companyGradeInfo(c=state.company){

// ── 주문 체결 공통 ─────────────────────────────
// 예약 주문·자동 리밸런싱이 같은 수수료/세금/기록 경로를 쓰도록 모았습니다.
function marketBuyShares(s,qty,account){
  ensureAdvancedState();
  qty=Math.floor(+qty||0); if(!s||qty<=0) return false;
  const acct=TAX_ACCOUNTS.includes(account)?account:state.tax.mode, foreign=isForeignStock(s);
  const unit=s.price*(1+stockFeeRate()), cost=unit*qty, principalKRW=s.price*qty*(foreign?fx.usd:1);
  if(!canTaxContribute(acct,principalKRW)) return false;
  if(foreign ? state.usd<cost : state.cash<cost) return false;
  if(foreign) state.usd-=cost; else state.cash-=cost;
  s.avgBuy=((s.avgBuy*s.own)+unit*qty)/(s.own+qty);
  s.own+=qty;
  addTaxContribution(acct,principalKRW);
  addTaxLot(s,qty,unit,acct);
  recordTrade(s,"buy",qty,s.price,0);
  return true;
}
function simulateFifoBasis(s,qty,account){
  const acct=TAX_ACCOUNTS.includes(account)?account:state.tax.mode;
  const lots=ensureTaxLots(s).filter(l=>l.account===acct).map(l=>({qty:l.qty,price:l.price}));
  let left=Math.max(0,Math.floor(+qty||0)), basis=0;
  while(left>0&&lots.length){
    const l=lots[0], take=Math.min(left,l.qty);
    basis+=take*l.price; l.qty-=take; left-=take;
    if(l.qty<=0) lots.shift();
  }
  if(left>0) basis+=left*Math.max(0,+s.avgBuy||+s.price||0);
  return basis;
}
function taxPreviewFor(s,qty,account){
  ensureAdvancedState();
  qty=Math.floor(+qty||0);
  const acct=TAX_ACCOUNTS.includes(account)?account:state.tax.mode;
  const available=s?accountQty(s,acct):0;
  if(!s||qty<=0) return {ok:false,reason:"수량을 입력해 주세요.",account:acct,available};
  if(qty>available) return {ok:false,reason:`${taxModeLabel(acct)}에 매도 가능한 수량은 ${available}주입니다.`,account:acct,available};
  const foreign=isForeignStock(s);
  const revenue=s.price*(1-stockFeeRate()-tradeTaxRate())*qty;
  const basis=simulateFifoBasis(s,qty,acct);
  const profit=revenue-basis, profitKRW=foreign?profit*fx.usd:profit;
  const projection=taxProjection(profitKRW,acct);
  const revenueKRW=foreign?revenue*fx.usd:revenue;
  return {ok:true,account:acct,available,qty,revenue,revenueKRW,basis,profit,profitKRW,tax:projection.tax,taxable:projection.taxable,carryUsed:projection.carryUsed,deferred:projection.deferred,netKRW:revenueKRW-projection.tax};
}
function marketSellShares(s,qty,account){
  ensureAdvancedState();
  qty=Math.floor(+qty||0);
  const acct=TAX_ACCOUNTS.includes(account)?account:state.tax.mode;
  if(!s||qty<=0||accountQty(s,acct)<qty) return false;
  const foreign=isForeignStock(s);
  const grossNative=s.price*qty;
  const tradeTaxNative=grossNative*tradeTaxRate();
  const revenue=s.price*(1-stockFeeRate()-tradeTaxRate())*qty;
  // FIFO 로트의 취득원가를 세금·실현손익 계산에 사용합니다.
  const profit=revenue-consumeTaxLots(s,qty,acct);
  const profitKRW=foreign?profit*fx.usd:profit;
  state.tradeTaxPaid=(state.tradeTaxPaid||0)+(foreign?tradeTaxNative*fx.usd:tradeTaxNative);
  recordTaxLedger({kind:"trade",label:"증권거래세",account:acct,base:foreign?grossNative*fx.usd:grossNative,rate:tradeTaxRate(),tax:foreign?tradeTaxNative*fx.usd:tradeTaxNative,loan:0,note:`${s.name} ${qty}주 매도 · 수수료 별도`});
  if(foreign){ state.usd+=revenue; s.realizedProfit+=profitKRW; } else { state.cash+=revenue; s.realizedProfit+=profit; }
  s.own-=qty; if(s.own===0) s.avgBuy=0;
  recordTrade(s,"sell",qty,s.price,profitKRW);
  settleTax(profitKRW,acct); creditStockBonus(profitKRW);
  return true;
}

function ensureShorts(){ if(!Array.isArray(state.shorts)) state.shorts=[]; return state.shorts; }
function shortStock(stockId,qty){
  if(!checkMarketOpen()) return;
  const s=stock(stockId); if(!s) return alert("종목을 선택해 주세요.");
  if(isIndexFund(s)) return alert("지수 ETF는 공매도할 수 없습니다.");
  qty=Math.floor(+qty||0);
  if(qty<=0) return alert("공매도 수량을 입력해 주세요.");
  const foreign=isForeignStock(s);
  const valueKRW=s.price*qty*(foreign?fx.usd:1);
  const marginNeed=valueKRW*0.3;
  const cashKRW=state.cash+(state.usd||0)*fx.usd;
  if(cashKRW<marginNeed) return alert(`공매도에는 포지션의 30%(${won(marginNeed)}) 이상의 현금이 필요합니다.`);
  if(!confirmTrade("공매도",`${s.name} ${qty}주 @ ${foreign?usdStr(s.price):won(s.price)} · 증거금 ${won(marginNeed)}`)) return;
  const proceeds=s.price*qty*(1-stockFeeRate());
  if(foreign) state.usd+=proceeds; else state.cash+=proceeds;
  ensureShorts().push({id:`sh${Date.now()}${Math.floor(Math.random()*1000)}`,stockId,qty,entry:s.price,margin:marginNeed,at:state.marketSeconds});
  addLog(`🔻 공매도: ${s.name} ${qty}주 @ ${foreign?usdStr(s.price):won(s.price)}`);
  notify("order","공매도 실행",`${s.name} ${qty}주`);
  saveGame(); update(); if(activePage()==="short") shortPage();
}
function coverShort(id,qty,force){
  const pos=ensureShorts().find(p=>p.id===id); if(!pos) return;
  const s=stock(pos.stockId); if(!s) return;
  qty=Math.min(Math.floor(+qty||pos.qty)||pos.qty,pos.qty);
  const foreign=isForeignStock(s);
  const cost=s.price*qty*(1+stockFeeRate());
  if(!force && (foreign ? state.usd<cost : state.cash<cost)) return alert("환매에 필요한 현금이 부족합니다.");
  if(foreign){
    if(state.usd<cost){
      const need=(cost-state.usd)*fx.usd;
      if(state.cash>=need){ state.cash-=need; }
      else { const short=need-state.cash; state.cash=0; state.loan=(state.loan||0)+short; state.loanRate=state.loanRate||0.08; addLog(`⚠️ 환매 부족분 ${won(short)}이 대출로 전환되었습니다.`); }
      state.usd=cost;
    }
    state.usd-=cost;
  } else {
    if(state.cash<cost){ const short=Math.max(0,cost-state.cash); state.cash=0; state.loan=(state.loan||0)+short; state.loanRate=state.loanRate||0.08; addLog(`⚠️ 환매 부족분 ${won(short)}이 대출로 전환되었습니다.`); }
    else state.cash-=cost;
  }
  const pnl=(pos.entry-s.price)*qty*(1-stockFeeRate());
  const pnlKRW=foreign?pnl*fx.usd:pnl;
  state.shortRealized=(state.shortRealized||0)+pnlKRW;
  pos.qty-=qty;
  if(pos.qty<=0) state.shorts=ensureShorts().filter(p=>p.id!==id);
  addLog(`${force?"⚠️ 강제 청산":"🔺 공매도 환매"}: ${s.name} ${qty}주 · 실현손익 ${won(pnlKRW)}`);
  notify("order",force?"마진콜 · 강제 청산":"공매도 환매",`${s.name} ${qty}주 · ${won(pnlKRW)}`);
  saveGame(); update(); if(activePage()==="short") shortPage();
}
function coverShortAll(){ ensureShorts().slice().forEach(p=>coverShort(p.id,p.qty)); }
// 가격이 진입가 대비 30% 오르면 증거금이 녹아 강제 청산됩니다.
function checkShortMargins(){
  ensureShorts().slice().forEach(p=>{
    const s=stock(p.stockId); if(!s) return;
    if(s.price>=p.entry*1.3) coverShort(p.id,p.qty,true);
  });
}

function ensureBonds(){ if(!state.bonds||typeof state.bonds!=="object") state.bonds={qty:0,avg:0}; const b=state.bonds; b.qty=Math.max(0,+b.qty||0); b.avg=Math.max(0,+b.avg||0); return b; }
function buyBond(qty){
  const b=ensureBonds(); qty=Math.floor(+qty||0);
  if(qty<=0) return alert("매수 수량을 입력해 주세요.");
  const price=bondUnitPrice(), cost=price*qty*(1+BOND.fee);
  if(state.cash<cost) return alert(`채권 매수에는 ${won(cost)}이 필요합니다.`);
  state.cash-=cost;
  b.avg=((b.avg*b.qty)+price*qty)/(b.qty+qty);

}
function sellBond(qty){

  if(qty<=0) return alert("보유한 채권이 없습니다.");
  const price=bondUnitPrice();
  const revenue=price*qty*(1-BOND.fee);
  state.cash+=revenue;
  b.qty-=qty; if(b.qty===0) b.avg=0;

function ensureIPO(){
  if(!state.ipo||typeof state.ipo!=="object") state.ipo={offer:null,nextAt:0,history:[]};
  const ipo=state.ipo;
  if(!Array.isArray(ipo.history)) ipo.history=[];
  if(!Number.isFinite(+ipo.nextAt)) ipo.nextAt=0;
  return ipo;
}
// 공모주로 상장된 종목을 주식 목록에 추가합니다(저장 데이터 복원에도 사용).
function ensureListedStock(def,price){
  const exist=stocks.find(s=>s.id===def.id); if(exist) return exist;
  const p=Math.max(100,Math.round((+price||def.price||1000)/100)*100);
  const revenue=Math.max(100000000,Math.round(p*10000));
  const s={id:def.id,name:def.name,ticker:def.ticker||def.id.toUpperCase(),market:"국내",group:"domestic",price:p,start:p,drift:.001,vol:def.vol||.035,theme:def.theme||"신규 상장",own:0,lastMove:0,avgBuy:0,realizedProfit:0,hist:[p],revenue,opProfit:Math.round(revenue*.12),indexPower:0,ipo:true,
    prevClose:p,dayOpen:p,dayRet:0,dayIndex:marketDayIndex(state.marketSeconds)};
  stocks.push(s);
  return s;
}
function resetListedStocks(){ stocks=stocks.filter(s=>!s.ipo); state.listedIds=[]; }
function announceIPO(o, urgent){
  const left=clockText(realSeconds(Math.max(0,o.closesAt-state.marketSeconds)));
  const title=urgent?"⏰ 공모주 청약 마감 임박":"📢 공모주 청약 시작";
  // 알림 설정을 꺼 두었어도 반드시 표시합니다. 토스트를 누르면 바로 청약 화면으로 이동합니다.
  notifyAlways(title,`${o.name}(${o.ticker}) · 공모가 ${won(o.price)} · ${left} 남음 · 눌러서 청약하기`,{
    durationMs:urgent?10000:Math.min(20000,Math.max(8000,realSeconds(Math.max(0,o.closesAt-state.marketSeconds))*1000)),
    onClick:()=>show("ipo")
  });
}
function tickIPO(){
  const ipo=ensureIPO();
  if(ipo.offer){
    if(state.marketSeconds>=ipo.offer.closesAt) closeIPO();
    else if(!ipo.offer.reminded && ipo.offer.closesAt-state.marketSeconds<=30){
      ipo.offer.reminded=true;
      announceIPO(ipo.offer,true);
    }
    return;
  }
  if(state.marketSeconds<ipo.nextAt) return;
  const pool=IPO_POOL.filter(d=>!stocks.some(s=>s.id===d.id));
  if(!pool.length){ ipo.nextAt=state.marketSeconds+300; return; }
  const d=pool[Math.floor(worldTickRand("ipo",1)*pool.length)];
  const price=Math.max(100,Math.round(d.price*(0.9+worldTickRand("ipo",2)*0.2)/100)*100);
  ipo.offer={id:d.id,name:d.name,ticker:d.ticker,group:"domestic",theme:d.theme,vol:d.vol,price,qty:60000,closesAt:state.marketSeconds+120,subscribed:0,mine:0,reminded:false};
  publishBreakingNews("📢 공모주 청약", `${d.name}(${d.ticker}) 공모가 ${won(price)} · 120초간 청약 접수 중`);
  announceIPO(ipo.offer,false);
}
function setIPOAmount(mode){
  const o=ensureIPO().offer, el=$("ipo-amount"); if(!o||!el) return;
  let amount=Math.max(0,Math.floor(+state.cash||0));
  if(mode==="half") amount=Math.floor(amount/2);

function subscribeIPO(){

function cancelIPO(){

  o.reserved=0;
  o.subscribed=Math.max(0,(o.subscribed||0)-refund);

  o.lastAction={type:"cancel",amount:refund,at:Date.now(),shares:0};

  if(!OFFLINE_REPLAY){ saveGame(); ipoPage(); update(); }
}
function closeIPO(){
  const ipo=ensureIPO(),o=ipo.offer; if(!o) return;
  const mine=Math.max(0,+o.mine||0);
  const mineShares=o.price>0?mine/o.price:0;
  const demandShares=Math.round(o.qty*(0.3+worldRand("ipo",o.id,1)*2.2))+mineShares;
  const ratio=Math.min(1,o.qty/Math.max(1,demandShares));
  const alloc=mine>0?Math.max(0,Math.floor(mineShares*ratio)):0;
  const acct=TAX_ACCOUNTS.includes(o.account)?o.account:"general", reserved=Math.max(0,+o.reserved||0);
  if(mine>0) state.cash+=mine-alloc*o.price;
  if(reserved>0) releaseTaxContribution(acct,Math.max(0,reserved-alloc*o.price));
  o.reserved=0;
  const open=Math.max(100,Math.round(o.price*(0.9+worldRand("ipo",o.id,2)*0.35)/100)*100);
  const s=ensureListedStock(o,o.price);
  s.start=o.price; s.price=open; s.lastMove=(open-o.price)/o.price; s.hist=[o.price,open];
  if(alloc>0){ s.own=alloc; s.avgBuy=o.price; addTaxLot(s,alloc,o.price,acct); recordTrade(s,"buy",alloc,o.price,0); }
  if(!state.listedIds.includes(o.id)) state.listedIds.push(o.id);
  ipo.history.unshift({id:o.id,name:o.name,price:o.price,open,alloc,at:state.marketSeconds});
  ipo.history=ipo.history.slice(0,8);
  ipo.offer=null;
  ipo.lastResult={name:o.name,price:o.price,open,alloc,mine,refund:Math.max(0,mine-alloc*o.price),at:state.marketSeconds};
  ipo.nextAt=state.marketSeconds+300+Math.floor(worldTickRand("ipoNext",1)*300);
  addLog(`📈 신규 상장: ${o.name} 공모가 ${won(o.price)} → 시초가 ${won(open)}${alloc?` · ${alloc}주 배정`:""}${mine&&!alloc?" · 전액 환불":""}`);
  publishBreakingNews("📈 신규 상장", `${o.name}(${o.ticker}) 상장 · 공모가 ${won(o.price)} · 시초가 ${won(open)}`);
  if(mine>0 && OFFLINE_REPLAY){
    // 재생 중에는 알림을 띄우지 않습니다(상장 이력·뉴스는 그대로 기록됨).
  } else if(mine>0){
    notifyAlways("📈 공모주 상장 결과",`${o.name} · ${alloc?`${alloc}주 배정`:"배정 0주"} · 환불 ${won(Math.max(0,mine-alloc*o.price))} · 시초가 ${won(open)}`,{durationMs:6500,onClick:()=>show("holdings")});
  } else {
    notify("system","공모주 상장",`${o.name} · 청약 미참여 · 시초가 ${won(open)}`);
  }
  if(!OFFLINE_REPLAY && activePage()==="ipo") ipoPage();
  if(!OFFLINE_REPLAY){ saveGame(); update(); }
}

// ── 자동 리밸런싱 ─────────────────────────────
function autoRebalance(){
  const a=state.auto||{};
  if(!a.enabled||!a.rebalance||!state.marketOpen) return 0;
  const gross=grossAssetsKRW(); if(gross<=0) return 0;
  const target=Math.max(0,Math.min(100,Number.isFinite(+a.rebStockPct)?+a.rebStockPct:60))/100;
  const band=Math.max(0.02,Math.min(0.2,Number.isFinite(+a.rebBand)?+a.rebBand:5)/100);
  const now=stockValueKRW()/gross;
  let moved=0;
  const acct=state.tax.mode;
  if(now>target+band){
    let need=(now-target-band)*gross;
    const taxAware=!!a.taxAware, taxBudget=Math.max(0,+a.taxBudget||0);
    const sellList=[...stocks].filter(s=>accountQty(s,acct)>0&&!isIndexFund(s));
    // 세금 고려 모드: 평가차익이 작은(또는 손실인) 종목부터 매도해 양도세를 줄입니다.
    sellList.sort(taxAware
      ?(x,y)=>{const ax=accountAvgBuy(x,acct),ay=accountAvgBuy(y,acct);return ((x.price-ax)/Math.max(1,ax))-((y.price-ay)/Math.max(1,ay));}
      :(x,y)=>y.price*accountQty(y,acct)-x.price*accountQty(x,acct));
    sellList.forEach(s=>{
      if(need<=0) return;
      const unit=s.price*(isForeignStock(s)?fx.usd:1);
      const qty=Math.min(accountQty(s,acct),Math.max(1,Math.floor(need/unit)));
      if(qty<=0) return;
      const p=taxPreviewFor(s,qty,acct);
      if(taxAware && taxBudget>0 && (state.tax.taxPaidByAccount[acct]||0)+p.tax>taxBudget){
        addLog(`🧾 세금 예산 초과로 ${s.name} 매도 건너뜀 (예상 ${won(p.tax)} / 예산 ${won(taxBudget)})`);
        return;
      }
      if(marketSellShares(s,qty,acct)){ const done=qty*unit; moved+=done; need-=done; }
    });
  } else if(now<target-band){
    const need=(target-band-now)*gross;
    const budget=Math.min(state.cash,need);
    if(budget>10000){
      const list=stocks.filter(s=>!isIndexFund(s));
      const per=budget/list.length;
      list.forEach(s=>{
        const unit=s.price*(1+stockFeeRate())*(isForeignStock(s)?fx.usd:1);
        const qty=Math.floor(per/unit);
        if(qty>0&&marketBuyShares(s,qty)) moved+=per;
      });
    }
  }
  if(moved>0){
    addLog(`⚖️ 자동 리밸런싱: 주식 비중 ${pct(now)} → 목표 ${Math.round(target*100)}% · ${won(moved)} 조정${a.taxAware?` (세금 고려 · 예산 ${a.taxBudget>0?won(a.taxBudget):"제한 없음"})`:""}`);
    notify("system","리밸런싱",`${won(moved)} · 주식 ${Math.round(target*100)}% 맞춤${a.taxAware?" · 절세 우선":""}`);
    saveGame(); update();
  }
  return moved;
}
// 경기 국면 전환: 같은 게임 시각이면 모든 플레이어가 같은 국면·지표·뉴스를 봅니다.
function enterEconomyPhase(phase){
  const eco=state.economy||(state.economy=Object.assign({},ECON_DEFAULT));
  const wr=k=>worldTickRand("eco",k);
  eco.phase=phase||["호황","중립","불황"][Math.floor(wr(1)*3)];
  eco.cycleLeft=60+Math.floor(wr(2)*60);
  eco.rateAdj=eco.phase==="호황"?.004:eco.phase==="불황"?-.004:0;
  const dir=wr(3)<.5?-1:1;
  eco.baseRate=Math.max(.01,Math.min(.08,(eco.baseRate||.03)+dir*.0025));
  // 경기 국면에 따라 물가·실업률·성장률이 움직이고, 이는 시장 방향에도 반영됩니다.
  const phaseBias=eco.phase==="호황"?1:eco.phase==="불황"?-1:0;
  eco.inflation=Math.max(.005,Math.min(.08,(+eco.inflation||.025)+phaseBias*.003+(wr(4)-.5)*.002));
  eco.unemployment=Math.max(.015,Math.min(.15,(+eco.unemployment||.035)-phaseBias*.004+(wr(5)-.5)*.0015));
  eco.gdpGrowth=Math.max(-.06,Math.min(.08,(+eco.gdpGrowth||.02)+phaseBias*.007+(wr(6)-.5)*.003));
  if(eco.phase==="불황"){
    stocks.forEach((s,i)=>applyShock(s,-(0.008+wr(10+i)*.020)));
    publishBreakingNews("📉 금융 위기 · 경기 침체", `경기 침체가 시작되었습니다. 물가 ${(eco.inflation*100).toFixed(1)}% · 실업률 ${(eco.unemployment*100).toFixed(1)}% · 기준금리 ${(eco.baseRate*100).toFixed(2)}%`);
    notify("economy","경제 위기",`금융 위기 · 실업률 ${(eco.unemployment*100).toFixed(1)}%`);
  } else if(eco.phase==="호황"){
    stocks.forEach((s,i)=>applyShock(s,0.008+wr(40+i)*.020));
    publishBreakingNews("🚀 경기 호황", `소비와 투자가 살아납니다. 물가 ${(eco.inflation*100).toFixed(1)}% · 실업률 ${(eco.unemployment*100).toFixed(1)}% · 성장률 ${(eco.gdpGrowth*100).toFixed(1)}%`);
    notify("economy","경기 호황",`성장률 ${(eco.gdpGrowth*100).toFixed(1)}% · 기준금리 ${(eco.baseRate*100).toFixed(2)}%`);
  } else {
    publishBreakingNews("🏦 기준금리", `기준금리 ${(eco.baseRate*100).toFixed(2)}% · 경기 ${eco.phase} 국면이 시작되었습니다.`);
    notify("economy","경제 지표",`경기 ${eco.phase} · 기준금리 ${(eco.baseRate*100).toFixed(2)}%`);
  }
  return eco;
}
function tickAlt(){
  if(!state.altPrices||typeof state.altPrices!=="object") state.altPrices={};
  // 부동산·금·은 가격도 같은 게임 시각이면 모두 같은 값이 되도록 공용 난수를 씁니다.
  const ar=k=>worldTickRand("alt",k);
  ESTATES.forEach((e,ei)=>{
    const p=estatePrice(e.id);
    const shock=ar(10+ei)<.03?(ar(20+ei)-.5)*.12:0;
    state.altPrices[e.id]=Math.max(Math.round(e.price*.35),Math.round(p*(1+(ar(30+ei)-.5)*e.vol+shock)));
  });
  METALS.forEach((m,mi)=>{
    const p=metalPrice(m.id);
    state.altPrices[m.id]=Math.max(Math.round(m.price*.35*100)/100,Math.round(p*(1+(ar(40+mi)-.5)*m.vol)*100)/100);
  });
  if(state.marketSeconds%60===0 && !OFFLINE_REPLAY){
    let rent=0,upkeep=0;
    const rentBonus=rebirthBonus("estate",.04);
    ESTATES.forEach(e=>{ const q=(state.estate[e.id]&&state.estate[e.id].qty)||0; if(!q) return; rent+=q*estatePrice(e.id)*e.rent*rentBonus; upkeep+=q*estatePrice(e.id)*e.upkeep; });
    if(rent||upkeep){
      // 임대료는 자동 수익 설정을 따르고, 유지비는 설정과 무관하게 항상 차감합니다.
      const paid=creditAutoIncome(rent,"임대 수익");
      if(upkeep>0) state.cash-=upkeep;
      addLog(`🏢 임대 수익 ${won(rent)}${autoIncomeNote(paid)} · 유지비 ${won(upkeep)}`);
    }
  }
  const c=state.company;
  if(c){
    if(!Number.isFinite(+c.upkeep)) c.upkeep=0;
    if(!Number.isFinite(+c.risk)) c.risk=0;
    c.revenue=Math.max(0,Math.round(c.revenue*(0.99+Math.random()*.02)));
    // 기업 가치는 장부가(설립·확장·인수 누계) 주변에서만 움직입니다.
    // 인수한 회사가 많을수록 위협(가치 변동성)이 커져 장부가에서 더 크게 출렁입니다.
    const book=Math.max(10000000,c.book||c.valuation);
    const swing=0.2+Math.max(0,Math.min(0.15,+c.risk||0));
    c.valuation=Math.max(book*(1-swing),Math.min(book*(1+swing),Math.round(c.valuation*(0.997+Math.random()*.006))));
    // 상장한 기업은 주가가 순자산 가치를 향해 천천히 수렴하며 매 틱 변동합니다.
    if(c.listed && (+c.listed.shares||0)>0){
      const fair=Math.max(100,c.valuation/c.listed.shares);
      const p=Math.max(100,+c.listed.price||+c.listed.ipoPrice||100);
      c.listed.price=Math.max(100,Math.round(p*(0.994+Math.random()*0.012)+(fair-p)*0.03));
    }
    if(state.marketSeconds%30===0){
      // 상장해 지분을 팔았으면 내 지분만큼만 배당을 받습니다.
      const own=c.listed?Math.max(0,Math.min(100,+c.listed.ownPct||0))/100:1;
      const pay=Math.round(c.profit*(c.payout==null?.3:c.payout)*rebirthBonus("company",.04)*own);
      const paid=creditAutoIncome(pay,"기업 배당");
      if(pay>0) addLog(`🏭 기업 배당 +${won(pay)}${autoIncomeNote(paid)}`);
      if((c.upkeep||0)>0){
        const up=c.upkeep;
        state.cash=Math.max(0,state.cash-up);
        addLog(`🏭 인수 기업 유지비 -${won(up)}`);
      }
    }
  }
  const eco=state.economy||(state.economy=Object.assign({},ECON_DEFAULT));
  // tickAlt는 15게임초마다 실행되므로 남은 시간도 15초씩 줄여야 합니다.
  // (기존에는 1씩 줄어 90초 표시가 실제로는 1,350초가 되는 버그가 있었습니다.)
  eco.cycleLeft=(eco.cycleLeft||0)-15;
  if(eco.cycleLeft<=0) enterEconomyPhase();
  if(state.marketSeconds%180===0 && worldTickRand("sector",1)<.5){
    const sector=["AI","반도체","배터리","우주","디지털 자산"][Math.floor(worldTickRand("sector",2)*5)];
    const up=worldTickRand("sector",3)<.5;
    stocks.filter(s=>s.theme.includes(sector)).forEach((s,i)=>applyShock(s,(up?1:-1)*(.01+worldTickRand("sector",10+i)*.03)));
    publishBreakingNews("📈 산업 뉴스", `${sector} 업종에 ${up?"매수세":"차익 실현"}가 몰리고 있습니다.`);
  }
  const gi=gradeIndex(currentGrade());
  if(gi>(state.rewardedGrade||0)){
    let reward=0;
    for(let i=(state.rewardedGrade||0)+1;i<=gi;i++) reward+=i*500000;
    state.rewardedGrade=gi; state.cash+=reward;
    addLog(`🏅 승급 보상: ${GRADES[gi]} (+${won(reward)})`);
    notify("grade","승급 보상",`${GRADES[gi]} · ${won(reward)}`);
  }
  checkSpecial();
}
function setTargetGoal(v){
  const n=Math.max(1000000,Math.round(+v||1000000000));
  state.targetGoal=n; saveGame(); portfolio();

function periodReturns(){
  // 게임 시간 기준: 하루=60초, 일주=420초, 한 달=1800초로 압축해 계산합니다.
  const cur=totalAssetsKRW(), now=state.marketSeconds;
  const at=sec=>{ const p=[...assetHistory.points].reverse().find(x=>x.t<=now-sec); return p?p.v:null; };
  const calc=sec=>{ const v=at(sec); return v&&v>0?(cur-v)/v:null; };
  return {m1:calc(60),m5:calc(420),m15:calc(1800)};
}
function unrealizedPL(){
  return stocks.reduce((a,s)=>a+(s.own>0?(s.price-s.avgBuy)*s.own*(isForeignStock(s)?fx.usd:1):0),0);
}
function stockReturnRows(){
  return stocks.filter(s=>s.own>0).map(s=>({name:s.name,roi:s.avgBuy>0?(s.price-s.avgBuy)/s.avgBuy:0,value:s.price*s.own*(isForeignStock(s)?fx.usd:1)})).sort((a,b)=>b.roi-a.roi);
}
function altReturnRows(){
  const rows=[];
  ESTATES.forEach(e=>{ const h=state.estate[e.id]; if(!h||h.qty<=0||!h.avgBuy) return; const p=estatePrice(e.id); rows.push({name:e.name,roi:(p-h.avgBuy)/h.avgBuy,value:p*h.qty}); });
  METALS.forEach(m=>{ const h=state.metals[m.id]; if(!h||h.qty<=0||!h.avg) return; const p=metalPrice(m.id); rows.push({name:m.name,roi:(p-h.avg)/h.avg,value:p*h.qty}); });
  return rows.sort((a,b)=>b.roi-a.roi);
}
function journalFiltered(){

function isoWeekKey(){
  const d=new Date();
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=t.getUTCDay()||7;
  t.setUTCDate(t.getUTCDate()+4-day);
  const y=t.getUTCFullYear();
  const w=Math.ceil(((t-new Date(Date.UTC(y,0,1)))/86400000+1)/7);
  return `${y}-W${String(w).padStart(2,"0")}`;
}
function ensureWeekly(){
  const k=isoWeekKey();
  if(!state.weekly||state.weekly.key!==k||!state.weekly.counts||!state.weekly.claimed){
    state.weekly={key:k,counts:{},claimed:{}};
  }
}
function claimWeekly(id){
  ensureWeekly();
  const m=WEEKLY_POOL.find(x=>x.id===id); if(!m) return;
  const w=state.weekly; if(w.claimed[id]) return;
  if((w.counts[id]||0)<m.target) return alert("아직 주간 조건을 채우지 못했습니다.");
  w.claimed[id]=true; state.cash+=m.reward;

}

function todayKey(){ const d=new Date(); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }
function dailyMissions(){
  const seed=[...todayKey()].reduce((a,c)=>a+c.charCodeAt(0),0);
  const picks=[];
  for(let i=0;i<3;i++) picks.push(DAILY_POOL[(seed+i*2)%DAILY_POOL.length]);
  return [...new Map(picks.map(m=>[m.id,m])).values()];
}
function ensureDaily(){
  const key=todayKey();
  if(!state.daily || state.daily.date!==key || !state.daily.counts || !state.daily.claimed){
    state.daily={date:key,counts:{trades:0,dividends:0,orders:0,goals:0,deposit:0,estateBuy:0,altTrades:0},claimed:{}};
  }
  ensureWeekly();
  // 연속 접속: 날짜가 바뀐 첫 호출에서만 계산합니다.
  if(!state.streak||typeof state.streak!=="object") state.streak={days:1,last:"",best:1};
  if(state.streak.last!==key){
    const y=new Date(Date.now()-86400000);
    const yk=`${y.getFullYear()}-${y.getMonth()+1}-${y.getDate()}`;
    state.streak.days=state.streak.last===yk?Math.min(365,(state.streak.days||1)+1):1;
    state.streak.last=key;
    state.streak.best=Math.max(state.streak.best||1,state.streak.days);
    if(state.streak.days>1 && state.streak.days%3===0){
      const reward=state.streak.days%7===0?1000000:300000;
      state.cash+=reward;
      addLog(`🔥 연속 접속 ${state.streak.days}일 보상 +${won(reward)}`);
      notify("mission","연속 접속",`${state.streak.days}일 연속 · ${won(reward)}`);
    }
  }
}
function bumpDaily(k,n=1){

function bestRoi(){
  const open=[...stockReturnRows(),...altReturnRows()].reduce((best,r)=>Math.max(best,+r.roi||0),0);
  const closed=(state.journal||[]).reduce((best,x)=>{
    if(x.side!=="sell"||!(+x.valueKRW>0)) return best;
    return Math.max(best,(+x.profit||0)/+x.valueKRW);
  },0);
  return Math.max(open,closed);
}

// ── 오프라인 정산(기본 2시간, 환생 업그레이드로 연장) ──────────────
const OFFLINE_MAX_BASE=2*3600;
function offlineMaxSeconds(){ return OFFLINE_MAX_BASE + 2*3600*rebirthLevel("offline"); }
// 오프라인 동안에도 시장을 결정론적으로 재생합니다(같은 게임 시각 = 같은 시세).
let OFFLINE_REPLAY=false;
// 재생을 한 번에 오래 돌리면 화면이 멈추므로, 같은 단계를 작은 덩어리로 나눠 돌릴 수 있게 분리했습니다.
function replayOfflineSteps(from,to){
  const every=Math.max(10,Math.round(+(state.auto&&state.auto.every)||60));
  for(let i=from;i<to;i++){
    state.marketSeconds++;
    if(state.marketSeconds%15===0) tickAlt();
    if(state.marketSeconds%5===0){ tickMarket(); updateFX(); }
    if(state.marketSeconds%7===0) marketEventsAndNews();
    // 자리를 비운 동안에도 자동매매 규칙을 같은 주기로 돌립니다.
    // (복귀 후 한 번만 돌리면 그 사이 가격 변동을 놓쳐 '자동매매'가 없던 일이 됩니다.)
    if(state.auto && state.auto.enabled && state.marketSeconds%every===0){
      try{ autoSellRules(); autoInvest(true); }catch(e){}
    }
  }
}
function replayOfflineMarket(seconds){
  if(!(seconds>0)) return;
  OFFLINE_REPLAY=true;
  try{ replayOfflineSteps(0,seconds); }
  finally { OFFLINE_REPLAY=false; }
  state.marketOpen=(state.marketSeconds%240)<180;
}
// 화면이 보이지 않는 탭에서는 양보하지 않습니다(백그라운드 타이머 지연으로 오히려 느려짐).
function offlineYield(){
  return new Promise(resolve=>{
    try{
      if(typeof document!=="undefined" && document.visibilityState==="hidden"){ resolve(); return; }
      setTimeout(resolve,0);
    }catch(e){ resolve(); }
  });
}
// 화면이 끊기지 않게 나눠 재생합니다. 고정 덩어리 대신 "예산(ms)만큼 계산하고 양보"라서
// 빠른 기기에서는 양보 횟수가 줄고, 느린 기기에서도 한 번에 붙잡는 시간이 짧습니다.
function replayNowMs(){
  try{ return (typeof performance!=="undefined" && performance && performance.now) ? performance.now() : Date.now(); }
  catch(e){ return Date.now(); }
}
async function replayOfflineMarketChunked(seconds, budgetMs, onProgress){
  if(!(seconds>0)) return;
  const budget=Math.max(3, Math.min(30, +budgetMs||8));
  OFFLINE_REPLAY=true;
  try{
    let done=0;
    while(done<seconds){
      const started=replayNowMs();
      do{
        const step=Math.min(300, seconds-done);
        replayOfflineSteps(done, done+step);
        done+=step;
      } while(done<seconds && replayNowMs()-started<budget);
      if(typeof onProgress==="function"){ try{ onProgress(done, seconds); }catch(e){} }
      await offlineYield();
    }
  } finally { OFFLINE_REPLAY=false; }
  state.marketOpen=(state.marketSeconds%240)<180;
}
function offlineElapsedSeconds(){
  const now=Date.now();
  const last=state.lastSeen||0;
  state.lastSeen=now;
  if(!last || last>now) return null;
  const sec=Math.min(offlineMaxSeconds(), Math.floor((now-last)/1000));
  return sec>=120?sec:null;
}
// 재생 전 시세를 기억해 두고, 같은 시간만큼 시장을 돌려 놓습니다(돈 정산은 따로).
function offlineMarketStart(){
  const idxBefore=marketIndex(), fxBefore=fx.usd, heldBefore={};
  stocks.forEach(s=>{ if(+s.own>0) heldBefore[s.id]=s.price; });
  const realizedBefore=stocks.reduce((a,s)=>a+(+s.realizedProfit||0),0);
  return {idxBefore, fxBefore, heldBefore, realizedBefore};
}
// 복귀 요약 카드: 경과 시간과 자동 수익을 한 장으로 보여 줍니다.

function offlineSettle(sec, start, opts){
  const {idxBefore, fxBefore, heldBefore}=start;
  const cashBefore=state.cash, pendingBefore=ensureAutoIncome().pending;
  const idxAfter=marketIndex(), fxAfter=fx.usd;
  const held=Object.keys(heldBefore).map(id=>{ const s=stock(id); const p0=heldBefore[id]||s.price; return {name:s.name, ret:p0>0?s.price/p0-1:0}; }).sort((a,b)=>Math.abs(b.ret)-Math.abs(a.ret)).slice(0,3);
  const periods=sec/15;
  let interest=0, loanInterest=0;
  const depositBonus=rebirthBonus("deposit",.03);
  products.forEach(p=>{
    if(p.amount<=0 || p.rate<=0) return;
    for(let i=0;i<periods;i++){
      const eff=Math.min(MAX_EFFECTIVE_DEPOSIT,p.amount>30000000?30000000+(p.amount-30000000)*0.5:p.amount);
      const add=eff*(p.rate*depositBonus*INTEREST_PERIOD);
      p.amount+=add; interest+=add;
    }
  });
  // 현금을 방치해도 자동으로 돈이 늘어나던 파킹 보너스는 제거했습니다(원인 불명 자동 수익).
  if((state.loan||0)>0){
    for(let i=0;i<periods;i++){
      const li=state.loan*((state.loanRate||0)*0.015);
      loanInterest+=li;
      if(state.cash>=li) state.cash-=li;
      else { state.loan+=li-state.cash; state.cash=0; }
    }
  }
  const divPeriods=Math.min(30, Math.floor(sec/DIVIDEND_EVERY));
  const dividends=expectedDividend()*divPeriods*rebirthBonus("dividend",.03);
  if(dividends>0){
    creditAutoIncome(dividends,"주식 배당");
    if(autoIncomeMode()!=="off") state.dividendTotal=(state.dividendTotal||0)+dividends;
  }
  // 부동산 임대료·유지비와 기업 배당도 오프라인 동안 정산합니다(가격 변동은 제외).
  const rentPeriods=Math.floor(sec/60);
  let rent=0,upkeep=0;
  const rentBonus=rebirthBonus("estate",.04);
  ESTATES.forEach(e=>{ const q=(state.estate[e.id]&&state.estate[e.id].qty)||0; if(!q) return; rent+=q*estatePrice(e.id)*e.rent*rentBonus*rentPeriods; upkeep+=q*estatePrice(e.id)*e.upkeep*rentPeriods; });
  const companyPay=state.company?Math.round(state.company.profit*((state.company.payout==null?.3:state.company.payout))*rebirthBonus("company",.04)*sec/30):0;
  // 오프라인 정산도 같은 자동 수익 설정을 따르고, 유지비는 그대로 차감합니다.
  creditAutoIncome(rent,"임대 수익");
  creditAutoIncome(companyPay,"기업 배당");
  // 유지비는 현금 한도 안에서만 차감합니다(현금이 음수가 되지 않게).
  const upkeepPaid=Math.min(Math.max(0,state.cash),upkeep);
  if(upkeepPaid>0) state.cash-=upkeepPaid;
  const upkeepUnpaid=Math.max(0,upkeep-upkeepPaid);
  const market={idxBefore,idxAfter,fxBefore,fxAfter,held};
  const realizedAfter=stocks.reduce((a,s)=>a+(+s.realizedProfit||0),0);
  const autoProfit=realizedAfter-(start.realizedBefore||0);
  const net=interest+dividends+(rent||0)+(companyPay||0)+autoProfit-(loanInterest||0)-(upkeep||0);
  const pendingAfter=ensureAutoIncome().pending;
  const cashDelta=state.cash-cashBefore;
  const pendingAdded=Math.max(0,pendingAfter-pendingBefore);
  const report={at:Date.now(),sec,interest,dividends,loanInterest,rent:rent||0,upkeep:upkeep||0,upkeepPaid,upkeepUnpaid,companyPay:companyPay||0,autoProfit,net,cashDelta,pendingAdded,pendingAfter,market};
  state.lastOfflineReport=report;
  if(!Array.isArray(state.incomeHistory)) state.incomeHistory=[];
  state.incomeHistory.push({at:report.at,sec,net,dividends,interest,rent:report.rent,companyPay:report.companyPay,autoProfit,upkeep:report.upkeep,loanInterest,cashDelta,pendingAdded});
  if(state.incomeHistory.length>60) state.incomeHistory.splice(0,state.incomeHistory.length-60);
  try{ trackEvent("offline_settlement",{min:Math.floor(sec/60)}); }catch(e){}
  const summary=report;
  addLog(`오프라인 복귀: ${Math.floor(sec/60)}분 · 자동 수익 ${won(net)} (이자 ${won(interest)} · 배당 ${won(dividends)})`);
  notify("system","오프라인 복귀",`${Math.floor(sec/60)}분 동안 자동 수익 ${won(net)}`);
  openModal("오프라인 복귀 리포트",`${offlineReportHtml(report)}
  ${autoIncomeMode()==="auto"?"":`<p class="muted-sm" style="margin-top:10px">자동 수익이 <b>${autoIncomeModeLabel()}</b>로 설정되어 있어 배당·임대료·기업 배당은 현금 대신 대기액에 쌓이거나 지급되지 않았습니다. 현금 카드에서 바로 받을 수 있습니다.</p>`}
  <details style="margin-top:10px"><summary style="cursor:pointer;font-size:13px;font-weight:700">재생된 시장 보기 (최대 ${Math.floor(offlineMaxSeconds()/3600)}시간)</summary>
    <div class="kpis" style="margin-top:8px">
      <div class="kpi"><small>시장 지수</small><b class="${idxAfter>=idxBefore?"up":"down"}">${pct(idxBefore>0?idxAfter/idxBefore-1:0)}</b></div>
      <div class="kpi"><small>환율</small><b class="${fxAfter>=fxBefore?"up":"down"}">${pct(fxBefore>0?fxAfter/fxBefore-1:0)}</b></div>
      ${held.length?held.map(h=>`<div class="kpi"><small>${escHtml(h.name)}</small><b class="${h.ret>=0?"up":"down"}">${pct(h.ret)}</b></div>`).join(""):`<div class="kpi"><small>보유 종목</small><b>없음</b></div>`}
    </div>
    <p style="margin-top:10px;font-size:12px;color:#667085">꺼져 있던 시간만큼 시장을 그대로 재생했습니다(같은 시간이면 모든 플레이어가 같은 시세). 자동매매를 켜 둔 경우 같은 주기로 매수·매도가 실행됐습니다.</p>
  </details>`);
  saveGame();
  if(opts&&opts.refresh){ try{ update(); dashboardPage(); portfolio(); }catch(e){} }
  return summary;
}
// 테스트·내부용: 한 번에 동기 정산.
function applyOfflineProgress(){
  const sec=offlineElapsedSeconds();
  if(!sec) return null;
  const start=offlineMarketStart();
  replayOfflineMarket(sec);
  return offlineSettle(sec,start);
}
// 화면용: 재생을 나눠 돌려 로딩 중에도 화면이 멈추지 않습니다.
async function applyOfflineProgressChunked(){
  const sec=offlineElapsedSeconds();
  if(!sec) return null;
  const start=offlineMarketStart();
  const showProgress=sec>600;
  let lastPct=-1;
  const onProgress=(done,total)=>{
    const pct=Math.max(0,Math.min(100,Math.round(done/total*100)));
    if(!showProgress || pct===lastPct || pct%5!==0) return;
    lastPct=pct;
    try{
      openModal("복귀 준비 중",`<p style="font-size:13px">${Math.floor(total/60)}분 동안의 시장을 다시 계산하고 있습니다.</p>
        <div class="bar" style="margin:10px 0"><span style="width:${pct}%"></span></div>
        <p class="muted-sm">${pct}% · 게임은 바로 이어서 할 수 있습니다.</p>`);
    }catch(e){}
  };
  await replayOfflineMarketChunked(sec, 8, onProgress);
  return offlineSettle(sec,start,{refresh:true});
}
