function firebaseAutoRetry(){ fbAutoPaused=false; fbLastError=null; fbLastSync=Date.now()-FB_SYNC_MIN_MS; scheduleCloudSync(); settingsPage(); }

// ── 연결 상태 점검: 승인된 도메인 · Google 로그인 · 규칙 · 색인을 하나씩 확인 ──
let fbDiag=null; // {at, running, rows:[{key,label,state,detail,fix}]}
function fbDiagDomainOk(list,host){
  const h=String(host||"").toLowerCase();
  return (list||[]).map(x=>String(x).toLowerCase()).some(d=>d===h || (h==="127.0.0.1"&&d==="localhost"));
}
const FB_DIAG_ICON={pass:"✅",fail:"❌",warn:"⚠️",run:"⏳"};
function fbDiagHtml(){
  if(!fbDiag) return "";
  const rows=fbDiag.rows.map(r=>`<div class="fb-diag-row" style="display:flex;gap:8px;padding:7px 0;border-top:1px solid rgba(0,0,0,.06)">
      <div style="font-size:14px;line-height:1.4">${FB_DIAG_ICON[r.state]||"⬜"}</div>
      <div style="flex:1;min-width:0">
        <b style="font-size:12.5px;${r.state==="fail"?"color:#b42318":""}">${escHtml(r.label)}</b>
        ${r.detail?`<div class="muted-sm" style="font-size:11.5px">${escHtml(r.detail)}</div>`:""}
        ${r.state==="fail"&&r.fix?`<div style="font-size:11.5px;color:#7a271a;margin-top:3px">→ ${escHtml(r.fix)}</div>`:""}
        ${r.link?`<div style="margin-top:5px"><a href="${escAttr(r.link)}" target="_blank" rel="noopener" style="font-size:12px;font-weight:700;color:#1a73e8">${escHtml(r.linkLabel||"색인 만들기 화면 열기")} ↗</a></div>`:""}
      </div></div>`).join("");
  const important=fbDiag.rows.filter(r=>r.state==="fail").length;
  const passed=fbDiag.rows.filter(r=>r.state==="pass").length;
  const unknown=fbDiag.rows.filter(r=>r.state==="warn").length;
  const head=fbDiag.running?"점검 중…":(!important&&!unknown)?`${passed}개 모두 통과`:[`${passed}개 통과`,important?`<b style="color:#b42318">${important}개 실패</b>`:"",unknown?`${unknown}개 확인 불가`:""].filter(Boolean).join(" · ");
  return `<div style="margin-top:10px;padding:8px 12px;border:1px solid rgba(0,0,0,.1);border-radius:10px">
    <div style="font-size:12px;font-weight:700">연결 점검 결과 · ${head}</div>${rows}</div>`;
}
// failed-precondition 오류에는 콘솔 색인 생성 링크가 들어 있습니다. 없으면 색인 목록으로 대신 이동합니다.
function fbIndexLinkFromError(e){
  const msg=String((e&&e.message)||"");
  const m=msg.match(/https:\/\/console\.firebase\.google\.com\/[^\s"']+/);
  return m?m[0]:`https://console.firebase.google.com/project/${fbProject()}/firestore/indexes`;
}
function fbDiagPush(key,label,state,detail,fix,link,linkLabel){
  if(!fbDiag) return;
  const row={key,label,state,detail:detail||"",fix:fix||"",link:link||"",linkLabel:linkLabel||""};
  const i=fbDiag.rows.findIndex(r=>r.key===key);
  if(i>=0) fbDiag.rows[i]=row; else fbDiag.rows.push(row);
  try{ firebasePanelRefresh(""); }catch(e){}
}
async function firebaseDiagnose(){
  if(fbDiag&&fbDiag.running) return;
  trackEvent("connection_check");
  fbDiag={at:Date.now(),running:true,rows:[]};
  try{ firebasePanelRefresh(""); }catch(e){}
  fbDiagPush("config","웹 앱 설정",firebaseConfigured()?"pass":"fail",firebaseConfigured()?`프로젝트 ${fbProject()}`:"meta[name=firebase-config]가 비어 있습니다",firebaseConfigured()?"":"index.html의 meta[name=firebase-config]에 웹 앱 설정 JSON을 넣으세요");
  if(!firebaseConfigured()){ fbDiag.running=false; firebasePanelRefresh(""); return; }
  let api=null;
  try{ api=await firebaseLoad(); fbDiagPush("sdk","Firebase SDK","pass","app · auth · firestore 로드 완료"); }
  catch(e){ fbDiagPush("sdk","Firebase SDK","fail","SDK를 불러오지 못했습니다",firebaseHelpFor("firebase_sdk").steps[0]); }

  // 1) 승인된 도메인: 콘솔에 등록된 목록을 읽어 지금 주소와 비교합니다.
  const host=fbHost();
  try{
    const r=await fetch(`https://identitytoolkit.googleapis.com/v1/projects?key=${FIREBASE_CONFIG.apiKey}&fields=authorizedDomains`);
    if(!r.ok) throw new Error("HTTP "+r.status);
    const j=await r.json();
    const list=j.authorizedDomains||[];
    if(fbDiagDomainOk(list,host)) fbDiagPush("domain","승인된 도메인","pass",`${host} 승인됨`);
    else fbDiagPush("domain","승인된 도메인","fail",`${host} 가 목록에 없습니다`,`Firebase 콘솔 → Authentication → Settings → 승인된 도메인에 ${host} 추가`);
  }catch(e){
    fbDiagPush("domain","승인된 도메인","warn","목록을 확인하지 못했습니다","네트워크 또는 apiKey를 확인하세요");
  }

  // 2) Google 로그인: 이미 로그인했다면 확실한 증거이고, 아니면 제공자 설정을 조회합니다.
  if(fbUser){
    fbDiagPush("google","Google 로그인","pass",`${fbUser.email||fbUser.displayName||"Google 사용자"}로 로그인됨`);
  }else{
    try{
      const r=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:createAuthUri?key=${FIREBASE_CONFIG.apiKey}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({continueUri:location.origin+"/",providerId:"google.com",email:"check@example.com"})});
      const j=await r.json();
      const msg=String((j.error&&j.error.message)||"");
      if(msg.includes("OPERATION_NOT_ALLOWED")) fbDiagPush("google","Google 로그인","fail","Google 로그인이 꺼져 있습니다","Authentication → Sign-in method → Google 사용 설정");
      else if(msg.includes("UNAUTHORIZED_DOMAIN")||msg.includes("INVALID_CONTINUE_URI")) fbDiagPush("google","Google 로그인","fail","이 주소에서는 로그인할 수 없습니다",`승인된 도메인에 ${host} 추가`);
      else if(j.authUri) fbDiagPush("google","Google 로그인","pass","사용 설정됨 · 아직 로그인 전");
      else fbDiagPush("google","Google 로그인","warn",msg||"응답을 해석하지 못했습니다","Google로 로그인을 한 번 눌러 확인하세요");
    }catch(e){
      fbDiagPush("google","Google 로그인","warn","확인하지 못했습니다","Google로 로그인을 한 번 눌러 확인하세요");
    }
  }

  // 3) Firestore 규칙: 공개 읽기(scores)와 내 저장(saves/uid)을 실제로 읽어 봅니다.
  if(api){
    let rulesState="pass", rulesDetail="공개 읽기 허용", rulesFix="";
    try{
      await api.db.getDocs(api.db.query(api.db.collection(fbDb,"scores"),api.db.limit(1)));
    }catch(e){
      const c=firebaseErrorCode(e);
      rulesState="fail";
      rulesDetail=c==="permission-denied"?"scores 공개 읽기가 거부되었습니다":`Firestore 오류 ${c}`;
      rulesFix=firebaseHelpFor(c).steps[0];
    }
    if(rulesState==="pass"&&fbUser){
      try{ await api.db.getDoc(api.db.doc(fbDb,"saves",fbUser.uid)); rulesDetail="공개 읽기 · 내 저장 읽기 모두 허용"; }
      catch(e){
        const c=firebaseErrorCode(e);
        rulesState="fail";
        rulesDetail=c==="permission-denied"?"내 저장(saves/{uid}) 읽기가 거부되었습니다":`Firestore 오류 ${c}`;
        rulesFix=firebaseHelpFor(c).steps[0];
      }
    }
    if(rulesState==="pass"&&!fbUser) rulesDetail="공개 읽기 허용(로그인하면 저장 규칙도 확인합니다)";
    fbDiagPush("rules","Firestore 규칙",rulesState,rulesDetail,rulesFix);

    // 4) 색인: 리더보드 쿼리를 그대로 실행해 봅니다.
    try{
      const q=api.db.query(api.db.collection(fbDb,"scores"),api.db.where("season","==",seasonKey()),api.db.orderBy("score","desc"),api.db.limit(1));
      await api.db.getDocs(q);
      fbDiagPush("index","리더보드 색인","pass",`시즌 ${seasonKey()} 쿼리 성공`);
    }catch(e){
      const c=firebaseErrorCode(e);
      if(c==="failed-precondition") fbDiagPush("index","리더보드 색인","fail","복합 색인이 아직 없습니다 (scores: season ↑ + score ↓)","아래 링크를 눌러 콘솔에서 색인을 만들고 1~2분 뒤 다시 점검하세요",fbIndexLinkFromError(e),"색인 만들기 화면 열기");
      else if(c==="permission-denied") fbDiagPush("index","리더보드 색인","warn","규칙에서 먼저 막혔습니다","규칙을 게시한 뒤 다시 점검하세요");
      else fbDiagPush("index","리더보드 색인","warn",`확인하지 못했습니다 (${c})`,firebaseHelpFor(c).steps[0]);
    }
  }
  if(fbDiag){ fbDiag.running=false; }
  try{ firebasePanelRefresh(""); }catch(e){}
}

function dashNarrow(){ try{ return typeof window!=="undefined" && +window.innerWidth>0 && +window.innerWidth<=760; }catch(e){ return false; } }

// 오프라인 복귀마다 쌓인 자동 수익 기록을 오늘/7일 단위로 합산합니다.
function incomeRecords(){
  return Array.isArray(state.incomeHistory)?state.incomeHistory.filter(e=>e&&Number.isFinite(+e.at)&&+e.at>0):[];
}
function incomeTotals(){
  const now=Date.now(), todayKey=new Date(now).toDateString();
  const list=incomeRecords();
  const today=list.filter(e=>new Date(+e.at).toDateString()===todayKey);
  const week=list.filter(e=>now-(+e.at||0)<=7*24*3600*1000);
  const sum=(arr,k)=>arr.reduce((a,e)=>a+(+e[k]||0),0);
  const pack=arr=>({net:sum(arr,"net"),cash:sum(arr,"cashDelta"),pending:sum(arr,"pendingAdded"),auto:sum(arr,"autoProfit"),dividends:sum(arr,"dividends")});
  return {count:list.length,today:pack(today),week:pack(week)};
}
function incomeSummaryHtml(){
  const t=incomeTotals();
  if(!t.count) return "";
  return `<section class="section"><div class="section-head"><h3>자동 수익</h3><button class="ghost small" onclick="openIncomeHistory()">전체 기록</button></div>
  <div class="panel"><div class="kpis">

}
function openIncomeHistory(){
  const list=incomeRecords().slice().reverse().slice(0,20);

// ── 시장 건강(밸런스 관측) ─────────────────────────────────
function marketBreadth(){
  const list=stocks.filter(s=>!isIndexFund(s));
  const up=list.filter(s=>dayChangePct(s)>.0001).length;
  const down=list.filter(s=>dayChangePct(s)<-.0001).length;
  return {up,down,flat:Math.max(0,list.length-up-down),total:list.length};
}
function marketRangeStats(){
  const list=stocks.filter(s=>!isIndexFund(s));
  const ratios=list.map(s=>s.start>0?s.price/s.start:1);
  return {min:ratios.length?Math.min(...ratios):1,max:ratios.length?Math.max(...ratios):1,avg:ratios.reduce((a,b)=>a+b,0)/Math.max(1,ratios.length)};
}
function marketHealthPanelHtml(){
  const b=marketBreadth(), r=marketRangeStats();
  const ranked=stocks.filter(s=>!isIndexFund(s)).map(s=>({s,ret:s.start>0?s.price/s.start-1:0})).sort((a,b)=>b.ret-a.ret);
  const top=ranked.slice(0,3), bottom=ranked.slice(-3).reverse();
  const pctUp=b.total?Math.round(b.up/b.total*100):0;
  return `<section class="section"><div class="section-head"><h3>시장 건강</h3><span class="pill">${b.total}종목 · 상승 ${pctUp}%</span></div><div class="panel">
    <div class="bar" style="height:10px"><span data-live-style="breadthUpWidth" style="width:${pctUp}%;background:#d92d20"></span></div>
    <div class="kpis" style="margin-top:10px"><div class="kpi"><small>상승</small><b class="up" data-live="breadthUp">${b.up}</b></div><div class="kpi"><small>하락</small><b class="down" data-live="breadthDown">${b.down}</b></div><div class="kpi"><small>보합</small><b data-live="breadthFlat">${b.flat}</b></div><div class="kpi"><small>시작가 대비</small><b data-live="breadthRange">${Math.round(r.min*100)}% ~ ${Math.round(r.max*100)}%</b></div></div>
    <div class="two-col" style="margin-top:10px"><div><b class="up">상위</b>${top.map(x=>`<div class="snap-row"><span>${escHtml(x.s.name)}</span><b class="up">${pct(x.ret)}</b></div>`).join("")}</div><div><b class="down">하위</b>${bottom.map(x=>`<div class="snap-row"><span>${escHtml(x.s.name)}</span><b class="down">${pct(x.ret)}</b></div>`).join("")}</div></div>
    <p class="muted-sm" style="margin-top:8px">장기 범위는 시작가의 ${Math.round(MIN_TOTAL_RATIO*100)}%~${Math.round(MAX_TOTAL_RATIO*100)}%로 제한됩니다. 이 패널은 밸런스 이상치를 빨리 발견하기 위한 관측용입니다.</p>
  </div></section>`;
}

function buyRebirthUpgrade(id){
  const r=ensureRebirth(), u=REBIRTH_UPGRADES.find(x=>x.id===id);

  if(lv>=u.max) return false;
  if(r.points<cost) return alert("환생 포인트가 부족합니다.");
  r.points-=cost; r.spent=(r.spent||0)+cost; r.upgrades[id]=lv+1;

  return true;
}

const DIAG_KEY="money_playground_diag", DIAG_MAX=30;
let diagCache=null;
function gaId(){ try{ const m=document.querySelector('meta[name="ga4-id"]'); return (m&&m.getAttribute?String(m.getAttribute("content")||"").trim():"")||""; }catch(e){ return ""; } }
function diagState(){
  if(diagCache) return diagCache;
  try{ diagCache=JSON.parse(localStorage.getItem(DIAG_KEY)||"null")||{}; }catch(e){ diagCache={}; }
  if(!Array.isArray(diagCache.errors)) diagCache.errors=[];
  if(!diagCache.events||typeof diagCache.events!=="object") diagCache.events={};
  return diagCache;
}
function diagPersist(){ try{ localStorage.setItem(DIAG_KEY, JSON.stringify(diagState())); }catch(e){} }
function gtagSafe(cmd){ try{ if(typeof window!=="undefined" && typeof window.gtag==="function") window.gtag.apply(window, arguments); }catch(e){} }
// 주요 행동을 세어 두고, GA4가 설정되어 있으면 같이 보냅니다.
function trackEvent(name,params){
  try{
    const d=diagState();
    d.events[name]=(d.events[name]||0)+1;
    d.lastEventAt=Date.now();
    diagPersist();
    gtagSafe("event", String(name), params&&typeof params==="object"?params:{});
  }catch(e){}
}
function logError(where,err){
  try{
    const d=diagState();
    const raw=(err&&(err.message||err.reason||err))||"unknown";
    d.errors.unshift({at:Date.now(), where:String(where||""), code:String((err&&err.code)||""), msg:String(raw).slice(0,300)});
    if(d.errors.length>DIAG_MAX) d.errors.length=DIAG_MAX;
    diagPersist();
    gtagSafe("event","js_error",{where:String(where||""), code:String((err&&err.code)||"")});
  }catch(e){}
}
// GA4 측정 ID를 meta[name=ga4-id]에 넣으면 자동으로 켜집니다(없으면 아무 것도 보내지 않습니다).
function analyticsBoot(){
  const id=gaId();
  if(!id) return;
  try{
    if(document.getElementById("ga4-script")) return;
    if(!document.head||typeof document.head.appendChild!=="function") return;
    const s=document.createElement("script");
    s.id="ga4-script"; s.async=true; s.src=`https://www.googletagmanager.com/gtag/js?id=${encodeURIComponent(id)}`;
    document.head.appendChild(s);
    if(typeof window!=="undefined"){
      window.dataLayer=window.dataLayer||[];
      window.gtag=function(){ window.dataLayer.push(arguments); };
      window.gtag("js",new Date());
      window.gtag("config",id,{send_page_view:true});
    }
  }catch(e){ logError("analytics",e); }
}
function diagText(){
  const d=diagState();
  const lines=[
    `앱 버전 v${SAVE_VERSION} · 리바이전 ${saveRevision()}`,
    `GA4 ${gaId()?"설정됨":"없음"} · Firebase ${firebaseConfigured()?"설정됨":"없음"}`,
    `오류 ${d.errors.length}건 · 이벤트 ${Object.keys(d.events).length}종`,
    ""
  ];
  Object.keys(d.events).forEach(k=>lines.push(`· event ${k}: ${d.events[k]}`));
  d.errors.slice(0,10).forEach(e=>lines.push(`· error ${new Date(e.at).toISOString()} [${e.where}${e.code?" "+e.code:""}] ${String(e.msg||"").slice(0,160)}`));
  return lines.join("\n");
}

const UNLOCK_RULES=[
  {id:"tax", label:"세금 계좌", need:5000000, pages:["tax"], hint:"총자산 500만원"},
  {id:"ipo", label:"공모주 청약", need:10000000, pages:["ipo"], hint:"총자산 1,000만원"},
  {id:"company", label:"기업 경영", need:30000000, pages:["company"], hint:"총자산 3,000만원"},
  {id:"rebirth", label:"환생", need:100000000, pages:["rebirth"], hint:"순자산 1억원"}
];
function ensureOnboard(){
  if(!state.onboard||typeof state.onboard!=="object") state.onboard={done:false, dismissed:false, seen:{}, unlocked:{}, firstTrade:false,tutorialDone:false};
  if(!state.onboard.seen||typeof state.onboard.seen!=="object") state.onboard.seen={};
  if(!state.onboard.unlocked||typeof state.onboard.unlocked!=="object") state.onboard.unlocked={};
  if(typeof state.onboard.tutorialDone!=="boolean") state.onboard.tutorialDone=false;
  return state.onboard;
}
function unlockReach(){ return Math.max(totalAssetsKRW(), +state.peakNet||0); }
function unlockRuleFor(page){ return UNLOCK_RULES.find(u=>u.pages.includes(page))||null; }
// 한 번이라도 기준을 넘으면 영구 해금입니다(환생·초기화 뒤에도 다시 잠기지 않음).
function unlockedMap(){
  const ob=ensureOnboard();
  if(!ob.unlocked||typeof ob.unlocked!=="object") ob.unlocked={};
  return ob.unlocked;
}
function syncUnlocks(){
  const map=unlockedMap(), reach=unlockReach();
  let changed=false;
  // 이미 환생한 세이브는 자산이 초기화됐어도 환생 화면을 영구 해금합니다.
  if(ensureRebirth().count>0 && !map.rebirth){ map.rebirth=true; changed=true; }
  UNLOCK_RULES.forEach(r=>{ if(!map[r.id] && reach>=r.need){ map[r.id]=true; changed=true; } });
  return changed;
}
function isPageLocked(page){
  // 예전 세이브에 unlocked.rebirth가 없어도 환생 횟수가 1회 이상이면 열어 줍니다.
  if(page==="rebirth" && ensureRebirth().count>0){ syncUnlocks(); return false; }
  const rule=unlockRuleFor(page);
  if(!rule) return false;
  if(unlockedMap()[rule.id]) return false;
  if(syncUnlocks() && unlockedMap()[rule.id]) return false;
  return unlockReach()<rule.need;
}
function openUnlockModal(rule){
  const reach=unlockReach(), p=Math.max(0,Math.min(100,rule.need>0?reach/rule.need*100:100));
  openModal("아직 잠겨 있어요",`<p style="font-size:13px"><b>${escHtml(rule.label)}</b>은(는) ${escHtml(rule.hint)}을 넘기면 열립니다.</p>
    <div class="bar" style="margin:10px 0"><span style="width:${p.toFixed(1)}%"></span></div>
    <p class="muted-sm">지금 ${won(reach)} / ${won(rule.need)}</p>
    <p class="muted-sm" style="margin-top:8px">대시보드의 <b>첫 걸음</b>을 따라가면 가장 빨리 자랍니다.</p>`);
}
function onboardGoals(){
  const ob=ensureOnboard();
  const dex=(state.dex&&state.dex.stocks)||{};
  return [
    {id:"salary", label:"노동으로 첫 급여 받기", done:!!((state.labor&&state.labor.shifts)>0), go:"openLabor()"},
    {id:"trade", label:"주식 처음 사보기", done:!!ob.firstTrade || Object.keys(dex).length>0, go:"show('domestic')"},
    {id:"save", label:"예금·적금 가입하기", done:(products||[]).some(p=>+p.amount>0), go:"show('banking')"}
  ];
}
function onboardPanelHtml(){
  const ob=ensureOnboard();
  if(ob.dismissed) return "";
  const goals=onboardGoals(), done=goals.filter(g=>g.done).length;
  if(done===goals.length) ob.done=true;
  return `<section class="section" data-onboard="${done}/${goals.length}">
    <div class="section-head"><h3>첫 걸음 ${done}/${goals.length}</h3><span><button class="ghost small" onclick="startTutorial(true)">튜토리얼 다시 보기</button> <button class="ghost small" onclick="dismissOnboard()">숨기기</button></span></div>
    <div class="panel stack">
      <p class="muted-sm">이 세 단계를 먼저 해보면 게임이 어떻게 돌아가는지 바로 감이 생깁니다.</p>
      ${goals.map(g=>`<div class="holding-row compact"><b>${g.done?"✅":"⬜"} ${escHtml(g.label)}</b>${g.done?`<span class="muted-sm">완료</span>`:`<button class="ghost small" onclick="${g.go}">하러 가기</button>`}</div>`).join("")}
    </div></section>`;
}

];
function clearTutorialHighlight(){
  if(tutorialTargetEl){ tutorialTargetEl.classList.remove("tutorial-target"); tutorialTargetEl=null; }
}
function tutorialRoot(){
  let el=document.getElementById("tutorialRoot");
  if(!el){ el=document.createElement("div"); el.id="tutorialRoot"; document.body.appendChild(el); }
  return el;
}
function renderTutorialStep(){
  if(!tutorialActive) return;
  const step=TUTORIAL_STEPS[tutorialStep]||TUTORIAL_STEPS[0];
  clearTutorialHighlight();
  try{ show(step.page); }catch(e){}
  setTimeout(()=>{
    if(!tutorialActive) return;
    const target=document.querySelector(step.target);
    if(target){ tutorialTargetEl=target; target.classList.add("tutorial-target"); try{ target.scrollIntoView({block:"center",behavior:"smooth"}); }catch(e){} }
  },120);
  const root=tutorialRoot();
  root.innerHTML=`<div class="tutorial-card" role="dialog" aria-modal="false" aria-label="게임 튜토리얼">
    <div class="tutorial-top"><span class="pill">튜토리얼 ${tutorialStep+1}/${TUTORIAL_STEPS.length}</span><button class="ghost small" onclick="skipTutorial()">건너뛰기</button></div>
    <h3>${escHtml(step.title)}</h3>
    <p>${escHtml(step.body)}</p>
    <div class="tutorial-dots">${TUTORIAL_STEPS.map((_,i)=>`<span class="${i===tutorialStep?"on":""}"></span>`).join("")}</div>
    <div class="button-row" style="margin-top:10px"><button class="ghost" onclick="tutorialPrev()" ${tutorialStep===0?"disabled":""}>이전</button><button class="buy" onclick="tutorialNext()">${tutorialStep===TUTORIAL_STEPS.length-1?"시작하기":"다음"}</button></div>
  </div>`;
}
function startTutorial(force){
  ensureOnboard();
  tutorialActive=true; tutorialStep=0;
  if(typeof closeModal==="function"){ try{ closeModal(); }catch(e){} }
  renderTutorialStep();
  if(force) trackEvent("tutorial_restart");
}
function tutorialNext(){
  if(!tutorialActive) return;
  if(tutorialStep>=TUTORIAL_STEPS.length-1) return finishTutorial();
  tutorialStep++; renderTutorialStep();
}
function tutorialPrev(){
  if(!tutorialActive||tutorialStep<=0) return;
  tutorialStep--; renderTutorialStep();
}
function finishTutorial(){
  tutorialActive=false;
  clearTutorialHighlight();
  const root=document.getElementById("tutorialRoot"); if(root&&root.parentNode) root.parentNode.removeChild(root);
  const ob=ensureOnboard(); ob.tutorialDone=true;
  saveGame();
  try{ show("dashboard"); }catch(e){}
  notify("system","튜토리얼 완료","이제 노동으로 첫 자금을 만들고 한 주부터 투자해 보세요.");
  maybeAskFullscreen();
}
function skipTutorial(){
  tutorialActive=false;
  clearTutorialHighlight();
  const root=document.getElementById("tutorialRoot"); if(root&&root.parentNode) root.parentNode.removeChild(root);
  ensureOnboard().tutorialDone=true; saveGame();
  maybeAskFullscreen();
}
function startTutorialIfNeeded(){
  const ob=ensureOnboard();
  if(tutorialActive || ob.tutorialDone || state.savedAt) return false;
  if(((state.labor&&state.labor.shifts)||0)>0) return false;
  setTimeout(()=>startTutorial(true),450);
  return true;
}
let unlockCheckAt=0;
function checkUnlocks(){
  const now=Date.now();
  if(now-unlockCheckAt<5000) return;
  unlockCheckAt=now;
  const ob=ensureOnboard(), reach=unlockReach();
  syncUnlocks();
  UNLOCK_RULES.forEach(u=>{
    if(ob.seen[u.id] || reach<u.need) return;
    ob.seen[u.id]=true;
    notify("system","새 기능 해금",`${u.label}이(가) 열렸습니다.`);
    trackEvent("unlock",{id:u.id});
  });
}

  startLoops();

    window.addEventListener("error",e=>{ try{ logError("window",(e&&e.error)||{message:e&&e.message}); notify("system","오류가 발생했습니다",String((e&&e.message)||"알 수 없는 오류")); }catch(_){} });
    window.addEventListener("unhandledrejection",e=>{ try{ logError("promise",e&&e.reason); }catch(_){} });
  }
  setTimeout(bootDone,350);
  setTimeout(()=>{ if(!startTutorialIfNeeded()) maybeAskFullscreen(); },800);
  if(typeof navigator!=="undefined" && "serviceWorker" in navigator && typeof location!=="undefined" && location.protocol.startsWith("http")){
    // 새 배포가 첫 로드에 보이도록 서비스워커 스크립트도 HTTP 캐시를 건너뛰고 확인합니다.
    const hadController=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("message",e=>{
      const d=e&&e.data||{};
      if(d.type==="MPG_SW_UPDATE") swUpdateNotify();
    });
    navigator.serviceWorker.addEventListener("controllerchange",()=>{
      if(hadController) swUpdateNotify(); // 첫 설치 때는 새로고침하지 않습니다.
    });
    if(typeof document!=="undefined" && document.addEventListener){
      // 백그라운드·입력 중이면 미루고, 화면으로 돌아왔을 때 적용합니다.
      document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") swUpdateApply(); });
      document.addEventListener("pointerdown",swUpdateMarkInput,{passive:true});
      document.addEventListener("keydown",swUpdateMarkInput,{passive:true});
    }
    // 입력이 멈춘 뒤에도 적용되지 못한 경우를 위해 지연 재시도합니다(저장 후 새로고침).
    setInterval(()=>{ if(swUpdateReady&&!swUpdateApplied) swUpdateApply(); },4000);
    navigator.serviceWorker.register("sw.js",{updateViaCache:"none"})
      .then(reg=>{ try{ reg.update(); }catch(e){} })
      .catch(()=>{});
  }
}

// ── 새 버전 적용: 저장을 먼저 보장하고, 거래·입력 중에는 다음 기회로 미룹니다 ──
let swUpdateReady=false, swUpdateApplied=false, swLastInput=0;
function swUpdateMarkInput(){ swLastInput=Date.now(); }
function swUpdateBusy(){
  try{
    if(typeof document==="undefined") return false;
    if(document.visibilityState && document.visibilityState!=="visible") return true; // 백그라운드 탭
    if(typeof multiTab!=="undefined" && multiTab) return true; // 다른 탭이 저장 중이라 이 탭은 저장이 잠김
    if(document.querySelector && document.querySelector("#modalRoot.on, .modal.on, dialog[open], .modal.show, .modal-backdrop")) return true; // 확인·주문·노동 창
    const el=document.activeElement, tag=(el&&el.tagName)||"";
    if(/^(INPUT|SELECT|TEXTAREA)$/.test(tag)) return true; // 주문 입력 중
    if(swLastInput && Date.now()-swLastInput<2500) return true; // 막 누른 직후
  }catch(e){}
  return false;
}
function swUpdateApply(){
  if(!swUpdateReady||swUpdateApplied) return false;
  if(swUpdateBusy()) return false;
  swUpdateApplied=true;
  try{ saveGame(); }catch(e){}
  try{ if(typeof location!=="undefined" && location.reload) location.reload(); }catch(e){}
  return true;
}
function swUpdateNotify(){ swUpdateReady=true; swUpdateApply(); }

let loopsStarted=false;
function startLoops(){
  if(loopsStarted) return;
  loopsStarted=true;
  setInterval(gameLoop,1000);
  setInterval(refreshLaborUI,1000);
  // 자동 저장은 설정을 따르되 타이머는 하나만 돌립니다.
  setInterval(()=>{ if(!state.settings || state.settings.autoSave!==false) saveGame(); },10000);
}
function gameLoop(){
  if(state.paused){ updateSpeedUI(); return; }
  const n=Math.max(1,Math.min(5,Math.round(state.speed)||1));
  for(let i=0;i<n;i++){
    tickSeconds();
    if(state.marketSeconds%15===0) tickAlt();
    if(state.marketSeconds%5===0){ tickMarket(); updateFX(); }
    if(state.marketSeconds%7===0) marketEventsAndNews();
    if(state.marketSeconds%15===0) interest();
  }
  update();
  checkUnlocks();
}

function addLog(text) {
  if(OFFLINE_REPLAY) return; // 오프라인 재생 중에는 로그·저장을 남기지 않습니다.
  const now = new Date();
  const timeStr = `[${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}]`;
  state.logs.unshift(`${timeStr} ${text}`);
  if(state.logs.length > 20) state.logs.pop();
  saveGame();
}

    stocks: stocks.map(s => ({id:s.id, own:s.own, price:s.price, avgBuy:s.avgBuy, realizedProfit:s.realizedProfit, lastMove:s.lastMove, revenue:s.revenue, opProfit:s.opProfit,
      market:s.market, group:s.group,
      volume:s.volume, foreignFlow:s.foreignFlow, instFlow:s.instFlow, taxLots:ensureTaxLots(s).map(l=>({qty:l.qty,price:l.price,at:l.at,account:l.account})),
      prevClose:s.prevClose, dayOpen:s.dayOpen, dayRet:s.dayRet, dayIndex:s.dayIndex})),

    // 서버 순위 검증용 원화 평가 스냅샷입니다. 주식·현금·상품은 서버가 저장 값으로 직접 계산하고,

    valuation: {estate:estateValue(), metals:metalValue(), company:companyValue(), bonds:bondValueKRW(), shorts:shortValueKRW(), fx:fx.usd}

}

// 같은 오리진의 다른 탭이 저장하면 이 탭은 자동 저장을 멈춥니다(마지막 탭이 덮어쓰는 사고 방지).
let multiTab=false;
function handleExternalSave(){
  if(multiTab) return;
  multiTab=true;
  state.paused=true;
  updateSpeedUI();
  notify("system","다른 탭 감지","다른 탭에서 이미 플레이 중입니다. 이 탭은 자동 저장을 멈췄습니다. 계속하려면 새로고침해 주세요.");
}
function saveRevision(){ return Math.max(0, Math.floor(+state.revision||0)); }
function saveGame() {
  if(multiTab) return;
  snapshotSave("auto");
  state.lastSeen=Date.now();
  state.savedAt=Date.now();
  state.revision=saveRevision()+1; // 저장할 때마다 리바이전을 올려 기기 간 충돌을 판단합니다.
  localStorage.setItem(SAVE_KEY, JSON.stringify(buildSaveData()));
  try{ scheduleCloudSync(); }catch(e){} // 로그인 상태면 클라우드에도 자동 업로드
}

// ── 세이브 백업 ─────────────────────────────────────────────
// 자동 저장이 덮어쓰기 전 상태를 몇 개 보관해, 파일이 깨지거나 잘못 불러왔을 때
// 같은 런 안에서 되돌릴 수 있게 합니다. (localStorage 용량 보호를 위해 크기 제한)
const SAVE_BACKUP_KEY="money_playground_backups";
const SAVE_BACKUP_MAX=3;
const SAVE_BACKUP_EVERY=5*60*1000;
const SAVE_BACKUP_BYTES=200000;
function saveBackupList(){
  try{
    const list=JSON.parse(localStorage.getItem(SAVE_BACKUP_KEY)||"[]");
    return (Array.isArray(list)?list:[]).filter(b=>b&&typeof b.data==="string"&&b.data.length<=SAVE_BACKUP_BYTES&&Number.isFinite(+b.at));
  }catch(e){ return []; }
}
function snapshotSave(reason, at){
  const raw=localStorage.getItem(SAVE_KEY);
  if(!raw || raw.length>SAVE_BACKUP_BYTES) return false;
  const list=saveBackupList();
  const last=list[0];
  if(last && last.data===raw) return false;
  const now=Number.isFinite(+at)?+at:Date.now();
  if(reason==="auto" && last && now-(+last.at||0)<SAVE_BACKUP_EVERY) return false;
  list.unshift({at:now,reason:String(reason||"auto").slice(0,12),revision:saveRevision(),data:raw});
  try{ localStorage.setItem(SAVE_BACKUP_KEY, JSON.stringify(list.slice(0,SAVE_BACKUP_MAX))); return true; }
  catch(e){ return false; }
}
function clearSaveBackups(){
  try{ localStorage.removeItem(SAVE_BACKUP_KEY); }catch(e){}
}
function backupLabel(){
  const list=saveBackupList();
  if(!list.length) return "백업 없음";
  return `${new Date(+list[0].at).toLocaleString("ko-KR")} · ${list.length}개`;
}
function restoreLatestBackup(){
  const list=saveBackupList();
  if(!list.length) return alert("복원할 백업이 없습니다.");
  const last=list[0];
  if(!confirm(`${new Date(+last.at).toLocaleString("ko-KR")} 시점의 저장으로 되돌릴까요?\n지금 진행은 사라집니다.`)) return;
  try{
    applySaveData(JSON.parse(last.data));
    saveGame(); banking(); fxPage(); portfolio(); update();
    notify("system","백업 복원",`${new Date(+last.at).toLocaleString("ko-KR")} 백업을 불러왔습니다.`+(lastSaveFixReport.length?` · 값 ${lastSaveFixReport.length}개 보정`:""));
  } catch(e) {
    alert(saveStaleRebirth(e)?SAVE_STALE_REBIRTH_MSG:"백업을 복원하지 못했습니다.");
  }
}

// 저장 백업 3개를 목록으로 보여 주고, 미리보기 후 선택해서 복원합니다.
function backupPreviewData(b){

    const usd=(+st.usd||0)*(+(data.fx&&data.fx.usd)||1);
    return {data,cash:+st.cash||0,usd,stock,prod,net:(+st.cash||0)+usd+stock+prod-(+st.loan||0),revision:data.state&&data.state.revision};
  }catch(e){ return null; }
}

// 저장 스키마 마이그레이션: 버전이 없는 구세이브도 현재 구조로 올린 뒤 적용합니다.
const SAVE_MIGRATIONS={
  2:data=>{
    // v2: 평단가에 매수 수수료가 포함되는 형식으로 통일합니다.
    if(data.costBasisIncludesFee===undefined) data.costBasisIncludesFee=false;
    return data;
  },
  4:data=>{
    // v4: 저장 리바이전·저장 시각을 추가합니다(기기 간 저장 충돌 판단용).
    data.state=data.state||{}
    if(!Number.isFinite(+data.state.revision)||+data.state.revision<0) data.state.revision=0;
    if(!Number.isFinite(+data.state.savedAt)||+data.state.savedAt<0) data.state.savedAt=0;
    return data;
  },
  3:data=>{
    // v3: 세금 계좌별 로트·연간 납입한도·세금연도·계좌별 납부 내역을 추가합니다.
    data.state=data.state||{};
    const t=data.state.tax;
    if(t&&typeof t==="object"){
      if(!t.contributions||typeof t.contributions!=="object") t.contributions={general:0,isa:0,pension:0};
      if(!t.taxPaidByAccount||typeof t.taxPaidByAccount!=="object") t.taxPaidByAccount={general:0,isa:0,pension:0};
      if(t.carryLossBase===undefined){
        const netLoss=Math.max(0,-(+data.state.realizedYTD||0));
        t.carryLossBase=Math.max(0,(+t.carryLoss||0)-netLoss);
      }
      if(!Number.isFinite(+t.year)||+t.year<1) t.year=1;
      if(!Number.isFinite(+t.yearStart)) t.yearStart=Math.max(0,+data.state.marketSeconds||0);
    }
    return data;
  }
};
function migrateSaveData(data){
  if(!data||typeof data!=="object") return data;
  let version=Math.max(1,Math.floor(+data.version||1));
  while(version<SAVE_VERSION){
    version++;
    const step=SAVE_MIGRATIONS[version];
    if(step) data=step(data)||data;
  }
  data.version=SAVE_VERSION;
  return data;
}

// 저장 파일(localStorage·파일 불러오기·클라우드)에서 온 값은 화면에 넣기 전에 형식을 검사합니다.
// 조작된 저장 파일이 문자열 대신 HTML을 밀어 넣거나 숫자 자리에 객체를 넣지 못하게 합니다.
// 저장 값의 타입·범위·열거형 규칙표. 새 필드가 생기면 여기 한 줄만 추가하면
// 로드·불러오기·클라우드 복원이 모두 같은 규칙으로 보정됩니다.
const SAVE_NUM=(min,max)=>({kind:"number",min,max});
const SAVE_INT=(min,max)=>({kind:"int",min,max});
const SAVE_STATE_SPEC={
  cash:SAVE_NUM(0,1e18),
  usd:SAVE_NUM(0,1e15),
  loan:SAVE_NUM(0,1e18),
  loanRate:SAVE_NUM(0,1),
  marketSeconds:SAVE_INT(0,1e9),
  peakNet:SAVE_NUM(0,1e18),
  targetGoal:SAVE_NUM(1000000,1e18),
  dividendTotal:SAVE_NUM(0,1e18),
  feesTotal:SAVE_NUM(0,1e18),
  loanTotal:SAVE_NUM(0,1e18),
  realizedYTD:SAVE_NUM(-1e18,1e18),
  taxedProfit:SAVE_NUM(-1e18,1e18),
  taxPaid:SAVE_NUM(0,1e18),
  tradeTaxPaid:SAVE_NUM(0,1e18),
  wealthFeePaid:SAVE_NUM(0,1e18),
  shortRealized:SAVE_NUM(-1e18,1e18),
  altRealized:SAVE_NUM(-1e18,1e18),
  rewardedGrade:SAVE_INT(0,99),
  speed:SAVE_INT(1,5),
  revision:SAVE_INT(0,1e9),
  savedAt:SAVE_INT(0,1e15),
  lastFileBackupAt:SAVE_INT(0,1e15),
  backupPromptAt:SAVE_INT(0,1e15),
  riskScenario:{kind:"enum",values:["base","crash","rate","fx"],fallback:"base"}
};
let saveFixReport=[];
let lastSaveFixReport=[];
function saveSpecValue(entry,v){
  if(entry.kind==="enum") return entry.values.includes(v)?v:entry.fallback;
  const n=+v;
  let out=Number.isFinite(n)?n:0;
  if(entry.kind==="int") out=Math.floor(out);
  if(entry.min!=null) out=Math.max(entry.min,out);
  if(entry.max!=null) out=Math.min(entry.max,out);
  return out;
}
function normalizeSaveState(st, fixes){
  Object.keys(SAVE_STATE_SPEC).forEach(k=>{
    if(!(k in st)) return;
    const before=st[k], after=saveSpecValue(SAVE_STATE_SPEC[k],before);
    st[k]=after;
    if(after!==before && fixes.length<20) fixes.push({key:k,from:before,to:after});
  });
}
function saveText(v,max){ return String(v==null?"":v).slice(0,max); }
function saveNumber(v){ const n=+v; return Number.isFinite(n)?n:0; }
function sanitizeSaveData(data){
  if(!data || typeof data!=="object" || Array.isArray(data)) return null;
  const st=(data.state && typeof data.state==="object" && !Array.isArray(data.state))?data.state:null;
  if(!st) return data;
  const fixes=[];
  normalizeSaveState(st, fixes);
  // 기기 클라우드 저장을 접으면서 남은 연결 정보는 저장 데이터에서도 지웁니다.
  delete st.cloud;
  saveFixReport=fixes;
  // 거래 저널: 화면에 종목명·수량·금액을 그대로 그리므로 모양을 강제합니다.
  st.journal=(Array.isArray(st.journal)?st.journal:[]).filter(x=>x && typeof x==="object").slice(0,200).map(x=>({
    at:Math.max(0,saveNumber(x.at)),
    name:saveText(x.name,40),
    side:x.side==="sell"?"sell":"buy",
    qty:Math.max(0,Math.floor(saveNumber(x.qty))),
    valueKRW:Math.max(0,saveNumber(x.valueKRW)),
    fee:Math.max(0,saveNumber(x.fee)),
    profit:saveNumber(x.profit)
  }));
  // 알림 센터 기록: 제목·본문은 문자열·길이를 제한합니다.
  st.alerts=(Array.isArray(st.alerts)?st.alerts:[]).filter(a=>a && typeof a==="object").slice(0,40).map(a=>({
    at:Math.max(0,saveNumber(a.at)),
    kind:saveText(a.kind,20),
    title:saveText(a.title,80),
    text:saveText(a.text,200),
    read:!!a.read
  }));
  // 최근 거래 로그는 문자열만 남깁니다.
  st.logs=(Array.isArray(st.logs)?st.logs:[]).filter(l=>typeof l==="string").slice(0,20).map(l=>saveText(l,200));
  // 뉴스 기록은 기업명 같은 입력값이 섞여 들어가므로 문자열·길이를 제한합니다.
  st.news=(Array.isArray(st.news)?st.news:[]).filter(n=>typeof n==="string").slice(0,25).map(n=>saveText(n,200));
  return data;
}

// localStorage와 파일 불러오기가 같은 경로를 쓰도록 저장 데이터 적용을 한 곳에 모읍니다.
// 저장 파일에 적힌 환생 횟수(0부터). 없는 예전 저장은 0회로 봅니다.
function saveRebirthCount(data){
  const st=data && data.state;
  if(!st || typeof st!=="object") return null; // 저장 형식이 아니면 환생 비교를 하지 않습니다.
  const r=st.rebirth;
  return Math.max(0,Math.floor(+((r&&r.count)||0)));
}
function applySaveData(data) {
  data=sanitizeSaveData(migrateSaveData(data));
  if(!data) throw new Error("잘못된 저장 데이터");
  lastSaveFixReport=saveFixReport.slice();
  // 진행만 되돌린 뒤 같은 순자산으로 환생 포인트를 다시 받는 우회를 막습니다.
  const incomingRebirths=saveRebirthCount(data);
  if(incomingRebirths!=null && incomingRebirths < ensureRebirth().count) throw Object.assign(new Error("stale_rebirth"),{code:"stale_rebirth"});
  if(data.state) Object.assign(state, data.state);
  if(data.fx) Object.assign(fx, data.fx);
  // 공모주로 상장된 종목을 먼저 복원해야 저장된 가격·보유량을 적용할 수 있습니다.
  if(Array.isArray(state.listedIds)) state.listedIds.forEach(id => { const d=IPO_POOL.find(x=>x.id===id); if(d) ensureListedStock(d,d.price); });
  if(data.stocks) {
    data.stocks.forEach(ls => {
      let s = stocks.find(x => x.id === ls.id);
      if(!s) return;
      s.own = ls.own || 0;
      // 예전 저장의 -99%·+2,300% 가격도 새 장기 범위 안으로 보정합니다.
      s.price = clampStockPrice(s, ls.price || s.start);
      s.avgBuy = ls.avgBuy || 0;
      // 구버전 저장 데이터의 평단가에는 매수 수수료가 빠져 있으므로 취득원가로 한 번만 환산
      if(data.costBasisIncludesFee !== true && s.avgBuy > 0) s.avgBuy *= (1 + FEE_STOCK);
      s.realizedProfit = ls.realizedProfit || 0;
      s.lastMove = ls.lastMove || 0;
      s.volume=Math.max(0,+ls.volume||0); s.foreignFlow=Math.max(-1e15,+ls.foreignFlow||0); s.instFlow=Math.max(-1e15,+ls.instFlow||0);
      if(Array.isArray(ls.taxLots)) s.taxLots=ls.taxLots.filter(l=>l&&+l.qty>0).map(l=>({qty:Math.floor(+l.qty||0),price:Math.max(0,+l.price||0),at:Math.max(0,+l.at||0),account:TAX_ACCOUNTS.includes(l.account)?l.account:"general"}));
      if(Number.isFinite(+ls.revenue)&&+ls.revenue>0) s.revenue=+ls.revenue;
      if(Number.isFinite(+ls.opProfit)&&+ls.opProfit>=0) s.opProfit=+ls.opProfit;
      // 일일 시세(전일 종가·시가·변동률) 복원 · 구버전 세이브는 현재가 기준으로 보정
      s.prevClose=clampStockPrice(s,(Number.isFinite(+ls.prevClose)&&+ls.prevClose>0)?+ls.prevClose:s.price);
      s.dayOpen=clampStockPrice(s,(Number.isFinite(+ls.dayOpen)&&+ls.dayOpen>0)?+ls.dayOpen:s.price);
      s.dayRet=Number.isFinite(+ls.dayRet)?+ls.dayRet:0;
      s.dayIndex=Number.isFinite(+ls.dayIndex)?+ls.dayIndex:marketDayIndex(state.marketSeconds);
    });
  }
  if(data.products) {
    data.products.forEach(lp => {
      let p = products.find(x => x.id === lp.id);
      if(!p) return;
      p.amount = lp.amount || 0;
      // 구버전 저장 데이터에는 rate가 없으므로, 가입 중이면 현재 등급 이율로 확정해 줍니다.
      // 현재 등급이 해당 상품을 열 수 없으면 그 상품의 해금 등급 이율로 확정해 이자가 0이 되지 않도록 함
      p.rate = (Number.isFinite(lp.rate) && lp.rate > 0) ? lp.rate
        : (p.amount > 0 ? (gradeRateFor(p.id, currentGrade()) || gradeRateFor(p.id, PRODUCT_UNLOCK[p.id])) : 0);
      p.bank=lp.bank||null;
      p.startedAt=Number.isFinite(lp.startedAt)?lp.startedAt:null;
      p.matured=!!lp.matured;
    });
  }
  // 새 기능 필드 기본값 보정(구버전 세이브 대응)
  ensureAdvancedState();
  stocks.forEach(s=>ensureTaxLots(s));
  if(!Array.isArray(state.orders)) state.orders = [];
  if(!Array.isArray(state.shorts)) state.shorts = [];
  state.shorts=state.shorts.filter(p=>p&&typeof p==="object"&&stock(p.stockId)&&+p.qty>0).map(p=>({id:p.id||`sh${Math.random().toString(36).slice(2,8)}`,stockId:p.stockId,qty:Math.floor(+p.qty||0),entry:Math.max(0,+p.entry||0),margin:Math.max(0,+p.margin||0),at:Math.max(0,+p.at||0)}));
  ensureBonds(); ensureIPO();
  if(!Array.isArray(state.listedIds)) state.listedIds = [];
  if(!Number.isFinite(+state.shortRealized)) state.shortRealized = 0;
  if(!state.goals || typeof state.goals !== "object") state.goals = {};
  ["loan","loanRate","realizedYTD","taxedProfit","taxPaid","wealthFeePaid","wealthFeeAt"].forEach(k => {
    if(!Number.isFinite(state[k]) || state[k] < 0) state[k] = 0;
  });
  if((state.loan||0)>0 && !(state.loanRate>0)) state.loanRate=TAX_DEBT_RATE;
  if(!Number.isFinite(fx.anchor)) fx.anchor = fx.usd || START_FX; // 구버전 저장 대응
  // 신규 기능 필드 기본값 보정
  if(!Array.isArray(state.watch)) state.watch=[];
  if(!Array.isArray(state.journal)) state.journal=[];
  if(!Array.isArray(state.alerts)) state.alerts=[];
  if(!state.achievements || typeof state.achievements!=="object") state.achievements={};
  ["loanTotal","dividendTotal","feesTotal"].forEach(k=>{ if(!Number.isFinite(state[k])) state[k]=0; });
  state.notify=Object.assign({},NOTIFY_DEFAULT,(state.notify&&typeof state.notify==="object")?state.notify:{});
  Object.keys(NOTIFY_DEFAULT).forEach(k=>{ if(k!=="sound"&&k!=="haptic"&&k!=="master"&&k!=="newsGap"&&k!=="toastMs"&&k!=="toastMax"&&k!=="push") state.notify[k]=state.notify[k]!==false; });
  state.notify.master=state.notify.master===true;
  state.notify.push=state.notify.push===true;
  state.notify.newsGap=Math.max(0,Math.min(600,Math.round(+state.notify.newsGap||0)));
  state.notify.toastMs=Math.max(2000,Math.min(8000,Math.round(+state.notify.toastMs||4200)));
  state.notify.toastMax=Math.max(1,Math.min(5,Math.round(+state.notify.toastMax||3)));
  const AUTO_DEFAULT={enabled:false,stockPct:60,minCash:1000000,every:60,goldPct:0,estatePct:0,autoSell:false,takeProfit:20,stopLoss:10,rebalance:false,rebStockPct:60,rebBand:5,taxAware:false,taxBudget:0};
  state.auto=Object.assign({},AUTO_DEFAULT,(state.auto&&typeof state.auto==="object")?state.auto:{});
  state.auto.goldPct=Math.max(0,Math.min(100,+state.auto.goldPct||0));
  state.auto.estatePct=Math.max(0,Math.min(100,+state.auto.estatePct||0));
  const LABOR_DEFAULT={shifts:0,earned:0,lastAt:{},warned:false,xp:0,points:0,stamina:100,skills:{focus:0,stamina:0,service:0}};
  state.labor=Object.assign({},LABOR_DEFAULT,(state.labor&&typeof state.labor==="object")?state.labor:{});
  state.labor.shifts=Math.max(0,Math.floor(+state.labor.shifts||0));
  state.labor.earned=Math.max(0,+state.labor.earned||0);
  state.labor.xp=Math.max(0,+state.labor.xp||0);
  state.labor.points=Math.max(0,Math.floor(+state.labor.points||0));
  if(!state.labor.skills||typeof state.labor.skills!=="object") state.labor.skills={focus:0,stamina:0,service:0};
  if(!state.labor.lastAt||typeof state.labor.lastAt!=="object") state.labor.lastAt={};
  LABOR_JOBS.forEach(j=>{ const t=+state.labor.lastAt[j.id]; if(!Number.isFinite(t)||t<0||t>Date.now()) delete state.labor.lastAt[j.id]; });
  state.labor.warned=!!state.labor.warned;
  if(!Number.isFinite(+state.rewardedGrade)) state.rewardedGrade=gradeIndex(currentGrade());
  if(!Number.isFinite(+state.targetGoal)||+state.targetGoal<=0) state.targetGoal=1000000000;
  if(!state.daily || typeof state.daily!=="object") state.daily={date:"",counts:{},claimed:{}};
  state.revision=Math.max(0,Math.floor(+state.revision||0));
  state.savedAt=Math.max(0,+state.savedAt||0);
  if(!Number.isFinite(state.speed) || state.speed<1) state.speed=1;
  state.speed=Math.max(1,Math.min(5,Math.round(state.speed)));
  ensureOnboard();
  // 새 설정 항목 기본값·타입 보정(잘못된 값이 들어와도 게임이 멈추지 않게)
  state.settings=Object.assign({},SETTINGS_DEFAULT,(state.settings&&typeof state.settings==="object")?state.settings:{});
  state.settings.speed=state.speed;
  state.settings.theme=state.settings.theme==="dark"?"dark":"light";
  state.settings.numberFormat=state.settings.numberFormat==="short"?"short":"full";
  ["confirmTrades","animations","effects","autoSave","fullscreenPrompt","beginnerMode"].forEach(k=>{ state.settings[k]=state.settings[k]!==false; });
  ["colorblind","largeText"].forEach(k=>{ state.settings[k]=state.settings[k]===true; });
  ensureRebirth();
  // 구버전 세이브 마이그레이션: 환생 기록이 있으면 환생 화면을 즉시 영구 해금합니다.
  if(state.rebirth.count>0) unlockedMap().rebirth=true;
  if(!state.ui || typeof state.ui!=="object") state.ui={assetTab:"overview"};
  if(!["overview","stocks","finance","estate","metals","company","journal","growth","risk"].includes(state.ui.assetTab)) state.ui.assetTab="overview";
  ["cash","usd","loan","peakNet","altRealized"].forEach(k=>{ if(!Number.isFinite(+state[k]) || +state[k]<0) state[k]=0; });
  if(typeof state.paused!=="boolean") state.paused=false;
  if(!Number.isFinite(state.seasonBase) || state.seasonBase<=0) state.seasonBase=totalAssetsKRW();
  if(!Number.isFinite(state.seasonBaseIndex) || state.seasonBaseIndex<=0) state.seasonBaseIndex=marketIndex();
  // 확장 자산 기본값/정규화(구버전 세이브 호환)
  if(!state.estate||typeof state.estate!=="object") state.estate={};
  ESTATES.forEach(e=>{ const h=state.estate[e.id]; if(!h||typeof h!=="object") { delete state.estate[e.id]; return; } h.qty=Math.max(0,Math.floor(+h.qty||0)); h.avgBuy=Math.max(0,+h.avgBuy||0); if(!h.qty) delete state.estate[e.id]; });
  if(!state.metals||typeof state.metals!=="object") state.metals={};
  METALS.forEach(m=>{ const h=state.metals[m.id]; if(!h||typeof h!=="object"){ state.metals[m.id]={qty:0,avg:0}; return; } h.qty=Math.max(0,+h.qty||0); h.avg=Math.max(0,+h.avg||0); });
  if(!state.altPrices||typeof state.altPrices!=="object") state.altPrices={};
  ESTATES.forEach(e=>{ if(!Number.isFinite(state.altPrices[e.id])||state.altPrices[e.id]<=0) state.altPrices[e.id]=e.price; });
  METALS.forEach(m=>{ if(!Number.isFinite(state.altPrices[m.id])||state.altPrices[m.id]<=0) state.altPrices[m.id]=m.price; });
  if(state.company && typeof state.company==="object"){
    const c=state.company;
    c.level=Math.max(1,Math.min(COMPANY_LEVELS.length,Math.floor(+c.level||1)));
    c.valuation=Math.max(0,+c.valuation||COMPANY_LEVELS[0].val);
    c.revenue=Math.max(0,+c.revenue||0); c.profit=Math.max(0,+c.profit||0);
    c.payout=Math.max(0,Math.min(1,Number.isFinite(+c.payout)?+c.payout:.3));
    if(!c.acquired||typeof c.acquired!=="object"||Array.isArray(c.acquired)) c.acquired={};
    // 기업명은 화면에 그대로 그려지므로 저장 파일에서도 길이·제어문자를 제한합니다.
    c.name=String(typeof c.name==="string"?c.name:"").replace(/[\u0000-\u001f\u007f]/g," ").trim().slice(0,12)||"나의 기업";
    c.upkeep=Math.max(0,+c.upkeep||0);
    c.risk=Math.max(0,+c.risk||0);
    if(c.listed&&typeof c.listed==="object"){
      c.listed.shares=Math.max(1,Math.floor(+c.listed.shares||COMPANY_SHARES));
      c.listed.ipoPrice=Math.max(100,Math.round(+c.listed.ipoPrice||100));
      c.listed.price=Math.max(100,Math.round(+c.listed.price||c.listed.ipoPrice));
      c.listed.ownPct=Math.max(0,Math.min(100,Math.round(+c.listed.ownPct||0)));
    } else c.listed=null;
  } else state.company=null;
  state.economy=Object.assign({},ECON_DEFAULT,(state.economy&&typeof state.economy==="object")?state.economy:{});
  ["baseRate","inflation","unemployment","gdpGrowth","cycleLeft","rateAdj"].forEach(k=>{ if(!Number.isFinite(+state.economy[k])) state.economy[k]=ECON_DEFAULT[k]; });
  if(!["호황","중립","불황"].includes(state.economy.phase)) state.economy.phase="중립";
  if(!state.weekly||typeof state.weekly!=="object"||!state.weekly.counts) state.weekly={key:"",counts:{},claimed:{}};
  if(!state.special||typeof state.special!=="object") state.special={};
  if(!state.streak||typeof state.streak!=="object") state.streak={days:1,last:"",best:1};
  if(!state.dex||typeof state.dex!=="object") state.dex={stocks:{},products:{},estates:{},metals:{},company:false};
  ["stocks","products","estates","metals"].forEach(k=>{ if(!state.dex[k]||typeof state.dex[k]!=="object") state.dex[k]={}; });
  state.dex.company=!!state.dex.company;
  if(state.company && !Number.isFinite(state.company.book)) state.company.book=state.company.valuation;
  if(!state.journalFilter||typeof state.journalFilter!=="object") state.journalFilter={q:"",side:"all"};
  state.peakNet=Math.max(Number.isFinite(+state.peakNet)?+state.peakNet:0,totalAssetsKRW());
  if(!Number.isFinite(+state.altRealized)) state.altRealized=0;
  // 월간 리포트 기준점: 새 달이거나 월간 기준이 없는 구버전 저장이면 현재 자산에서 다시 시작합니다.
  const month=seasonKey();
  if(state.reportMonth!==month){
    state.reportMonth=month;
    state.seasonBase=totalAssetsKRW();
    state.seasonBaseIndex=marketIndex();
  }
  state.lastGrade=currentGrade();
  applyTheme(); // 불러온 설정(큰 글씨·색약·테마)을 즉시 반영합니다.
}

  state.priceAlerts = [];
  state.achievements = {};
  state.loanTotal = 0;
  state.dividendTotal = 0;
  state.feesTotal = 0;

  state.labor={shifts:0,earned:0,lastAt:{},warned:false,xp:0,points:0,stamina:100,skills:{focus:0,stamina:0,service:0}};
  state.estate={}; state.metals={gold:{qty:0,avg:0},silver:{qty:0,avg:0}}; state.company=null;
  state.altPrices={}; state.economy=Object.assign({},ECON_DEFAULT);
  state.weekly={key:"",counts:{},claimed:{}}; state.special={}; state.streak={days:1,last:"",best:1};
  state.dex={stocks:{},products:{},estates:{},metals:{},company:false}; state.peakNet=START_CASH; state.altRealized=0;
  state.journalFilter={q:"",side:"all"}; state.rewardedGrade=0; state.targetGoal=1000000000;
  state.ui={assetTab:"overview",mobileStock:"",dashMore:null};
  state.seasonBase = START_CASH; state.reportMonth=seasonKey();
  fx.usd = START_FX;
  fx.anchor = START_FX;
  stocks.forEach(s=>{
    s.price = s.start;

    s.lastMove = 0;

    s.revenue = Math.max(100000000,Math.round(s.start*10000));
    s.opProfit = Math.round(s.revenue*.12);
    s.hist = [s.start];
    s.taxLots = [];
    s.volume = 0; s.foreignFlow = 0; s.instFlow = 0;

function nav(){

function goPage(id, force){
  // 잠긴 화면은 어떤 경로로 들어와도 같은 검사를 거칩니다(내부 이동은 force로 통과).
  if(!force){
    const rule=unlockRuleFor(id);
    if(rule && isPageLocked(id)){ openUnlockModal(rule); return; }
  }
  document.querySelectorAll(".page").forEach(x=>x.classList.toggle("on",x.id==id));
  if(typeof window!=="undefined" && typeof window.scrollTo==="function") window.scrollTo({top:0,behavior:"auto"});
  const globalStats=document.querySelector(".stats");
  if(globalStats) globalStats.classList.toggle("hidden",["dashboard","portfolio","settings","rebirth"].includes(id));
  const active=parentPage(id);
  document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("on",x.dataset.page===active));
  document.querySelectorAll(".bb-nav button").forEach(x=>x.classList.toggle("on",x.dataset.page===active));
  const activeNav=document.querySelector(".nav button.on");
  if(activeNav&&activeNav.parentElement){ const n=activeNav.parentElement; n.scrollLeft=Math.max(0,activeNav.offsetLeft-n.clientWidth/2+activeNav.offsetWidth/2); }
  renderPage(id);
  if(LIVE_PAGES.includes(id)) livePageKeys[id]=livePageKey(id);
  refreshLaborUI();
  renderMobileTradeBar();
}
function show(id){ goPage(id); }
function quickNav(id){ goPage(id); }

const escAttr=v=>String(v==null?"":v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

  ${pageHeader("MARKET",title,desc,`<span class="pill">5초마다 갱신 · 하루 10분</span>`)}

  <div class="toolbar">

    <button class="chip ${stockView.watchOnly?"on":""}" onclick="stockView.watchOnly=!stockView.watchOnly; this.classList.toggle('on'); ['domestic','foreign','mega','special','watch'].forEach(g=>applyStockView(g))">★ 관심만</button>
    <button class="ghost" onclick="openCompare('${group}')">비교</button>
    <span class="pill" id="count-${group}"></span>
  </div>
  ${marketIntelHtml()}

function holdingCard(s){
  const isForeign=["foreign","mega","special"].includes(s.group);
  const ctx="holdings";
  const qid=qtyInputId(s.id,ctx);
  const dayC=dayChangePct(s);
  const avg=s.own>0?s.avgBuy:0;
  const value=stockPriceKRW(s)*Math.max(0,+s.own||0);
  const cost=(+s.avgBuy||0)*(+s.own||0)*(isForeign?fx.usd:1);
  const pnl=value-cost, acct=state.tax.mode, aq=accountQty(s,acct), acctAvg=accountAvgBuy(s,acct);
  return `<article class="card holding-card">
    <div class="top"><div><h2 class="stock-name" onclick="openStockDetail('${s.id}')" title="종목 상세 보기">${s.name}</h2><span class="pill">${s.ticker} · ${s.theme}</span></div><div style="display:flex;gap:6px;align-items:flex-start"><span class="pill">${s.market}</span><button class="star" onclick="openStockDetail('${s.id}')" aria-label="종목 상세" title="종목 상세">ℹ️</button></div></div>
    <div class="price ${dayC>=0?"up":"down"}" data-price="${s.id}" onclick="openStockDetail('${s.id}')" title="종목 상세 보기">${isForeign ? usdStr(s.price) : won(s.price)}</div>
    <p class="${dayC>=0?"up":"down"}" data-change="${s.id}">오늘 ${pct(dayC)} · 전일 종가 기준</p>
    <div class="spark" data-spark="${s.id}" onmousemove="sparkHover(event,'${s.id}')" onmouseleave="sparkLeave('${s.id}')">${sparklineHTML(s)}</div>
    <div class="mini holding-mini">
      <div><small>보유</small><b data-own="${s.id}">${qtyText(s.own)}</b></div>
      <div><small>평단</small><b data-avg="${s.id}">${avg>0?(isForeign?usdStr(avg):won(avg)):"-"}</b></div>
      <div><small>평가액</small><b data-hold-value="${s.id}">${won(value)}</b></div>
      <div><small>평가손익</small><b class="${pnl>=0?"up":"down"}" data-hold-pnl="${s.id}">${pnl>=0?"+":""}${won(pnl)}</b></div>
    </div>
    <p class="muted-sm" style="margin:6px 0">현재 계좌 ${taxModeLabel(acct)} · 평단 ${acctAvg>0?(isForeign?usdStr(acctAvg):won(acctAvg)):"-"} · 매도 가능 <b>${qtyText(aq)}</b>${s.own>aq?` (다른 계좌 ${qtyText(s.own-aq)})`:""}</p>
    <div class="quick-trade">
      <button class="ghost" onclick="setTradeQty('${s.id}','one','${ctx}')">1주</button>
      <button class="ghost" onclick="setTradeQty('${s.id}','own','${ctx}')">보유 전량</button>
      <button class="sell" onclick="fullSell('${s.id}')">전량 매도</button>
    </div>
    <div class="trade trade-qty trade-sell-only trade-dock" style="margin-top:6px">
      <input id="${qid}" class="qty-input" type="number" min="1" step="1" value="1" inputmode="numeric" aria-label="${escAttr(s.name)} 매도 수량">
      <button class="sell" onclick="sellQty('${s.id}','${ctx}')">매도</button>
    </div>
  </article>`;
}
function holdingsPage(){
  const page=$("holdings"); if(!page) return;
  const owned=stocks.filter(s=>+s.own>0).sort((a,b)=>stockPriceKRW(b)*b.own-stockPriceKRW(a)*a.own);
  const total=owned.reduce((a,s)=>a+stockPriceKRW(s)*s.own,0);
  const cost=owned.reduce((a,s)=>a+(+s.avgBuy||0)*s.own*(isForeignStock(s)?fx.usd:1),0);
  const pnl=total-cost;
  page.innerHTML=`${marketDayBarHTML()}
  ${pageHeader("MARKET","보유 주식","국내·해외·공모주 등 모든 계좌의 보유 종목을 한곳에 모았습니다. 이 화면은 매도만 가능합니다.",`<span class="pill">${owned.length}종목</span>`)}
  ${marketTabs("holdings")}

function card(s, group){

  const ctx=group||"";
  const qid=qtyInputId(s.id,ctx);
  // 일시정지 중에 화면을 새로 그려도 0.00%가 아니라 현재 값을 바로 보여 줍니다.
  const dayC=dayChangePct(s);
  const roi=(s.own>0&&s.avgBuy>0)?(s.price-s.avgBuy)/s.avgBuy:0;
  const maxBuy=maxBuyQty(s);
  return `<article class="card">
    <div class="top"><div><h2 class="stock-name" onclick="openStockDetail('${s.id}')" title="종목 상세 보기">${s.name}</h2><span class="pill">${s.ticker} · ${s.theme}</span></div><div style="display:flex;gap:6px;align-items:flex-start"><span class="pill">${s.market}</span><button class="star" onclick="openStockDetail('${s.id}')" aria-label="종목 상세" title="종목 상세">ℹ️</button><button class="star ${isWatched(s.id)?"on":""}" onclick="toggleWatch('${s.id}')" aria-label="관심종목" title="관심종목">★</button><button class="star" onclick="openPriceAlert('${s.id}')" aria-label="가격 알림" title="가격 알림">🔔</button></div></div>
    <div class="price ${dayC>=0?"up":"down"}" data-price="${s.id}" onclick="openStockDetail('${s.id}')" title="종목 상세 보기">${isForeign ? usdStr(s.price) : won(s.price)}</div>
    <p class="${dayC>=0?"up":"down"}" data-change="${s.id}">오늘 ${pct(dayC)} · 전일 종가 기준</p>
    <div class="flow-line"><span>거래량 <b data-volume="${s.id}">${volumeText(s.volume)}</b></span><span>외국인 <b class="${s.foreignFlow>=0?"up":"down"}" data-foreign="${s.id}">${flowText(s.foreignFlow)}</b></span><span>기관 <b class="${s.instFlow>=0?"up":"down"}" data-inst="${s.id}">${flowText(s.instFlow)}</b></span></div>
    <div class="spark" data-spark="${s.id}" onmousemove="sparkHover(event,'${s.id}')" onmouseleave="sparkLeave('${s.id}')">${sparklineHTML(s)}</div>
    <div style="margin-top:8px; font-size:12px; color:#475569;">
      평단(수수료포함): <span data-avg="${s.id}">${s.own>0?(isForeign?usdStr(s.avgBuy):won(s.avgBuy)):"-"}</span> | 수익률: <span class="${roi>=0?"up":"down"}" data-roipct="${s.id}">${s.own>0?pct(roi):"0%"}</span>
    </div>
    <div class="mini">
      <div><small>보유</small><b data-own="${s.id}">${qtyText(s.own)}</b></div>
      <div><small>풀매수 가능</small><b data-maxbuy="${s.id}">${qtyText(maxBuy)}</b></div>
      <div><small>풀매도 가능</small><b data-maxsell="${s.id}">${qtyText(s.own)}</b></div>
    </div>
    <div class="quick-trade">
      <button class="ghost" onclick="setTradeQty('${s.id}','one','${ctx}')">1주</button>
      <button class="buy" onclick="fullBuy('${s.id}')">최대 매수</button>
      <button class="sell" onclick="fullSell('${s.id}')">전량 매도</button>
    </div>
    <div class="trade trade-qty trade-dock" style="margin-top:6px">
      <input id="${qid}" class="qty-input" type="number" min="1" step="1" value="1" inputmode="numeric" aria-label="${escAttr(s.name)} 거래 수량">
      <button class="buy" onclick="buyQty('${s.id}','${ctx}')">매수</button>

// ── 종목 상세 정보 ────────────────────────────────
// 종목 이름·현재가를 누르거나 ℹ️ 버튼을 누르면 시세·펀더멘털·내 보유 현황을 한 창에 보여 줍니다.
function openStockDetail(id){
  const s=stock(id); if(!s) return;
  const isForeign=isForeignStock(s);
  const priceText=v=>isForeign?usdStr(v):won(v);
  const dayC=dayChangePct(s);
  const hist=(s.hist&&s.hist.length?s.hist:[s.start,s.price]).filter(v=>+v>0);
  const series=priceSeries(s);
  const histHigh=series.length?Math.max(...series):s.price, histLow=series.length?Math.min(...series):s.price;
  const own=Math.max(0,+s.own||0);
  const value=stockPriceKRW(s)*own, cost=(+s.avgBuy||0)*own*(isForeign?fx.usd:1), pnl=value-cost;
  const roi=cost>0?pnl/cost:0;
  const acct=state.tax.mode, aq=accountQty(s,acct);
  const lots=(s.taxLots||[]).filter(l=>l&&+l.qty>0);
  const lotRows=TAX_ACCOUNTS.map(a=>{
    const qty=lots.filter(l=>l.account===a).reduce((sum,l)=>sum+Math.floor(+l.qty||0),0);
    return qty>0?`<div class="holding-row compact"><b>${taxModeLabel(a)}</b><span>${qtyText(qty)}</span><span class="muted-sm">${won(stockPriceKRW(s)*qty)}</span></div>`:"";
  }).join("");
  openModal(`${escHtml(s.name)} 상세`,`
    <p class="muted-sm">${escHtml(s.ticker)} · ${escHtml(s.market)} · ${escHtml(s.theme)}${s.ipo?" · 공모주":""}</p>
    <div class="kpis" style="margin-top:10px">
      <div class="kpi"><small>현재가</small><b>${priceText(s.price)}</b></div>
      <div class="kpi"><small>오늘 변동</small><b class="${dayC>=0?"up":"down"}">${pct(dayC)}</b></div>
      <div class="kpi"><small>전일 종가</small><b>${priceText(+s.prevClose>0?s.prevClose:s.price)}</b></div>
      <div class="kpi"><small>시가</small><b>${priceText(+s.dayOpen>0?s.dayOpen:s.price)}</b></div>
      <div class="kpi"><small>차트 최고</small><b>${priceText(histHigh)}</b></div>
      <div class="kpi"><small>차트 최저</small><b>${priceText(histLow)}</b></div>
      <div class="kpi"><small>거래량</small><b>${volumeText(s.volume)}</b></div>
      <div class="kpi"><small>외국인·기관</small><b class="${(s.foreignFlow||0)+(s.instFlow||0)>=0?"up":"down"}">${flowText(s.foreignFlow)} / ${flowText(s.instFlow)}</b></div>
    </div>
    <div class="section-head" style="margin-top:12px"><h3>가격 추이</h3><span class="pill">${priceSeriesInfo(s).synthetic?"오늘":`최근 ${Math.max(1,Math.round(hist.length*5/60))}분`}</span></div>
    ${priceChartHtml(s)}
    <div class="kpis" style="margin-top:8px">
      <div class="kpi"><small>구간 최고</small><b>${priceText(Math.max(...priceSeries(s)))}</b></div>
      <div class="kpi"><small>구간 최저</small><b>${priceText(Math.min(...priceSeries(s)))}</b></div>
      <div class="kpi"><small>구간 시작</small><b>${priceText(priceSeries(s)[0])}</b></div>
      <div class="kpi"><small>현재</small><b class="${dayC>=0?"up":"down"}">${priceText(s.price)}</b></div>
    </div>
    <div class="section-head" style="margin-top:12px"><h3>실적</h3><span class="pill">최근 발표 기준</span></div>
    <div class="kpis">
      <div class="kpi"><small>매출</small><b>${wonShort(s.revenue||0)}</b></div>
      <div class="kpi"><small>영업이익</small><b>${wonShort(s.opProfit||0)}</b></div>
      <div class="kpi"><small>영업이익률</small><b>${((+s.opProfit||0)/Math.max(1,+s.revenue||0)*100).toFixed(1)}%</b></div>
    </div>
    <div class="section-head" style="margin-top:12px"><h3>내 보유</h3><span class="pill">${taxModeLabel(acct)} · 매도 가능 <b>${qtyText(aq)}</b></span></div>
    ${own>0?`<div class="kpis">
      <div class="kpi"><small>보유 수량</small><b>${qtyText(own)}</b></div>
      <div class="kpi"><small>평균 단가</small><b>${priceText(+s.avgBuy||0)}</b></div>
      <div class="kpi"><small>평가액</small><b>${won(value)}</b></div>
      <div class="kpi"><small>평가손익</small><b class="${pnl>=0?"up":"down"}">${pnl>=0?"+":""}${won(pnl)}</b></div>
      <div class="kpi"><small>수익률</small><b class="${roi>=0?"up":"down"}">${pct(roi)}</b></div>
    </div>${lotRows||""}`:`<p class="muted-sm" style="margin-top:6px">보유하지 않은 종목입니다. 보유하면 평단·평가손익·계좌별 수량이 여기에 표시됩니다.</p>`}
    <div class="button-row" style="margin-top:12px">
      <button class="ghost" onclick="toggleWatch('${s.id}');openStockDetail('${s.id}')">${isWatched(s.id)?"★ 관심 해제":"☆ 관심 추가"}</button>
      <button class="ghost" onclick="openPriceAlert('${s.id}')">🔔 가격 알림</button>
      <button class="ghost" onclick="closeModal();show('${s.group||"domestic"}')">거래 화면으로</button>
      <button class="ghost" onclick="closeModal()">닫기</button>
    </div>`);
}

  $("banking").innerHTML=`${pageHeader("FINANCE","금융상품","현금을 안정적으로 굴리는 예금·적금입니다. 15초마다 이자가 반영됩니다.")}
  ${financeTabs("banking")}

  <div class="products">${products.map(productCard).join("")}</div>

// 상품 카드의 부제(현재 등급 이율 또는 잠금 안내)
function productSubText(p, unlocked, held){
  const term=p.term>0?` · 만기 실제 ${realSeconds(p.term)}초 · 보너스 ${(p.bonus*100).toFixed(1)}%`:" · 수시 입출금";
  const bank=BANKS.find(b=>b.id===p.bank);
  return `${p.type} · ${unlocked ? `현재 등급 연 ${(gradeRateFor(p.id, currentGrade())*100).toFixed(1)}%` : `🔒 ${unlockLabel(p.id)}${held?" · 보유 중(이자는 확정 이율로 유지)":""}`}${term}${bank?` · ${bank.name}`:""}`;
}

// 배너와 해금 상태만 갱신합니다. 금융 화면을 다시 그리지 않으므로 입력 중인 금액이 보존됩니다.
function refreshBankingState(){
  products.forEach(p=>{
    const card=document.querySelector(`[data-card="${p.id}"]`);
    if(!card) return;
    const unlocked=canJoin(p.id), held=p.amount>0;
    card.className="product"+(unlocked ? "" : (held ? " locked holding" : " locked"));
    const sub=card.querySelector(`[data-sub="${p.id}"]`);
    if(sub) sub.textContent=productSubText(p, unlocked, held);
    const input=document.getElementById(`prod-${p.id}`);
    if(input) input.disabled=!unlocked;
    const maturity=card.querySelector(`[data-maturity="${p.id}"]`);
    if(maturity) maturity.value=productMaturityText(p);
    const joinBtn=card.querySelector(`[data-join="${p.id}"]`);
    if(joinBtn) joinBtn.disabled=!unlocked;
    const bankSel=document.getElementById(`bank-${p.id}`);
    if(bankSel){
      const selected=bankSel.value||p.bank||"hanbit";
      bankSel.disabled=!unlocked;
      bankSel.innerHTML=bankOptionsHtml(p);
      bankSel.value=selected;
    }
    const bankPreview=card.querySelector(`[data-bank-preview="${p.id}"]`);
    if(bankPreview) bankPreview.textContent=bankPreviewText(p,BANKS.find(b=>b.id===(bankSel&&bankSel.value))||BANKS[0]);
  });
  const gb=document.getElementById("gradeBanner");
  if(gb) gb.innerHTML=gradeBannerHTML();
}

// 등급 안내 배너: 현재 등급, 총자산, 다음 등급까지 남은 금액
function gradeBannerHTML(){
  const next=nextGradeInfo();
  return `🏅 현재 등급: <b>${currentGrade()}</b> · 총자산 ${won(totalAssetsKRW())}` +
    (next ? ` · 다음 등급 <b>${next.grade}</b>까지 ${won(next.remain)}` : " · 최고 등급입니다") +
    `<br><span style="font-size:12px;">등급이 높을수록 같은 상품의 이율이 높습니다. 가입 시점의 이율은 이후 등급이 바뀌어도 유지됩니다.</span>`;
}

function productMaturityText(p){
  if(p.amount<=0) return "미가입";
  if(p.term<=0) return "수시";
  if(p.matured) return "만기 완료";
  // startedAt이 0인 경우(게임 시작 직후 가입)도 '지금 가입'으로 잘못 해석하지 않도록 null만 검사합니다.
  const start=p.startedAt!=null?p.startedAt:state.marketSeconds;
  const gameLeft=Math.max(0,p.term-(state.marketSeconds-start));
  return `실제 ${realSeconds(gameLeft)}초 남음`;
}

// 은행별 실제 가입 예상 이율을 보여 줍니다. +16%는 기본 이율에 곱해지는 보너스이지,
// 예금 전체가 16% 수익이 된다는 뜻이 아닙니다.
function bankRateForProduct(p,bank){
  const base=gradeRateFor(p.id,currentGrade());
  return base*(bank&&bank.mult||1)*(1+((state.economy&&state.economy.rateAdj)||0));
}
function bankOptionLabel(p,b){
  const r=bankRateForProduct(p,b);
  if(r<=0) return `${b.name} · 등급 잠금`;
  const bonus=b.mult>1?` · 기본 +${Math.round((b.mult-1)*100)}%`:" · 기본";
  return `${b.name} · 연 ${(r*100).toFixed(2)}%${bonus}`;
}
function bankOptionsHtml(p){
  return BANKS.map(b=>`<option value="${b.id}" ${(p.bank||"hanbit")===b.id?"selected":""}>${bankOptionLabel(p,b)}</option>`).join("");
}
function bankPreviewText(p,bank){
  const b=bank||BANKS.find(x=>x.id===p.bank)||BANKS[0];
  if(p.amount>0 && p.rate>0) return `보유 중 · 가입 당시 확정 연 ${(p.rate*100).toFixed(2)}% 유지 · 추가 가입도 같은 이율`;
  const r=bankRateForProduct(p,b);
  return `${b.name} 선택 시 예상 연 ${(r*100).toFixed(2)}% · 기본 이율 대비 +${Math.round((b.mult-1)*100)}% 보너스 · 가입 시 확정`;
}
function refreshBankPreview(id){
  const p=product(id), sel=$("bank-"+id); if(!p||!sel) return;
  const el=document.querySelector(`[data-bank-preview="${id}"]`);
  const bank=BANKS.find(b=>b.id===sel.value)||BANKS[0];
  if(el) el.textContent=bankPreviewText(p,bank);
}
// 상품 카드: 현재 등급 이율과 가입 당시 확정 이율을 함께 보여줍니다.
function productCard(p){
  const unlocked=canJoin(p.id);
  const held=p.amount>0;
  // 보유 중인 상품은 등급이 내려가도 이자가 계속 되므로 흐리게 처리하지 않습니다.
  const stateClass=unlocked ? "" : (held ? " locked holding" : " locked");
  return `<article class="product${stateClass}" data-card="${p.id}">
    <h2>${p.name}</h2>
    <p data-sub="${p.id}">${productSubText(p, unlocked, held)}</p>
    <div class="product-grid">
      <div><small>가입액</small><b data-prod="${p.id}">${won(p.amount)}</b></div>
      <div><small>최소 금액</small><b>${won(p.min)}</b></div>
      <div><small>확정 이율</small><b data-locked="${p.id}">${p.rate>0?`연 ${(p.rate*100).toFixed(1)}%`:"미가입"}</b></div>
      <div><small>위험도</small><b>${p.risk}</b></div>
    </div>
    <div class="trade bank-trade">
      <label>가입 금액<input id="prod-${p.id}" type="number" value="${p.min}" step="10000" placeholder="가입 금액" aria-label="${escAttr(p.name)} 가입 금액" ${unlocked?"":"disabled"}></label>
      <button class="buy" data-join="${p.id}" onclick="join('${p.id}')" ${unlocked?"":"disabled"}>가입</button>
      <button class="sell" onclick="leave('${p.id}')">해지</button>
    </div>
    <div class="inline-form" style="margin-top:8px">
      <label>은행 (가입 이율)<select id="bank-${p.id}" onchange="refreshBankPreview('${p.id}')" ${unlocked?"":"disabled"}>${bankOptionsHtml(p)}</select></label>
      <label>만기 상태<input id="maturity-${p.id}" data-maturity="${p.id}" value="${productMaturityText(p)}" readonly></label>
    </div>
    <p class="muted-sm" data-bank-preview="${p.id}" style="margin-top:6px">${bankPreviewText(p,BANKS.find(b=>b.id===(p.bank||"hanbit")))}</p>
  </article>`;
}

// ── 자산 화면 구성 요소 ───────────────────────────────────────
function assetTabs(active){
  const tabs=[["overview","개요"],["stocks","주식"],["finance","금융"],["estate","부동산"],["metals","실물"],["company","기업"],["journal","거래 내역"],["growth","성장"],["risk","리스크"]];
  return `<div class="subtabs" role="tablist">${tabs.map(([id,label])=>`<button role="tab" aria-selected="${id===active}" class="${id===active?"on":""}" onclick="setAssetTab('${id}')">${label}</button>`).join("")}</div>`;
}
function setAssetTab(id){
  state.ui=Object.assign({assetTab:"overview"},state.ui);

  state.ui.assetTab=id;

// ── 자동매매 백테스트 ──────────────────────────────
// 현재 시장을 복제해 같은 규칙으로 과거 N분을 다시 돌려 보고, 끝나면 원래 상태로 되돌립니다.
function cloneGameSnapshot(){
  return {
    state:JSON.parse(JSON.stringify(state)),
    stocks:JSON.parse(JSON.stringify(stocks)),
    products:JSON.parse(JSON.stringify(products)),
    fx:JSON.parse(JSON.stringify(fx))
  };
}
function restoreGameSnapshot(sn){
  Object.keys(state).forEach(k=>{ delete state[k]; });
  Object.assign(state,sn.state);
  stocks=sn.stocks;
  products.splice(0,products.length,...sn.products);
  Object.keys(fx).forEach(k=>{ delete fx[k]; });
  Object.assign(fx,sn.fx);
}
function runAutoBacktest(minutes){
  const m=Math.max(5,Math.min(180,Math.round(+minutes||60)));
  const snap=cloneGameSnapshot();
  const cash0=state.cash;
  const realized0=stocks.reduce((a,s)=>a+(+s.realizedProfit||0),0);
  const equity0=netAssetsKRW();
  let trades=0;
  const origRecord=recordTrade, origNotify=notify, prevReplay=OFFLINE_REPLAY;
  recordTrade=function(){ trades++; return origRecord.apply(this,arguments); };
  notify=function(){};
  OFFLINE_REPLAY=true;
  let out;
  try{
    const every=Math.max(10,Math.round(+(state.auto&&state.auto.every)||60));
    for(let i=0;i<m*12;i++){
      state.marketSeconds+=5;
      state.marketOpen=(state.marketSeconds%240)<180;
      if(state.marketSeconds%15===0) tickAlt();
      tickMarket(); updateFX();
      if(state.marketSeconds%10<5) marketEventsAndNews();
      if(state.marketSeconds%15<5) interest();
      if(state.auto&&state.auto.enabled&&state.marketSeconds%every<5){ autoSellRules(); autoInvest(true); }
    }
    out={minutes:m,trades,cashDelta:state.cash-cash0,realized:stocks.reduce((a,s)=>a+(+s.realizedProfit||0),0)-realized0,equityDelta:netAssetsKRW()-equity0};
  } finally {
    recordTrade=origRecord; notify=origNotify; OFFLINE_REPLAY=prevReplay;
    restoreGameSnapshot(snap);
  }
  return out;
}
function openAutoBacktest(minutes){
  const a=state.auto||{};
  const r=runAutoBacktest(minutes);
  update();
  openModal("자동매매 백테스트",`
    <p class="muted-sm">지난 ${r.minutes}분을 같은 규칙으로 다시 돌린 <b>가상 결과</b>입니다. 미래 수익을 보장하지 않습니다.</p>
    <div class="kpis" style="margin-top:10px">
      <div class="kpi"><small>매매 횟수</small><b>${r.trades}건</b></div>
      <div class="kpi"><small>실현손익</small><b class="${r.realized>=0?"up":"down"}">${r.realized>=0?"+":""}${won(r.realized)}</b></div>
      <div class="kpi"><small>현금 변화</small><b class="${r.cashDelta>=0?"up":"down"}">${r.cashDelta>=0?"+":""}${won(r.cashDelta)}</b></div>

    </div>
    <p class="muted-sm" style="margin-top:8px">${a.enabled?`켜진 규칙 · ${a.every||60}초마다 · 익절 ${a.takeProfit||0}% · 손절 ${a.stopLoss||0}%${a.autoSell?"":" · 자동 매도 꺼짐"}`:"자동 투자가 꺼져 있어 매매가 일어나지 않았습니다. 먼저 자동 투자를 켜세요."}</p>
    <div class="button-row" style="margin-top:12px"><button class="ghost" onclick="openAutoBacktest(30)">30분</button><button class="ghost" onclick="openAutoBacktest(180)">3시간</button><button class="ghost" onclick="closeModal()">닫기</button></div>`);
}

function updateFX(){
  let baseVol = 0.0035;
  if(state.currentEvent === "FX_SURGE") baseVol = 0.010; // 환율 급등 이벤트 발동 시 변동성 확대
  
  // 완만한 추세선(anchor)이 아주 느리게 움직이고, 실제 환율은 그 추세선을 따라갑니다.
  // 추세는 시작 환율 ±12% 안으로 제한하고 복원력도 두어, 폭주 없이 방향성만 남깁니다.
  const fxr=k=>worldTickRand("fx",k);
  fx.anchor = fx.anchor + (fxr(1) - 0.5) * 0.004 * fx.anchor + (START_FX - fx.anchor) * 0.0003;
  fx.anchor = Math.max(START_FX * 0.88, Math.min(START_FX * 1.12, fx.anchor));

  let revert = ((fx.anchor - fx.usd) / fx.anchor) * 0.05;
  let changeRate = (fxr(2) - 0.5) * baseVol + revert;
  fx.usd = Math.max(1000, Math.round(fx.usd * (1 + changeRate)));
  
  if(OFFLINE_REPLAY) return; // 재생 중에는 화면 갱신을 건너뜁니다(환율 값은 위에서 이미 갱신).
  let e=document.getElementById("fxPrice");
  if(e) e.textContent="1 USD = "+fx.usd.toLocaleString()+"원";
  let fd=document.getElementById("fxFeeDesc");
  if(fd) fd.textContent=`환전 시 ${(fxFeeRate()*100).toFixed(1)}%의 환전 수수료가 적용됩니다(${currentGrade()} 등급 우대).`;
}

function toUSD(){
  let v=+($("krw").value||0);
  if(v<=0||v>state.cash)return alert("원화 현금이 부족하거나 잘못된 액수입니다.");
  
  let dynamicFx = fx.usd * (1 + fxFeeRate()); // 등급별 우대 수수료 적용(달러를 비싸게 삼)
  let netUsd = v / dynamicFx;
  
  state.cash-=v; 
  state.usd+=netUsd; 
  addLog(`달러 환전: 원화 ${won(v)} -> ${usdStr(netUsd)} (환율: ${fx.usd}원, 수수료 ${(fxFeeRate()*100).toFixed(1)}%)`);
  update();
}

function toKRW(){
  let v=+($("usd").value||0);
  if(v<=0||v>state.usd)return alert("달러 잔고가 부족하거나 잘못된 액수입니다.");
  
  let dynamicFx = fx.usd * (1 - fxFeeRate()); // 등급별 우대 수수료 적용(원화를 적게 받음)
  let netKrw = v * dynamicFx;
  
  state.usd-=v; 
  state.cash+=netKrw; 
  addLog(`원화 환전: 달러 ${usdStr(v)} -> ${won(netKrw)} (환율: ${fx.usd}원, 수수료 ${(fxFeeRate()*100).toFixed(1)}%)`);
  update();
}

function product(id){return products.find(p=>p.id==id)}
function activePage(){return document.querySelector(".page.on")?.id}

function checkMarketOpen() {

function buy(id){

// 현재 잔고와 계좌 납입한도로 살 수 있는 최대 수량(수수료 포함)입니다.
function maxBuyQty(s){
  if(!s || !(+s.price>0)) return 0;
  const unit=+s.price*(1+stockFeeRate());
  if(!(unit>0)) return 0;
  const foreign=isForeignStock(s), balance=foreign?(+state.usd||0):(+state.cash||0);
  let max=Math.max(0,Math.floor(balance/unit));
  const room=taxContributionRoom(state.tax.mode);
  if(Number.isFinite(room)) max=Math.min(max,Math.max(0,Math.floor(room/(s.price*(foreign?fx.usd:1)))));
  return max;
}
// 같은 종목 카드가 국내·관심 화면에 동시에 있을 수 있어 화면(context)별로 수량 칸을 구분합니다.
function qtyInputId(id,ctx){ return "qty-"+id+(ctx?"-"+ctx:""); }
// 카드의 좁은 칸에서도 큰 수량이 보기 좋게 한 줄에 들어가도록 만 단위로 줄입니다.
function qtyText(n){
  const v=Math.max(0,Math.floor(+n||0));
  if(v>=10000){
    const man=v/10000;
    return `${man>=100?man.toFixed(0):man.toFixed(1).replace(/\.0$/,"")}만주`;
  }
  return v.toLocaleString("ko-KR")+"주";
}
function tradeQtyValue(id,ctx){
  const el=$(qtyInputId(id,ctx));
  const raw=(el && el.value!==undefined)?el.value:1;
  return Math.floor(+raw||0);
}
// 카드의 수량 칸을 1주·최대 매수·보유 전량으로 채웁니다(바로 주문하지는 않음).
function setTradeQty(id,mode,ctx){
  const s=stock(id), el=$(qtyInputId(id,ctx)); if(!s||!el) return;
  let q=1;
  if(mode==="max") q=Math.max(1,maxBuyQty(s));
  else if(mode==="own") q=Math.max(1,accountQty(s,state.tax.mode));
  el.value=String(q);
  return q;
}
// 카드에 입력한 수량만큼 매수합니다.
// 주문 확인 시트: 수수료·세금·체결 후 잔고까지 보여 준 뒤에만 주문합니다.
function openStockOrderSheet(kind,id,qty,ctx){
  const s=stock(id); if(!s) return;
  const acct=state.tax.mode, foreign=isForeignStock(s), fee=stockFeeRate(), taxRate=tradeTaxRate();
  let rows=[];
  if(kind==="buy"){
    const gross=s.price*qty, feeAmt=gross*fee, total=gross+feeAmt;
    const cashAfter=foreign?state.cash-total*fx.usd:state.cash-total;
    rows=[
      ["주문 단가",foreign?usdStr(s.price):won(s.price)],
      ["수량",`${qty.toLocaleString("ko-KR")}주`],
      ["주문 금액",foreign?usdStr(gross):won(gross)],
      [`수수료 ${(fee*100).toFixed(2)}%`,foreign?usdStr(feeAmt):won(feeAmt)],
      ["총 결제",foreign?usdStr(total):won(total)],
      ["체결 후 현금",won(cashAfter)]
    ];
  } else {
    const p=taxPreviewFor(s,qty,acct);
    rows=[
      ["주문 단가",foreign?usdStr(s.price):won(s.price)],
      ["수량",`${qty.toLocaleString("ko-KR")}주`],
      ["매도 금액(수수료·거래세 반영)",foreign?usdStr(p.revenue):won(p.revenue)],
      ["예상 세금",won(p.tax)],
      ["세후 수령",won(p.netKRW)],
      ["체결 후 보유",`${Math.max(0,accountQty(s,acct)-qty).toLocaleString("ko-KR")}주`],
      ["체결 후 현금",won(state.cash+p.netKRW)]
    ];
  }
  openModal(`${escHtml(s.name)} ${kind==="buy"?"매수":"매도"} 확인`,`
    <p class="muted-sm">${taxModeLabel(acct)} · ${escHtml(s.ticker)} · 시장가 주문</p>
    <div class="offline-rows" style="margin-top:8px">${rows.map(([k,v])=>`<div class="snap-row"><span>${escHtml(k)}</span><b>${escHtml(String(v))}</b></div>`).join("")}</div>
    <div class="button-row" style="margin-top:12px"><button class="${kind==="buy"?"buy":"sell"}" onclick="executeStockOrder('${kind}','${s.id}',${qty},'${ctx}')">주문 실행</button><button class="ghost" onclick="closeModal()">취소</button></div>`);
}
function executeStockOrder(kind,id,qty,ctx){
  closeModal();
  if(kind==="buy") buyQty(id,ctx,true); else sellQty(id,ctx,true);
}
function buyQty(id,ctx,skipPreview){
  if(!checkMarketOpen()) return;
  const s=stock(id); if(!s) return;
  const qty=tradeQtyValue(id,ctx), acct=state.tax.mode;
  if(qty<=0) return alert("매수 수량을 1주 이상 입력해 주세요.");
  const max=maxBuyQty(s);
  if(max<=0) return alert(isForeignStock(s)?"수수료 포함 달러 잔고 또는 계좌 납입한도가 부족합니다.":"수수료 포함 현금 또는 계좌 납입한도가 부족합니다.");
  if(qty>max) return alert(`지금은 최대 ${max.toLocaleString("ko-KR")}주까지 매수할 수 있습니다.`);
  const cost=s.price*(1+stockFeeRate())*qty, principalKRW=s.price*qty*(isForeignStock(s)?fx.usd:1);
  if(!canTaxContribute(acct,principalKRW)) return alert(`${taxModeLabel(acct)} 연간 납입한도가 부족합니다.`);
  if(!skipPreview && (state.settings||{}).confirmTrades!==false){ openStockOrderSheet("buy",id,qty,ctx); return; }
  if(!marketBuyShares(s,qty,acct)) return alert("주문을 처리하지 못했습니다. 잔고 또는 납입한도를 확인해 주세요.");
  addLog(`${s.name} ${qty.toLocaleString("ko-KR")}주 매수 (${isForeignStock(s)?usdStr(s.price):won(s.price)}, 수수료 포함 · ${taxModeLabel(acct)})`);
  saveGame(); update();
}
// 카드에 입력한 수량만큼 현재 계좌에서 매도합니다.
function sellQty(id,ctx,skipPreview){
  if(!checkMarketOpen()) return;
  const s=stock(id); if(!s) return;
  const qty=tradeQtyValue(id,ctx), acct=state.tax.mode, available=accountQty(s,acct);
  if(qty<=0) return alert("매도 수량을 1주 이상 입력해 주세요.");

  const p=taxPreviewFor(s,qty,acct), foreign=isForeignStock(s);

  if(!marketSellShares(s,qty,acct)) return alert("주문을 처리하지 못했습니다. 계좌 보유 수량을 확인해 주세요.");
  addLog(`${s.name} ${qty.toLocaleString("ko-KR")}주 매도 (${foreign?usdStr(s.price):won(s.price)} · ${taxModeLabel(acct)})`);

  if(typeof activePage==="function" && activePage()==="holdings") holdingsPage();
}

    <label class="field-label" style="margin-top:8px">조건<select id="alert-dir"><option value="above" ${!ex||ex.dir!=="below"?"selected":""}>이 가격 이상으로 오르면</option><option value="below" ${ex&&ex.dir==="below"?"selected":""}>이 가격 이하로 내리면</option></select></label>
