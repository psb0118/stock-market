// ── 자산 추이·배분 ──────────────────────────────────
// 추이 데이터는 저장 파일에 넣지 않고 메모리에만 쌓습니다(저장/불러오기 호환 유지).
const assetHistory={points:[],peak:0};

function recordAssetHistory(){
  const v=totalAssetsKRW();
  const last=assetHistory.points[assetHistory.points.length-1];
  if(last && Math.abs(last.v-v)<1) last.t=state.marketSeconds;
  else assetHistory.points.push({t:state.marketSeconds,v});
  if(assetHistory.points.length>180) assetHistory.points.shift(); // 15초 간격 45분
  assetHistory.peak=Math.max(assetHistory.peak,v);
}

function assetTrendPointAt(ratio){
  const points=assetHistory.points||[];
  if(!points.length) return null;
  const r=Math.max(0,Math.min(1,Number.isFinite(+ratio)?+ratio:0));
  const index=Math.round(r*Math.max(0,points.length-1));
  const vals=points.map(p=>p.v);
  const min=Math.min(...vals),max=Math.max(...vals),span=(max-min)||Math.max(1,Math.abs(max)*0.01);
  const point=points[index];
  const y=120-((point.v-min)/span)*(120-6)-3;
  return {point,index,value:point.v,xPct:points.length>1?index/(points.length-1):0,yPct:Math.max(0,Math.min(1,y/120))};
}
function assetTrendTimeLabel(point){
  const t=Math.max(0,+((point&&point.t)||0));
  return `${marketDayIndex(t)+1}일차 · ${clockText(t%MARKET_DAY_SECONDS)}`;
}
function assetTrendHover(ev){
  const chart=ev&&ev.currentTarget;
  if(!chart || !chart.querySelector) return;
  const svg=chart.querySelector("svg"), tip=chart.querySelector(".trend-tip");
  if(!svg || !tip || !svg.getBoundingClientRect) return;
  const rect=svg.getBoundingClientRect();
  if(!(rect.width>0)) return;
  const hit=assetTrendPointAt((+ev.clientX-rect.left)/rect.width);
  if(!hit) return;
  tip.innerHTML=`<b>${won(hit.value)}</b><small>${assetTrendTimeLabel(hit.point)}</small>`;
  tip.classList.add("on");
  const half=Math.min(rect.width/2,90);
  const x=hit.xPct*rect.width;
  tip.style.left=Math.max(half,Math.min(rect.width-half,x))+"px";
  const guide=chart.querySelector(".trend-guide"), dot=chart.querySelector(".trend-dot");
  if(guide){ guide.setAttribute("x1",(hit.xPct*600).toFixed(1)); guide.setAttribute("x2",(hit.xPct*600).toFixed(1)); guide.style.visibility="visible"; }
  if(dot){ dot.setAttribute("cx",(hit.xPct*600).toFixed(1)); dot.setAttribute("cy",(hit.yPct*120).toFixed(1)); dot.style.visibility="visible"; }
}
function assetTrendLeave(ev){
  const chart=ev&&ev.currentTarget;
  if(!chart || !chart.querySelector) return;
  const tip=chart.querySelector(".trend-tip");
  if(tip) tip.classList.remove("on");
  chart.querySelectorAll(".trend-guide,.trend-dot").forEach(el=>{ el.style.visibility="hidden"; });
}
function assetTrendSVG(){
  // 기록이 2개 미만이면 선을 그리지 않습니다.
  // (시작 금액을 첫 점으로 끼워 넣으면 새로고침 직후 가짜 상승/하락 선이 보입니다.)
  if(assetHistory.points.length<2) return "";
  const vals=assetHistory.points.map(p=>p.v);
  const min=Math.min(...vals),max=Math.max(...vals),span=(max-min)||Math.max(1,Math.abs(max)*0.01);
  const w=600,h=120,step=w/Math.max(1,vals.length-1);
  const coords=vals.map((v,i)=>`${(i*step).toFixed(1)},${(h-((v-min)/span)*(h-6)-3).toFixed(1)}`).join(" ");
  const up=vals[vals.length-1]>=vals[0];
  const color=up?"#d92d20":"#1d4ed8";
  return `<div class="trend-chart" role="img" aria-label="자산 추이 그래프 · 최근 자산 변화" onpointermove="assetTrendHover(event)" onpointerdown="assetTrendHover(event)" onpointerleave="assetTrendLeave(event)">
    <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polygon points="0,${h} ${coords} ${w},${h}" fill="${color}" opacity=".10"/><polyline points="${coords}" fill="none" stroke="${color}" stroke-width="2.5" vector-effect="non-scaling-stroke"/><line class="trend-guide" x1="0" y1="0" x2="0" y2="${h}" style="visibility:hidden"/><circle class="trend-dot" cx="0" cy="0" r="4" style="visibility:hidden"/></svg>
    <span class="trend-tip" id="assetTrendTip"></span>
  </div>`;
}

// 자산 배분(현금·달러·주식·금융상품). 부채는 별도 표기합니다.
function allocation(){
  const parts=[
    {label:"현금",value:Math.max(0,state.cash),color:"#0f766e"},
    {label:"달러",value:Math.max(0,(state.usd||0)*fx.usd),color:"#0369a1"},
    {label:"주식",value:Math.max(0,stockValueKRW()),color:"#b45309"},
    {label:"금융상품",value:Math.max(0,productValueKRW()),color:"#6d28d9"},
    {label:"부동산",value:Math.max(0,estateValue()),color:"#be123c"},
    {label:"금·은",value:Math.max(0,metalValue()),color:"#a16207"},
    {label:"기업",value:Math.max(0,companyValue()),color:"#0f766e"}
  ];
  const gross=parts.reduce((a,p)=>a+p.value,0);
  parts.forEach(p=>{ p.pct=gross>0?(p.value/gross)*100:0; });
  return {parts,gross};
}

// 거래 저널과 자산 배분을 함께 읽어 투자 스타일을 진단합니다.
function investmentStyle(){
  const journal=Array.isArray(state.journal)?state.journal:[];
  const buys=journal.filter(x=>x.side==="buy").length;
  const sells=journal.filter(x=>x.side==="sell").length;
  const wins=journal.filter(x=>x.side==="sell"&&(+x.profit||0)>0).length;
  const realized=journal.reduce((a,x)=>a+(x.side==="sell"?(+x.profit||0):0),0);
  const winRate=sells?wins/sells:0;
  const alloc=allocation();
  const stockPct=(alloc.parts.find(p=>p.label==="주식")||{pct:0}).pct;
  const safePct=alloc.parts.filter(p=>["현금","금융상품"].includes(p.label)).reduce((a,p)=>a+p.pct,0);
  const top=stockReturnRows()[0]||null;
  let style="관망형",desc="아직 거래 기록이 적어 성향을 판단하는 중입니다.",advice="소액으로 분산 매수해 자신의 위험 감도를 확인해 보세요.";
  if(journal.length>=3 && sells>=3 && sells/(buys+sells)>=.45 && winRate>=.5){
    style="스윙 트레이더"; desc="짧은 변동을 매매로 잡아내며 매도 승률이 높은 편입니다."; advice="수수료와 세금을 감안해 기대 수익이 충분한 거래만 남기세요.";
  } else if(journal.length>=3 && buys>=Math.max(2,sells*2)){
    style="장기 보유형"; desc="매수 후 보유 비중이 높아 기업 가치와 배당을 중시합니다."; advice="보유 종목의 실적과 배당 성장을 분기마다 점검하세요.";
  } else if(stockPct>=60){
    style="공격 성장형"; desc="주식 비중이 높아 시장 상승을 적극적으로 추종합니다."; advice="하락장을 대비해 현금·금융상품 완충을 남겨 두세요.";
  } else if(safePct>=60){
    style="안정 추구형"; desc="현금과 금융상품 비중이 높아 원금 보존을 우선합니다."; advice="물가 상승률보다 높은 금리의 상품으로 실질 수익을 지키세요.";
  } else if(journal.length>=3){
    style="균형형"; desc="주식과 안전자산을 함께 보유해 변동성을 분산하고 있습니다."; advice="자산 비중이 목표에서 벗어나면 정기적으로 리밸런싱하세요.";
  }
  return {style,desc,advice,buys,sells,winRate,realized,stockPct,safePct,top};
}

// ── 가격 차트(최근 60틱 스파크라인) ───────────────────────
function sparklineSVG(s){
  const data = ((s.hist && s.hist.length > 1) ? s.hist : [s.start, s.price]).slice(-60);
  const min = Math.min(...data), max = Math.max(...data), span = (max - min) || 1;
  const w = 100, h = 28, step = w / Math.max(1, data.length - 1);
  const points = data.map((v, i) => `${(i * step).toFixed(1)},${(h - ((v - min) / span) * h).toFixed(1)}`).join(" ");
  const up = data[data.length - 1] >= data[0];
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="${escAttr(s.name)} 최근 주가 추이"><polyline points="${points}" fill="none" stroke="${up ? "#d92d20" : "#1d4ed8"}" stroke-width="1.6"/></svg>`;
}
// 그래프 위 마우스 위치를 실제 가격으로 바꿔 줍니다. hist는 최근 60틱의 실제 가격입니다.
function sparkPointAt(s, ratio){
  const data=((s.hist && s.hist.length>1)?s.hist:[s.start,s.price]).slice(-60);
  const r=Math.max(0,Math.min(1,Number.isFinite(+ratio)?+ratio:0));
  const idx=Math.min(data.length-1,Math.round(r*(data.length-1)));
  const price=+data[idx]||0;
  const base=+s.start>0?+s.start:1;
  return {price,index:idx,count:data.length,pct:(price-base)/base};
}
// 종목 상세용 가격 차트(최근 20분, 5초 간격) — 마우스를 올리면 그 시점 가격을 보여 줍니다.
// 히스토리가 아직 짧으면 전일 종가·시가·현재가로 오늘 흐름을 보여 줍니다(없는 과거를 만들지 않음).
function priceSeriesInfo(s){
  const raw=(s.hist||[]).map(v=>+v).filter(v=>v>0);
  if(raw.length>=2) return {data:raw.slice(-240),synthetic:false};
  const seeded=[...new Set([+s.prevClose||0,+s.dayOpen||0,+s.start||0,+s.price||0].filter(v=>v>0))];
  return {data:seeded.length?seeded:[+s.price||1],synthetic:true};
}
function priceSeries(s){ return priceSeriesInfo(s).data; }
function pricePointAt(s,ratio){
  const info=priceSeriesInfo(s), data=info.data;
  const r=Math.max(0,Math.min(1,Number.isFinite(+ratio)?+ratio:0));
  const index=Math.round(r*Math.max(0,data.length-1));
  const price=+data[index]||0;
  const base=+s.start>0?+s.start:1;
  const ago=(data.length-1-index)*5;
  const label=info.synthetic?(index===data.length-1?"현재":index===0?"전일 종가":"시가"):(ago>=60?`${Math.floor(ago/60)}분 전`:`${ago}초 전`);
  return {price,index,count:data.length,ago,label,synthetic:info.synthetic,pct:(price-base)/base};
}
function priceChartHtml(s){
  const info=priceSeriesInfo(s), data=info.data;
  const min=Math.min(...data), max=Math.max(...data), span=(max-min)||1;
  const w=320,h=120,step=w/Math.max(1,data.length-1);
  const pts=data.map((v,i)=>`${(i*step).toFixed(1)},${(h-((v-min)/span)*(h-10)-5).toFixed(1)}`).join(" ");
  const up=data[data.length-1]>=data[0];
  const color=up?"#d92d20":"#1d4ed8";
  const spanMin=Math.max(1,Math.round((data.length-1)*5/60));
  const axisLeft=info.synthetic?"전일 종가":`${spanMin}분 전`;
  return `<div class="price-chart" data-price-chart="${s.id}" onpointermove="priceChartHover(event,'${s.id}')" onpointerdown="priceChartHover(event,'${s.id}')" onpointerleave="priceChartLeave('${s.id}')">
    <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="${escAttr(s.name)} ${info.synthetic?"오늘":`최근 ${spanMin}분`} 가격 흐름">
      <line x1="0" y1="${(h*0.25).toFixed(1)}" x2="${w}" y2="${(h*0.25).toFixed(1)}" stroke="#e4e7ec" stroke-width="1"/>
      <line x1="0" y1="${(h*0.5).toFixed(1)}" x2="${w}" y2="${(h*0.5).toFixed(1)}" stroke="#e4e7ec" stroke-width="1"/>
      <line x1="0" y1="${(h*0.75).toFixed(1)}" x2="${w}" y2="${(h*0.75).toFixed(1)}" stroke="#e4e7ec" stroke-width="1"/>
      <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2"/>
    </svg>
    <span class="price-tip" data-price-tip="${s.id}"></span>
    <div class="price-axis"><span>${axisLeft}</span><span>지금</span></div>
  </div>`;
}
function priceChartHover(ev,id){
  const s=stock(id); if(!s || !ev || !ev.currentTarget) return;
  const host=ev.currentTarget;
  const rect=host.getBoundingClientRect?host.getBoundingClientRect():{left:0,width:1};
  const ratio=((+ev.clientX||0)-rect.left)/Math.max(1,rect.width);
  const p=pricePointAt(s,ratio);

}
function priceChartLeave(id){
  document.querySelectorAll(`[data-price-tip="${id}"]`).forEach(t=>t.classList.remove("on"));
}
function sparkRenderKey(s){ return `${s.id}|${s.price}|${s.hist?s.hist.length:0}`; }
function sparklineHTML(s){
  return `${sparklineSVG(s)}<span class="spark-tip" data-spark-tip="${s.id}"></span>`;
}
function sparkHover(ev,id){
  const s=stock(id); if(!s || !ev || !ev.currentTarget) return;
  const host=ev.currentTarget, tip=host.querySelector(`[data-spark-tip="${id}"]`);
  const rect=host.getBoundingClientRect();

  tip.innerHTML=`<b>${isForeignStock(s)?usdStr(point.price):won(point.price)}</b> 차트 시작 대비 ${pct(point.pct)}`;
  tip.classList.add("on");
  // 툴팁 폭까지 고려해 카드 밖으로 넘치지 않게 합니다(320px 화면 대응).
  const half=Math.min(rect.width/2,(tip.offsetWidth||140)/2+4);
  const x=point.index/Math.max(1,point.count-1)*rect.width;
  tip.style.left=Math.max(half,Math.min(rect.width-half,x))+"px";
}
function sparkLeave(id){

}

// ── 예약(지정가) 주문 ────────────────────────────────
function placeOrder(){
  const stockId = $("order-stock") ? $("order-stock").value : "";
  const type = (($("order-type")||{}).value) || "limit";
  const side = (($("order-side")||{}).value) || "buy";
  const qty = Math.floor(+($("order-qty") ? $("order-qty").value : 0) || 0);
  const limit = +($("order-limit") ? $("order-limit").value : 0) || 0;
  const trail = Math.max(1, Math.min(50, Math.floor(+((($("order-trail")||{}).value)) || 5)));
  const every = Math.max(15, Math.min(600, Math.floor(+((($("order-every")||{}).value)) || 60)));
  const takeProfit = +((($("order-tp")||{}).value)) || 0;
  const stopPrice = +((($("order-sl")||{}).value)) || 0;
  const entry = +((($("order-entry")||{}).value)) || 0;
  const s = stock(stockId);
  if(!s) return alert("예약할 종목을 선택해 주세요.");
  const id = `o${Date.now()}${Math.floor(Math.random()*1000)}`;
  const account = state.tax.mode, held = accountQty(s,account);
  const priceText = isForeignStock(s) ? usdStr(limit) : won(limit);
  if(type === "dca"){
    if(limit < 10000) return alert("분할 매수 금액은 1만원 이상이어야 합니다.");
    state.orders.push({id, stockId, type:"dca", side:"buy", amount:limit, every, lastAt:state.marketSeconds, account});
    addLog(`🔁 분할 매수 예약: ${s.name} ${won(limit)} / ${every}초 · ${taxModeLabel(account)}`);
  } else if(type === "trailing"){
    if(held <= 0) return alert("현재 계좌에 보유 중인 종목만 트레일링 스톱을 걸 수 있습니다.");
    state.orders.push({id, stockId, type:"trailing", side:"sell", qty:qty||held, trail, peak:s.price, account});
    addLog(`📉 트레일링 스톱: ${s.name} ${qty||held}주 · 고점 대비 -${trail}% · ${taxModeLabel(account)}`);
  } else if(type === "oco"){
    if(qty <= 0 || takeProfit <= 0 || stopPrice <= 0) return alert("수량·익절가·손절가를 모두 입력해 주세요.");
    if(held < qty) return alert("현재 계좌의 보유 수량이 부족합니다.");
    if(!(takeProfit > stopPrice)) return alert("익절가는 손절가보다 높아야 합니다.");
    state.orders.push({id, stockId, type:"oco", side:"sell", qty, takeProfit, stopPrice, account});
    addLog(`🎯 OCO 주문: ${s.name} ${qty}주 · 익절 ${won(takeProfit)} / 손절 ${won(stopPrice)} · ${taxModeLabel(account)}`);
  } else if(type === "bracket"){
    if(qty <= 0 || entry <= 0 || takeProfit <= 0 || stopPrice <= 0) return alert("수량·진입가·익절가·손절가를 모두 입력해 주세요.");
    if(!(takeProfit > entry && entry > stopPrice)) return alert("익절가 > 진입가 > 손절가 순서로 입력해 주세요.");
    state.orders.push({id, stockId, type:"bracket", side:"buy", qty, entry, takeProfit, stopPrice, account});
    addLog(`🧩 브래킷 주문: ${s.name} ${qty}주 · 진입 ${won(entry)} 돌파 시 매수 후 OCO · ${taxModeLabel(account)}`);
  } else if(type === "stop"){
    if(qty <= 0 || limit <= 0) return alert("수량과 조건 가격을 입력해 주세요.");
    if(side === "sell" && held < qty) return alert("현재 계좌의 보유 수량이 부족합니다.");
    state.orders.push({id, stockId, type:"stop", side, qty, limit, account});
    addLog(`🛑 조건 주문: ${s.name} ${side==="buy"?"돌파 매수":"손절 매도"} ${qty}주 @ ${priceText} · ${taxModeLabel(account)}`);
  } else {
    if(qty <= 0 || limit <= 0) return alert("수량과 지정가를 올바르게 입력해 주세요.");
    if(side === "sell" && held < qty) return alert("현재 계좌의 보유 수량이 부족합니다.");
    state.orders.push({id, stockId, type:"limit", side, qty, limit, account});
    addLog(`예약 주문: ${s.name} ${side === "buy" ? "매수" : "매도"} ${qty}주 @ ${priceText} · ${taxModeLabel(account)}`);
  }
  if(!OFFLINE_REPLAY){ saveGame(); portfolio(); update(); }
}

function cancelOrder(oid){
  const before = state.orders.length;
  state.orders = state.orders.filter(o => o.id !== oid);
  if(state.orders.length !== before) addLog("예약 주문을 취소했습니다.");
  saveGame(); portfolio();
}

// 예약 주문 체결: 지정가·조건(손절/돌파)·트레일링 스톱·분할 매수(DCA)를 처리합니다.
// 휴장 중에는 지정가·조건·트레일링이 대기하고, 분할 매수도 개장 후에만 실행됩니다.
function processOrders(){
  if(!state.orders.length) return;
  const remain = [];
  const extra = [];
  state.orders.forEach(o => {
    const s = stock(o.stockId);
    if(!s) return;
    const foreign = isForeignStock(s);
    const px = p => foreign ? usdStr(p) : won(p);
    const acct = TAX_ACCOUNTS.includes(o.account) ? o.account : state.tax.mode;
    if(o.type === "dca"){
      if(state.marketOpen && state.marketSeconds - (o.lastAt||0) >= (o.every||60)){
        const unit = s.price*(1+stockFeeRate())*(foreign?fx.usd:1);
        const qty = Math.max(0,Math.floor((o.amount||0)/unit));
        if(qty>0 && marketBuyShares(s,qty,acct)){
          o.lastAt = state.marketSeconds;
          addLog(`🔁 분할 매수 체결: ${s.name} ${qty}주 @ ${px(s.price)}`);
          notify("order","분할 매수",`${s.name} ${qty}주`);
          bumpDaily("orders");
        }
      }
      remain.push(o); return;
    }
    if(!state.marketOpen){ remain.push(o); return; }
    if(o.type === "oco"){
      if(accountQty(s,acct) < o.qty) return; // 다른 거래로 수량이 사라진 OCO는 자동 취소
      const hitTp=s.price >= o.takeProfit;
      const hitSl=s.price <= o.stopPrice;
      if(!hitTp && !hitSl){ remain.push(o); return; }
      if(marketSellShares(s,o.qty,acct)){
        addLog(`🎯 OCO ${hitTp?"익절":"손절"} 체결: ${s.name} ${o.qty}주 @ ${s.price}`);
        notify("order",hitTp?"OCO 익절 체결":"OCO 손절 체결",`${s.name} ${o.qty}주`);
        bumpDaily("orders");
      } else remain.push(o);
      return;
    }
    if(o.type === "bracket"){
      if(s.price < o.entry){ remain.push(o); return; }
      if(marketBuyShares(s,o.qty,acct)){
        extra.push({id:`o${Date.now()}${Math.floor(Math.random()*1000)}`,stockId:o.stockId,type:"oco",side:"sell",qty:o.qty,takeProfit:o.takeProfit,stopPrice:o.stopPrice,parent:o.id,account:acct});
        addLog(`🧩 브래킷 진입 돌파: ${s.name} ${o.qty}주 @ ${s.price} · OCO 자동 등록`);
        notify("order","브래킷 진입",`${s.name} ${o.qty}주 · OCO 등록`);
        bumpDaily("orders");
      } else remain.push(o);
      return;
    }
    if(o.type === "trailing"){
      o.peak = Math.max(+o.peak||0, s.price);
      const trig = (o.peak||s.price)*(1-(o.trail||5)/100);
      if(s.price > trig){ remain.push(o); return; }
      const qty = Math.min(o.qty||accountQty(s,acct), accountQty(s,acct));
      if(qty>0 && marketSellShares(s,qty,acct)){
        addLog(`📉 트레일링 스톱 매도: ${s.name} ${qty}주 @ ${px(s.price)}`);
        notify("order","트레일링 스톱",`${s.name} ${qty}주`);
        bumpDaily("orders");
      }
      return;
    }
    if(o.type === "stop"){
      const hit = o.side === "buy" ? s.price >= o.limit : s.price <= o.limit;
      if(!hit){ remain.push(o); return; }
      if(o.side === "buy"){
        if(marketBuyShares(s,o.qty,acct)){
          addLog(`🛑 돌파 매수 체결: ${s.name} ${o.qty}주 @ ${px(s.price)}`);
          notify("order","돌파 매수",`${s.name} ${o.qty}주`);
          bumpDaily("orders");
        } else remain.push(o);
      } else {
        if(accountQty(s,acct) < o.qty){ remain.push(o); return; }
        if(marketSellShares(s,o.qty,acct)){
          addLog(`🛑 손절 매도 체결: ${s.name} ${o.qty}주 @ ${px(s.price)}`);
          notify("order","손절 매도",`${s.name} ${o.qty}주`);
          bumpDaily("orders");
        }
      }
      return;
    }
    // 지정가 주문
    const hit = o.side === "buy" ? s.price <= o.limit : s.price >= o.limit;
    if(!hit){ remain.push(o); return; }
    if(o.side === "buy"){
      if(marketBuyShares(s,o.qty,acct)){
        addLog(`⏱ 예약 매수 체결: ${s.name} ${o.qty}주 @ ${px(s.price)}`);
        notify("order","지정가 매수 체결",`${s.name} ${o.qty}주`);
        bumpDaily("orders");
      } else remain.push(o);
    } else {
      if(accountQty(s,acct) < o.qty){ remain.push(o); return; }
      const p=taxPreviewFor(s,o.qty,acct);
      if(marketSellShares(s,o.qty,acct)){
        addLog(`⏱ 예약 매도 체결: ${s.name} ${o.qty}주 @ ${px(s.price)}`);
        notify("order","지정가 매도 체결",`${s.name} ${o.qty}주 · ${won(p.profitKRW)}`);
        bumpDaily("orders");
      }
    }
  });
  state.orders = remain.concat(extra);
}

// ── 세금 ────────────────────────────────────────
// 양도소득세: 일반 계좌는 연 2,500만원 공제 후 22%, ISA는 200만원 공제 후 9.9%,
// 연금저축은 매도 시점에 과세하지 않고 인출할 때 5.5%를 납부합니다.
// 세금·수수료를 현금으로 낼 수 없을 때 생기는 부채의 기본 금리입니다.
// 예전에는 이 경로에서 loanRate를 비워 두어 0% 무이자 대출이 되는 버그가 있었습니다.
const TAX_DEBT_RATE=0.08;
function ensureDebtRate(){
  if((state.loan||0)>0 && !((state.loanRate||0)>0)) state.loanRate=TAX_DEBT_RATE;
}
// 현금이 부족한 세금을 대출로 전환합니다. 전환한 부족분을 돌려주어 화면에서 안내할 수 있게 합니다.
function ensureTaxLedger(){
  if(!Array.isArray(state.taxLedger)) state.taxLedger=[];
  if(!Number.isFinite(+state.tradeTaxPaid)||+state.tradeTaxPaid<0) state.tradeTaxPaid=0;
  return state.taxLedger;
}
function totalTaxPaid(){ return Math.max(0,+state.taxPaid||0)+Math.max(0,+state.tradeTaxPaid||0); }
function recordTaxLedger(entry){
  ensureTaxLedger();
  const tax=Math.max(0,+entry.tax||0);
  if(!(tax>0) && !entry.deferred) return null;
  const row=Object.assign({at:Date.now(),year:Math.max(1,+((state.tax&&state.tax.year)||1)),account:(state.tax&&state.tax.mode)||"general",kind:"tax",label:"세금",base:0,rate:0,tax,loan:0,note:""},entry);
  state.taxLedger.unshift(row);
  if(state.taxLedger.length>80) state.taxLedger.length=80;
  return row;
}
function taxKindLabel(kind){
  return ({trade:"증권거래세",general:"일반 양도세",isa:"ISA 양도세",pension:"연금 인출세",deferred:"연금 과세 이연"})[kind]||"세금";
}
function payTaxWithCashOrLoan(amount, label){
  const due=Math.max(0,+amount||0);
  if(!(due>0)) return 0;
  const cash=Math.max(0,+state.cash||0);
  if(cash>=due){ state.cash=cash-due; return 0; }
  const short=due-cash;
  state.cash=0;
  state.loan=(state.loan||0)+short;
  if(!((state.loanRate||0)>0)) state.loanRate=TAX_DEBT_RATE;
  addLog(`⚠️ ${label} 부족분 ${won(short)}이 대출로 전환되었습니다. (연 ${((state.loanRate||TAX_DEBT_RATE)*100).toFixed(1)}%)`);
  if(!OFFLINE_REPLAY) notify("tax","세금 대출 전환",`${label} ${won(short)} · 연 ${((state.loanRate||TAX_DEBT_RATE)*100).toFixed(1)}%`);
  return short;
}
function taxProjection(profitKRW, account){
  ensureAdvancedState();
  const t=state.tax, acct=TAX_ACCOUNTS.includes(account)?account:t.mode, profit=+profitKRW||0;
  const base={account:acct,profit,tax:0,taxable:0,carryUsed:0,deferred:0};
  if(!(profit>0)) return base;
  if(acct==="pension") return Object.assign(base,{deferred:profit});
  if(acct==="isa"){
    const gains=(+t.isaGains||0)+profit;
    const taxable=Math.max(0,Math.max(0,gains-2000000)-(+t.isaTaxed||0));
    return Object.assign(base,{tax:taxable*.099,taxable});
  }
  const realized=(+state.realizedYTD||0)+profit;
  let taxable=Math.max(0,Math.max(0,realized-TAX_GAINS_FREE)-(+state.taxedProfit||0));
  // carryLossBase는 지난 세금연도에서 넘어온 손실만 담습니다. 당해 손실은 realizedYTD에 이미 반영되어
  // 중복 차감되지 않습니다.
  const carryUsed=Math.min(taxable,Math.max(0,+t.carryLossBase||0));
  taxable=Math.max(0,taxable-carryUsed);
  return Object.assign(base,{tax:taxable*TAX_GAINS_RATE,taxable,carryUsed});
}
function settleTax(profitKRW, account){
  ensureAdvancedState();
  const t=state.tax, acct=TAX_ACCOUNTS.includes(account)?account:t.mode, profit=+profitKRW||0;
  if(!profit){ return 0; }
  // 계좌별 손익은 서로 섞지 않습니다. state.realizedYTD와 state.taxedProfit은
  // 일반 계좌 전용이고, ISA는 isaGains/isaTaxed, 연금은 pensionDeferred를 사용합니다.
  if(profit<0){
    if(acct==="general"){
      state.realizedYTD=(state.realizedYTD||0)+profit;
      t.carryLoss=Math.min(TAX_GAINS_FREE*2,t.carryLoss-profit);
    } else if(acct==="isa"){
      t.isaGains=Math.max(0,t.isaGains+profit);
    } else {
      t.pensionDeferred=Math.max(0,t.pensionDeferred+profit);
    }
    return 0;
  }
  const plan=taxProjection(profit,acct);
  if(acct==="pension"){
    t.pensionDeferred=(t.pensionDeferred||0)+profit;
    recordTaxLedger({kind:"deferred",label:"연금저축 과세 이연",account:"pension",base:profit,rate:.055,tax:0,loan:0,deferred:true,note:`지금 납부 0원 · 인출 시 ${won(profit*.055)} (5.5%)`});
    addLog(`연금저축 세금 이연: ${won(profit*.055)} (인출 시 5.5%)`);
    return 0;
  }
  if(acct==="isa"){
    t.isaGains=(t.isaGains||0)+profit;
    if(plan.taxable>0){
      const tax=plan.tax;
      t.isaTaxed=(t.isaTaxed||0)+plan.taxable;
      state.taxPaid=(state.taxPaid||0)+tax;
      t.taxPaidByAccount.isa+=tax;
      const loan=payTaxWithCashOrLoan(tax,"ISA 양도세");
      recordTaxLedger({kind:"isa",label:"ISA 양도세",account:"isa",base:plan.taxable,rate:.099,tax,loan,note:`과세표준 ${won(plan.taxable)} · 기본공제 200만원`});
      addLog(`ISA 양도세 원천징수: ${won(tax)} (ISA 누적 실현손익 ${won(t.isaGains)})`);
      notify("tax","ISA 양도세",won(tax));
    }
    return plan.tax;
  }
  state.realizedYTD=(state.realizedYTD||0)+profit;
  if(plan.carryUsed>0){ t.carryLoss=Math.max(0,t.carryLoss-plan.carryUsed); t.carryLossBase=Math.max(0,t.carryLossBase-plan.carryUsed); }
  if(plan.taxable>0){
    const tax=plan.tax;
    state.taxedProfit=(state.taxedProfit||0)+plan.taxable;
    state.taxPaid=(state.taxPaid||0)+tax;
    t.taxPaidByAccount.general+=tax;
    const loan=payTaxWithCashOrLoan(tax,"양도세");
    recordTaxLedger({kind:"general",label:"일반 양도세",account:"general",base:plan.taxable,rate:.22,tax,loan,note:`연 기본공제 250만원 · 이월 손실 ${won(plan.carryUsed)} 차감`});
    addLog(`양도세 원천징수: ${won(tax)} (연 누적 실현손익 ${won(state.realizedYTD)})`);
    notify("tax","양도세 원천징수",`${won(tax)}`);
    return tax;
  }
  return 0;
}

// ── 신용 대출 ───────────────────────────────────
function loanPolicy(){ return LOAN_POLICY[currentGrade()] || LOAN_POLICY["브론즈"]; }

// 기준금리·금리 조정을 신규 대출 금리에 반영합니다(변동 폭은 ±1%p~+2%p로 제한).
function economyRateDelta(){
  const e=state.economy||{};
  const base=Number.isFinite(+e.baseRate)?+e.baseRate:ECON_DEFAULT.baseRate;
  const adj=Number.isFinite(+e.rateAdj)?+e.rateAdj:0;
  const raw=(base-ECON_DEFAULT.baseRate)*0.6+adj*0.5;
  return Math.max(-0.01,Math.min(0.02,raw));
}
function borrowLoan(){
  const pol = loanPolicy();
  if(pol.limit <= 0) return alert("대출은 실버 등급부터 이용할 수 있습니다.");
  const avail = Math.max(0, pol.limit - (state.loan || 0));
  const amt = Math.floor((+($("loan-amt") ? $("loan-amt").value : 0) || 0) / 10000) * 10000;
  if(amt <= 0) return alert("대출 금액을 입력해 주세요.");
  if(amt > avail) return alert(`대출 한도를 초과했습니다. (가능 ${won(avail)})`);
  // 기준금리·금리 조정이 신규 대출 금리에 반영됩니다(기존 대출은 가중 평균으로 유지).
  const polRate=Math.max(0.01,pol.rate+economyRateDelta());
  const oldLoan=state.loan||0, oldRate=(state.loanRate||0)>0?state.loanRate:(oldLoan>0?TAX_DEBT_RATE:polRate);
  // 기존 대출이 있으면 새 대출 금리로 전체 잔액을 덮어쓰지 않고 금액 가중 평균을 씁니다.
  state.loan = oldLoan + amt;
  state.loanRate = oldLoan>0 ? ((oldLoan*oldRate)+(amt*polRate))/state.loan : polRate;
  state.loanTotal = (state.loanTotal || 0) + amt;
  state.cash += amt;
  addLog(`신용 대출 실행: ${won(amt)} (연 ${(polRate * 100).toFixed(1)}%)`);
  if(!OFFLINE_REPLAY){ saveGame(); portfolio(); update(); }
}

function repayLoan(){
  const loan = state.loan || 0;
  if(loan <= 0) return alert("상환할 대출이 없습니다.");
  let amt = Math.floor((+($("loan-amt") ? $("loan-amt").value : 0) || 0) / 10000) * 10000;
  if(amt <= 0) return alert("상환할 금액을 입력해 주세요. 전액 상환은 '전액 상환' 버튼을 이용하세요.");
  amt = Math.min(amt, loan, Math.floor(state.cash));
  if(amt <= 0) return alert("상환할 현금이 부족합니다.");
  state.loan = loan - amt;
  state.cash -= amt;
  if(state.loan <= 0){ state.loan = 0; state.loanRate = 0; }
  addLog(`대출 상환: ${won(amt)} (남은 잔액 ${won(state.loan)})`);
  if(!OFFLINE_REPLAY){ saveGame(); portfolio(); update(); }
}

// 대출 전액 상환: 입력값과 무관하게 보유 현금으로 최대한 갚습니다.
function repayLoanFull(){
  const loan=state.loan||0;
  if(loan<=0) return alert("상환할 대출이 없습니다.");
  const amt=Math.min(loan,Math.floor(state.cash));
  if(amt<=0) return alert("상환할 현금이 부족합니다.");
  state.loan=loan-amt;
  state.cash-=amt;
  if(state.loan<=0){ state.loan=0; state.loanRate=0; }
  addLog(`대출 전액 상환: ${won(amt)} (남은 잔액 ${won(state.loan)})`);
  if(!OFFLINE_REPLAY){ saveGame(); portfolio(); update(); }
}

// ── 배당·실적 발표 ───────────────────────────────
function applyShock(s, move){
  // 장중 충격도 전일 종가 기준 -30%~+50%와 장기 가격 범위 안에서만 움직입니다.
  const before=s.price;
  s.price = clampDailyPrice(s, s.price * (1 + move));
  s.lastMove = before>0?(s.price-before)/before:0;
}

function payDividends(){
  let totalKRW = 0;
  const auto=autoIncomeMode()==="auto";
  const dividendBonus=rebirthBonus("dividend",.03);
  stocks.forEach(s => {
    if(s.own <= 0) return;
    const amount = s.price * s.own * DIVIDEND_YIELD * dividendBonus;
    if(auto){
      if(isForeignStock(s)) state.usd += amount;
      else state.cash += amount;
    }
    totalKRW += isForeignStock(s) ? amount * fx.usd : amount;
  });
  if(totalKRW <= 0) return;
  const paid=auto?totalKRW:creditAutoIncome(totalKRW,"주식 배당");
  // 받지 않음으로 설정한 배당은 수령 기록·미션 진행에 넣지 않습니다.
  if(autoIncomeMode()!=="off"){
    state.dividendTotal = (state.dividendTotal || 0) + totalKRW;
    bumpDaily("dividends");
  }
  addLog(`💰 배당금 ${auto?"지급":"발생"}: ${won(totalKRW)}${autoIncomeNote(paid)}`);
  if(!auto) return;
  publishBreakingNews("💰 배당 지급", `보유 주식 배당금 ${won(totalKRW)}이 지급되었습니다.`);
  notify("dividend","배당금 지급",`${won(totalKRW)}`);
}

function ensureStockFundamentals(s){
  if(!s) return;
  if(!Number.isFinite(+s.revenue)||+s.revenue<=0) s.revenue=Math.max(100000000,Math.round((+s.start||s.price||1000)*10000));
  if(!Number.isFinite(+s.opProfit)||+s.opProfit<0) s.opProfit=Math.round(s.revenue*.12);
}
function earningsSurprise(target){
  if(!stocks.length) return;
  const pool=stocks.filter(s=>!isIndexFund(s));
  // 실적도 같은 게임 시각이면 모두 같은 종목·같은 발표가 나오도록 공용 난수를 씁니다.
  const key=`${Math.max(0,Math.floor(+state.marketSeconds||0))}|${(target&&(target.id||target.stockId))||"pool"}`;
  const er=k=>worldRand("earn",key,k);
  const s = (target&&target.id&&stock(target.id)) || (target&&target.stockId&&stock(target.stockId)) || pool[Math.floor(er(1) * pool.length)];
  if(!s) return;
  ensureStockFundamentals(s);
  // 매출 성장률과 영업이익률 변화가 함께 주가 방향을 결정합니다.
  const revGrowth=(er(2)-.45)*.18;
  const marginBefore=s.opProfit/Math.max(1,s.revenue);
  const marginAfter=Math.max(.005,Math.min(.45,marginBefore+(er(3)-.5)*.06));
  const revenue=Math.max(100000000,Math.round(s.revenue*(1+revGrowth)));
  const opProfit=Math.max(0,Math.round(revenue*marginAfter));
  const opGrowth=(opProfit-s.opProfit)/Math.max(1,s.opProfit);
  const score=revGrowth*.55+opGrowth*.45;
  const beat=score>=0;
  s.revenue=revenue; s.opProfit=opProfit;
  const move=Math.max(-.15,Math.min(.15,score*.7+(beat?.005:-.005)));
  applyShock(s, move);
  publishBreakingNews("📊 실적 발표", `${s.name} ${beat?"어닝 서프라이즈":"어닝 쇼크"}! 매출 ${won(revenue)} (${pct(revGrowth)}) · 영업이익 ${won(opProfit)} (${pct(opGrowth)}) · 주가 ${pct(move)}`);
  notify("earnings","실적 발표",`${s.name} ${beat?"서프라이즈":"쇼크"} · 주가 ${pct(move)}`);
  return {stockId:s.id,name:s.name,revenue,opProfit,beat,move,at:state.marketSeconds};
}

// ── 확장 상태 보정 · 세금 로트 · 실적 캘린더 · 리스크 · 챌린지 ─────────
function ensureAdvancedState(){
  if(!Array.isArray(state.calendar)) state.calendar=[];
  if(!Array.isArray(state.disclosures)) state.disclosures=[];
  if(!state.tax || typeof state.tax!=="object") state.tax={mode:"general",carryLoss:0,carryLossBase:0,pensionDeferred:0,isaGains:0,isaTaxed:0,splitVersion:1,
    contributions:{general:0,isa:0,pension:0},taxPaidByAccount:{general:0,isa:0,pension:0},year:1,yearStart:state.marketSeconds||0};
  const t=state.tax;
  if(!TAX_ACCOUNTS.includes(t.mode)) t.mode="general";
  ["carryLoss","carryLossBase","pensionDeferred","isaGains","isaTaxed"].forEach(k=>{ t[k]=Math.max(0,+t[k]||0); });
  if(!t.contributions || typeof t.contributions!=="object") t.contributions={general:0,isa:0,pension:0};
  TAX_ACCOUNTS.forEach(k=>{ t.contributions[k]=Math.max(0,+t.contributions[k]||0); });
  if(!t.taxPaidByAccount || typeof t.taxPaidByAccount!=="object"){
    const paid=Math.max(0,+state.taxPaid||0), isaPaid=Math.min(paid,Math.max(0,+t.isaTaxed||0)*.099);
    t.taxPaidByAccount={general:paid-isaPaid,isa:isaPaid,pension:0};
  }
  TAX_ACCOUNTS.forEach(k=>{ t.taxPaidByAccount[k]=Math.max(0,+t.taxPaidByAccount[k]||0); });
  t.year=Math.max(1,Math.floor(+t.year||1));
  t.yearStart=Number.isFinite(+t.yearStart)?Math.max(0,+t.yearStart):Math.max(0,+state.marketSeconds||0);
  // 이전 버전은 ISA·연금 손익까지 realizedYTD에 합산했습니다. 한 번만 분리해
  // 기존 세이브를 불러온 뒤 일반 계좌 세금에 과거 ISA·연금 이익이 다시 잡히지 않게 합니다.
  if(t.splitVersion!==1){
    const total=+state.realizedYTD||0, other=(+t.isaGains||0)+(+t.pensionDeferred||0);
    const general=total-other;
    state.realizedYTD=total>=0?Math.max(0,general):general;
    t.splitVersion=1;
  }
  if(!state.challenge || typeof state.challenge!=="object") state.challenge={active:null,history:[],best:0,last:null};
  if(!Array.isArray(state.challenge.history)) state.challenge.history=[];
  state.challenge.best=Math.max(0,+state.challenge.best||0);
  if(!state.ui || typeof state.ui!=="object") state.ui={assetTab:"overview",mobileStock:"",dashMore:null};
  if(typeof state.ui.mobileStock!=="string") state.ui.mobileStock="";
  if(state.ui.dashMore!==true && state.ui.dashMore!==false) state.ui.dashMore=null;
  if(!Array.isArray(state.priceAlerts)) state.priceAlerts=[];
  state.priceAlerts=state.priceAlerts.filter(a=>a&&stock(a.stockId)&&+a.price>0).map(a=>({stockId:a.stockId,price:+a.price,dir:a.dir==="below"?"below":"above",armed:a.armed!==false}));
  if(!["base","crash","rate","fx"].includes(state.riskScenario)) state.riskScenario="base";
  return state;
}

// FIFO 세금 로트: 계좌·취득원가를 남기고, 매도할 때 해당 계좌의 오래된 로트부터 소진합니다.
function lotAccount(l){ return TAX_ACCOUNTS.includes(l&&l.account)?l.account:"general"; }
function ensureTaxLots(s){
  if(!s) return [];
  if(!Array.isArray(s.taxLots)) s.taxLots=[];
  s.taxLots=s.taxLots.filter(l=>l&&+l.qty>0).map(l=>({qty:Math.max(0,Math.floor(+l.qty||0)),price:Math.max(0,+l.price||0),at:Math.max(0,+l.at||0),account:lotAccount(l)}));
  const total=s.taxLots.reduce((a,l)=>a+l.qty,0);
  if(total<(+s.own||0)) s.taxLots.push({qty:(+s.own||0)-total,price:Math.max(0,+s.avgBuy||+s.price||0),at:0,account:"general"});
  else if(total>(+s.own||0)){
    let excess=total-(+s.own||0);
    for(let i=s.taxLots.length-1;i>=0&&excess>0;i--){
      const take=Math.min(excess,s.taxLots[i].qty);
      s.taxLots[i].qty-=take; excess-=take;
      if(s.taxLots[i].qty<=0) s.taxLots.splice(i,1);
    }
  }
  return s.taxLots;
}
function accountLots(s,account){ return ensureTaxLots(s).filter(l=>l.account===(account||state.tax.mode)); }
function accountQty(s,account){ return accountLots(s,account).reduce((a,l)=>a+l.qty,0); }
function accountAvgBuy(s,account){
  const lots=accountLots(s,account), qty=lots.reduce((a,l)=>a+l.qty,0);
  return qty>0?lots.reduce((a,l)=>a+l.qty*l.price,0)/qty:0;
}
// 매수 직후(s.own에 이미 수량이 더해진 뒤) 호출합니다. 기존 보유분의 로트가 없으면
// 평단가로 보완한 뒤 새 로트를 추가해, 같은 수량이 두 번 잡히지 않게 합니다.
function addTaxLot(s,qty,price,account){
  const n=Math.max(0,Math.floor(+qty||0));
  if(!s||!n) return;
  if(!Array.isArray(s.taxLots)) s.taxLots=[];
  s.taxLots=s.taxLots.filter(l=>l&&+l.qty>0).map(l=>({qty:Math.max(0,Math.floor(+l.qty||0)),price:Math.max(0,+l.price||0),at:Math.max(0,+l.at||0),account:lotAccount(l)}));
  const previousOwn=Math.max(0,(+s.own||0)-n);
  const total=s.taxLots.reduce((a,l)=>a+l.qty,0);
  if(total<previousOwn) s.taxLots.push({qty:previousOwn-total,price:Math.max(0,+s.avgBuy||+s.price||0),at:0,account:"general"});
  s.taxLots.push({qty:n,price:Math.max(0,+price||0),at:Math.max(0,+state.marketSeconds||0),account:TAX_ACCOUNTS.includes(account)?account:state.tax.mode});
}
function consumeTaxLots(s,qty,account){
  const acct=TAX_ACCOUNTS.includes(account)?account:state.tax.mode, lots=ensureTaxLots(s);
  let left=Math.max(0,Math.floor(+qty||0)), basis=0;
  for(let i=0;i<lots.length&&left>0;){
    const l=lots[i];
    if(l.account!==acct){ i++; continue; }
    const take=Math.min(left,l.qty);
    basis+=take*l.price; l.qty-=take; left-=take;
    if(l.qty<=0) lots.splice(i,1); else i++;
  }
  // 구버전 세이브 등 계좌 로트가 부족한 경우 평단가로 보완합니다.
  if(left>0) basis+=left*Math.max(0,+s.avgBuy||+s.price||0);
  return basis;
}
function moveTaxLots(s,qty,from,to){
  if(!s||!TAX_ACCOUNTS.includes(from)||!TAX_ACCOUNTS.includes(to)||from===to) return 0;
  let left=Math.max(0,Math.floor(+qty||0)), moved=0, lots=ensureTaxLots(s);
  for(const l of lots){
    if(left<=0) break;
    if(l.account!==from) continue;
    const take=Math.min(left,l.qty);
    if(take<=0) continue;
    if(take===l.qty){ l.account=to; }
    else { l.qty-=take; lots.push({qty:take,price:l.price,at:l.at,account:to}); }
    left-=take; moved+=take;
  }
  return moved;
}
function taxModeLabel(mode){ return mode==="isa"?"ISA 절세 계좌":mode==="pension"?"연금저축 계좌":"일반 위탁 계좌"; }
function taxAccountRealized(mode,t){
  t=t||state.tax||{};
  if(mode==="isa") return +t.isaGains||0;
  if(mode==="pension") return +t.pensionDeferred||0;
  return +state.realizedYTD||0;
}
function taxAccountLimit(mode){ return TAX_ACCOUNT_LIMITS[mode]??Infinity; }
function taxContributionUsed(mode){ const t=ensureAdvancedState().tax; return Math.max(0,+((t.contributions||{})[mode])||0); }
function taxContributionRoom(mode){
  const limit=taxAccountLimit(mode);
  return Number.isFinite(limit)?Math.max(0,limit-taxContributionUsed(mode)):Infinity;
}
function canTaxContribute(mode,amountKRW){
  const amount=Math.max(0,+amountKRW||0);
  return !Number.isFinite(taxAccountLimit(mode)) || taxContributionUsed(mode)+amount<=taxAccountLimit(mode)+0.01;
}
function addTaxContribution(mode,amountKRW){
  const t=ensureAdvancedState().tax, amount=Math.max(0,+amountKRW||0);
  if(!TAX_ACCOUNTS.includes(mode)||!amount) return;
  t.contributions[mode]=Math.max(0,+t.contributions[mode]||0)+amount;
}
function releaseTaxContribution(mode,amountKRW){

}
function taxYearRemaining(){ const t=ensureAdvancedState().tax; return Math.max(0,TAX_YEAR_SECONDS-(state.marketSeconds-(+t.yearStart||0))); }
function taxYearReset(){
  const t=ensureAdvancedState().tax;
  // 연말 일반 계좌의 순손실만 다음 연도로 넘깁니다. 당해 이익과 상계된 손실을 다시
  // 이월 손실로 쓰는 중복 차감을 막습니다.
  const priorBase=Math.max(0,+t.carryLossBase||0), currentLoss=Math.max(0,-(+state.realizedYTD||0));
  t.carryLoss=Math.min(TAX_GAINS_FREE*2,priorBase+currentLoss);
  t.carryLossBase=t.carryLoss;
  state.realizedYTD=0; state.taxedProfit=0;
  t.isaGains=0; t.isaTaxed=0;
  t.contributions={general:0,isa:0,pension:0};
  t.taxPaidByAccount={general:0,isa:0,pension:0};
  t.year=Math.max(1,+t.year||1)+1; t.yearStart=state.marketSeconds;
  addLog(`🧾 세금 ${t.year-1}년차 결산 완료 · ${t.year}년차 시작 (일반 공제·ISA 한도·연간 손익 리셋, 이월 손실 유지)`);
  notify("tax","세금 연도 결산",`${t.year}년차 시작 · 일반·ISA 연간 손익과 납입한도가 리셋되었습니다.`);
}

function taxAccountStats(mode){

const CALENDAR_SIZE=4;
function ensureCalendar(force){
  ensureAdvancedState();
  const pool=stocks.filter(s=>!isIndexFund(s));
  const valid=id=>!!stock(id);
  state.calendar=state.calendar.filter(e=>e&&valid(e.stockId));
  if(force || !state.calendar.length){
    state.calendar=[];
    pool.slice(0,CALENDAR_SIZE).forEach((s,i)=>{
      state.calendar.push({stockId:s.id, at:state.marketSeconds+45+i*120+((state.marketSeconds+i*7)%17), kind:"earnings"});
    });
  } else {
    const scheduled=new Set(state.calendar.map(e=>e.stockId));
    const need=Math.max(0,CALENDAR_SIZE-state.calendar.length);
    pool.filter(s=>!scheduled.has(s.id)).slice(0,need).forEach((s,i)=>{
      state.calendar.push({stockId:s.id, at:state.marketSeconds+180+i*40, kind:"earnings"});
    });
  }
  state.calendar.sort((a,b)=>a.at-b.at);
  return state.calendar;
}
function tickCalendar(){

  }
}

// 리스크 대시보드
function maxDrawdownPct(){
  const pts=assetHistory.points||[];
  let peak=0, max=0;
  pts.forEach(p=>{ const v=Math.max(0,+p.v||0); peak=Math.max(peak,v); if(peak>0) max=Math.max(max,(peak-v)/peak); });
  return max;
}
function portfolioVolatility(){
  const pts=(assetHistory.points||[]).slice(-31);
  if(pts.length<3) return 0;
  const rets=[];
  for(let i=1;i<pts.length;i++){ const a=+pts[i-1].v||0, b=+pts[i].v||0; if(a>0) rets.push((b-a)/a); }
  if(rets.length<2) return 0;
  const mean=rets.reduce((a,b)=>a+b,0)/rets.length;
  const variance=rets.reduce((a,b)=>a+(b-mean)*(b-mean),0)/rets.length;
  return Math.sqrt(variance);
}
function topHoldingInfo(){
  const total=stockValueKRW();
  const held=stocks.filter(s=>s.own>0).map(s=>({name:s.name,value:stockPriceKRW(s)*s.own})).sort((a,b)=>b.value-a.value);
  const top=held[0]||{name:"-",value:0};
  return {top, pct:total>0?top.value/total:0, count:held.length};
}
function pairCorrelation(a,b){
  const n=Math.min((a.hist||[]).length,(b.hist||[]).length,30);
  if(n<4) return null;
  const ar=(a.hist||[]).slice(-n), br=(b.hist||[]).slice(-n);
  const ax=[], bx=[];
  for(let i=1;i<n;i++){ if(ar[i-1]>0&&br[i-1]>0){ ax.push(ar[i]/ar[i-1]-1); bx.push(br[i]/br[i-1]-1); } }
  if(ax.length<3) return null;
  const ma=ax.reduce((x,y)=>x+y,0)/ax.length, mb=bx.reduce((x,y)=>x+y,0)/bx.length;
  let cov=0, va=0, vb=0;
  for(let i=0;i<ax.length;i++){ const da=ax[i]-ma, db=bx[i]-mb; cov+=da*db; va+=da*da; vb+=db*db; }
  return va>0&&vb>0?cov/Math.sqrt(va*vb):null;
}
function topCorrelationInfo(){
  const held=stocks.filter(s=>s.own>0).slice(0,6);
  let best=null;
  for(let i=0;i<held.length;i++) for(let j=i+1;j<held.length;j++){
    const c=pairCorrelation(held[i],held[j]);
    if(c==null) continue;
    if(!best || Math.abs(c)>Math.abs(best.corr)) best={a:held[i].name,b:held[j].name,corr:c};
  }
  return best;
}
function riskMetrics(){
  const total=netAssetsKRW(), equity=stockValueKRW(), top=topHoldingInfo(), corr=topCorrelationInfo();
  return {total,equityPct:total>0?equity/total:0,debtRatio:total>0?(state.loan||0)/Math.max(1,grossAssetsKRW()):0,maxDD:maxDrawdownPct(),vol:portfolioVolatility(),top,corr};
}

const CHALLENGES=[
  {id:"sprint",name:"10분 스프린트",seconds:600,target:.08,reward:2000000,desc:"현재 순자산에서 10분 안에 +8%"},
  {id:"growth",name:"30분 성장",seconds:1800,target:.20,reward:5000000,desc:"현재 순자산에서 30분 안에 +20%"},
  {id:"legend",name:"1시간 레전드",seconds:3600,target:.50,reward:12000000,desc:"현재 순자산에서 1시간 안에 +50%"}
];
function ensureChallenge(){ return ensureAdvancedState().challenge; }
function challengeSpec(id){ return CHALLENGES.find(c=>c.id===id)||null; }
function challengeProgress(c){ return c&&c.startNet>0?(netAssetsKRW()-c.startNet)/c.startNet:0; }
function startChallenge(id){
  const c=ensureChallenge(), spec=challengeSpec(id);
  if(!spec) return false;
  if(c.active){ alert("이미 진행 중인 챌린지가 있습니다. 먼저 끝내거나 포기해 주세요."); return false; }
  const net=netAssetsKRW();
  if(net<=0){ alert("순자산이 0원보다 커야 챌린지를 시작할 수 있습니다."); return false; }
  c.active={id:spec.id,name:spec.name,startNet:net,target:spec.target,startsAt:state.marketSeconds,endsAt:state.marketSeconds+spec.seconds,reward:spec.reward,lastNet:net};
  c.last=null;
  addLog(`🎯 시나리오 챌린지 시작: ${spec.name} · 목표 ${pct(spec.target)}`);
  saveGame(); dashboardPage(); portfolio(); update();
  notify("mission","챌린지 시작",`${spec.name} · 목표 ${pct(spec.target)}`);
  return true;
}
function finishChallenge(status){
  const c=ensureChallenge(), a=c.active; if(!a) return false;
  const net=netAssetsKRW();
  const result={...a,status,endedAt:state.marketSeconds,finalNet:net,returnPct:challengeProgress(a)};
  if(status==="success"){
    state.cash=(state.cash||0)+(+a.reward||0);
    addLog(`🏆 챌린지 성공: ${a.name} · 보상 ${won(a.reward)}`);
    notify("mission","챌린지 성공",`${a.name} · +${won(a.reward)}`);
  } else {
    addLog(`🎯 챌린지 종료: ${a.name} · ${pct(result.returnPct)}`);
    notify("mission","챌린지 종료",`${a.name} · 목표 미달 ${pct(result.returnPct)}`);
  }
  c.history.unshift(result); c.history=c.history.slice(0,10);
  c.best=Math.max(c.best||0,result.returnPct||0);
  c.active=null; c.last=result;
  saveGame(); dashboardPage(); portfolio(); update();
  return true;
}
function cancelChallenge(){
  const c=ensureChallenge(); if(!c.active) return false;
  if(!confirm("진행 중인 챌린지를 포기할까요? 게임 진행은 초기화되지 않습니다.")) return false;
  return finishChallenge("canceled");
}
function tickChallenges(){
  const c=ensureChallenge(), a=c.active; if(!a) return;
  const net=netAssetsKRW(); a.lastNet=net;
  const target=a.startNet*(1+a.target);
  if(net>=target) finishChallenge("success");
  else if(state.marketSeconds>=a.endsAt) finishChallenge("fail");
}
function challengePanelHtml(){
  const c=ensureChallenge(), a=c.active;
  const cards=CHALLENGES.map(spec=>{
    const on=!!a&&a.id===spec.id;
    return `<div class="challenge-card${on?" active":""}"><div class="challenge-meta"><b>${spec.name}</b><span class="pill">${pct(spec.target)}</span></div><p class="muted-sm">${spec.desc}</p><div class="challenge-meta"><span>보상 ${won(spec.reward)}</span><button class="${on?"ghost":"buy"} small" ${a&&!on?"disabled":""} onclick="startChallenge('${spec.id}')" ${on?"disabled":""}>${on?"진행 중":"시작"}</button></div></div>`;
  }).join("");
  const progress=a?(()=>{ const p=challengeProgress(a), goal=a.startNet*(1+a.target); return `<div class="challenge-card active" style="margin-top:10px"><div class="challenge-meta"><b>${a.name} 진행 중</b><span class="pill">${clockText(realSeconds(Math.max(0,a.endsAt-state.marketSeconds)))} 남음</span></div><div class="bar"><span data-live-style="challengeWidth" style="width:${Math.max(0,Math.min(100,p/Math.max(.0001,a.target)*100)).toFixed(1)}%"></span></div><div class="challenge-meta"><span data-live="challengeNet">${won(netAssetsKRW())} / ${won(goal)}</span><span class="${p>=0?"up":"down"}" data-live="challengePct">${pct(p)}</span></div><button class="ghost small" onclick="cancelChallenge()">포기 (진행은 유지)</button></div>`; })():"";
  const last=c.last?`<p class="muted-sm" style="margin-top:8px">최근 결과: <b>${c.last.name}</b> · ${c.last.status==="success"?"성공":c.last.status==="canceled"?"포기":"미달"} · ${pct(c.last.returnPct||0)}</p>`:"";
  return `<section class="section"><div class="section-head"><h3>시나리오 챌린지</h3><span class="pill">현재 진행에서 시작 · 초기화 없음</span></div><div class="panel"><p class="muted-sm">현재 순자산을 시작점으로 기록하고 제한 시간 안에 목표 수익률을 달성합니다. 실패해도 자산·진행은 초기화되지 않습니다.</p><div class="challenge-grid" style="margin-top:10px">${cards}</div>${progress}${last}</div></section>`;
}

// 모바일 전용 트레이드 바
const MOBILE_TRADE_PAGES=["domestic","foreign","mega","special","holdings","watch"];
function mobileTradeList(){
  const page=activePage();
  if(page==="holdings") return stocks.filter(s=>s.own>0);
  if(page==="watch") return stocks.filter(s=>isWatched(s.id));
  if(["domestic","foreign","mega","special"].includes(page)) return stocks.filter(s=>s.group===page);
  return [];
}
function renderMobileTradeBar(){
  ensureAdvancedState();
  const bar=$("mobileTradeBar"); if(!bar) return;
  const page=activePage();
  const on=MOBILE_TRADE_PAGES.includes(page);
  if(bar.classList&&bar.classList.toggle) bar.classList.toggle("on",on);
  if(document.body&&document.body.classList&&document.body.classList.toggle) document.body.classList.toggle("has-mobile-trade",on);
  if(!on) return;
  const list=mobileTradeList(), sel=$("mobile-stock");
  if(!sel) return;
  if(!list.length){ sel.innerHTML=`<option value="">종목 없음</option>`; return; }
  if(!list.some(s=>s.id===state.ui.mobileStock)) state.ui.mobileStock=list[0].id;
  sel.innerHTML=list.map(s=>`<option value="${s.id}" ${s.id===state.ui.mobileStock?"selected":""}>${escHtml(s.name)}</option>`).join("");
  sel.value=state.ui.mobileStock;
  renderMobileTradeInfo();
}
function renderMobileTradeInfo(){
  const box=$("mobileTradeInfo"); if(!box) return;
  const s=stock(((($("mobile-stock")||{}).value)||(state.ui&&state.ui.mobileStock)||""));
  if(!s){ box.textContent="거래할 종목이 없습니다."; return; }
  const acct=state.tax.mode, max=maxBuyQty(s), available=accountQty(s,acct);
  const qty=Math.max(1,Math.floor(+((($("mobile-trade-qty")||{}).value)||1)||1));
  const p=taxPreviewFor(s,Math.min(qty,Math.max(1,available)),acct);
  const taxText=available>0&&p.ok?`<div>${acct==="pension"?`인출세 이연 ${won(Math.max(0,p.profitKRW*.055))}`:`예상 세금 ${won(p.tax)} · 세후 ${won(p.netKRW)}`}</div>`:"";
  box.innerHTML=`<div>${taxModeLabel(acct)} · 매수 가능 ${max.toLocaleString("ko-KR")}주 · 매도 가능 ${available.toLocaleString("ko-KR")}주</div>${taxText}`;
}
function mobileTradeSelect(id){
  ensureAdvancedState();
  if(stock(id)) state.ui.mobileStock=id;
  renderMobileTradeInfo();
}
function mobileTrade(side){
  ensureAdvancedState();
  const s=stock(((($("mobile-stock")||{}).value)||state.ui.mobileStock)||"");
  if(!s) return alert("거래할 종목을 선택해 주세요.");
  const qty=Math.floor(+((($("mobile-trade-qty")||{}).value)||0)||0);
  if(qty<=0) return alert("수량을 1주 이상 입력해 주세요.");
  if(!checkMarketOpen()) return false;
  const acct=state.tax.mode;
  if(side==="buy"){
    if(qty>maxBuyQty(s)) return alert("수수료 포함 잔고 또는 계좌 납입한도가 부족합니다.");
    const cost=s.price*(1+stockFeeRate())*qty, principalKRW=s.price*qty*(isForeignStock(s)?fx.usd:1);
    if(!canTaxContribute(acct,principalKRW)) return alert(`${taxModeLabel(acct)} 연간 납입한도가 부족합니다.`);
    if(!confirmTrade("모바일 매수",`${s.name} ${qty}주 · ${taxModeLabel(acct)}`)) return false;
    if(!marketBuyShares(s,qty,acct)) return alert("주문을 처리하지 못했습니다.");
    addLog(`📱 모바일 매수: ${s.name} ${qty}주 · ${taxModeLabel(acct)}`);
  } else {
    const available=accountQty(s,acct);
    if(qty>available) return alert(`${taxModeLabel(acct)} 보유 ${available}주까지만 매도할 수 있습니다.`);
    const p=taxPreviewFor(s,qty,acct);
    const taxNote=acct==="pension"?` · 인출세 이연 ${won(Math.max(0,p.profitKRW*.055))}`:` · 예상 세금 ${won(p.tax)} · 세후 ${won(p.netKRW)}`;
    if(!confirmTrade("모바일 매도",`${s.name} ${qty}주 · ${taxModeLabel(acct)}${taxNote}`)) return false;
    if(!marketSellShares(s,qty,acct)) return alert("주문을 처리하지 못했습니다.");
    addLog(`📱 모바일 매도: ${s.name} ${qty}주 · ${taxModeLabel(acct)}`);
  }
  state.ui.mobileStock=s.id;
  saveGame(); update(); renderMobileTradeBar();
  return true;
}

function exportSave(){
  const blob = new Blob([JSON.stringify(buildSaveData(), null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `money-playground-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
  state.lastFileBackupAt=Date.now();
  try{ saveGame(); }catch(e){}
  addLog("저장 파일을 내보냈습니다.");
}

function fileBackupDue(){
  if(!state.lastFileBackupAt) return (state.marketSeconds||0)>300;
  return Date.now()-state.lastFileBackupAt>=FILE_BACKUP_EVERY;
}
function fileBackupLabel(){
  return state.lastFileBackupAt?new Date(state.lastFileBackupAt).toLocaleDateString("ko-KR"):"아직 없음";
}
function maybeFileBackupPrompt(){
  if(!fileBackupDue()) return false;
  if(state.backupPromptAt && Date.now()-state.backupPromptAt<3*24*60*60*1000) return false;
  openModal("주간 저장 백업",`
    <p style="font-size:13px">마지막 백업 파일: <b>${escHtml(fileBackupLabel())}</b></p>

    <div class="button-row" style="margin-top:12px"><button class="buy" onclick="exportSave();closeModal();">백업 파일 받기</button><button class="ghost" onclick="snoozeFileBackup()">3일 뒤</button></div>`);

}

  state.backupPromptAt=Date.now();
  try{ saveGame(); }catch(e){}
  closeModal();
}

const IMPORT_MAX_BYTES=5*1024*1024;
function handleImport(ev){
  const file = ev.target.files && ev.target.files[0];
  if(!file) return;
  if(file.size>IMPORT_MAX_BYTES){ alert("저장 파일이 너무 큽니다. 5MB 이하 파일을 선택해 주세요."); ev.target.value=""; return; }
  const reader = new FileReader();
  reader.onerror = () => alert("저장 파일을 읽지 못했습니다. 다시 선택해 주세요.");
  reader.onload = () => {
    try {
      previewImportSave(JSON.parse(String(reader.result)), file.name);
    } catch(e) {
      alert("저장 파일을 읽을 수 없습니다. 형식을 확인해 주세요.");
    }
  };
  reader.readAsText(file);
  ev.target.value = "";
}

// 저장 파일을 바로 덮어쓰지 않고, 무엇이 들어오는지 먼저 보여 줍니다.
function saveFileSummary(data){
  const st=(data && typeof data==="object" && data.state && typeof data.state==="object")?data.state:null;
  if(!st) return null;
  const r=(st.rebirth && typeof st.rebirth==="object")?st.rebirth:{};
  const rebirths=Math.max(0,Math.floor(+r.count||0));
  return {
    version:Math.max(1,Math.floor(+data.version||1)),
    savedAt:Math.max(0,+st.savedAt||0),
    marketSeconds:Math.max(0,Math.floor(+st.marketSeconds||0)),
    rebirths, points:Math.max(0,Math.floor(+r.points||0)),
    cash:Math.max(0,+st.cash||0),
    stocksOwned:(Array.isArray(data.stocks)?data.stocks:[]).filter(s=>s&&+s.own>0).length,
    stale:rebirths<ensureRebirth().count
  };
}
function previewImportSave(data, fileName){
  const s=saveFileSummary(data);
  if(!s) return alert("저장 파일 형식을 확인해 주세요.");
  pendingImport=data;
  openModal("저장 파일 불러오기", `
    <p class="muted-sm">지금 진행을 덮어씁니다. 아래 내용을 확인해 주세요.</p>
    <div class="kpis" style="margin-top:10px">
      <div class="kpi"><small>저장 시각</small><b>${s.savedAt?escHtml(new Date(s.savedAt).toLocaleString("ko-KR")):"기록 없음"}</b></div>
      <div class="kpi"><small>환생</small><b>${s.rebirths}회 · ${s.points}P</b></div>
      <div class="kpi"><small>현금</small><b>${won(s.cash)}</b></div>
      <div class="kpi"><small>보유 종목</small><b>${s.stocksOwned}개</b></div>
    </div>
    <p class="muted-sm" style="margin-top:8px">파일: ${escHtml(fileName||"선택한 파일")} · 형식 v${s.version} · 플레이 ${Math.floor(s.marketSeconds/60)}분</p>
    ${s.stale?`<div class="labor-alert"><b>불러올 수 없습니다.</b> 이 파일의 환생 기록(${s.rebirths}회)이 지금 진행(${ensureRebirth().count}회)보다 적습니다.</div>`:""}
    <div class="button-row" style="margin-top:12px">
      <button class="buy" ${s.stale?"disabled":""} onclick="applyPendingImport()">불러오기</button>
      <button class="ghost" onclick="cancelPendingImport()">취소</button>
    </div>`);
}
function cancelPendingImport(){ pendingImport=null; closeModal(); }
function applyPendingImport(){
  const data=pendingImport;
  if(!data) return;
  pendingImport=null;
  try{
    snapshotSave("import");
    applySaveData(data);
    saveGame(); banking(); fxPage(); portfolio(); update();
    closeModal();
    addLog("저장 파일을 불러왔습니다.");
    if(lastSaveFixReport.length){
      const names=lastSaveFixReport.slice(0,4).map(f=>f.key).join(", ");
      addLog(`저장 값 ${lastSaveFixReport.length}개를 보정했습니다: ${names}`);
      notify("system","저장 파일",`값 ${lastSaveFixReport.length}개를 보정했습니다. (${names})`);
    } else {
      notify("system","저장 파일","선택한 저장 파일을 불러왔습니다.");
    }
  } catch(e) {
    alert(saveStaleRebirth(e)?SAVE_STALE_REBIRTH_MSG:"저장 파일을 적용하지 못했습니다.");
  }
}

async function firebaseLoad(){
  if(!firebaseConfigured()) throw Object.assign(new Error("no_firebase"),{code:"no_firebase"});
  if(fbApi) return fbApi;
  if(fbLoadPromise) return fbLoadPromise;
  fbLoadPromise=(async()=>{
    const base=`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}`;
    const [appMod,authMod,dbMod]=await Promise.all([
      import(`${base}/firebase-app.js`),
      import(`${base}/firebase-auth.js`),
      import(`${base}/firebase-firestore.js`)
    ]);
    fbApp=appMod.initializeApp(FIREBASE_CONFIG);
    fbAuth=authMod.getAuth(fbApp);
    fbDb=dbMod.getFirestore(fbApp);
    fbApi={app:appMod,auth:authMod,db:dbMod};
    return fbApi;
  })();
  try{ return await fbLoadPromise; } finally { fbLoadPromise=null; }
}
async function firebaseBoot(){
  if(!firebaseConfigured()) return;
  try{
    const api=await firebaseLoad();
    try{ await api.auth.getRedirectResult(fbAuth); }catch(e){}
    api.auth.onAuthStateChanged(fbAuth,u=>{
      const was=fbUser;
      const wasUid=was&&was.uid;
      fbUser=u||null;
      if(wasUid && (!fbUser || fbUser.uid!==wasUid)){
        fbPresenceStop(true);
        fbResetPending=null; fbCloudEpoch++;
      }
      if(fbUser && (!was || was.uid!==fbUser.uid)){
        fbAutoPaused=false; trackEvent("sign_in");
        fbPresenceStart();
        firebaseAfterSignIn();
      }
      if(!fbUser){ fbAutoPaused=false; fbResetPending=null; fbAdminUsers=null; fbAdminBusy=false; fbAdminMsg=""; }
      try{ if(activePage()==="settings") settingsPage(); }catch(e){}
    });
  }catch(e){ /* SDK 로드 실패는 조용히 무시하고 로컬 저장으로 계속합니다. */ }
}
async function firebaseSignIn(){
  if(!firebaseConfigured()) return alert("Firebase 설정(meta[name=firebase-config])이 필요합니다.");
  if(fbBusy) return;
  fbBusy=true; firebasePanelRefresh("Google 로그인 중…");
  try{
    const api=await firebaseLoad();
    const provider=new api.auth.GoogleAuthProvider();
    provider.setCustomParameters({prompt:"select_account"});
    await api.auth.signInWithPopup(fbAuth,provider);
  }catch(e){
    try{
      if(e&&["auth/popup-blocked","auth/operation-not-supported-in-this-environment","auth/cancelled-popup-request"].includes(e.code)){
        const api=await firebaseLoad();
        await api.auth.signInWithRedirect(fbAuth,new api.auth.GoogleAuthProvider());
        return;
      }
    }catch(_){}
    const info=firebaseNoteError(e,"Google 로그인");
    firebasePanelRefresh("");
    alert(`Google 로그인에 실패했습니다 (${info.code})\n\n${info.title}\n· ${(info.steps[0]||"").replace(/<[^>]+>/g,"")}\n\n설정 화면에도 같은 안내가 표시됩니다.`);
  }finally{
    fbBusy=false;
    try{ settingsPage(); }catch(e){}
  }
}
async function firebaseSignOut(){
  try{
    const api=await firebaseLoad();
    const uid=fbPresenceUid;
    fbPresenceStop(false);
    if(uid) await fbPresenceOffline(uid);
    await api.auth.signOut(fbAuth);
    fbUser=null; fbAdminUsers=null; fbAdminBusy=false; fbAdminMsg="";
    settingsPage();
  }catch(e){ alert("로그아웃하지 못했습니다: "+((e&&(e.code||e.message))||"오류")); }
}
// ── 접속 상태 · 관리자 접속자 목록 · 강제 초기화 ──────────────
function fbMillis(v){
  if(!v) return 0;
  if(typeof v==="number") return v;
  if(typeof v.toMillis==="function") return v.toMillis();
  const n=+v; return Number.isFinite(n)?n:0;
}
function fbPresenceOnline(data, now){
  if(!data || data.online!==true) return false;
  const at=fbMillis(data.lastSeen);
  return !!at && (now-at)<=FB_ONLINE_WINDOW_MS;
}
// 관리자 화면은 접속 중인 사용자뿐 아니라 오프라인 사용자도 보여 줍니다.
// 접속 중인 사용자를 먼저, 그 안에서는 최근 접속 순으로 정렬합니다.
function fbAdminFromDocs(docs){
  const now=Date.now();
  return (docs||[]).map(d=>Object.assign({id:(d&&d.id)||""}, d&&d.data?d.data():(d||{})))
    .filter(u=>String(u.uid||u.id||"").trim())
    .sort((a,b)=>{
      const ao=fbPresenceOnline(a,now)?0:1, bo=fbPresenceOnline(b,now)?0:1;
      return ao!==bo?ao-bo:fbMillis(b.lastSeen)-fbMillis(a.lastSeen);
    });
}
function fbAgoText(ms){
  const s=Math.max(0,Math.round((Date.now()-ms)/1000));
  return s<60?`${s}초 전`:`${Math.floor(s/60)}분 전`;
}
async function fbPresenceBeat(uid){
  if(!fbUser || fbUser.uid!==uid) return;
  try{
    const api=await firebaseLoad();
    await api.db.setDoc(api.db.doc(fbDb,"presence",uid),{
      uid,
      nickname:fbUser.displayName||"익명",
      email:fbUser.email||"",
      online:true,
      device:fbDevice(),
      lastSeen:api.db.serverTimestamp()
    },{merge:true});
  }catch(e){ /* 규칙 게시 전이거나 오프라인이면 조용히 넘어갑니다. */ }
}
async function fbPresenceOffline(uid){
  if(!uid) return;
  try{
    const api=await firebaseLoad();
    await api.db.setDoc(api.db.doc(fbDb,"presence",uid),{
      uid, online:false, lastSeen:api.db.serverTimestamp()
    },{merge:true});
  }catch(e){}
}
function fbPresenceStop(markOffline){
  const uid=fbPresenceUid;
  if(fbPresenceTimer){ clearInterval(fbPresenceTimer); fbPresenceTimer=null; }
  fbPresenceUid=null;
  if(fbResetUnsub){ try{ fbResetUnsub(); }catch(e){} fbResetUnsub=null; }
  if(markOffline && uid) fbPresenceOffline(uid);
}
function fbPresenceStart(){
  if(!fbUser) return;
  const uid=fbUser.uid;
  if(fbPresenceUid===uid && fbPresenceTimer) return;
  fbPresenceStop(true);
  fbPresenceUid=uid;
  fbPresenceBeat(uid);
  fbPresenceTimer=setInterval(()=>{ if(fbUser && fbUser.uid===uid) fbPresenceBeat(uid); }, FB_PRESENCE_MS);
}
function fbResetSeenKey(uid){ return "money_playground_admin_reset_"+uid; }
function fbResetId(data){ return String((data&&data.requestId)||""); }
function fbResetAlreadySeen(uid, data){
  const id=fbResetId(data);
  if(!id) return true;
  try{ return localStorage.getItem(fbResetSeenKey(uid))===id; }catch(e){ return false; }
}
function fbResetMarkSeen(uid, data){
  try{ localStorage.setItem(fbResetSeenKey(uid), fbResetId(data)); }catch(e){}
}
function fbResetAt(data){
  return fbMillis(data&&data.at) || fbMillis(data&&data.requestedAt);
}
// 오래된 초기화 신호가 나중에 새 기기에서 현재 진행을 지우지 않도록,
// 초기화 이후에 서버에 저장된 진행이 있으면 이미 처리된 것으로 봅니다.
async function fbResetIsStale(api, uid, data){
  const at=fbResetAt(data);
  if(!at) return false;
  try{
    const snap=await api.db.getDoc(api.db.doc(fbDb,"saves",uid));
    if(!snap.exists()) return false;
    const d=snap.data()||{};
    // updatedAt은 Firestore 서버 시각이라 기기 시계 차이에 덜 민감합니다.
    const saved=fbMillis(d.updatedAt) || fbMillis(d.savedAt);
    return saved>at;
  }catch(e){ return false; }
}
// 로그인한 기기는 관리자의 초기화 신호를 실시간으로 받아 즉시 반영합니다.
function fbWatchForcedReset(){
  if(!fbUser) return;
  if(fbResetUnsub){ try{ fbResetUnsub(); }catch(e){} fbResetUnsub=null; }
  const uid=fbUser.uid;
  firebaseLoad().then(api=>{
    if(!fbUser || fbUser.uid!==uid || fbResetUnsub) return;
    fbResetUnsub=api.db.onSnapshot(api.db.doc(fbDb,"admin_resets",uid),snap=>{
      if(!fbUser || fbUser.uid!==uid || !snap.exists()) return;
      const data=snap.data()||{};
      const rid=fbResetId(data);
      // 같은 초기화 요청의 완료 신호가 오면 새 진행을 바로 클라우드에 올립니다.
      if(fbResetPending && rid && fbResetPending.requestId===rid){
        if(data.completedAt){ fbResetPending.completed=true; fbFinishForcedReset(); }
        return;
      }
      if(fbResetAlreadySeen(uid,data)) return;
      (async()=>{
        if(await fbResetIsStale(api,uid,data)){ fbResetMarkSeen(uid,data); return; }
        if(!fbUser || fbUser.uid!==uid) return;
        fbResetMarkSeen(uid,data);
        await fbApplyForcedReset(data);
      })();
    },()=>{});
  }).catch(()=>{});
}
async function fbCheckForcedReset(api){
  if(!fbUser) return false;
  try{
    const uid=fbUser.uid;
    const snap=await api.db.getDoc(api.db.doc(fbDb,"admin_resets",uid));
    if(!fbUser || fbUser.uid!==uid || !snap.exists()) return false;
    const data=snap.data()||{};
    const rid=fbResetId(data);
    if(fbResetPending && rid && fbResetPending.requestId===rid){
      if(data.completedAt){ fbResetPending.completed=true; await fbFinishForcedReset(); return true; }
      return false;
    }
    if(fbResetAlreadySeen(uid,data)) return false;
    if(await fbResetIsStale(api,uid,data)){ fbResetMarkSeen(uid,data); return false; }
    if(!fbUser || fbUser.uid!==uid) return false;
    fbResetMarkSeen(uid,data);
    await fbApplyForcedReset(data);
    return true;
  }catch(e){ return false; }
}
async function fbApplyForcedReset(data){
  const requestId=fbResetId(data)||("r"+Date.now());
  const mode=data && data.mode==="all" ? "all" : "run";
  const by=String((data&&data.by)||"관리자");
  const pending={requestId,mode,by,completed:!!(data&&data.completedAt),applied:false};
  fbResetPending=pending;
  fbCloudEpoch++;
  fbAutoPaused=true; fbConflict=null; fbSyncRev=null;
  if(fbAutoTimer){ clearTimeout(fbAutoTimer); fbAutoTimer=null; }
  // 진행 중이던 옛 자동 저장이 끝난 뒤에 새 상태로 교체합니다.
  if(fbCloudWrite) await fbWaitCloudWrite();
  if(fbResetPending!==pending || !fbUser){ if(fbResetPending===pending) fbResetPending=null; return; }
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  clearGame(true);
  if(mode==="all"){
    // 전체 초기화는 환생 기록과 영구 업그레이드까지 지웁니다.
    state.rebirth={count:0,points:0,spent:0,upgrades:{},bestNet:0,history:[],notified:false};
    state.onboard={done:false,dismissed:false,seen:{},unlocked:{},firstTrade:false};
  }
  saveGame();
  pending.applied=true;
  try{ settingsPage(); }catch(e){}
  openModal("관리자 초기화",`<p>관리자 <b>${escHtml(by)}</b>가 이 계정을 초기화했습니다.</p>
    <p class="muted-sm" style="margin-top:6px">${mode==="all"?"현재 진행과 환생·영구 업그레이드가 모두 초기화되었습니다.":"현재 진행과 서버 저장·점수가 초기화되었습니다. 환생·영구 업그레이드는 유지됩니다."}</p>
    <p class="muted-sm" style="margin-top:4px">초기화된 새 진행은 서버 정리가 끝나는 즉시 자동 저장됩니다.</p>
    <div class="button-row" style="margin-top:10px"><button class="buy" onclick="startTutorial(true)">튜토리얼 보기</button><button class="ghost" onclick="closeModal()">확인</button></div>`);
  notify("system","관리자 초기화", mode==="all"?"환생 기록까지 전체 초기화되었습니다.":"현재 진행이 초기화되었습니다.");
  if(pending.completed) await fbFinishForcedReset(pending);
}
async function fbFinishForcedReset(pending){
  pending=pending||fbResetPending;
  if(!pending) return;
  if(!pending.applied){ pending.completed=true; return; }
  await fbWaitCloudWrite();
  if(fbResetPending!==pending || !fbUser) return;
  fbResetPending=null;
  fbAutoPaused=false; fbConflict=null; fbLastSync=0; fbLastScorePush=0;
  if(fbAutoTimer){ clearTimeout(fbAutoTimer); fbAutoTimer=null; }
  // 60초 간격을 기다리지 않고 새 진행을 즉시 올립니다.
  firebaseAutoUpload();
}
function fbAdminPanelHtml(){
  // 호출부에서 한 번 거르지만, 화면 조각 자체도 관리자 계정이 아니면 비웁니다.
  if(!isAdminUser()) return "";
  const list=fbAdminUsers;

// Firestore 문서 ID로 쓸 수 있는 UID만 허용합니다. 이메일·슬래시·공백이 들어가면

const ADMIN_UID_RE=/^[A-Za-z0-9_-]{1,128}$/;
function adminUid(v){
  const uid=String(v==null?"":v).trim();
  return ADMIN_UID_RE.test(uid)?uid:"";
}

}

    await Promise.all(scoreSnap.docs.map(d=>api.db.deleteDoc(d.ref)));

    await api.db.setDoc(api.db.doc(fbDb,"admin_resets",target),{

    },{merge:true});

  }catch(e){
    const code=firebaseErrorCode(e);
    fbAdminMsg=code.indexOf("permission-denied")>=0 ? "초기화 권한이 없습니다. firestore.rules를 게시했는지 확인하세요." : `초기화하지 못했습니다 (${code})`;
  }finally{
    fbAdminBusy=false;
    try{ firebasePanelRefresh(""); }catch(e){}
  }
}

function firebaseSavePayload(){
  const data=buildSaveData();
  const raw=JSON.stringify(data);
  if(raw.length>900000) throw new Error("저장 데이터가 너무 큽니다(Firestore 1MB 제한에 근접).");
  return {data,score:Math.round(totalAssetsKRW())};
}
// ── 기기 간 저장 충돌 · 백업 스냅샷 ─────────────────────────────
const DEVICE_KEY="money_playground_device";
const FB_SNAPSHOTS_MAX=8;
let fbSyncRev=null;   // 이 기기가 마지막으로 확인한 클라우드 리비전
let fbConflict=null;  // 충돌 내용(사용자가 고를 때까지 자동 저장을 멈춥니다)
function fbDevice(){
  try{ let d=localStorage.getItem(DEVICE_KEY); if(!d){ d="d"+Math.random().toString(36).slice(2,10); localStorage.setItem(DEVICE_KEY,d); } return d; }
  catch(e){ return "unknown"; }
}
// 클라우드 리비전이 이 기기가 마지막으로 본 값과 다르면 다른 곳에서 저장한 것입니다.
function cloudConflictInfo(localRev, syncedRev, remote){
  if(!remote || !remote.save) return null;
  const r=Math.max(0,Math.floor(+remote.revision||0));
  const known=(syncedRev==null)?null:Math.max(0,Math.floor(+syncedRev||0));
  if(known!==null && r===known) return null;
  return {remoteRev:r, localRev:Math.max(0,Math.floor(+localRev||0)), remoteScore:Math.round(+remote.score||0), remoteAt:+remote.savedAt||0, remoteDevice:String(remote.device||""), save:remote.save};
}
async function fbPreflight(api){
  const snap=await api.db.getDoc(api.db.doc(fbDb,"saves",fbUser.uid));
  const exists=(snap&&typeof snap.exists==="function")?snap.exists():!!snap;
  const remote=exists?(snap.data()||null):null;
  return {remote, conflict:cloudConflictInfo(saveRevision(), fbSyncRev, remote)};
}
// 백업은 10분에 한 번, 또는 자산이 ±10% 이상 바뀌었을 때만 남깁니다(쓰기 한도 절약).
const FB_SNAPSHOT_EVERY_MS=10*60*1000, FB_SNAPSHOT_SCORE_STEP=0.1;
function fbSnapshotState(uid){
  try{ return JSON.parse(localStorage.getItem("money_playground_snap_"+uid)||"null")||{at:0,score:0}; }
  catch(e){ return {at:0,score:0}; }
}
function fbSnapshotRemember(uid,score){
  try{ localStorage.setItem("money_playground_snap_"+uid, JSON.stringify({at:Date.now(),score:Math.round(+score||0)})); }catch(e){}
}
function fbShouldSnapshot(score, prev){
  const now=Date.now();
  const st=prev||{at:0,score:0};
  if(now-(+st.at||0)>=FB_SNAPSHOT_EVERY_MS) return true;
  const base=Math.max(0,+st.score||0);
  const cur=Math.max(0,+score||0);
  if(base<=0) return cur>0; // 아직 백업이 없으면 한 번은 남깁니다.
  return Math.abs(cur-base)/base>=FB_SNAPSHOT_SCORE_STEP;
}
// 최근 몇 개를 백업으로 남기고 오래된 것은 지웁니다.
async function fbPushSnapshot(api,payload){
  if(!fbUser || !payload) return false;
  try{
    const col=api.db.collection(fbDb,"saves",fbUser.uid,"history");
    const at=Date.now();
    await api.db.setDoc(api.db.doc(col,String(at)),{save:payload.data, score:payload.score, at, revision:saveRevision(), device:fbDevice()});
    const snap=await api.db.getDocs(api.db.query(col,api.db.orderBy("at","desc")));
    const extra=(snap&&snap.docs?snap.docs:[]).slice(FB_SNAPSHOTS_MAX);
    await Promise.all(extra.map(d=>api.db.deleteDoc(d.ref).catch(()=>{})));
    return true;
  }catch(e){ return false; /* 백업 실패는 저장 자체를 막지 않습니다(규칙에 history가 없을 수 있음) */ }
}
async function fbMaybeSnapshot(api,payload){
  if(!fbUser || !payload) return false;
  if(!fbShouldSnapshot(payload.score, fbSnapshotState(fbUser.uid))) return false;
  const ok=await fbPushSnapshot(api,payload);
  if(ok) fbSnapshotRemember(fbUser.uid, payload.score);
  return ok;
}
async function fbListSnapshots(){
  if(!firebaseConfigured()||!fbUser) return [];
  const api=await firebaseLoad();
  const col=api.db.collection(fbDb,"saves",fbUser.uid,"history");
  const snap=await api.db.getDocs(api.db.query(col,api.db.orderBy("at","desc"),api.db.limit(FB_SNAPSHOTS_MAX)));
  return (snap&&snap.docs?snap.docs:[]).map(d=>{ const x=d.data()||{}; return {id:d.id, at:+x.at||0, score:Math.round(+x.score||0), revision:+x.revision||0}; });
}
async function firebaseUpload(force){
  if(!firebaseConfigured()) return alert("Firebase 설정이 필요합니다.");
  if(!fbUser) return alert("먼저 Google로 로그인해 주세요.");
  if(fbBusy) return;
  fbBusy=true; firebasePanelRefresh("저장 중…");
  try{
    const api=await firebaseLoad();
    const {data,score}=firebaseSavePayload();
    // 다른 기기에서 더 최근에 저장했으면 자동으로 덮어쓰지 않고 선택을 받습니다.
    if(!force){
      const {conflict}=await fbPreflight(api);
      if(conflict){
        fbConflict=conflict; fbAutoPaused=true;
        notify("system","저장 충돌",`다른 곳에서 더 최근에 저장했습니다(${won(conflict.remoteScore)}). 설정에서 어느 쪽을 쓸지 골라 주세요.`);
        try{ settingsPage(); }catch(e){}
        return;
      }
    }
    await api.db.setDoc(api.db.doc(fbDb,"saves",fbUser.uid),{save:data,score,nickname:fbUser.displayName||"",revision:saveRevision(),savedAt:Date.now(),device:fbDevice(),updatedAt:api.db.serverTimestamp()});
    // 같은 시즌에 한 줄만 유지되도록 문서 id를 시즌+uid로 고정합니다(중복 행 방지).
    await api.db.setDoc(api.db.doc(fbDb,"scores",`${seasonKey()}_${fbUser.uid}`),{season:seasonKey(),uid:fbUser.uid,nickname:fbUser.displayName||"익명",score,updatedAt:api.db.serverTimestamp()});
    fbSyncRev=saveRevision(); fbConflict=null;
    await fbMaybeSnapshot(api,{data,score});
    notify("system","클라우드 저장",`Google 계정에 저장했습니다. · ${won(score)}`);
    trackEvent("cloud_save");
    fbLastSync=Date.now(); fbLastScorePush=Date.now(); fbAutoPaused=false; fbLastError=null;
  }catch(e){
    const info=firebaseNoteError(e,"클라우드 저장");
    alert(`저장하지 못했습니다 (${info.code})\n\n${info.title}\n· ${(info.steps[0]||"").replace(/<[^>]+>/g,"")}`);
  }finally{
    fbBusy=false;
    try{ settingsPage(); }catch(e){}
  }
}
// ── 로그인 상태에서 저장하면 클라우드에도 자동으로 올립니다(쓰기 제한을 위해 간격을 둡니다) ──
const FB_SYNC_MIN_MS=60000, FB_SYNC_DELAY_MS=8000, FB_SCORE_EVERY_MS=300000;
function fbAutoWanted(){ return !!(fbUser && !fbAutoPaused && !fbResetPending && !multiTab && state.settings && state.settings.cloudAuto!==false); }
async function fbWaitCloudWrite(){
  while(fbCloudWrite){
    const p=fbCloudWrite;
    try{ await p; }catch(e){}
    if(fbCloudWrite===p) break;
  }
}
function scheduleCloudSync(){
  if(!fbAutoWanted()||fbAutoTimer) return;
  const wait=Math.max(FB_SYNC_DELAY_MS, FB_SYNC_MIN_MS-(Date.now()-fbLastSync));
  fbAutoTimer=setTimeout(()=>{ fbAutoTimer=null; firebaseAutoUpload(); }, wait);
}
async function firebaseAutoUpload(){
  if(!fbAutoWanted()) return;
  const epoch=fbCloudEpoch;
  const job=(async()=>{
    try{
      const api=await firebaseLoad();
      const {data,score}=firebaseSavePayload();
      if(epoch!==fbCloudEpoch || !fbAutoWanted()) return;
      const {conflict}=await fbPreflight(api);
      if(epoch!==fbCloudEpoch || !fbAutoWanted()) return;
      if(conflict){
        fbConflict=conflict; fbAutoPaused=true;
        notify("system","클라우드 저장 대기",`다른 기기에서 더 최근에 저장했습니다(${won(conflict.remoteScore)}). 설정에서 어느 쪽을 쓸지 골라 주세요.`);
        return;
      }
      fbLastSync=Date.now();
      await api.db.setDoc(api.db.doc(fbDb,"saves",fbUser.uid),{save:data,score,nickname:fbUser.displayName||"",revision:saveRevision(),savedAt:Date.now(),device:fbDevice(),updatedAt:api.db.serverTimestamp()});
      fbSyncRev=saveRevision();
      // 초기화가 저장 중간에 시작됐다면 점수·백업도 옛 상태로 쓰지 않습니다.
      if(epoch!==fbCloudEpoch) return;
      // 순위는 5분에 한 번만 써서 Firestore 쓰기 한도를 아낍니다.
      if(Date.now()-fbLastScorePush>FB_SCORE_EVERY_MS){
        fbLastScorePush=Date.now();
        await api.db.setDoc(api.db.doc(fbDb,"scores",`${seasonKey()}_${fbUser.uid}`),{season:seasonKey(),uid:fbUser.uid,nickname:fbUser.displayName||"익명",score,updatedAt:api.db.serverTimestamp()});
      }
      if(epoch!==fbCloudEpoch) return;
      await fbMaybeSnapshot(api,{data,score});
      if(fbLastError&&fbLastError.where==="자동 저장") fbLastError=null;
    }catch(e){
      firebaseNoteError(e,"자동 저장");
    }finally{
      if(activePage()==="settings"){ try{ firebasePanelRefresh(""); }catch(_){} }
    }
  })();
  fbCloudWrite=job;
  try{ await job; } finally { if(fbCloudWrite===job) fbCloudWrite=null; }
}
function setCloudAuto(on){ state.settings.cloudAuto=!!on; fbAutoPaused=false; fbLastError=null; saveGame(); if(on) scheduleCloudSync(); settingsPage(); }
function fbSyncText(){
  if(!fbUser) return "";
  if(fbAutoPaused) return fbLastError&&fbLastError.where==="자동 저장"?`자동 저장 멈춤 · 오류 ${fbLastError.code}`:"자동 저장 일시중지";
  if(state.settings&&state.settings.cloudAuto===false) return "자동 클라우드 저장 꺼짐";
  if(!fbLastSync) return "자동 저장 켜짐 · 조금 뒤 첫 업로드";
  const s=Math.max(0,Math.round((Date.now()-fbLastSync)/1000));
  return `자동 저장 켜짐 · ${s<60?`${s}초`:`${Math.round(s/60)}분`} 전 업로드`;
}
// 로그인 직후: 클라우드에 더 진행된 기록이 있으면 로컬로 덮어쓰지 않고 일시중지합니다.
async function firebaseAfterSignIn(){
  if(!fbUser) return;
  try{
    const api=await firebaseLoad();
    // 관리자가 초기화한 계정이면 옛 저장을 올리기 전에 로컬 진행을 먼저 비웁니다.
    if(await fbCheckForcedReset(api)) return;
    const {remote, conflict}=await fbPreflight(api);
    const remoteScore=remote?Math.round(+remote.score||0):0;
    const local=Math.round(totalAssetsKRW());
    if(remote){
      fbSyncRev=Math.max(0,Math.floor(+remote.revision||0));
      if(remoteScore>local*1.05 || conflict){
        fbConflict=conflict||{remoteRev:fbSyncRev, localRev:saveRevision(), remoteScore, remoteAt:+remote.savedAt||0, remoteDevice:String(remote.device||""), save:remote.save};
        fbAutoPaused=true;
        notify("system","클라우드 기록 발견",`클라우드에 더 진행된 기록(${won(remoteScore)})이 있습니다. 설정에서 불러오거나 이 기기 기록을 유지하세요.`);
      } else {
        firebaseAutoUpload();
      }
    } else {
      firebaseAutoUpload();
    }
  }catch(e){
    firebaseNoteError(e,"로그인 확인");
  }finally{
    // 초기화 확인이 끝난 뒤에 실시간 신호를 연결해 옛 저장을 다시 올리는 경쟁을 막습니다.
    fbWatchForcedReset();
    if(isAdminUser()) fbAdminRefresh();
    if(activePage()==="settings"){ try{ firebasePanelRefresh(""); }catch(_){} }
  }
}
async function firebaseDownload(){
  if(!firebaseConfigured()) return alert("Firebase 설정이 필요합니다.");
  if(!fbUser) return alert("먼저 Google로 로그인해 주세요.");
  if(fbBusy) return;
  if(!confirm("Google 계정에 저장된 진행으로 이 기기를 덮어쓸까요?\n현재 진행은 사라집니다.")) return;
  fbBusy=true; firebasePanelRefresh("불러오는 중…");
  try{
    const api=await firebaseLoad();
    const snap=await api.db.getDoc(api.db.doc(fbDb,"saves",fbUser.uid));
    if(!snap.exists()||!snap.data()||!snap.data().save) throw Object.assign(new Error("no_save"),{code:"no_save"});
    applySaveData(snap.data().save);
    saveGame(); banking(); fxPage(); news(); portfolio(); update(); updateBell(); updateSpeedUI();
    notify("system","클라우드 복원","Google 계정 저장을 불러왔습니다.");
    trackEvent("cloud_restore");
    fbLastError=null; fbAutoPaused=false;
  }catch(e){
    if(e&&e.code==="no_save"){ alert("Google 계정에 저장된 진행이 아직 없습니다.\n먼저 '클라우드에 저장'을 눌러 주세요."); }
    else if(saveStaleRebirth(e)){ alert(SAVE_STALE_REBIRTH_MSG); }
    else { const info=firebaseNoteError(e,"클라우드 불러오기"); alert(`불러오지 못했습니다 (${info.code})\n\n${info.title}\n· ${(info.steps[0]||"").replace(/<[^>]+>/g,"")}`); }
  }finally{
    fbBusy=false;
    try{ settingsPage(); }catch(e){}
  }
}

async function fbResolveUseCloud(){
  if(!fbConflict) return;

  }catch(e){ alert(saveStaleRebirth(e)?SAVE_STALE_REBIRTH_MSG:"복원하지 못했습니다: "+firebaseErrorCode(e)); }

async function fbResolveKeepLocal(){
