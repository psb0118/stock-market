// 저장 스키마 마이그레이션: 버전이 없는 구세이브도 현재 구조로 올린 뒤 적용합니다.
const SAVE_MIGRATIONS={
  2:data=>{
    // v2: 평단가에 매수 수수료가 포함되는 형식으로 통일합니다.
    if(data.costBasisIncludesFee===undefined) data.costBasisIncludesFee=false;
    return data;
  },
  3:data=>{
    // v3: 세금 계좌별 로트·연간 납입한도·세금연도·계좌별 납부 내역을 추가합니다.
    data.state=data.state||{};
    const t=data.state.tax;
    if(t&&typeof t==="object"){
      if(!t.contributions||typeof t.contributions!=="object") t.contributions={general:0,isa:0,pension:0};
      if(!t.taxPaidByAccount||typeof t.taxPaidByAccount!=="object") t.taxPaidByAccount={general:0,isa:0,pension:0};
      if(t.carryLossBase===undefined){
        const netLoss=Math.max(0,-(+data.state.realizedYTD||0));
        t.carryLossBase=Math.max(0,(+t.carryLoss||0)-netLoss);
      }
      if(!Number.isFinite(+t.year)||+t.year<1) t.year=1;
      if(!Number.isFinite(+t.yearStart)) t.yearStart=Math.max(0,+data.state.marketSeconds||0);
    }
    return data;
  }
};
function migrateSaveData(data){
  if(!data||typeof data!=="object") return data;
  let version=Math.max(1,Math.floor(+data.version||1));
  while(version<SAVE_VERSION){
    version++;
    const step=SAVE_MIGRATIONS[version];
    if(step) data=step(data)||data;
  }
  data.version=SAVE_VERSION;
  return data;
}

// localStorage와 파일 불러오기가 같은 경로를 쓰도록 저장 데이터 적용을 한 곳에 모읍니다.
function applySaveData(data) {
  if(!data || typeof data !== "object") throw new Error("잘못된 저장 데이터");
  data=migrateSaveData(data);
  if(data.state) Object.assign(state, data.state);
  if(data.fx) Object.assign(fx, data.fx);
  // 공모주로 상장된 종목을 먼저 복원해야 저장된 가격·보유량을 적용할 수 있습니다.
  if(Array.isArray(state.listedIds)) state.listedIds.forEach(id => { const d=IPO_POOL.find(x=>x.id===id); if(d) ensureListedStock(d,d.price); });
  if(data.stocks) {
    data.stocks.forEach(ls => {
      let s = stocks.find(x => x.id === ls.id);
      if(!s) return;
      s.own = ls.own || 0;
      s.price = ls.price || s.start;
      s.avgBuy = ls.avgBuy || 0;
      // 구버전 저장 데이터의 평단가에는 매수 수수료가 빠져 있으므로 취득원가로 한 번만 환산
      if(data.costBasisIncludesFee !== true && s.avgBuy > 0) s.avgBuy *= (1 + FEE_STOCK);
      s.realizedProfit = ls.realizedProfit || 0;
      s.lastMove = ls.lastMove || 0;
      s.volume=Math.max(0,+ls.volume||0); s.foreignFlow=Math.max(-1e15,+ls.foreignFlow||0); s.instFlow=Math.max(-1e15,+ls.instFlow||0);
      if(Array.isArray(ls.taxLots)) s.taxLots=ls.taxLots.filter(l=>l&&+l.qty>0).map(l=>({qty:Math.floor(+l.qty||0),price:Math.max(0,+l.price||0),at:Math.max(0,+l.at||0),account:TAX_ACCOUNTS.includes(l.account)?l.account:"general"}));
      if(Number.isFinite(+ls.revenue)&&+ls.revenue>0) s.revenue=+ls.revenue;
      if(Number.isFinite(+ls.opProfit)&&+ls.opProfit>=0) s.opProfit=+ls.opProfit;
      // 일일 시세(전일 종가·시가·변동률) 복원 · 구버전 세이브는 현재가 기준으로 보정
      s.prevClose=(Number.isFinite(+ls.prevClose)&&+ls.prevClose>0)?+ls.prevClose:s.price;
      s.dayOpen=(Number.isFinite(+ls.dayOpen)&&+ls.dayOpen>0)?+ls.dayOpen:s.price;
      s.dayRet=Number.isFinite(+ls.dayRet)?+ls.dayRet:0;
      s.dayIndex=Number.isFinite(+ls.dayIndex)?+ls.dayIndex:marketDayIndex(state.marketSeconds);
    });
  }
  if(data.products) {
    data.products.forEach(lp => {
      let p = products.find(x => x.id === lp.id);
      if(!p) return;
      p.amount = lp.amount || 0;
      // 구버전 저장 데이터에는 rate가 없으므로, 가입 중이면 현재 등급 이율로 확정해 줍니다.
      // 현재 등급이 해당 상품을 열 수 없으면 그 상품의 해금 등급 이율로 확정해 이자가 0이 되지 않도록 함
      p.rate = (Number.isFinite(lp.rate) && lp.rate > 0) ? lp.rate
        : (p.amount > 0 ? (gradeRateFor(p.id, currentGrade()) || gradeRateFor(p.id, PRODUCT_UNLOCK[p.id])) : 0);
      p.bank=lp.bank||null;
      p.startedAt=Number.isFinite(lp.startedAt)?lp.startedAt:null;
      p.matured=!!lp.matured;
    });
  }
  // 새 기능 필드 기본값 보정(구버전 세이브 대응)
  ensureAdvancedState();
  stocks.forEach(s=>ensureTaxLots(s));
  if(!Array.isArray(state.orders)) state.orders = [];
  if(!Array.isArray(state.shorts)) state.shorts = [];
  state.shorts=state.shorts.filter(p=>p&&typeof p==="object"&&stock(p.stockId)&&+p.qty>0).map(p=>({id:p.id||`sh${Math.random().toString(36).slice(2,8)}`,stockId:p.stockId,qty:Math.floor(+p.qty||0),entry:Math.max(0,+p.entry||0),margin:Math.max(0,+p.margin||0),at:Math.max(0,+p.at||0)}));
  ensureBonds(); ensureIPO();
  if(!Array.isArray(state.listedIds)) state.listedIds = [];
  if(!Number.isFinite(+state.shortRealized)) state.shortRealized = 0;
  if(!state.goals || typeof state.goals !== "object") state.goals = {};
  ["loan","loanRate","realizedYTD","taxedProfit","taxPaid"].forEach(k => {
    if(!Number.isFinite(state[k])) state[k] = 0;
  });
  if(!Number.isFinite(fx.anchor)) fx.anchor = fx.usd || START_FX; // 구버전 저장 대응
  // 신규 기능 필드 기본값 보정
  if(!Array.isArray(state.watch)) state.watch=[];
  if(!Array.isArray(state.journal)) state.journal=[];
  if(!Array.isArray(state.alerts)) state.alerts=[];
  if(!state.achievements || typeof state.achievements!=="object") state.achievements={};
  ["loanTotal","dividendTotal","feesTotal"].forEach(k=>{ if(!Number.isFinite(state[k])) state[k]=0; });
  state.notify=Object.assign({},NOTIFY_DEFAULT,(state.notify&&typeof state.notify==="object")?state.notify:{});
  Object.keys(NOTIFY_DEFAULT).forEach(k=>{ if(k!=="sound"&&k!=="haptic"&&k!=="master"&&k!=="newsGap"&&k!=="toastMs"&&k!=="toastMax") state.notify[k]=state.notify[k]!==false; });
  state.notify.master=state.notify.master===true;
  state.notify.newsGap=Math.max(0,Math.min(600,Math.round(+state.notify.newsGap||0)));
  state.notify.toastMs=Math.max(2000,Math.min(8000,Math.round(+state.notify.toastMs||4200)));
  state.notify.toastMax=Math.max(1,Math.min(5,Math.round(+state.notify.toastMax||3)));
  const AUTO_DEFAULT={enabled:false,stockPct:60,minCash:1000000,every:60,goldPct:0,estatePct:0,autoSell:false,takeProfit:20,stopLoss:10,rebalance:false,rebStockPct:60,rebBand:5,taxAware:false,taxBudget:0};
  state.auto=Object.assign({},AUTO_DEFAULT,(state.auto&&typeof state.auto==="object")?state.auto:{});
  state.auto.goldPct=Math.max(0,Math.min(100,+state.auto.goldPct||0));
  state.auto.estatePct=Math.max(0,Math.min(100,+state.auto.estatePct||0));
  const LABOR_DEFAULT={shifts:0,earned:0,lastAt:{},warned:false,xp:0,points:0,stamina:100,skills:{focus:0,stamina:0,service:0}};
  state.labor=Object.assign({},LABOR_DEFAULT,(state.labor&&typeof state.labor==="object")?state.labor:{});
  state.labor.shifts=Math.max(0,Math.floor(+state.labor.shifts||0));
  state.labor.earned=Math.max(0,+state.labor.earned||0);
  state.labor.xp=Math.max(0,+state.labor.xp||0);
  state.labor.points=Math.max(0,Math.floor(+state.labor.points||0));
  if(!state.labor.skills||typeof state.labor.skills!=="object") state.labor.skills={focus:0,stamina:0,service:0};
  if(!state.labor.lastAt||typeof state.labor.lastAt!=="object") state.labor.lastAt={};
  LABOR_JOBS.forEach(j=>{ const t=+state.labor.lastAt[j.id]; if(!Number.isFinite(t)||t<0) delete state.labor.lastAt[j.id]; });
  state.labor.warned=!!state.labor.warned;
  if(!Number.isFinite(+state.rewardedGrade)) state.rewardedGrade=gradeIndex(currentGrade());
  if(!Number.isFinite(+state.targetGoal)||+state.targetGoal<=0) state.targetGoal=1000000000;
  if(!state.daily || typeof state.daily!=="object") state.daily={date:"",counts:{},claimed:{}};
  if(!Number.isFinite(state.speed) || state.speed<1) state.speed=1;
  state.speed=Math.max(1,Math.min(5,Math.round(state.speed)));
  // 새 설정 항목 기본값·타입 보정(잘못된 값이 들어와도 게임이 멈추지 않게)
  state.settings=Object.assign({},SETTINGS_DEFAULT,(state.settings&&typeof state.settings==="object")?state.settings:{});
  state.settings.speed=state.speed;
  state.settings.theme=state.settings.theme==="dark"?"dark":"light";
  state.settings.numberFormat=state.settings.numberFormat==="short"?"short":"full";
  ["confirmTrades","animations","effects","autoSave"].forEach(k=>{ state.settings[k]=state.settings[k]!==false; });
  ensureRebirth();
  if(!state.ui || typeof state.ui!=="object") state.ui={assetTab:"overview"};
  if(!["overview","stocks","finance","estate","metals","company","journal","growth","risk"].includes(state.ui.assetTab)) state.ui.assetTab="overview";
  ["cash","usd","loan","peakNet","altRealized"].forEach(k=>{ if(!Number.isFinite(+state[k]) || +state[k]<0) state[k]=0; });
  if(typeof state.paused!=="boolean") state.paused=false;
  if(!Number.isFinite(state.seasonBase) || state.seasonBase<=0) state.seasonBase=totalAssetsKRW();
  if(!Number.isFinite(state.seasonBaseIndex) || state.seasonBaseIndex<=0) state.seasonBaseIndex=marketIndex();
  const CLOUD_DEFAULT={nickname:"", auto:false, lastSync:0, revision:0, rank:0, best:0, season:""};
  state.cloud=Object.assign({},CLOUD_DEFAULT,(state.cloud&&typeof state.cloud==="object")?state.cloud:{});
  delete state.cloud.token; // 기기 토큰은 localStorage에만 둠(내보내기 파일에 포함 금지)
  // 확장 자산 기본값/정규화(구버전 세이브 호환)
  if(!state.estate||typeof state.estate!=="object") state.estate={};
  ESTATES.forEach(e=>{ const h=state.estate[e.id]; if(!h||typeof h!=="object") { delete state.estate[e.id]; return; } h.qty=Math.max(0,Math.floor(+h.qty||0)); h.avgBuy=Math.max(0,+h.avgBuy||0); if(!h.qty) delete state.estate[e.id]; });
  if(!state.metals||typeof state.metals!=="object") state.metals={};
  METALS.forEach(m=>{ const h=state.metals[m.id]; if(!h||typeof h!=="object"){ state.metals[m.id]={qty:0,avg:0}; return; } h.qty=Math.max(0,+h.qty||0); h.avg=Math.max(0,+h.avg||0); });
  if(!state.altPrices||typeof state.altPrices!=="object") state.altPrices={};
  ESTATES.forEach(e=>{ if(!Number.isFinite(state.altPrices[e.id])||state.altPrices[e.id]<=0) state.altPrices[e.id]=e.price; });
  METALS.forEach(m=>{ if(!Number.isFinite(state.altPrices[m.id])||state.altPrices[m.id]<=0) state.altPrices[m.id]=m.price; });
  if(state.company && typeof state.company==="object"){
    const c=state.company;
    c.level=Math.max(1,Math.min(COMPANY_LEVELS.length,Math.floor(+c.level||1)));
    c.valuation=Math.max(0,+c.valuation||COMPANY_LEVELS[0].val);
    c.revenue=Math.max(0,+c.revenue||0); c.profit=Math.max(0,+c.profit||0);
    c.payout=Math.max(0,Math.min(1,Number.isFinite(+c.payout)?+c.payout:.3));
    if(!c.acquired||typeof c.acquired!=="object"||Array.isArray(c.acquired)) c.acquired={};
    if(typeof c.name!=="string") c.name="나의 기업";
    c.upkeep=Math.max(0,+c.upkeep||0);
    c.risk=Math.max(0,+c.risk||0);
    if(c.listed&&typeof c.listed==="object"){
      c.listed.shares=Math.max(1,Math.floor(+c.listed.shares||COMPANY_SHARES));
      c.listed.ipoPrice=Math.max(100,Math.round(+c.listed.ipoPrice||100));
      c.listed.price=Math.max(100,Math.round(+c.listed.price||c.listed.ipoPrice));
      c.listed.ownPct=Math.max(0,Math.min(100,Math.round(+c.listed.ownPct||0)));
    } else c.listed=null;
  } else state.company=null;
  state.economy=Object.assign({},ECON_DEFAULT,(state.economy&&typeof state.economy==="object")?state.economy:{});
  ["baseRate","inflation","unemployment","gdpGrowth","cycleLeft","rateAdj"].forEach(k=>{ if(!Number.isFinite(+state.economy[k])) state.economy[k]=ECON_DEFAULT[k]; });
  if(!["호황","중립","불황"].includes(state.economy.phase)) state.economy.phase="중립";
  if(!state.weekly||typeof state.weekly!=="object"||!state.weekly.counts) state.weekly={key:"",counts:{},claimed:{}};
  if(!state.special||typeof state.special!=="object") state.special={};
  if(!state.streak||typeof state.streak!=="object") state.streak={days:1,last:"",best:1};
  if(!state.dex||typeof state.dex!=="object") state.dex={stocks:{},products:{},estates:{},metals:{},company:false};
  ["stocks","products","estates","metals"].forEach(k=>{ if(!state.dex[k]||typeof state.dex[k]!=="object") state.dex[k]={}; });
  state.dex.company=!!state.dex.company;
  if(state.company && !Number.isFinite(state.company.book)) state.company.book=state.company.valuation;
  if(!state.journalFilter||typeof state.journalFilter!=="object") state.journalFilter={q:"",side:"all"};
  state.peakNet=Math.max(Number.isFinite(+state.peakNet)?+state.peakNet:0,totalAssetsKRW());
  if(!Number.isFinite(+state.altRealized)) state.altRealized=0;
  // 월간 리포트 기준점: 새 달이거나 월간 기준이 없는 구버전 저장이면 현재 자산에서 다시 시작합니다.
  const month=seasonKey();
  if(state.reportMonth!==month){
    state.reportMonth=month;
    state.seasonBase=totalAssetsKRW();
    state.seasonBaseIndex=marketIndex();
  }
  state.lastGrade=currentGrade();
}

function goPage(id){
  document.querySelectorAll(".page").forEach(x=>x.classList.toggle("on",x.id==id));
  if(typeof window!=="undefined" && typeof window.scrollTo==="function") window.scrollTo({top:0,behavior:"auto"});
  const globalStats=document.querySelector(".stats");
  if(globalStats) globalStats.classList.toggle("hidden",["dashboard","portfolio","settings","rebirth"].includes(id));
  const active=parentPage(id);
  document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("on",x.dataset.page===active));
  document.querySelectorAll(".bb-nav button").forEach(x=>x.classList.toggle("on",x.dataset.page===active));
  const activeNav=document.querySelector(".nav button.on");
  if(activeNav&&activeNav.parentElement){ const n=activeNav.parentElement; n.scrollLeft=Math.max(0,activeNav.offsetLeft-n.clientWidth/2+activeNav.offsetWidth/2); }
  renderPage(id);
  refreshLaborUI();
  renderMobileTradeBar();
}
function show(id){ goPage(id); }
function quickNav(id){ goPage(id); }

const escAttr=v=>String(v==null?"":v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

function holdingCard(s){
  const isForeign=["foreign","mega","special"].includes(s.group);
  const ctx="holdings";
  const qid=qtyInputId(s.id,ctx);
  const dayC=dayChangePct(s);
  const avg=s.own>0?s.avgBuy:0;
  const value=stockPriceKRW(s)*Math.max(0,+s.own||0);
  const cost=(+s.avgBuy||0)*(+s.own||0)*(isForeign?fx.usd:1);
  const pnl=value-cost, acct=state.tax.mode, aq=accountQty(s,acct), acctAvg=accountAvgBuy(s,acct);
  return `<article class="card holding-card">
    <div class="top"><div><h2>${s.name}</h2><span class="pill">${s.ticker} · ${s.theme}</span></div><span class="pill">${s.market}</span></div>
    <div class="price ${dayC>=0?"up":"down"}" data-price="${s.id}">${isForeign ? usdStr(s.price) : won(s.price)}</div>
    <p class="${dayC>=0?"up":"down"}" data-change="${s.id}">시작가 대비 ${pct((s.price-s.start)/s.start)} · 오늘 ${pct(dayC)}</p>
    <div class="spark" data-spark="${s.id}" onmousemove="sparkHover(event,'${s.id}')" onmouseleave="sparkLeave('${s.id}')">${sparklineHTML(s)}</div>
    <div class="mini holding-mini">
      <div><small>보유</small><b data-own="${s.id}">${qtyText(s.own)}</b></div>
      <div><small>평단</small><b data-avg="${s.id}">${avg>0?(isForeign?usdStr(avg):won(avg)):"-"}</b></div>
      <div><small>평가액</small><b data-hold-value="${s.id}">${won(value)}</b></div>
      <div><small>평가손익</small><b class="${pnl>=0?"up":"down"}" data-hold-pnl="${s.id}">${pnl>=0?"+":""}${won(pnl)}</b></div>
    </div>
    <p class="muted-sm" style="margin:6px 0">현재 계좌 ${taxModeLabel(acct)} · 평단 ${acctAvg>0?(isForeign?usdStr(acctAvg):won(acctAvg)):"-"} · 매도 가능 <b>${qtyText(aq)}</b>${s.own>aq?` (다른 계좌 ${qtyText(s.own-aq)})`:""}</p>

// 상품 카드의 부제(현재 등급 이율 또는 잠금 안내)
function productSubText(p, unlocked, held){
  const term=p.term>0?` · 만기 실제 ${realSeconds(p.term)}초 · 보너스 ${(p.bonus*100).toFixed(1)}%`:" · 수시 입출금";
  const bank=BANKS.find(b=>b.id===p.bank);
  return `${p.type} · ${unlocked ? `현재 등급 연 ${(gradeRateFor(p.id, currentGrade())*100).toFixed(1)}%` : `🔒 ${unlockLabel(p.id)}${held?" · 보유 중(이자는 확정 이율로 유지)":""}`}${term}${bank?` · ${bank.name}`:""}`;
}

// 배너와 해금 상태만 갱신합니다. 금융 화면을 다시 그리지 않으므로 입력 중인 금액이 보존됩니다.
function refreshBankingState(){
  products.forEach(p=>{
    const card=document.querySelector(`[data-card="${p.id}"]`);
    if(!card) return;
    const unlocked=canJoin(p.id), held=p.amount>0;
    card.className="product"+(unlocked ? "" : (held ? " locked holding" : " locked"));
    const sub=card.querySelector(`[data-sub="${p.id}"]`);
    if(sub) sub.textContent=productSubText(p, unlocked, held);
    const input=document.getElementById(`prod-${p.id}`);
    if(input) input.disabled=!unlocked;
    const maturity=card.querySelector(`[data-maturity="${p.id}"]`);
    if(maturity) maturity.value=productMaturityText(p);
    const joinBtn=card.querySelector(`[data-join="${p.id}"]`);
    if(joinBtn) joinBtn.disabled=!unlocked;
  });
  const gb=document.getElementById("gradeBanner");
  if(gb) gb.innerHTML=gradeBannerHTML();
}

// 등급 안내 배너: 현재 등급, 총자산, 다음 등급까지 남은 금액
function gradeBannerHTML(){
  const next=nextGradeInfo();
  return `🏅 현재 등급: <b>${currentGrade()}</b> · 총자산 ${won(totalAssetsKRW())}` +
    (next ? ` · 다음 등급 <b>${next.grade}</b>까지 ${won(next.remain)}` : " · 최고 등급입니다") +
    `<br><span style="font-size:12px;">등급이 높을수록 같은 상품의 이율이 높습니다. 가입 시점의 이율은 이후 등급이 바뀌어도 유지됩니다.</span>`;
}

function productMaturityText(p){
  if(p.amount<=0) return "미가입";
  if(p.term<=0) return "수시";
  if(p.matured) return "만기 완료";
  // startedAt이 0인 경우(게임 시작 직후 가입)도 '지금 가입'으로 잘못 해석하지 않도록 null만 검사합니다.
  const start=p.startedAt!=null?p.startedAt:state.marketSeconds;
  const gameLeft=Math.max(0,p.term-(state.marketSeconds-start));
  return `실제 ${realSeconds(gameLeft)}초 남음`;
}

// 상품 카드: 현재 등급 이율과 가입 당시 확정 이율을 함께 보여줍니다.
function productCard(p){
  const unlocked=canJoin(p.id);
  const held=p.amount>0;
  // 보유 중인 상품은 등급이 내려가도 이자가 계속 되므로 흐리게 처리하지 않습니다.
  const stateClass=unlocked ? "" : (held ? " locked holding" : " locked");
  return `<article class="product${stateClass}" data-card="${p.id}">
    <h2>${p.name}</h2>
    <p data-sub="${p.id}">${productSubText(p, unlocked, held)}</p>
    <div class="product-grid">
      <div><small>가입액</small><b data-prod="${p.id}">${won(p.amount)}</b></div>
      <div><small>최소 금액</small><b>${won(p.min)}</b></div>
      <div><small>확정 이율</small><b data-locked="${p.id}">${p.rate>0?`연 ${(p.rate*100).toFixed(1)}%`:"미가입"}</b></div>
      <div><small>위험도</small><b>${p.risk}</b></div>
    </div>
    <div class="trade bank-trade">
      <input id="prod-${p.id}" type="number" value="${p.min}" step="10000" ${unlocked?"":"disabled"}>
      <button class="buy" data-join="${p.id}" onclick="join('${p.id}')" ${unlocked?"":"disabled"}>가입</button>
      <button class="sell" onclick="leave('${p.id}')">해지</button>
    </div>
    <div class="inline-form" style="margin-top:8px">
      <label>은행<select id="bank-${p.id}" ${unlocked?"":"disabled"}>${BANKS.map(b=>`<option value="${b.id}" ${(p.bank||"hanbit")===b.id?"selected":""}>${b.name} (${b.mult>1?"+":""}${((b.mult-1)*100).toFixed(0)}%)</option>`).join("")}</select></label>
      <label>만기 상태<input id="maturity-${p.id}" data-maturity="${p.id}" value="${productMaturityText(p)}" readonly></label>
    </div>
  </article>`;
}

}

// ── 공매도 화면 ────────────────────────────────
function shortPage(){
  const pos=ensureShorts();
  const rows=pos.length?pos.map(p=>{
    const s=stock(p.stockId); if(!s) return "";
    const foreign=isForeignStock(s);
    const px=v=>foreign?usdStr(v):won(v);
    const pnl=(p.entry-s.price)*p.qty*(foreign?fx.usd:1);
    const danger=s.price>=p.entry*1.2;
    return `<div class="holding-row compact"><b>${s.name}</b><span>${p.qty}주 · 진입 ${px(p.entry)}</span><span>현재 ${px(s.price)}</span><span class="${pnl>=0?"up":"down"}">${won(pnl)}</span><span class="${danger?"down":"muted-sm"}">${danger?"⚠ 마진콜 임박":"유지"}</span><button class="ghost" onclick="coverShort('${p.id}')">환매</button></div>`;
  }).join(""):`<div class="empty-state small"><b>공매도 포지션이 없습니다</b><p>가격이 내려갈 것 같으면 주식을 빌려 먼저 팔고, 나중에 싸게 되사서 차익을 낼 수 있습니다.</p></div>`;
  const realized=state.shortRealized||0;
  $("short").innerHTML=`${pageHeader("FINANCE","공매도","주식을 빌려 먼저 팔고, 나중에 되사서 차익을 노립니다. 가격이 오르면 손실이 커집니다.")}
  ${financeTabs("short")}
  <div class="notice">공매도는 포지션 가치의 <b>30% 이상 현금</b>이 있어야 열 수 있고, 가격이 진입가보다 <b>30% 오르면 마진콜(강제 청산)</b>됩니다. 환매 수수료가 붙고, 현금이 부족하면 부족분이 대출로 전환될 수 있습니다.</div>
  <div class="panel">
    <div class="inline-form">
      <label>종목<select id="short-stock">${stocks.filter(s=>!isIndexFund(s)).map(s=>`<option value="${s.id}">${s.name}</option>`).join("")}</select></label>
      <label>수량<input id="short-qty" type="number" min="1" step="1" value="1"></label>
      <label>&nbsp;<button class="sell" onclick="shortStock(document.getElementById('short-stock').value, document.getElementById('short-qty').value)">공매도 실행</button></label>
      ${pos.length?'<label>&nbsp;<button class="ghost" onclick="coverShortAll()">전량 환매</button></label>':""}
    </div>
    <div class="kpis" style="margin-top:10px"><div class="kpi"><small>열린 포지션</small><b>${pos.length}건</b></div><div class="kpi"><small>공매도 평가손익</small><b class="${shortValueKRW()>=0?"up":"down"}">${won(shortValueKRW())}</b></div><div class="kpi"><small>누적 실현손익</small><b class="${realized>=0?"up":"down"}">${won(realized)}</b></div></div>
    <div class="stack" style="margin-top:10px">${rows}</div>
  </div>`;
}

function updateIPOUI(){
  const o=ensureIPO().offer; if(!o) return;
  const el=$("ipoRemain"); if(!el) return;
  el.textContent=clockText(realSeconds(Math.max(0,o.closesAt-state.marketSeconds)));
}
function ipoPage(){
  const ipo=ensureIPO(), o=ipo.offer;

  const action=o&&o.lastAction;
  const actionBanner=action?`<div class="notice" style="background:${action.type==="subscribe"?"#ecfdf5":"#fff7ed"};border-color:${action.type==="subscribe"?"#86efac":"#fdba74"};color:${action.type==="subscribe"?"#166534":"#9a3412"}">${action.type==="subscribe"?`✅ <b>청약 접수 완료</b> · ${won(action.amount)} (${action.shares.toLocaleString("ko-KR")}주 기준) · 아래 취소 버튼을 누르면 전액 환불됩니다.`:`↩️ <b>청약 취소 완료</b> · ${won(action.amount)} 전액 환불 · 다시 청약할 수 있습니다.`}</div>`:"";
  const offerHtml=o?`<div class="panel">
      <div class="company-head"><div><span class="pill">청약 진행 중</span> <span class="pill">${o.ticker}</span><h2>${escHtml(o.name)}</h2><div class="muted-sm">${o.theme} · 공모 ${o.qty.toLocaleString("ko-KR")}주</div></div><div class="company-value"><small>공모가</small><b>${won(o.price)}</b></div></div>
      ${actionBanner}
      <div class="kpis" style="margin-top:10px"><div class="kpi"><small>마감까지 (실제)</small><b id="ipoRemain">${clockText(realSeconds(remain))}</b></div><div class="kpi"><small>청약 경쟁률</small><b>${(ratio*100).toFixed(0)}%</b></div><div class="kpi"><small>내 청약</small><b>${won(o.mine||0)}</b></div><div class="kpi"><small>접수 상태</small><b>${o.mine?"✅ 접수 완료":"미청약"}</b></div><div class="kpi"><small>예상 배정</small><b>${Math.max(0,Math.floor(((o.mine||0)/o.price)*Math.min(1,o.qty/Math.max(1,demandShares*1.5)))).toLocaleString("ko-KR")}주</b></div></div>
      <div class="inline-form" style="margin-top:10px">
        <label>청약 금액 (원)<input id="ipo-amount" type="number" min="10000" step="10000" placeholder="예: 1000000"></label>
        <label>&nbsp;<button class="buy" onclick="subscribeIPO()">청약하기</button></label>
        <label>&nbsp;<button class="ghost" onclick="setIPOAmount('max')">전액 채우기</button></label>
        ${(o.mine||0)>0?'<label>&nbsp;<button class="ghost" onclick="cancelIPO()">청약 취소</button></label>':""}
      </div>
      <p class="muted-sm">청약이 몰리면 공모 수량만큼만 배정되고 나머지 금액은 자동 환불됩니다. 상장 첫날 가격은 공모가 대비 -10% ~ +25% 사이에서 결정됩니다.</p>
    </div>`:`<div class="panel"><div class="empty-state small"><b>진행 중인 공모주가 없습니다</b><p>시장이 열려 있으면 5~10분 간격으로 새 공모주가 등장합니다.</p></div></div>`;
  const hist=ipo.history.length?ipo.history.map(h=>`<div class="holding-row compact"><b>${escHtml(h.name)}</b><span>공모가 ${won(h.price)}</span><span>시초가 ${won(h.open)}</span><span class="${h.open>=h.price?"up":"down"}">${pct((h.open-h.price)/h.price)}</span><span>${h.alloc?`${h.alloc.toLocaleString("ko-KR")}주 배정`:"미참여"}</span></div>`).join(""):`<div class="muted-sm">아직 신규 상장 기록이 없습니다.</div>`;
  const last=ipo.lastResult?`<div class="notice" style="margin-bottom:10px">최근 청약 결과 · <b>${escHtml(ipo.lastResult.name)}</b> · ${ipo.lastResult.alloc?`${ipo.lastResult.alloc.toLocaleString("ko-KR")}주 배정`:"배정 0주"} · 환불 ${won(ipo.lastResult.refund||0)} · 시초가 ${won(ipo.lastResult.open)}</div>`:"";
  $("ipo").innerHTML=`${marketDayBarHTML()}
  ${pageHeader("MARKET","공모주 청약","신규 상장 종목을 공모가에 청약합니다. 청약·취소 즉시 접수 상태와 환불 결과가 표시됩니다.")}
  ${marketTabs("ipo")}
  ${last}
  ${offerHtml}
  <section class="section"><h3>최근 상장</h3><div class="panel stack">${hist}</div></section>`;
}

function updateFX(){
  let baseVol = 0.0035;
  if(state.currentEvent === "FX_SURGE") baseVol = 0.010; // 환율 급등 이벤트 발동 시 변동성 확대
  
  // 완만한 추세선(anchor)이 아주 느리게 움직이고, 실제 환율은 그 추세선을 따라갑니다.
  // 추세는 시작 환율 ±12% 안으로 제한하고 복원력도 두어, 폭주 없이 방향성만 남깁니다.
  fx.anchor = fx.anchor + (Math.random() - 0.5) * 0.004 * fx.anchor + (START_FX - fx.anchor) * 0.0003;
  fx.anchor = Math.max(START_FX * 0.88, Math.min(START_FX * 1.12, fx.anchor));

  let revert = ((fx.anchor - fx.usd) / fx.anchor) * 0.05;
  let changeRate = (Math.random() - 0.5) * baseVol + revert;
  fx.usd = Math.max(1000, Math.round(fx.usd * (1 + changeRate)));
  
  let e=document.getElementById("fxPrice");
  if(e) e.textContent="1 USD = "+fx.usd.toLocaleString()+"원";
  let fd=document.getElementById("fxFeeDesc");
  if(fd) fd.textContent=`환전 시 ${(fxFeeRate()*100).toFixed(1)}%의 환전 수수료가 적용됩니다(${currentGrade()} 등급 우대).`;
}

function toUSD(){
  let v=+($("krw").value||0);
  if(v<=0||v>state.cash)return alert("원화 현금이 부족하거나 잘못된 액수입니다.");
  
  let dynamicFx = fx.usd * (1 + fxFeeRate()); // 등급별 우대 수수료 적용(달러를 비싸게 삼)
  let netUsd = v / dynamicFx;
  
  state.cash-=v; 
  state.usd+=netUsd; 
  addLog(`달러 환전: 원화 ${won(v)} -> ${usdStr(netUsd)} (환율: ${fx.usd}원, 수수료 ${(fxFeeRate()*100).toFixed(1)}%)`);
  update();
}

function toKRW(){
  let v=+($("usd").value||0);
  if(v<=0||v>state.usd)return alert("달러 잔고가 부족하거나 잘못된 액수입니다.");
  
  let dynamicFx = fx.usd * (1 - fxFeeRate()); // 등급별 우대 수수료 적용(원화를 적게 받음)
  let netKrw = v * dynamicFx;
  
  state.usd-=v; 
  state.cash+=netKrw; 
  addLog(`원화 환전: 달러 ${usdStr(v)} -> ${won(netKrw)} (환율: ${fx.usd}원, 수수료 ${(fxFeeRate()*100).toFixed(1)}%)`);
  update();
}

// 현재 잔고와 계좌 납입한도로 살 수 있는 최대 수량(수수료 포함)입니다.
function maxBuyQty(s){
  if(!s || !(+s.price>0)) return 0;
  const unit=+s.price*(1+stockFeeRate());
  if(!(unit>0)) return 0;
  const foreign=isForeignStock(s), balance=foreign?(+state.usd||0):(+state.cash||0);
  let max=Math.max(0,Math.floor(balance/unit));
  const room=taxContributionRoom(state.tax.mode);
  if(Number.isFinite(room)) max=Math.min(max,Math.max(0,Math.floor(room/(s.price*(foreign?fx.usd:1)))));
  return max;
}
// 같은 종목 카드가 국내·관심 화면에 동시에 있을 수 있어 화면(context)별로 수량 칸을 구분합니다.
function qtyInputId(id,ctx){ return "qty-"+id+(ctx?"-"+ctx:""); }
// 카드의 좁은 칸에서도 큰 수량이 보기 좋게 한 줄에 들어가도록 만 단위로 줄입니다.
function qtyText(n){
  const v=Math.max(0,Math.floor(+n||0));
  if(v>=10000){
    const man=v/10000;
    return `${man>=100?man.toFixed(0):man.toFixed(1).replace(/\.0$/,"")}만주`;
  }
  return v.toLocaleString("ko-KR")+"주";
}
function tradeQtyValue(id,ctx){
  const el=$(qtyInputId(id,ctx));
  const raw=(el && el.value!==undefined)?el.value:1;
  return Math.floor(+raw||0);
}
// 카드의 수량 칸을 1주·최대 매수·보유 전량으로 채웁니다(바로 주문하지는 않음).
function setTradeQty(id,mode,ctx){
  const s=stock(id), el=$(qtyInputId(id,ctx)); if(!s||!el) return;
  let q=1;
  if(mode==="max") q=Math.max(1,maxBuyQty(s));
  else if(mode==="own") q=Math.max(1,accountQty(s,state.tax.mode));
  el.value=String(q);
  return q;
}
// 카드에 입력한 수량만큼 매수합니다.
function buyQty(id,ctx){
  if(!checkMarketOpen()) return;
  const s=stock(id); if(!s) return;
  const qty=tradeQtyValue(id,ctx), acct=state.tax.mode;
  if(qty<=0) return alert("매수 수량을 1주 이상 입력해 주세요.");
  const max=maxBuyQty(s);
  if(max<=0) return alert(isForeignStock(s)?"수수료 포함 달러 잔고 또는 계좌 납입한도가 부족합니다.":"수수료 포함 현금 또는 계좌 납입한도가 부족합니다.");
  if(qty>max) return alert(`지금은 최대 ${max.toLocaleString("ko-KR")}주까지 매수할 수 있습니다.`);
  const cost=s.price*(1+stockFeeRate())*qty, principalKRW=s.price*qty*(isForeignStock(s)?fx.usd:1);
  if(!canTaxContribute(acct,principalKRW)) return alert(`${taxModeLabel(acct)} 연간 납입한도가 부족합니다.`);
  if(!confirmTrade("매수",`${s.name} ${qty.toLocaleString("ko-KR")}주 · ${isForeignStock(s)?usdStr(cost):won(cost)} · ${taxModeLabel(acct)}`)) return;

  addLog(`${s.name} ${qty.toLocaleString("ko-KR")}주 매수 (${isForeignStock(s)?usdStr(s.price):won(s.price)}, 수수료 포함 · ${taxModeLabel(acct)})`);

}

function join(id){
  if(!canJoin(id)) return alert(`${unlockLabel(id)}합니다. (현재 등급: ${currentGrade()})`);
  let p=product(id),v=Math.max(p.min,Math.floor((+$("prod-"+id).value||p.min)/10000)*10000);
  if(v>state.cash)return alert("현금이 부족합니다.");
  // 가입 시점 이율은 현금을 빼기 전 등급으로 확정합니다.
  // 현금을 먼저 빼면 총자산이 줄어 등급이 내려가고, 상위 등급 전용 상품(채권·ETF·연금)은 이율이 0으로 굳습니다.
  const bankEl=$("bank-"+id);
  const bank=BANKS.find(b=>b.id===(bankEl&&bankEl.value))||BANKS[0];
  if(p.amount===0){
    p.rate=gradeRateFor(id,currentGrade())*(bank.mult||1)*(1+((state.economy&&state.economy.rateAdj)||0));
    p.bank=bank.id; p.bankMult=bank.mult||1;
    p.startedAt=state.marketSeconds; p.matured=!(p.term>0);
  }
  state.cash-=v;
  p.amount+=v;
  markDex("products",id);
  addLog(`${p.name} 가입: ${won(v)} (${bank.name} 확정 연 ${(p.rate*100).toFixed(1)}%)`);
  bumpDaily("deposit");
  saveGame();
  update();
}

function leave(id){
  let p=product(id);
  if(p.amount<=0)return alert("해지할 금액이 없습니다.");
  // 만기 전 해지에는 원금의 0.5% 중도해지 페널티를 적용합니다(파킹·ETF는 예외).
  const early=p.term>0 && p.startedAt!=null && !p.matured;
  const penalty=early?p.amount*0.005:0;
  if(early && !confirm(`${p.name}을(를) 만기 전에 해지하면 ${won(penalty)}의 페널티가 적용됩니다. 계속할까요?`)) return;
  state.cash+=p.amount-penalty;
  addLog(`${p.name} 해지: ${won(p.amount-penalty)} 회수${penalty?` (페널티 ${won(penalty)})`:""}`);
  p.amount=0; p.rate=0; p.startedAt=null; p.matured=false; p.bank=null;
  saveGame();
  update();
}

function tickSeconds() {
  state.marketSeconds++;
  tickTaxYear();
  
  // 3분(180초) 개장 후 1분(60초) 휴장 순환 시스템
  // 남은 시간 표시는 renderMarketBar가 현재 배속을 반영한 실제 초로 처리합니다.
  const cycleTime = state.marketSeconds % 240;
  if (cycleTime < 180) {
    if(!state.marketOpen) {
      state.marketOpen = true;
      addLog("📢 시장이 개장되었습니다! 주식 거래가 가능합니다.");
    }
  } else {
    if(state.marketOpen) {
      state.marketOpen = false;
      addLog("🔒 시장이 마감(휴장)되었습니다. 당분간 주식 거래가 제한됩니다.");
    }
  }
  renderMarketBar();

  // 이벤트 잔여 타이머 감소 처리
  if(state.currentEvent) {
    state.eventTimer--;
    if(state.eventTimer <= 0) {
      addLog(`클린업: '${state.currentEvent}' 대형 트렌드 시장 이벤트가 종료되었습니다.`);
      state.currentEvent = null;
    }
  }

  // 배당 지급·실적 캘린더·기업 공시·목표 판정
  if(state.marketSeconds % DIVIDEND_EVERY === 0) payDividends();
  tickCalendar();
  tickDisclosures();

  // 자산 추이 기록(15초 간격, 최근 45분)
  if(state.marketSeconds % 15 === 0){ recordAssetHistory(); recoverLaborCondition(); }

  if(state.marketSeconds % 5 === 0){
    checkGoals();
    checkAchievements();
    ensureDaily();
    tickChallenges();
  }
  // 자동 매매(익절/손절) → 매도가 없을 때만 자동 적립을 실행합니다.
  if(state.auto && state.auto.enabled && state.marketSeconds % Math.max(15,state.auto.every||60) === 0){
    autoRebalance();
    if(!autoSellRules()) autoInvest();
  }
}

function economicMarketBias(){
  const e=state.economy||{};
  const growth=Number.isFinite(+e.gdpGrowth)?+e.gdpGrowth:ECON_DEFAULT.gdpGrowth;
  const inflation=Number.isFinite(+e.inflation)?+e.inflation:ECON_DEFAULT.inflation;
  const unemployment=Number.isFinite(+e.unemployment)?+e.unemployment:ECON_DEFAULT.unemployment;
  const rate=Number.isFinite(+e.baseRate)?+e.baseRate:ECON_DEFAULT.baseRate;
  const phase=e.phase==="호황"?1:e.phase==="불황"?-1:0;
  // 성장률은 우호적, 물가·실업률·금리 상승은 할인율과 소비 위축으로 부정적입니다.
  return growth*.00015 + phase*.0002 - (inflation-ECON_DEFAULT.inflation)*.0003 - (unemployment-ECON_DEFAULT.unemployment)*.0015 - (rate-ECON_DEFAULT.baseRate)*.0005;
}
function tickMarket(){
  state.tick++;
  const dayIndex=marketDayIndex(state.marketSeconds);
  let marketR=null;
  stocks.forEach(s=>{
    const old=s.price;
    const newDay=(!Number.isFinite(s.dayIndex)) || s.dayIndex!==dayIndex;

    if(newDay){
      // 하루가 지나면 어제 종가에 새 변동률을 적용합니다(복리).
      const prev=(+s.price>0)?+s.price:(+s.start>0?s.start:1);
      s.prevClose=prev;
      s.dayIndex=dayIndex;
      s.volume=0; s.foreignFlow=0; s.instFlow=0;
      if(!isIndexFund(s)){
        if(marketR===null) marketR=dailyMarketReturn();
        s.dayRet=Math.max(-MAX_DAILY_MOVE,Math.min(MAX_DAILY_MOVE,dailyStockReturn(s, marketR)));
        s.price=clampDailyPrice(s, prev*(1+s.dayRet));
        s.dayRet=prev>0?(s.price-prev)/prev:0;
      }
      s.dayOpen=s.price;
      s.lastMove=(s.price-prev)/prev;
      s.hist.push(s.price); if(s.hist.length>60) s.hist.shift();
      if(isIndexFund(s)) return; // ETF는 아래 지수 추종 계산을 이어서 합니다.
      return;
    }

    if(isIndexFund(s)){
      // 지수 ETF는 랜덤워크 대신 시장 지수를 추종합니다(2X는 제곱, 인버스는 역수).
      const idx=marketIndex();
      const mult=Math.pow(idx/1000,s.indexPower);
      s.price=clampDailyPrice(s, Math.max(100,Math.min(1000000,Math.round(s.start*mult/100)*100)));
      s.dayRet=0;
    } else {
      // 장중: 오늘 시가로 되돌아가려는 힘 + 작은 잡음 + 대형 이벤트 온도
      // 저가주에서도 가격이 튀지 않도록 되돌림과 한 틱 변동 폭을 제한합니다.
      const noise=(Math.random()-.5)*s.vol*.55;
      const gap=(s.dayOpen-s.price)/Math.max(1,s.dayOpen);
      const pull=Math.max(-.02,Math.min(.02,gap*.06));
      let bias=0;
      if(state.currentEvent==="AI_BOOM"){ bias+=.0012; if(s.theme.includes("AI")||s.theme.includes("반도체")) bias+=.0028; }
      if(state.currentEvent==="SEMI_STRONG"){ bias+=.0008; if(s.theme.includes("반도체")) bias+=.0022; }
      if(state.currentEvent==="MARKET_CRASH") bias-=.0022;
      if(state.currentEvent==="BUBBLE_SHOCK") bias-=.0008;
      // 일중 거래량과 외국인·기관 순매수. 순매수 강도는 다음 틱 가격에 완만하게 반영됩니다.
      // 시드 기반 노이즈를 써서 수급 계산이 시장 가격의 난수 흐름을 소비하지 않게 합니다.
      let hash=2166136261;
      const key=s.id+"|"+state.tick;
      for(let hi=0;hi<key.length;hi++){ hash^=key.charCodeAt(hi); hash=Math.imul(hash,16777619); }
      const n1=((hash>>>0)%1000)/1000, n2=((Math.imul(hash,31)>>>0)%1000)/1000, n3=((Math.imul(hash,97)>>>0)%1000)/1000;
      const turnover=Math.max(1,Math.round((Math.max(1,s.revenue)/Math.max(1,stockPriceKRW(s)))*0.00055*(0.55+n1)));
      const foreignNet=Math.round(turnover*((n2-.5)*0.9));
      const instNet=Math.round(turnover*((n3-.5)*0.8));
      s.volume+=turnover; s.foreignFlow+=foreignNet; s.instFlow+=instNet;
      bias+=Math.max(-.0018,Math.min(.0018,(foreignNet+instNet)/Math.max(1,turnover)*.0022));
      const step=Math.max(-.25,Math.min(.25,noise+pull+bias));
      s.price=clampDailyPrice(s, s.price*(1+step));
    }
    s.lastMove=(s.price-old)/old;
    s.hist.push(s.price);
    if(s.hist.length > 60) s.hist.shift();
  });
  checkShortMargins();
  tickIPO();
  processOrders();
  update();
}

function marketEventsAndNews() {
  // 15% 확률로 시장 빅 트렌드 이벤트 발생
  if(!state.currentEvent && Math.random() < 0.15) {
    const evs = ["AI_BOOM", "SEMI_STRONG", "FX_SURGE", "FX_CRASH", "MARKET_CRASH", "BUBBLE_SHOCK"];
    state.currentEvent = evs[Math.floor(Math.random() * evs.length)];
    state.eventTimer = 25 + Math.floor(Math.random() * 35); // 25~60초간 지속

    if(state.currentEvent === "SEMI_STRONG") evText = "🛠️ 전세계 반도체 공급 부족 심화! 반도체 생산 공급망 테마군에 자금이 집중됩니다.";
    if(state.currentEvent === "FX_SURGE") evText = "🇺🇸 달러 자본 독주 체제 가동으로 원/달러 환율이 급격한 변동성을 동반하여 요동칩니다.";
    if(state.currentEvent === "FX_CRASH") evText = "💵 달러 약세 전환으로 원/달러 환율이 급락하고 있습니다.";
    if(state.currentEvent === "MARKET_CRASH") evText = "📉 긴축 공포 확산! 글로벌 거시 경제 위기로 시장 전체 자산군에 무차별 폭락 쇼크가 몰아칩니다.";
    if(state.currentEvent === "BUBBLE_SHOCK") evText = "⚠️ 고점 과열 지적에 따른 차익 실현 버블 조정 구간 진입. 시장 변동성이 극대화됩니다.";
    
    publishBreakingNews("🌟 대형 경제 기류 발생", evText);

    // 속보 내용이 실제 가격에 반영되도록 관련 종목에 즉시 충격을 줍니다.
    if(state.currentEvent === "SEMI_STRONG"){
      stocks.filter(s=>s.theme.includes("반도체")).forEach(s=>applyShock(s, 0.02+Math.random()*0.03));
    }
    if(state.currentEvent === "AI_BOOM"){
      // 호황은 시장 전체를 조금씩 올리고, AI·반도체 테마는 더 크게 올립니다.
      stocks.forEach(s=>applyShock(s, 0.01+Math.random()*0.01));
      stocks.filter(s=>s.theme.includes("AI")||s.theme.includes("반도체")).forEach(s=>applyShock(s, 0.02+Math.random()*0.03));
    }
    if(state.currentEvent === "MARKET_CRASH"){
      stocks.forEach(s=>applyShock(s, -(0.02+Math.random()*0.03)));
    }
    if(state.currentEvent === "BUBBLE_SHOCK"){
      stocks.forEach(s=>applyShock(s, -(0.015+Math.random()*0.025)));
    }
    if(state.currentEvent === "FX_SURGE"){
      fx.usd = Math.round(fx.usd * 1.03);
    }
    if(state.currentEvent === "FX_CRASH"){
      fx.usd = Math.round(fx.usd * 0.97);
    }
    return;
  }

  // 일반 종목 속보 뉴스 생성
  if(stocks.length === 0) return;
  let sorted=[...stocks].sort((a,b)=>Math.abs(dayChangePct(b))-Math.abs(dayChangePct(a)));
  let s=sorted[0];
  if(!s) return;
  let up=dayChangePct(s)>=0;
  let reasons=up?["공격적인 분기 실적 기대감이 커지며","해외 기관들의 대규모 순매수세가 포착되며","신규 특허 취득 및 상용화 파트너십 소식에","장기 공급 계약 모멘텀이 시장에서 조명받으며"]:["고점 돌파 실패에 따른 실망 매물이 가중되며","단기 변동성 오버슈팅에 의한 매도세 유출로","일부 루머성 악재 지적에 거래 심리가 냉각되며","해외 거시 리스크 부담이 반영되며"];
  // 속보 내용이 실제 가격에도 반영되도록 같은 방향으로 소폭 충격을 가합니다.
  applyShock(s, (up?1:-1) * (0.004 + Math.random()*0.012));
  let text=`${s.name} (${s.ticker}) 측은 ${reasons[Math.floor(Math.random()*reasons.length)]} 전일 대비 ${pct(dayChangePct(s))} ${up?"상승":"하락"} 흐름을 연출 중입니다.`;
  publishBreakingNews("시황 속보", text);
}

let breakingShownAt=0; // 시황 속보 배너를 마지막으로 띄운 시각(실시간)
function publishBreakingNews(title, text){
  let fullText = `[${title}] ${text}`;
  state.news.unshift(fullText);
  state.news=state.news.slice(0,25); // 뉴스 목록에는 항상 쌓아 둡니다(최대 25개).

  // 배너만 알림 설정을 따릅니다. 꺼도 뉴스 탭 기록은 그대로 남습니다.
  const n=state.notify||{};
  const gap=Math.max(0,Math.min(600,Math.round(+n.newsGap||0)));
  const now=Date.now();
  const tooSoon=gap>0 && breakingShownAt>0 && now-breakingShownAt < gap*1000;
  const bannerOn=(n.master!==true) && n.news!==false && !tooSoon;
  const box=bannerOn?$("breaking"):null;
  if(box){
    breakingShownAt=now;
    box.innerHTML=`<b>${title}</b> ${text}`;
    box.classList.add("show");
    setTimeout(()=>box.classList.remove("show"),5500);
  }
  if(activePage()==="news") news();
}
// 토스트 숫자 설정(표시 시간·동시 개수)을 범위 안에서 저장합니다.
function setNotifyNum(k,v){
  if(!state.notify || typeof state.notify!=="object") state.notify=Object.assign({},NOTIFY_DEFAULT);
  const n=Math.round(+v);
  if(k==="toastMs") state.notify.toastMs=Number.isFinite(n)?Math.max(2000,Math.min(8000,n)):4200;
  else if(k==="toastMax") state.notify.toastMax=Number.isFinite(n)?Math.max(1,Math.min(5,n)):3;
  saveGame();
  try{ if(activePage()==="settings") settingsPage(); }catch(e){}
}
// 시황 속보 배너의 최소 표시 간격(초). 0이면 제한 없이 매번 표시합니다.
function setNotifyGap(v){
  if(!state.notify || typeof state.notify!=="object") state.notify=Object.assign({},NOTIFY_DEFAULT);
  state.notify.newsGap=Math.max(0,Math.min(600,Math.round(+v||0)));
  saveGame();
  try{ if(activePage()==="settings") settingsPage(); }catch(e){}
}

function interest(){
  const depositBonus=rebirthBonus("deposit",.03);
  products.forEach(p=>{
    if(p.amount > 0) {
      let principal = p.amount;
      let effectiveAmount = principal;
      
      // 적금 몰빵 방지 및 구간 효율 저하 밸런싱 (3000만원 초과 분은 이자율 절반 감소)
      if(principal > 30000000) {
        let excess = principal - 30000000;
        effectiveAmount = 30000000 + (excess * 0.5);
      }
      // 3억원을 넘는 예금은 이자 계산 기준 원금을 3억원으로 제한합니다.
      effectiveAmount = Math.min(MAX_EFFECTIVE_DEPOSIT, effectiveAmount);
      
      // 15초 단위 반영 스케일: 연이율 × 0.015 (예금 4.2% → 15초당 0.063%, 시간당 약 +16%)
      let calculatedInterest = effectiveAmount * (p.rate * depositBonus * 0.015);
      p.amount += calculatedInterest;
    }
  });

  // 만기 보너스: 가입 시점부터 term초가 지나면 한 번만 지급합니다.
  products.forEach(p=>{
    if(p.amount>0 && p.term>0 && p.startedAt!=null && !p.matured && state.marketSeconds-p.startedAt>=p.term){
      const bonus=p.amount*(p.bonus||0);
      p.amount+=bonus; p.matured=true;
      addLog(`🎁 만기 보너스: ${p.name} +${won(bonus)}`);
      notify("maturity","만기 보너스",`${p.name} +${won(bonus)}`);
    }
  });

  // 금리연동 채권 이자(15초): 액면가 기준 연 3.6%
  const bond=ensureBonds();
  if(bond.qty>0) state.cash += bond.qty*BOND.face*BOND.coupon*0.015;

  // 대출 이자(15초 단위): 연이율 × 0.015, 현금이 부족하면 대출 잔액에 가산
  if(state.loan > 0) {
    let loanInterest = state.loan * ((state.loanRate || 0) * 0.015);
    if(state.cash >= loanInterest) state.cash -= loanInterest;
    else {
      state.loan += loanInterest - state.cash; state.cash = 0;
      notify("loan","대출 이자 증가","현금이 부족해 이자가 대출 잔액에 더해졌습니다.");
    }
  }
  
  update();
}

function update(){
  // 모든 화면이 같은 총자산 계산을 쓰도록 한 곳으로 통일했습니다.
  let svWon=stockValueKRW();
  let pv=productValueKRW();

  $("cash").textContent=won(state.cash);
  let u=$("usdCash");if(u)u.textContent=usdStr(state.usd||0);
  $("stockValue").textContent=won(svWon);
  $("productValue").textContent=won(pv);
  $("totalValue").textContent=won(totalAssetsKRW());
  updateMarketDayBar();
  updateIPOUI();

  stocks.forEach(s=>{
    let c=(s.price-s.start)/s.start;
    // 오늘 변동률은 전일 종가 대비입니다(장 마감 뒤 새 변동률이 적용되므로 다음 날 기준가가 됩니다).
    const dayC=dayChangePct(s);
    const isForeign = ["foreign","mega","special"].includes(s.group);
    // 관심종목 페이지 등 같은 종목 카드가 여러 곳에 있을 수 있어 전부 갱신합니다.
    document.querySelectorAll(`[data-price="${s.id}"]`).forEach(pe=>{
      pe.textContent=isForeign ? usdStr(s.price) : won(s.price);
      pe.className="price "+(dayC>=0?"up":"down");
    });
    document.querySelectorAll(`[data-change="${s.id}"]`).forEach(ce=>{
      ce.textContent="시작가 대비 "+pct(c)+" · 오늘 "+pct(dayC);
      ce.className=dayC>=0?"up":"down";
    });
    document.querySelectorAll(`[data-avg="${s.id}"]`).forEach(ae=>{
      ae.textContent = s.own > 0 ? (isForeign ? usdStr(s.avgBuy) : won(s.avgBuy)) : "-";
    });
    document.querySelectorAll(`[data-roipct="${s.id}"]`).forEach(re=>{
      if(s.own > 0 && s.avgBuy > 0) {
        const currentRoi = (s.price - s.avgBuy) / s.avgBuy;
        re.textContent = pct(currentRoi);
        re.className = currentRoi >= 0 ? "up" : "down";
      } else {
        re.textContent = "0%";
        re.className = "";
      }
    });
    document.querySelectorAll(`[data-own="${s.id}"]`).forEach(el=>{ el.textContent=qtyText(s.own); });
    document.querySelectorAll(`[data-volume="${s.id}"]`).forEach(el=>{ el.textContent=volumeText(s.volume); });
    document.querySelectorAll(`[data-foreign="${s.id}"]`).forEach(el=>{ el.textContent=flowText(s.foreignFlow); el.className=s.foreignFlow>=0?"up":"down"; });
    document.querySelectorAll(`[data-inst="${s.id}"]`).forEach(el=>{ el.textContent=flowText(s.instFlow); el.className=s.instFlow>=0?"up":"down"; });
    document.querySelectorAll(`[data-maxbuy="${s.id}"]`).forEach(mb=>{
      mb.textContent=qtyText(maxBuyQty(s));
    });
    document.querySelectorAll(`[data-maxsell="${s.id}"]`).forEach(ms=>{ ms.textContent=qtyText(s.own); });
    document.querySelectorAll(`[data-hold-value="${s.id}"]`).forEach(he=>{ he.textContent=won(stockPriceKRW(s)*Math.max(0,+s.own||0)); });
    document.querySelectorAll(`[data-hold-pnl="${s.id}"]`).forEach(he=>{
      const cost=(+s.avgBuy||0)*(+s.own||0)*(isForeign?fx.usd:1);
      const pnl=stockPriceKRW(s)*(+s.own||0)-cost;
      he.textContent=(pnl>=0?"+":"")+won(pnl);
      he.className=pnl>=0?"up":"down";
    });
    document.querySelectorAll(`[data-spark="${s.id}"]`).forEach(sp=>{
      // 마우스로 가격을 보고 있는 동안에는 툴팁이 지워지지 않게 갱신을 잠시 건너뜁니다.
      if(typeof sp.matches==="function" && sp.matches(":hover")) return;
      sp.innerHTML=sparklineHTML(s);
    });
  });

  products.forEach(p=>{
    let e=document.querySelector(`[data-prod="${p.id}"]`);
    if(e)e.textContent=won(p.amount);
    let le=document.querySelector(`[data-locked="${p.id}"]`);
    if(le)le.textContent=p.rate>0 ? `연 ${(p.rate*100).toFixed(1)}%` : "미가입";
  });

  // 금융 화면에서는 배너·해금 상태만 갱신해 입력 중인 금액을 보존합니다.
  if(activePage()==="banking") refreshBankingState();

  state.peakNet=Math.max(state.peakNet||0,totalAssetsKRW());
  const bn=$("bottomNet");
  if(bn) bn.textContent=wonShort(totalAssetsKRW());
  const sg=$("sideGrade"); if(sg) sg.textContent=currentGrade();
  refreshLaborUI();

  const grade=currentGrade();
  if(state.lastGrade && state.lastGrade!==grade) notify("grade","등급 변동",`${state.lastGrade} → ${grade}`);
  state.lastGrade=grade;
  const rb=ensureRebirth();
  if(!rb.notified && canRebirth()){ rb.notified=true; notify("rebirth","환생 가능",`순자산 ${wonShort(totalAssetsKRW())} · 환생 화면에서 영구 업그레이드를 확인하세요.`); saveGame(); }

  // 입력·클릭 중에는 다시 그리지 않습니다(5초마다 재렌더로 입력이 끊기는 문제 방지).
  const livePage=activePage();
  if(["portfolio","dashboard","realestate","company","economy"].includes(livePage)){
    const pf=document.getElementById(livePage);
    const hovered=pf && typeof pf.matches==="function" && pf.matches(":hover");
    const focused=pf && document.activeElement && typeof pf.contains==="function" && pf.contains(document.activeElement);
    if(!hovered && !focused){
      if(livePage==="portfolio") portfolio();
      else if(livePage==="dashboard") dashboardPage();
      else if(livePage==="realestate") realestatePage();
      else if(livePage==="company") companyPage();
      else if(livePage==="economy") economyPage();
    }
  }
}

init();

// 노동 미니게임은 스페이스·엔터로도 멈출 수 있습니다(버튼에 포커스가 있을 때는 기본 클릭에 맡깁니다).
if(typeof document!=="undefined" && typeof document.addEventListener==="function"){
  document.addEventListener("keydown",e=>{
    if(!laborSession) return;
    const tag=e.target&&e.target.tagName?String(e.target.tagName).toUpperCase():"";
    if(tag==="BUTTON"||tag==="INPUT"||tag==="SELECT"||tag==="TEXTAREA") return;
    if(e.key===" "||e.key==="Enter"){ e.preventDefault(); laborStop(); }
  });
}
</script>
