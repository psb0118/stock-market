function setPriceAlert(id){
  const s=stock(id); if(!s) return false;
  const priceEl=$("alert-price"), dirEl=$("alert-dir");
  const p=Math.round(+((priceEl&&priceEl.value)||0));
  if(!(p>0)) return alert("가격을 1 이상으로 입력해 주세요.");
  const dir=(dirEl&&dirEl.value)==="below"?"below":"above";
  state.priceAlerts=(state.priceAlerts||[]).filter(a=>a.stockId!==id);
  state.priceAlerts.push({stockId:id,price:p,dir,armed:true});
  saveGame(); closeModal();
  notify("system","가격 알림 설정",`${s.name} ${dir==="above"?">=":"<="} ${isForeignStock(s)?usdStr(p):won(p)}`);
  return true;
}
function removePriceAlert(id){
  state.priceAlerts=(state.priceAlerts||[]).filter(a=>a.stockId!==id);
  saveGame(); closeModal();
  notify("system","가격 알림 삭제","설정한 알림을 삭제했습니다.");
  return true;
}
// 가격이 목표에 닿으면 1회 알림을 보내고 다시 무장하지 않습니다(알림 폭주 방지).
function checkPriceAlerts(){
  if(!Array.isArray(state.priceAlerts)||!state.priceAlerts.length) return 0;
  let hit=0;
  state.priceAlerts.forEach(a=>{
    if(!a.armed) return;
    const s=stock(a.stockId); if(!s) return;
    const reached=a.dir==="above"?s.price>=a.price:s.price<=a.price;
    if(!reached) return;
    a.armed=false; hit++;
    const foreign=isForeignStock(s);
    addLog(`🔔 가격 알림: ${s.name} ${foreign?usdStr(s.price):won(s.price)} (${a.dir==="above"?">=":"<="} ${foreign?usdStr(a.price):won(a.price)})`);
    notify("system","가격 알림",`${s.name} ${foreign?usdStr(s.price):won(s.price)} · 설정 ${a.dir==="above"?">=":"<="} ${foreign?usdStr(a.price):won(a.price)}`);
  });
  if(hit) saveGame();
  return hit;
}
// 관심종목(또는 현재 그룹)을 최대 6종목까지 한 표에서 비교합니다.
function openCompare(group){
  const base=group==="watch"?stocks.filter(s=>isWatched(s.id)):stocks.filter(s=>s.group===group);
  const pool=(base.length>=2?base:stocks.filter(s=>!isIndexFund(s))).slice(0,6);
  const rows=pool.map(s=>{
    const foreign=isForeignStock(s);
    const first=(s.hist&&s.hist.length)?s.hist[0]:s.start;
    const long=first>0?(s.price-first)/first:0;
    const day=dayChangePct(s);
    return `<tr><td>${escHtml(s.name)}<br><small>${s.ticker}</small></td><td>${foreign?usdStr(s.price):won(s.price)}</td><td class="${day>=0?"up":"down"}">${pct(day)}</td><td class="${long>=0?"up":"down"}">${pct(long)}</td><td>${(s.vol*100).toFixed(1)}%</td><td>${qtyText(s.own)}</td></tr>`;
  }).join("");
  openModal("종목 비교", `<div class="compare-wrap"><table class="compare-table"><thead><tr><th>종목</th><th>현재가</th><th>오늘</th><th>차트 구간</th><th>일 변동성</th><th>보유</th></tr></thead><tbody>${rows}</tbody></table></div><p class="muted-sm" style="margin-top:8px">차트 구간은 최근 가격 기록의 시작 대비입니다. 관심종목이 2개 이상이면 관심종목을, 아니면 현재 화면 종목을 비교합니다(최대 6종목).</p>`);
}

// ── CSV 내보내기 ────────────────────────────────────────────
// Excel·구글 시트는 =,+,-,@,탭,CR로 시작하는 셀을 수식으로 실행합니다.
// 저장 파일에서 온 종목명·메모 같은 문자열은 앞에 '를 붙여 글자로 고정하고, 숫자는 그대로 둡니다.
function csvFormulaSafe(s){ const t=s.replace(/^[\t\r\n]+/,""); return /^[=+\-@]/.test(t) && !/^-?\d+(?:\.\d+)?$/.test(t) ? "'"+t : s; }
function csvCell(v){ const s=csvFormulaSafe(String(v==null?"":v)); return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }
function downloadCsv(filename, rows){
  const csv="\ufeff"+rows.map(r=>r.map(csvCell).join(",")).join("\r\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}
function exportCsv(kind){
  const date=new Date().toISOString().slice(0,10);
  if(kind==="journal"){
    const rows=[["시각","구분","종목","수량","금액(원)","수수료(원)","실현손익(원)"]];
    (state.journal||[]).forEach(x=>rows.push([new Date(x.at).toLocaleString("ko-KR"),x.side==="buy"?"매수":"매도",x.name,x.qty,Math.round(x.valueKRW||0),Math.round(x.fee||0),Math.round(x.profit||0)]));
    downloadCsv(`money-playground-journal-${date}.csv`,rows);
  } else if(kind==="holdings"){
    const rows=[["종목","티커","보유수량","평단(원)","현재가(원)","평가액(원)","평가손익(원)"]];
    stocks.filter(s=>s.own>0).forEach(s=>{
      const value=stockPriceKRW(s)*s.own, cost=(+s.avgBuy||0)*s.own*(isForeignStock(s)?fx.usd:1);
      rows.push([s.name,s.ticker,s.own,Math.round(s.avgBuy||0),Math.round(stockPriceKRW(s)),Math.round(value),Math.round(value-cost)]);
    });
    downloadCsv(`money-playground-holdings-${date}.csv`,rows);
  } else {
    const rows=[["게임 일차","게임 시간(초)","순자산(원)"]];
    (assetHistory.points||[]).forEach(p=>rows.push([Math.floor((+p.t||0)/600)+1,Math.round(+p.t||0),Math.round(+p.v||0)]));
    downloadCsv(`money-playground-assets-${date}.csv`,rows);
  }
  addLog("CSV를 내보냈습니다.");
  notify("system","CSV 내보내기","파일을 내려받았습니다.");
}

function join(id){
  if(!canJoin(id)) return alert(`${unlockLabel(id)}합니다. (현재 등급: ${currentGrade()})`);
  let p=product(id),v=Math.max(p.min,Math.floor((+$("prod-"+id).value||p.min)/10000)*10000);
  if(v>state.cash)return alert("현금이 부족합니다.");
  // 가입 시점 이율은 현금을 빼기 전 등급으로 확정합니다.
  // 현금을 먼저 빼면 총자산이 줄어 등급이 내려가고, 상위 등급 전용 상품(채권·ETF·연금)은 이율이 0으로 굳습니다.
  const bankEl=$("bank-"+id);
  const bank=BANKS.find(b=>b.id===(bankEl&&bankEl.value))||BANKS[0];
  if(p.amount===0){
    p.rate=gradeRateFor(id,currentGrade())*(bank.mult||1)*(1+((state.economy&&state.economy.rateAdj)||0));
    p.bank=bank.id; p.bankMult=bank.mult||1;
    p.startedAt=state.marketSeconds; p.matured=!(p.term>0);
  }
  state.cash-=v;
  p.amount+=v;
  markDex("products",id);
  addLog(`${p.name} 가입: ${won(v)} (${bank.name} 확정 연 ${(p.rate*100).toFixed(1)}%)`);
  bumpDaily("deposit");
  saveGame();
  update();
}

function leave(id){
  let p=product(id);
  if(p.amount<=0)return alert("해지할 금액이 없습니다.");
  // 만기 전 해지에는 원금의 0.5% 중도해지 페널티를 적용합니다(파킹·ETF는 예외).
  const early=p.term>0 && p.startedAt!=null && !p.matured;
  const penalty=early?p.amount*0.005:0;
  if(early && !confirm(`${p.name}을(를) 만기 전에 해지하면 ${won(penalty)}의 페널티가 적용됩니다. 계속할까요?`)) return;
  state.cash+=p.amount-penalty;
  addLog(`${p.name} 해지: ${won(p.amount-penalty)} 회수${penalty?` (페널티 ${won(penalty)})`:""}`);
  p.amount=0; p.rate=0; p.startedAt=null; p.matured=false; p.bank=null;
  saveGame();
  update();
}

function tickSeconds() {
  state.marketSeconds++;
  tickTaxYear();
  
  // 3분(180초) 개장 후 1분(60초) 휴장 순환 시스템
  // 남은 시간 표시는 renderMarketBar가 현재 배속을 반영한 실제 초로 처리합니다.
  const cycleTime = state.marketSeconds % 240;
  if (cycleTime < 180) {
    if(!state.marketOpen) {
      state.marketOpen = true;
      addLog("📢 시장이 개장되었습니다! 주식 거래가 가능합니다.");
    }
  } else {
    if(state.marketOpen) {
      state.marketOpen = false;
      addLog("🔒 시장이 마감(휴장)되었습니다. 당분간 주식 거래가 제한됩니다.");
    }
  }
  renderMarketBar();

  // 이벤트 잔여 타이머 감소 처리
  if(state.currentEvent) {
    state.eventTimer--;
    if(state.eventTimer <= 0) {
      addLog(`클린업: '${state.currentEvent}' 대형 트렌드 시장 이벤트가 종료되었습니다.`);
      state.currentEvent = null;
    }
  }

  // 배당 지급·실적 캘린더·기업 공시·목표 판정
  if(state.marketSeconds % DIVIDEND_EVERY === 0) payDividends();
  // 후반 밸런스: 60초마다 고액 자산 관리 수수료를 현금에서 차감합니다(현금 부족 시 0원까지만).
  if(state.marketSeconds % 60 === 0) chargeWealthFee();
  tickCalendar();
  tickDisclosures();

  // 자산 추이 기록(15초 간격, 최근 45분)
  if(state.marketSeconds % 15 === 0){ recordAssetHistory(); recoverLaborCondition(); }

  if(state.marketSeconds % 5 === 0){
    checkGoals();
    checkAchievements();
    ensureDaily();
    tickChallenges();
  }
  // 자동 매매(익절/손절) → 매도가 없을 때만 자동 적립을 실행합니다.
  if(state.auto && state.auto.enabled && state.marketSeconds % Math.max(15,state.auto.every||60) === 0){
    autoRebalance();
    if(!autoSellRules()) autoInvest();
  }
}

function tickMarket(){
  state.tick++;
  const dayIndex=marketDayIndex(state.marketSeconds);
  let marketR=null, dayRolled=false;
  stocks.forEach(s=>{
    const old=s.price;
    const newDay=(!Number.isFinite(s.dayIndex)) || s.dayIndex!==dayIndex;

    if(newDay){
      // 하루가 지나면 어제 종가에 새 변동률을 적용합니다(복리).
      dayRolled=true;
      const prev=(+s.price>0)?+s.price:(+s.start>0?s.start:1);
      s.prevClose=prev;
      s.dayIndex=dayIndex;
      s.volume=0; s.foreignFlow=0; s.instFlow=0;
      if(!isIndexFund(s)){
        if(marketR===null) marketR=dailyMarketReturn();
        s.dayRet=Math.max(-MAX_DAILY_LOSS,Math.min(MAX_DAILY_GAIN,dailyStockReturn(s, marketR)));
        s.price=clampDailyPrice(s, prev*(1+s.dayRet));
        s.dayRet=prev>0?(s.price-prev)/prev:0;
      }
      s.dayOpen=s.price;
      s.lastMove=(s.price-prev)/prev;
      s.hist.push(s.price); if(s.hist.length>240) s.hist.shift();
      if(isIndexFund(s)) return; // ETF는 아래 지수 추종 계산을 이어서 합니다.
      return;
    }

    if(isIndexFund(s)){
      // 지수 ETF는 랜덤워크 대신 시장 지수를 추종합니다(2X는 제곱, 인버스는 역수).
      const idx=marketIndex();
      const mult=Math.pow(idx/1000,s.indexPower);
      s.price=clampDailyPrice(s, Math.max(100,Math.min(1000000,Math.round(s.start*mult/100)*100)));
      s.dayRet=0;
    } else {
      // 장중: 오늘 시가로 되돌아가려는 힘 + 작은 잡음 + 대형 이벤트 온도
      // 저가주에서도 가격이 튀지 않도록 되돌림과 한 틱 변동 폭을 제한합니다.
      const noise=(worldTickRand("intra",s.id)-.5)*s.vol*.35;
      const gap=(s.dayOpen-s.price)/Math.max(1,s.dayOpen);
      const pull=Math.max(-.02,Math.min(.02,gap*.06));
      let bias=0;
      // 이벤트 편향은 상승/하락을 같은 크기로 맞춥니다. 하락 쪽만 크면 장기적으로
      // 시장 전체가 조용히 하락해(모두가 손해) 투자할 재미가 사라집니다.
      if(state.currentEvent==="AI_BOOM"){ bias+=.0012; if(s.theme.includes("AI")||s.theme.includes("반도체")) bias+=.0028; }
      if(state.currentEvent==="SEMI_STRONG"){ bias+=.0010; if(s.theme.includes("반도체")) bias+=.0024; }
      if(state.currentEvent==="MARKET_CRASH") bias-=.0012;
      if(state.currentEvent==="BUBBLE_SHOCK") bias-=.0006;
      // 일중 거래량과 외국인·기관 순매수. 순매수 강도는 다음 틱 가격에 완만하게 반영됩니다.
      // 시드 기반 노이즈를 써서 수급 계산이 시장 가격의 난수 흐름을 소비하지 않게 합니다.
      let hash=2166136261;
      const key=s.id+"|"+state.tick;
      for(let hi=0;hi<key.length;hi++){ hash^=key.charCodeAt(hi); hash=Math.imul(hash,16777619); }
      const n1=((hash>>>0)%1000)/1000, n2=((Math.imul(hash,31)>>>0)%1000)/1000, n3=((Math.imul(hash,97)>>>0)%1000)/1000;
      const turnover=Math.max(1,Math.round((Math.max(1,s.revenue)/Math.max(1,stockPriceKRW(s)))*0.00055*(0.55+n1)));
      const foreignNet=Math.round(turnover*((n2-.5)*0.9));
      const instNet=Math.round(turnover*((n3-.5)*0.8));
      s.volume+=turnover; s.foreignFlow+=foreignNet; s.instFlow+=instNet;
      bias+=Math.max(-.0018,Math.min(.0018,(foreignNet+instNet)/Math.max(1,turnover)*.0022));
      const step=Math.max(-.25,Math.min(.25,noise+pull+bias));
      s.price=clampDailyPrice(s, s.price*(1+step));
    }
    s.lastMove=(s.price-old)/old;
    s.hist.push(s.price);
    if(s.hist.length > 240) s.hist.shift();
  });
  if(dayRolled) ensureDailyBreadth(dayIndex);
  checkShortMargins();
  // 오프라인 재생 중에는 화면이 없으므로 렌더·알림을 건너뜁니다(가격 계산에는 영향 없음).
  if(!OFFLINE_REPLAY) checkPriceAlerts();
  tickIPO();
  processOrders();
  if(!OFFLINE_REPLAY) update();
}
// 시장 전체가 같은 방향으로만 움직이면 게임이 단조로워지므로, 새 날에 모든
// 종목이 하락한 경우 일부 종목은 당일 흐름을 소폭 반등시킵니다(최소 1종목 보장).
function ensureDailyBreadth(dayIndex){
  const list=stocks.filter(s=>!isIndexFund(s));
  if(list.length<3 || !list.every(s=>s.dayRet<0)) return;
  let changed=0;
  list.forEach((s,i)=>{
    if((i+dayIndex)%4!==0) return;
    const prev=(+s.prevClose>0)?+s.prevClose:s.price;
    const ret=Math.max(.005,Math.min(MAX_DAILY_GAIN,Math.abs(s.dayRet||0)*.25));
    const p=clampDailyPrice(s,prev*(1+ret));
    if(!(p>prev)) return;
    s.price=p;
    s.dayRet=(p-prev)/prev;
    s.dayOpen=p;
    s.lastMove=s.dayRet;
    if(s.hist && s.hist.length) s.hist[s.hist.length-1]=p;
    changed++;
  });
  if(changed) return;
  const s=list.find(x=>x.price<stockPriceBounds(x).hi-0.001);
  if(!s) return;
  const prev=(+s.prevClose>0)?+s.prevClose:s.price;
  const p=clampDailyPrice(s,prev*(1+.01));
  s.price=p;
  s.dayRet=prev>0?(p-prev)/prev:0;
  s.dayOpen=p;
  s.lastMove=s.dayRet;
  if(s.hist && s.hist.length) s.hist[s.hist.length-1]=p;
}

function marketEventsAndNews() {
  // 이벤트·속보도 같은 게임 시각이면 모두 같은 내용이 나오도록 공용 난수를 씁니다.
  const wr=k=>worldTickRand("news",k);
  // 15% 확률로 시장 빅 트렌드 이벤트 발생
  if(!state.currentEvent && wr(1) < 0.15) {
    const evs = ["AI_BOOM", "SEMI_STRONG", "FX_SURGE", "FX_CRASH", "MARKET_CRASH", "BUBBLE_SHOCK"];
    state.currentEvent = evs[Math.floor(wr(2) * evs.length)];
    state.eventTimer = 25 + Math.floor(wr(3) * 35); // 25~60초간 지속
    
    let evText = "";
    if(state.currentEvent === "AI_BOOM") evText = "🔥 초거대 글로벌 인공지능 호황기가 도래하며 관련 테마주가 유례없는 초강세를 보입니다!";
    if(state.currentEvent === "SEMI_STRONG") evText = "🛠️ 전세계 반도체 공급 부족 심화! 반도체 생산 공급망 테마군에 자금이 집중됩니다.";
    if(state.currentEvent === "FX_SURGE") evText = "🇺🇸 달러 자본 독주 체제 가동으로 원/달러 환율이 급격한 변동성을 동반하여 요동칩니다.";
    if(state.currentEvent === "FX_CRASH") evText = "💵 달러 약세 전환으로 원/달러 환율이 급락하고 있습니다.";
    if(state.currentEvent === "MARKET_CRASH") evText = "📉 긴축 공포 확산! 글로벌 거시 경제 위기로 시장 전체 자산군에 무차별 폭락 쇼크가 몰아칩니다.";
    if(state.currentEvent === "BUBBLE_SHOCK") evText = "⚠️ 고점 과열 지적에 따른 차익 실현 버블 조정 구간 진입. 시장 변동성이 극대화됩니다.";
    
    publishBreakingNews("🌟 대형 경제 기류 발생", evText);

    // 속보 내용이 실제 가격에 반영되도록 관련 종목에 즉시 충격을 줍니다.
    if(!state.currentEvent) return;
    if(state.currentEvent === "SEMI_STRONG"){
      stocks.filter(s=>s.theme.includes("반도체")).forEach((s,i)=>applyShock(s, 0.02+wr(10+i)*0.03));
    }
    if(state.currentEvent === "AI_BOOM"){
      // 호황은 시장 전체를 조금씩 올리고, AI·반도체 테마는 더 크게 올립니다.
      stocks.forEach((s,i)=>applyShock(s, 0.01+wr(20+i)*0.01));
      stocks.filter(s=>s.theme.includes("AI")||s.theme.includes("반도체")).forEach((s,i)=>applyShock(s, 0.02+wr(40+i)*0.03));
    }
    if(state.currentEvent === "MARKET_CRASH"){
      stocks.forEach((s,i)=>applyShock(s, -(0.02+wr(60+i)*0.03)));
    }
    if(state.currentEvent === "BUBBLE_SHOCK"){
      stocks.forEach((s,i)=>applyShock(s, -(0.015+wr(80+i)*0.025)));
    }
    if(state.currentEvent === "FX_SURGE"){
      fx.usd = Math.round(fx.usd * 1.03);
    }
    if(state.currentEvent === "FX_CRASH"){
      fx.usd = Math.round(fx.usd * 0.97);
    }
    return;
  }

  // 일반 종목 속보 뉴스 생성
  if(stocks.length === 0) return;
  let sorted=[...stocks].sort((a,b)=>Math.abs(dayChangePct(b))-Math.abs(dayChangePct(a)));
  let s=sorted[0];
  if(!s) return;
  let up=dayChangePct(s)>=0;
  let reasons=up?["공격적인 분기 실적 기대감이 커지며","해외 기관들의 대규모 순매수세가 포착되며","신규 특허 취득 및 상용화 파트너십 소식에","장기 공급 계약 모멘텀이 시장에서 조명받으며"]:["고점 돌파 실패에 따른 실망 매물이 가중되며","단기 변동성 오버슈팅에 의한 매도세 유출로","일부 루머성 악재 지적에 거래 심리가 냉각되며","해외 거시 리스크 부담이 반영되며"];
  // 속보 내용이 실제 가격에도 반영되도록 같은 방향으로 소폭 충격을 가합니다.
  // 매번(7초마다) 큰 충격을 주면 변동성 때문에 장기 수익률이 계속 깎이므로(변동성 손실),
  // 가끔·작게만 반영합니다.
  if(wr(102) < 0.35) applyShock(s, (up?1:-1) * (0.002 + wr(100)*0.006));
  let text=`${s.name} (${s.ticker}) 측은 ${reasons[Math.floor(wr(101)*reasons.length)]} 전일 대비 ${pct(dayChangePct(s))} ${up?"상승":"하락"} 흐름을 연출 중입니다.`;
  publishBreakingNews("시황 속보", text);
}

let breakingShownAt=0; // 시황 속보 배너를 마지막으로 띄운 시각(실시간)
function publishBreakingNews(title, text){
  let fullText = `[${title}] ${text}`;
  state.news.unshift(fullText);
  state.news=state.news.slice(0,25); // 뉴스 목록에는 항상 쌓아 둡니다(최대 25개).

  if(OFFLINE_REPLAY) return; // 재생 중에는 배너를 그리지 않습니다(뉴스 기록은 위에 이미 남음).
  // 배너만 알림 설정을 따릅니다. 꺼도 뉴스 탭 기록은 그대로 남습니다.
  const n=state.notify||{};
  const gap=Math.max(0,Math.min(600,Math.round(+n.newsGap||0)));
  const now=Date.now();
  const tooSoon=gap>0 && breakingShownAt>0 && now-breakingShownAt < gap*1000;
  const bannerOn=(n.master!==true) && n.news!==false && !tooSoon;
  const box=bannerOn?$("breaking"):null;
  if(box){
    breakingShownAt=now;
    box.innerHTML=`<b>${escHtml(title)}</b> ${escHtml(text)}`;
    box.classList.add("show");
    setTimeout(()=>box.classList.remove("show"),5500);
  }
  if(activePage()==="news") news();
}
// 토스트 숫자 설정(표시 시간·동시 개수)을 범위 안에서 저장합니다.

function interest(){
  const depositBonus=rebirthBonus("deposit",.03);
  products.forEach(p=>{
    if(p.amount > 0) {
      let principal = p.amount;
      let effectiveAmount = principal;
      
      // 적금 몰빵 방지 및 구간 효율 저하 밸런싱 (3000만원 초과 분은 이자율 절반 감소)
      if(principal > 30000000) {
        let excess = principal - 30000000;
        effectiveAmount = 30000000 + (excess * 0.5);
      }
      // 3억원을 넘는 예금은 이자 계산 기준 원금을 3억원으로 제한합니다.
      effectiveAmount = Math.min(MAX_EFFECTIVE_DEPOSIT, effectiveAmount);
      
      // 15초 단위 반영 스케일: 연이율 × 0.015 (예금 4.2% → 15초당 0.063%, 시간당 약 +16%)
      let calculatedInterest = effectiveAmount * (p.rate * depositBonus * INTEREST_PERIOD);
      p.amount += calculatedInterest;
    }
  });

  // 만기 보너스: 가입 시점부터 term초가 지나면 한 번만 지급합니다.
  products.forEach(p=>{
    if(p.amount>0 && p.term>0 && p.startedAt!=null && !p.matured && state.marketSeconds-p.startedAt>=p.term){
      const bonus=p.amount*(p.bonus||0);
      p.amount+=bonus; p.matured=true;
      addLog(`🎁 만기 보너스: ${p.name} +${won(bonus)}`);
      notify("maturity","만기 보너스",`${p.name} +${won(bonus)}`);
    }
  });

  // 금리연동 채권 이자(15초): 액면가 기준 연 3.6%
  const bond=ensureBonds();
  if(bond.qty>0){
    const coupon=bond.qty*BOND.face*BOND.coupon*0.015;
    creditAutoIncome(coupon,"채권 이자");
    // 15초마다 현금이 늘어난 이유를 알 수 있도록 1분에 한 번 합산해 기록합니다.
    state.bondInterestAccrued=(+state.bondInterestAccrued||0)+coupon;
    if(state.marketSeconds%60===0){
      const paid=state.bondInterestAccrued;
      state.bondInterestAccrued=0;
      if(paid>0) addLog(`🏦 채권 이자 +${won(paid)} (연 3.6% · 15초마다 자동 지급)`);
    }
  } else {
    state.bondInterestAccrued=0;
  }

  // 대출 이자(15초 단위): 연이율 × 0.015, 현금이 부족하면 대출 잔액에 가산
  if(state.loan > 0) {
    // 예전 저장 데이터의 0% 대출도 최소 기본 금리로 복구해 무이자 부채를 막습니다.
    ensureDebtRate();
    let loanInterest = state.loan * ((state.loanRate || 0) * 0.015);
    if(state.cash >= loanInterest) state.cash -= loanInterest;
    else {
      state.loan += loanInterest - state.cash; state.cash = 0;
      notify("loan","대출 이자 증가","현금이 부족해 이자가 대출 잔액에 더해졌습니다.");
    }
  }
  
  update();
}

function liveNumber(key){
  const k=String(key||"");
  if(k==="reportRet") return reportData().ret;
  if(k==="dashChange"){
    const pts=assetHistory.points;
    return pts.length>1 && pts[0].v>0 ? (netAssetsKRW()-pts[0].v)/pts[0].v : 0;
  }
  if(k.startsWith("stock:")){
    const [,id,prop]=k.split(":"); const s=stock(id); if(!s) return null;
    if(prop==="roi") return s.avgBuy>0?(s.price-s.avgBuy)/s.avgBuy:0;
    if(prop==="pnl") return stockPriceKRW(s)*(s.own||0)-(+s.avgBuy||0)*(s.own||0)*(isForeignStock(s)?fx.usd:1);
  }
  if(k.startsWith("estate:")){
    const [,id,prop]=k.split(":"); const e=ESTATES.find(x=>x.id===id); const h=state.estate[id]||{qty:0,avgBuy:0}; if(!e) return null;
    const price=estatePrice(id);
    if(prop==="rent") return (h.qty||0)*price*e.rent*rebirthBonus("estate",.04);
    if(prop==="upkeep") return (h.qty||0)*price*e.upkeep;
    if(prop==="value") return (h.qty||0)*price;
  }
  if(k.startsWith("metal:")){
    const [,id,prop]=k.split(":"); const h=state.metals[id]||{qty:0,avg:0}; if(!METALS.some(m=>m.id===id)) return null;
    if(prop==="value") return (h.qty||0)*metalPrice(id);
    if(prop==="pnl") return (h.qty||0)*(metalPrice(id)-(+h.avg||0));
  }
  if(k.startsWith("product:")){
    const [,id]=k.split(":"); const p=product(id); return p?p.amount:null;
  }
  return null;
}

function patchLivePage(){
  if(typeof document==="undefined" || typeof document.querySelectorAll!=="function") return;
  document.querySelectorAll("[data-live]").forEach(el=>{
    const key=el.getAttribute("data-live");
    const v=liveValue(key);
    if(v==null) return;
    if(el.textContent!==v) el.textContent=v;
    const sign=liveNumber(key);
    if((key.endsWith(":roi")||key.endsWith(":pnl")||key==="reportRet"||key==="indexRet"||key==="dashChange") && sign!=null && el.classList){
      el.classList.remove("up","down"); el.classList.add(sign>=0?"up":"down");
    }
  });
  document.querySelectorAll("[data-live-style]").forEach(el=>{
    const key=el.getAttribute("data-live-style");
    const v=liveValue(key);
    if(v!=null) el.style.width=v;
  });
  // 자산 추이 그래프는 15초 기록 주기에 맞춰서만 다시 그립니다.
  if(state.marketSeconds%15===0){
    document.querySelectorAll("[data-live-trend-graph]").forEach(el=>{
      el.innerHTML=assetTrendSVG()||`<div class="trend-empty">자산 기록을 모으는 중입니다<br><small>15초마다 기록되며, 2개가 쌓이면 그래프가 표시됩니다.</small></div>`;
    });
  }
}

  // 금융 화면에서는 배너·해금 상태만 갱신해 입력 중인 금액을 보존합니다.
  if(activePage()==="banking") refreshBankingState();

  state.peakNet=Math.max(state.peakNet||0,totalAssetsKRW());
  const bn=$("bottomNet");
  if(bn) bn.textContent=wonShort(totalAssetsKRW());
  const sg=$("sideGrade"); if(sg) sg.textContent=currentGrade();
  refreshLaborUI();
  renderAutoBadge();

  const grade=currentGrade();
  if(state.lastGrade && state.lastGrade!==grade) notify("grade","등급 변동",`${state.lastGrade} → ${grade}`);
  state.lastGrade=grade;
  const rb=ensureRebirth();
  if(!rb.notified && canRebirth()){ rb.notified=true; notify("rebirth","환생 가능",`순자산 ${wonShort(totalAssetsKRW())} · 환생 화면에서 영구 업그레이드를 확인하세요.`); saveGame(); }

  // 입력·클릭 중에는 건드리지 않고, 구조가 바뀔 때만 전체를 다시 그립니다.
  const livePage=activePage();
  if(LIVE_PAGES.includes(livePage)){
    const pf=document.getElementById(livePage);
    const hovered=pf && typeof pf.matches==="function" && pf.matches(":hover");
    const focused=pf && document.activeElement && typeof pf.contains==="function" && pf.contains(document.activeElement);
    if(!focused){
      const key=livePageKey(livePage);
      if(livePageKeys[livePage]!==key && !hovered){
        livePageKeys[livePage]=key;
        renderLivePage(livePage);
      }else{
        // 마우스가 페이지 위에 있어도 숫자는 계속 갱신합니다. 구조가 바뀐 경우에는
        // 마우스를 떼는 다음 틱에 전체 렌더로 따라잡습니다(입력 중 포커스는 건드리지 않음).
        patchLivePage();
      }
    }
  }
}

init();

// 노동 미니게임은 스페이스·엔터로도 멈출 수 있습니다(버튼에 포커스가 있을 때는 기본 클릭에 맡깁니다).
if(typeof document!=="undefined" && typeof document.addEventListener==="function"){
  document.addEventListener("keydown",e=>{
    if(!laborSession) return;
    const tag=e.target&&e.target.tagName?String(e.target.tagName).toUpperCase():"";
    if(tag==="BUTTON"||tag==="INPUT"||tag==="SELECT"||tag==="TEXTAREA") return;
    if(e.key===" "||e.key==="Enter"){
      e.preventDefault();
      if(laborSession.mode==="timing") laborStop();
      else if(laborSession.mode==="tap") laborTap();
    }
  });
}
</script>
</body>
</html>
