// ── 공모주(IPO) ────────────────────────────────
function ensureIPO(){
  if(!state.ipo||typeof state.ipo!=="object") state.ipo={offer:null,nextAt:0,history:[]};
  const ipo=state.ipo;
  if(!Array.isArray(ipo.history)) ipo.history=[];
  if(!Number.isFinite(+ipo.nextAt)) ipo.nextAt=0;
  return ipo;
}
// 공모주로 상장된 종목을 주식 목록에 추가합니다(저장 데이터 복원에도 사용).
function ensureListedStock(def,price){
  const exist=stocks.find(s=>s.id===def.id); if(exist) return exist;
  const p=Math.max(100,Math.round((+price||def.price||1000)/100)*100);
  const revenue=Math.max(100000000,Math.round(p*10000));
  const s={id:def.id,name:def.name,ticker:def.ticker||def.id.toUpperCase(),market:"국내",group:"domestic",price:p,start:p,drift:.001,vol:def.vol||.035,theme:def.theme||"신규 상장",own:0,lastMove:0,avgBuy:0,realizedProfit:0,hist:[p],revenue,opProfit:Math.round(revenue*.12),indexPower:0,ipo:true,
    prevClose:p,dayOpen:p,dayRet:0,dayIndex:marketDayIndex(state.marketSeconds)};
  stocks.push(s);
  return s;
}
function resetListedStocks(){ stocks=stocks.filter(s=>!s.ipo); state.listedIds=[]; }
function announceIPO(o, urgent){
  const left=clockText(realSeconds(Math.max(0,o.closesAt-state.marketSeconds)));
  const title=urgent?"⏰ 공모주 청약 마감 임박":"📢 공모주 청약 시작";
  // 알림 설정을 꺼 두었어도 반드시 표시합니다. 토스트를 누르면 바로 청약 화면으로 이동합니다.
  notifyAlways(title,`${o.name}(${o.ticker}) · 공모가 ${won(o.price)} · ${left} 남음 · 눌러서 청약하기`,{
    durationMs:urgent?10000:Math.min(20000,Math.max(8000,realSeconds(Math.max(0,o.closesAt-state.marketSeconds))*1000)),
    onClick:()=>show("ipo")
  });
}
function tickIPO(){
  const ipo=ensureIPO();
  if(ipo.offer){
    if(state.marketSeconds>=ipo.offer.closesAt) closeIPO();
    else if(!ipo.offer.reminded && ipo.offer.closesAt-state.marketSeconds<=30){
      ipo.offer.reminded=true;
      announceIPO(ipo.offer,true);
    }
    return;
  }
  if(state.marketSeconds<ipo.nextAt) return;
  const pool=IPO_POOL.filter(d=>!stocks.some(s=>s.id===d.id));
  if(!pool.length){ ipo.nextAt=state.marketSeconds+300; return; }
  const d=pool[Math.floor(Math.random()*pool.length)];
  const price=Math.max(100,Math.round(d.price*(0.9+Math.random()*0.2)/100)*100);
  ipo.offer={id:d.id,name:d.name,ticker:d.ticker,group:"domestic",theme:d.theme,vol:d.vol,price,qty:60000,closesAt:state.marketSeconds+120,subscribed:0,mine:0,reminded:false};
  publishBreakingNews("📢 공모주 청약", `${d.name}(${d.ticker}) 공모가 ${won(price)} · 120초간 청약 접수 중`);
  announceIPO(ipo.offer,false);
}
function setIPOAmount(mode){
  const o=ensureIPO().offer, el=$("ipo-amount"); if(!o||!el) return;
  let amount=Math.max(0,Math.floor(+state.cash||0));
  if(mode==="half") amount=Math.floor(amount/2);
  amount=Math.floor(amount/10000)*10000;
  el.value=String(Math.max(10000,Math.min(amount,Math.floor(+state.cash||0))));

function subscribeIPO(){
  const ipo=ensureIPO(),o=ipo.offer; if(!o) return alert("진행 중인 공모주가 없습니다.");

  o.account=acct;

function cancelIPO(){
  const ipo=ensureIPO(),o=ipo.offer; if(!o||!o.mine) return;
  const refund=o.mine, acct=TAX_ACCOUNTS.includes(o.account)?o.account:"general", reserved=Math.max(0,+o.reserved||0);
  state.cash+=refund;
  releaseTaxContribution(acct,reserved);
  o.reserved=0;
  o.subscribed=Math.max(0,(o.subscribed||0)-refund);
  o.mine=0;
  o.lastAction={type:"cancel",amount:refund,at:Date.now(),shares:0};

  notifyAlways("↩️ 청약 취소 완료",`${o.name} ${won(refund)} 전액 환불 · 다시 청약할 수 있습니다`,{durationMs:4500,onClick:()=>show("ipo")});
  saveGame(); ipoPage(); update();
}
function closeIPO(){
  const ipo=ensureIPO(),o=ipo.offer; if(!o) return;
  const mine=Math.max(0,+o.mine||0);
  const mineShares=o.price>0?mine/o.price:0;
  const demandShares=Math.round(o.qty*(0.3+Math.random()*2.2))+mineShares;
  const ratio=Math.min(1,o.qty/Math.max(1,demandShares));
  const alloc=mine>0?Math.max(0,Math.floor(mineShares*ratio)):0;
  const acct=TAX_ACCOUNTS.includes(o.account)?o.account:"general", reserved=Math.max(0,+o.reserved||0);
  if(mine>0) state.cash+=mine-alloc*o.price;
  if(reserved>0) releaseTaxContribution(acct,Math.max(0,reserved-alloc*o.price));
  o.reserved=0;
  const open=Math.max(100,Math.round(o.price*(0.9+Math.random()*0.35)/100)*100);
  const s=ensureListedStock(o,o.price);
  s.start=o.price; s.price=open; s.lastMove=(open-o.price)/o.price; s.hist=[o.price,open];
  if(alloc>0){ s.own=alloc; s.avgBuy=o.price; addTaxLot(s,alloc,o.price,acct); recordTrade(s,"buy",alloc,o.price,0); }
  if(!state.listedIds.includes(o.id)) state.listedIds.push(o.id);
  ipo.history.unshift({id:o.id,name:o.name,price:o.price,open,alloc,at:state.marketSeconds});
  ipo.history=ipo.history.slice(0,8);
  ipo.offer=null;
  ipo.lastResult={name:o.name,price:o.price,open,alloc,mine,refund:Math.max(0,mine-alloc*o.price),at:state.marketSeconds};
  ipo.nextAt=state.marketSeconds+300+Math.floor(Math.random()*300);
  addLog(`📈 신규 상장: ${o.name} 공모가 ${won(o.price)} → 시초가 ${won(open)}${alloc?` · ${alloc}주 배정`:""}${mine&&!alloc?" · 전액 환불":""}`);
  publishBreakingNews("📈 신규 상장", `${o.name}(${o.ticker}) 상장 · 공모가 ${won(o.price)} · 시초가 ${won(open)}`);
  if(mine>0){
    notifyAlways("📈 공모주 상장 결과",`${o.name} · ${alloc?`${alloc}주 배정`:"배정 0주"} · 환불 ${won(Math.max(0,mine-alloc*o.price))} · 시초가 ${won(open)}`,{durationMs:6500,onClick:()=>show("holdings")});
  } else {
    notify("system","공모주 상장",`${o.name} · 청약 미참여 · 시초가 ${won(open)}`);
  }
  if(activePage()==="ipo") ipoPage();
  saveGame(); update();
}

// ── 자동 리밸런싱 ─────────────────────────────
function autoRebalance(){
  const a=state.auto||{};
  if(!a.enabled||!a.rebalance||!state.marketOpen) return 0;
  const gross=grossAssetsKRW(); if(gross<=0) return 0;
  const target=Math.max(0,Math.min(100,Number.isFinite(+a.rebStockPct)?+a.rebStockPct:60))/100;
  const band=Math.max(0.02,Math.min(0.2,Number.isFinite(+a.rebBand)?+a.rebBand:5)/100);
  const now=stockValueKRW()/gross;
  let moved=0;
  const acct=state.tax.mode;
  if(now>target+band){
    let need=(now-target-band)*gross;
    const taxAware=!!a.taxAware, taxBudget=Math.max(0,+a.taxBudget||0);
    const sellList=[...stocks].filter(s=>accountQty(s,acct)>0&&!isIndexFund(s));
    // 세금 고려 모드: 평가차익이 작은(또는 손실인) 종목부터 매도해 양도세를 줄입니다.
    sellList.sort(taxAware
      ?(x,y)=>{const ax=accountAvgBuy(x,acct),ay=accountAvgBuy(y,acct);return ((x.price-ax)/Math.max(1,ax))-((y.price-ay)/Math.max(1,ay));}
      :(x,y)=>y.price*accountQty(y,acct)-x.price*accountQty(x,acct));
    sellList.forEach(s=>{
      if(need<=0) return;
      const unit=s.price*(isForeignStock(s)?fx.usd:1);
      const qty=Math.min(accountQty(s,acct),Math.max(1,Math.floor(need/unit)));
      if(qty<=0) return;
      const p=taxPreviewFor(s,qty,acct);
      if(taxAware && taxBudget>0 && (state.tax.taxPaidByAccount[acct]||0)+p.tax>taxBudget){
        addLog(`🧾 세금 예산 초과로 ${s.name} 매도 건너뜀 (예상 ${won(p.tax)} / 예산 ${won(taxBudget)})`);
        return;
      }
      if(marketSellShares(s,qty,acct)){ const done=qty*unit; moved+=done; need-=done; }
    });
  } else if(now<target-band){
    const need=(target-band-now)*gross;
    const budget=Math.min(state.cash,need);
    if(budget>10000){
      const list=stocks.filter(s=>!isIndexFund(s));
      const per=budget/list.length;
      list.forEach(s=>{
        const unit=s.price*(1+stockFeeRate())*(isForeignStock(s)?fx.usd:1);
        const qty=Math.floor(per/unit);
        if(qty>0&&marketBuyShares(s,qty)) moved+=per;
      });
    }
  }
  if(moved>0){
    addLog(`⚖️ 자동 리밸런싱: 주식 비중 ${pct(now)} → 목표 ${Math.round(target*100)}% · ${won(moved)} 조정${a.taxAware?` (세금 고려 · 예산 ${a.taxBudget>0?won(a.taxBudget):"제한 없음"})`:""}`);
    notify("system","리밸런싱",`${won(moved)} · 주식 ${Math.round(target*100)}% 맞춤${a.taxAware?" · 절세 우선":""}`);
    saveGame(); update();
  }
  return moved;
}
function tickAlt(){
  if(!state.altPrices||typeof state.altPrices!=="object") state.altPrices={};
  ESTATES.forEach(e=>{
    const p=estatePrice(e.id);
    const shock=Math.random()<.03?(Math.random()-.5)*.12:0;
    state.altPrices[e.id]=Math.max(Math.round(e.price*.35),Math.round(p*(1+(Math.random()-.5)*e.vol+shock)));
  });
  METALS.forEach(m=>{
    const p=metalPrice(m.id);
    state.altPrices[m.id]=Math.max(Math.round(m.price*.35*100)/100,Math.round(p*(1+(Math.random()-.5)*m.vol)*100)/100);
  });
  if(state.marketSeconds%60===0){
    let rent=0,upkeep=0;
    const rentBonus=rebirthBonus("estate",.04);
    ESTATES.forEach(e=>{ const q=(state.estate[e.id]&&state.estate[e.id].qty)||0; if(!q) return; rent+=q*estatePrice(e.id)*e.rent*rentBonus; upkeep+=q*estatePrice(e.id)*e.upkeep; });
    if(rent||upkeep){ state.cash+=rent-upkeep; addLog(`🏢 임대 수익 ${won(rent)} · 유지비 ${won(upkeep)}`); }
  }
  const c=state.company;
  if(c){
    if(!Number.isFinite(+c.upkeep)) c.upkeep=0;
    if(!Number.isFinite(+c.risk)) c.risk=0;
    c.revenue=Math.max(0,Math.round(c.revenue*(0.99+Math.random()*.02)));
    // 기업 가치는 장부가(설립·확장·인수 누계) 주변에서만 움직입니다.
    // 인수한 회사가 많을수록 위협(가치 변동성)이 커져 장부가에서 더 크게 출렁입니다.
    const book=Math.max(10000000,c.book||c.valuation);
    const swing=0.2+Math.max(0,Math.min(0.15,+c.risk||0));
    c.valuation=Math.max(book*(1-swing),Math.min(book*(1+swing),Math.round(c.valuation*(0.997+Math.random()*.006))));
    // 상장한 기업은 주가가 순자산 가치를 향해 천천히 수렴하며 매 틱 변동합니다.
    if(c.listed && (+c.listed.shares||0)>0){
      const fair=Math.max(100,c.valuation/c.listed.shares);
      const p=Math.max(100,+c.listed.price||+c.listed.ipoPrice||100);
      c.listed.price=Math.max(100,Math.round(p*(0.994+Math.random()*0.012)+(fair-p)*0.03));
    }
    if(state.marketSeconds%30===0){
      // 상장해 지분을 팔았으면 내 지분만큼만 배당을 받습니다.
      const own=c.listed?Math.max(0,Math.min(100,+c.listed.ownPct||0))/100:1;
      const pay=Math.round(c.profit*(c.payout==null?.3:c.payout)*rebirthBonus("company",.04)*own);
      state.cash+=pay;
      if(pay>0) addLog(`🏭 기업 배당 +${won(pay)}`);
      if((c.upkeep||0)>0){
        const up=c.upkeep;
        state.cash=Math.max(0,state.cash-up);
        addLog(`🏭 인수 기업 유지비 -${won(up)}`);
      }
    }
  }
  const eco=state.economy||(state.economy=Object.assign({},ECON_DEFAULT));
  // tickAlt는 15게임초마다 실행되므로 남은 시간도 15초씩 줄여야 합니다.
  // (기존에는 1씩 줄어 90초 표시가 실제로는 1,350초가 되는 버그가 있었습니다.)
  eco.cycleLeft=(eco.cycleLeft||0)-15;
  if(eco.cycleLeft<=0){
    const phases=["호황","중립","불황"];
    eco.phase=phases[Math.floor(Math.random()*3)];
    eco.cycleLeft=60+Math.floor(Math.random()*60);
    eco.rateAdj=eco.phase==="호황"?.004:eco.phase==="불황"?-.004:0;
    const dir=Math.random()<.5?-1:1;
    eco.baseRate=Math.max(.01,Math.min(.08,(eco.baseRate||.03)+dir*.0025));
    // 경기 국면에 따라 물가·실업률·성장률이 움직이고, 이는 시장 방향에도 반영됩니다.
    const phaseBias=eco.phase==="호황"?1:eco.phase==="불황"?-1:0;
    eco.inflation=Math.max(.005,Math.min(.08,(+eco.inflation||.025)+phaseBias*.003+(Math.random()-.5)*.002));
    eco.unemployment=Math.max(.015,Math.min(.15,(+eco.unemployment||.035)-phaseBias*.004+(Math.random()-.5)*.0015));
    eco.gdpGrowth=Math.max(-.06,Math.min(.08,(+eco.gdpGrowth||.02)+phaseBias*.007+(Math.random()-.5)*.003));
    if(eco.phase==="불황"){
      stocks.forEach(s=>applyShock(s,-(0.01+Math.random()*.025)));
      publishBreakingNews("📉 금융 위기 · 경기 침체", `경기 침체가 시작되었습니다. 물가 ${(eco.inflation*100).toFixed(1)}% · 실업률 ${(eco.unemployment*100).toFixed(1)}% · 기준금리 ${(eco.baseRate*100).toFixed(2)}%`);
      notify("economy","경제 위기",`금융 위기 · 실업률 ${(eco.unemployment*100).toFixed(1)}%`);
    } else if(eco.phase==="호황"){
      stocks.forEach(s=>applyShock(s,0.008+Math.random()*.02));
      publishBreakingNews("🚀 경기 호황", `소비와 투자가 살아납니다. 물가 ${(eco.inflation*100).toFixed(1)}% · 실업률 ${(eco.unemployment*100).toFixed(1)}% · 성장률 ${(eco.gdpGrowth*100).toFixed(1)}%`);
      notify("economy","경기 호황",`성장률 ${(eco.gdpGrowth*100).toFixed(1)}% · 기준금리 ${(eco.baseRate*100).toFixed(2)}%`);
    } else {
      publishBreakingNews("🏦 기준금리", `기준금리 ${(eco.baseRate*100).toFixed(2)}% · 경기 ${eco.phase} 국면이 시작되었습니다.`);
      notify("economy","경제 지표",`경기 ${eco.phase} · 기준금리 ${(eco.baseRate*100).toFixed(2)}%`);
    }
  }
  if(state.marketSeconds%180===0 && Math.random()<.5){
    const sector=["AI","반도체","배터리","우주","디지털 자산"][Math.floor(Math.random()*5)];
    const up=Math.random()<.5;
    stocks.filter(s=>s.theme.includes(sector)).forEach(s=>applyShock(s,(up?1:-1)*(.01+Math.random()*.03)));
    publishBreakingNews("📈 산업 뉴스", `${sector} 업종에 ${up?"매수세":"차익 실현"}가 몰리고 있습니다.`);
  }
  const gi=gradeIndex(currentGrade());
  if(gi>(state.rewardedGrade||0)){
    let reward=0;
    for(let i=(state.rewardedGrade||0)+1;i<=gi;i++) reward+=i*500000;
    state.rewardedGrade=gi; state.cash+=reward;
    addLog(`🏅 승급 보상: ${GRADES[gi]} (+${won(reward)})`);
    notify("grade","승급 보상",`${GRADES[gi]} · ${won(reward)}`);
  }
  checkSpecial();
}

function periodReturns(){
  // 게임 시간 기준: 하루=60초, 일주=420초, 한 달=1800초로 압축해 계산합니다.
  const cur=totalAssetsKRW(), now=state.marketSeconds;
  const at=sec=>{ const p=[...assetHistory.points].reverse().find(x=>x.t<=now-sec); return p?p.v:null; };
  const calc=sec=>{ const v=at(sec); return v&&v>0?(cur-v)/v:null; };
  return {m1:calc(60),m5:calc(420),m15:calc(1800)};
}
function unrealizedPL(){

function altReturnRows(){

function isoWeekKey(){
  const d=new Date();
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=t.getUTCDay()||7;
  t.setUTCDate(t.getUTCDate()+4-day);
  const y=t.getUTCFullYear();
  const w=Math.ceil(((t-new Date(Date.UTC(y,0,1)))/86400000+1)/7);
  return `${y}-W${String(w).padStart(2,"0")}`;
}
function weeklyMissions(){ ensureWeekly(); return WEEKLY_POOL; }
function ensureWeekly(){
  const k=isoWeekKey();
  if(!state.weekly||state.weekly.key!==k||!state.weekly.counts||!state.weekly.claimed){
    state.weekly={key:k,counts:{},claimed:{}};
  }
}

function dailyMissions(){

  return [...new Map(picks.map(m=>[m.id,m])).values()];
}
function ensureDaily(){
  const key=todayKey();
  if(!state.daily || state.daily.date!==key || !state.daily.counts || !state.daily.claimed){
    state.daily={date:key,counts:{trades:0,dividends:0,orders:0,goals:0,deposit:0,estateBuy:0,altTrades:0},claimed:{}};
  }
  ensureWeekly();
  // 연속 접속: 날짜가 바뀐 첫 호출에서만 계산합니다.
  if(!state.streak||typeof state.streak!=="object") state.streak={days:1,last:"",best:1};
  if(state.streak.last!==key){
    const y=new Date(Date.now()-86400000);
    const yk=`${y.getFullYear()}-${y.getMonth()+1}-${y.getDate()}`;
    state.streak.days=state.streak.last===yk?Math.min(365,(state.streak.days||1)+1):1;
    state.streak.last=key;
    state.streak.best=Math.max(state.streak.best||1,state.streak.days);
    if(state.streak.days>1 && state.streak.days%3===0){
      const reward=state.streak.days%7===0?1000000:300000;

      addLog(`🔥 연속 접속 ${state.streak.days}일 보상 +${won(reward)}`);

    }
  }
}

  const open=[...stockReturnRows(),...altReturnRows()].reduce((best,r)=>Math.max(best,+r.roi||0),0);

    if(x.side!=="sell"||!(+x.valueKRW>0)) return best;

  },0);
  return Math.max(open,closed);

  });
}

function setSpeed(n){
  const v=Math.round(+n||1);
  state.speed=Math.max(1,Math.min(5,v));
  state.settings=Object.assign({},SETTINGS_DEFAULT,state.settings,{speed:state.speed});
  state.paused=false;
  saveGame(); updateSpeedUI();
  if(activePage()==="settings" && typeof settingsPage==="function") settingsPage();
}
function togglePause(){ state.paused=!state.paused; saveGame(); updateSpeedUI(); }
function cycleSpeed(){
  const i=SPEEDS.indexOf(speedNow());
  setSpeed(SPEEDS[(i+1)%SPEEDS.length]);
}
function speedNow(){ return Math.max(1,Math.min(5,Math.round(+state.speed||1))); }
// 게임 시간(초)을 현재 배속에서 실제 기다려야 하는 초로 환산합니다.
// 3배속에서 180게임초는 실제 60초이므로, 화면 카운트다운이 3초씩 건너뛰지 않습니다.
function realSeconds(gameSeconds){
  const sec=Math.max(0,Number(gameSeconds)||0);
  return Math.max(0,Math.ceil(sec/speedNow()));
}
function renderMarketBar(){
  updateMarketDayBar();
  const bar=$("marketTimeBar"); if(!bar) return;
  if(state.paused){
    bar.style.background="#fef3c7";
    bar.style.color="#92400e";
    bar.textContent="⏸ 일시정지 중 · 재개하면 시장이 다시 움직입니다.";
    return;
  }
  const cycleTime=state.marketSeconds%240;
  if(cycleTime<180){
    bar.style.background="#e0f2fe";
    bar.style.color="#0369a1";
    bar.textContent=`🟢 [개장 중] 주식 거래 가능 (다음 휴장까지 실제 ${realSeconds(180-cycleTime)}초 · ${speedNow()}x)`;
  }else{
    bar.style.background="#fee2e2";
    bar.style.color="#991b1b";
    bar.textContent=`🔴 [휴장 중] 주식 거래 제한 (다음 개장까지 실제 ${realSeconds(240-cycleTime)}초 · ${speedNow()}x) - 금융상품 이자는 정상 지급됩니다.`;
  }
}
function updateSpeedUI(){
  const label=state.paused?"⏸ 정지":`${speedNow()}x`;
  ["speedState","bbSpeed","sideSpeed"].forEach(id=>{ const el=$(id); if(el) el.textContent=label; });
  renderMarketBar();
  document.querySelectorAll("[data-speed]").forEach(b=>{
    const on=!state.paused && +b.dataset.speed===speedNow();
    b.classList.toggle("on",on);
    b.setAttribute("aria-pressed",on?"true":"false");
  });
  const pauseBtn=document.getElementById("pauseBtn");
  if(pauseBtn) pauseBtn.textContent=state.paused?"▶ 재개":"⏸ 일시정지";
}

// ── 오프라인 정산(기본 2시간, 환생 업그레이드로 연장) ──────────────
const OFFLINE_MAX_BASE=2*3600;
function offlineMaxSeconds(){ return OFFLINE_MAX_BASE + 2*3600*rebirthLevel("offline"); }
function applyOfflineProgress(){
  const now=Date.now();
  const last=state.lastSeen||0;
  state.lastSeen=now;
  if(!last || last>now) return null;
  const sec=Math.min(offlineMaxSeconds(), Math.floor((now-last)/1000));
  if(sec<120) return null;
  const periods=sec/15;
  let interest=0, loanInterest=0;
  const depositBonus=rebirthBonus("deposit",.03);
  products.forEach(p=>{
    if(p.amount<=0 || p.rate<=0) return;
    for(let i=0;i<periods;i++){
      const eff=Math.min(MAX_EFFECTIVE_DEPOSIT,p.amount>30000000?30000000+(p.amount-30000000)*0.5:p.amount);
      const add=eff*(p.rate*depositBonus*0.015);
      p.amount+=add; interest+=add;
    }
  });
  // 현금을 방치해도 자동으로 돈이 늘어나던 파킹 보너스는 제거했습니다(원인 불명 자동 수익).
  if((state.loan||0)>0){
    for(let i=0;i<periods;i++){
      const li=state.loan*((state.loanRate||0)*0.015);
      loanInterest+=li;
      if(state.cash>=li) state.cash-=li;
      else { state.loan+=li-state.cash; state.cash=0; }
    }
  }
  const divPeriods=Math.min(30, Math.floor(sec/DIVIDEND_EVERY));
  const dividends=expectedDividend()*divPeriods*rebirthBonus("dividend",.03);
  if(dividends>0){ state.cash+=dividends; state.dividendTotal=(state.dividendTotal||0)+dividends; }
  // 부동산 임대료·유지비와 기업 배당도 오프라인 동안 정산합니다(가격 변동은 제외).
  const rentPeriods=Math.floor(sec/60);
  let rent=0,upkeep=0;
  const rentBonus=rebirthBonus("estate",.04);
  ESTATES.forEach(e=>{ const q=(state.estate[e.id]&&state.estate[e.id].qty)||0; if(!q) return; rent+=q*estatePrice(e.id)*e.rent*rentBonus*rentPeriods; upkeep+=q*estatePrice(e.id)*e.upkeep*rentPeriods; });
  const companyPay=state.company?Math.round(state.company.profit*((state.company.payout==null?.3:state.company.payout))*rebirthBonus("company",.04)*sec/30):0;
  state.cash+=rent-upkeep+companyPay;
  const summary={sec,interest,dividends,loanInterest,rent,upkeep,companyPay};
  addLog(`오프라인 정산: ${Math.floor(sec/60)}분 · 이자 ${won(interest)} · 배당 ${won(dividends)}`);
  notify("system","오프라인 정산",`${Math.floor(sec/60)}분 동안 이자 ${won(interest)} · 배당 ${won(dividends)}`);
  openModal("오프라인 정산",`<div class="kpis">
    <div class="kpi"><small>경과 시간</small><b>${Math.floor(sec/60)}분</b></div>
    <div class="kpi"><small>금융상품 이자</small><b>${won(interest)}</b></div>
    <div class="kpi"><small>배당(최대 1시간)</small><b>${won(dividends)}</b></div>
    <div class="kpi"><small>대출 이자</small><b>${won(loanInterest)}</b></div>
    <div class="kpi"><small>임대 수익</small><b>${won(rent||0)}</b></div>
    <div class="kpi"><small>유지비</small><b>${won(upkeep||0)}</b></div>
    <div class="kpi"><small>기업 배당</small><b>${won(companyPay||0)}</b></div>
  </div><p style="margin-top:10px;font-size:12px;color:#667085">주가·부동산 가격 변동은 반영하지 않고 이자·배당·임대료만 정산합니다(최대 ${Math.floor(offlineMaxSeconds()/3600)}시간).</p>`);
  saveGame();
  return summary;
}

// 추이 데이터는 저장 파일에 넣지 않고 메모리에만 쌓습니다(저장/불러오기 호환 유지).
const assetHistory={points:[],peak:0};

function recordAssetHistory(){
  const v=totalAssetsKRW();
  const last=assetHistory.points[assetHistory.points.length-1];
  if(last && Math.abs(last.v-v)<1) last.t=state.marketSeconds;
  else assetHistory.points.push({t:state.marketSeconds,v});
  if(assetHistory.points.length>180) assetHistory.points.shift(); // 15초 간격 45분
  assetHistory.peak=Math.max(assetHistory.peak,v);
}

function assetTrendSVG(){
  // 기록이 2개 미만이면 선을 그리지 않습니다.
  // (시작 금액을 첫 점으로 끼워 넣으면 새로고침 직후 가짜 상승/하락 선이 보입니다.)
  if(assetHistory.points.length<2) return "";
  const vals=assetHistory.points.map(p=>p.v);
  const min=Math.min(...vals),max=Math.max(...vals),span=(max-min)||Math.max(1,Math.abs(max)*0.01);
  const w=600,h=120,step=w/Math.max(1,vals.length-1);
  const coords=vals.map((v,i)=>`${(i*step).toFixed(1)},${(h-((v-min)/span)*(h-6)-3).toFixed(1)}`).join(" ");
  const up=vals[vals.length-1]>=vals[0];
  const color=up?"#0f766e":"#b42318";
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polygon points="0,${h} ${coords} ${w},${h}" fill="${color}" opacity=".10"/><polyline points="${coords}" fill="none" stroke="${color}" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>`;
}

// 자산 배분(현금·달러·주식·금융상품). 부채는 별도 표기합니다.
function allocation(){
  const parts=[
    {label:"현금",value:Math.max(0,state.cash),color:"#0f766e"},
    {label:"달러",value:Math.max(0,(state.usd||0)*fx.usd),color:"#0369a1"},
    {label:"주식",value:Math.max(0,stockValueKRW()),color:"#b45309"},
    {label:"금융상품",value:Math.max(0,productValueKRW()),color:"#6d28d9"},
    {label:"부동산",value:Math.max(0,estateValue()),color:"#be123c"},
    {label:"금·은",value:Math.max(0,metalValue()),color:"#a16207"},
    {label:"기업",value:Math.max(0,companyValue()),color:"#0f766e"}
  ];
  const gross=parts.reduce((a,p)=>a+p.value,0);
  parts.forEach(p=>{ p.pct=gross>0?(p.value/gross)*100:0; });
  return {parts,gross};
}

// 거래 저널과 자산 배분을 함께 읽어 투자 스타일을 진단합니다.
function investmentStyle(){
  const journal=Array.isArray(state.journal)?state.journal:[];
  const buys=journal.filter(x=>x.side==="buy").length;
  const sells=journal.filter(x=>x.side==="sell").length;
  const wins=journal.filter(x=>x.side==="sell"&&(+x.profit||0)>0).length;
  const realized=journal.reduce((a,x)=>a+(x.side==="sell"?(+x.profit||0):0),0);
  const winRate=sells?wins/sells:0;
  const alloc=allocation();
  const stockPct=(alloc.parts.find(p=>p.label==="주식")||{pct:0}).pct;
  const safePct=alloc.parts.filter(p=>["현금","금융상품"].includes(p.label)).reduce((a,p)=>a+p.pct,0);
  const top=stockReturnRows()[0]||null;
  let style="관망형",desc="아직 거래 기록이 적어 성향을 판단하는 중입니다.",advice="소액으로 분산 매수해 자신의 위험 감도를 확인해 보세요.";
  if(journal.length>=3 && sells>=3 && sells/(buys+sells)>=.45 && winRate>=.5){
    style="스윙 트레이더"; desc="짧은 변동을 매매로 잡아내며 매도 승률이 높은 편입니다."; advice="수수료와 세금을 감안해 기대 수익이 충분한 거래만 남기세요.";
  } else if(journal.length>=3 && buys>=Math.max(2,sells*2)){
    style="장기 보유형"; desc="매수 후 보유 비중이 높아 기업 가치와 배당을 중시합니다."; advice="보유 종목의 실적과 배당 성장을 분기마다 점검하세요.";
  } else if(stockPct>=60){
    style="공격 성장형"; desc="주식 비중이 높아 시장 상승을 적극적으로 추종합니다."; advice="하락장을 대비해 현금·금융상품 완충을 남겨 두세요.";
  } else if(safePct>=60){
    style="안정 추구형"; desc="현금과 금융상품 비중이 높아 원금 보존을 우선합니다."; advice="물가 상승률보다 높은 금리의 상품으로 실질 수익을 지키세요.";
  } else if(journal.length>=3){
    style="균형형"; desc="주식과 안전자산을 함께 보유해 변동성을 분산하고 있습니다."; advice="자산 비중이 목표에서 벗어나면 정기적으로 리밸런싱하세요.";
  }
  return {style,desc,advice,buys,sells,winRate,realized,stockPct,safePct,top};
}

// 다음 배당까지 남은 초와 예상 배당금(원화 환산)

}

// ── 가격 차트(최근 60틱 스파크라인) ───────────────────────
function sparklineSVG(s){
  const data = (s.hist && s.hist.length > 1) ? s.hist : [s.start, s.price];
  const min = Math.min(...data), max = Math.max(...data), span = (max - min) || 1;
  const w = 100, h = 28, step = w / Math.max(1, data.length - 1);
  const points = data.map((v, i) => `${(i * step).toFixed(1)},${(h - ((v - min) / span) * h).toFixed(1)}`).join(" ");
  const up = data[data.length - 1] >= data[0];
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${points}" fill="none" stroke="${up ? "#0f766e" : "#b42318"}" stroke-width="1.6"/></svg>`;
}
// 그래프 위 마우스 위치를 실제 가격으로 바꿔 줍니다. hist는 최근 60틱의 실제 가격입니다.
function sparkPointAt(s, ratio){
  const data=(s.hist && s.hist.length>1)?s.hist:[s.start,s.price];
  const r=Math.max(0,Math.min(1,Number.isFinite(+ratio)?+ratio:0));
  const idx=Math.min(data.length-1,Math.round(r*(data.length-1)));
  const price=+data[idx]||0;
  const base=+s.start>0?+s.start:1;
  return {price,index:idx,count:data.length,pct:(price-base)/base};
}
function sparklineHTML(s){
  return `${sparklineSVG(s)}<span class="spark-tip" data-spark-tip="${s.id}"></span>`;
}
function sparkHover(ev,id){
  const s=stock(id); if(!s || !ev || !ev.currentTarget) return;
  const host=ev.currentTarget, tip=host.querySelector(`[data-spark-tip="${id}"]`);
  const rect=host.getBoundingClientRect();
  if(!tip || !rect || !(rect.width>0)) return;
  const ratio=(+ev.clientX-rect.left)/rect.width;
  const point=sparkPointAt(s,ratio);
  tip.innerHTML=`<b>${isForeignStock(s)?usdStr(point.price):won(point.price)}</b> 시작가 대비 ${pct(point.pct)}`;
  tip.classList.add("on");
  // 툴팁 폭까지 고려해 카드 밖으로 넘치지 않게 합니다(320px 화면 대응).
  const half=Math.min(rect.width/2,(tip.offsetWidth||140)/2+4);
  const x=point.index/Math.max(1,point.count-1)*rect.width;
  tip.style.left=Math.max(half,Math.min(rect.width-half,x))+"px";
}
function sparkLeave(id){
  document.querySelectorAll(`[data-spark="${id}"] [data-spark-tip]`).forEach(tip=>tip.classList.remove("on"));
}

// ── 예약(지정가) 주문 ────────────────────────────────
function placeOrder(){
  const stockId = $("order-stock") ? $("order-stock").value : "";
  const type = (($("order-type")||{}).value) || "limit";
  const side = (($("order-side")||{}).value) || "buy";
  const qty = Math.floor(+($("order-qty") ? $("order-qty").value : 0) || 0);
  const limit = +($("order-limit") ? $("order-limit").value : 0) || 0;
  const trail = Math.max(1, Math.min(50, Math.floor(+((($("order-trail")||{}).value)) || 5)));
  const every = Math.max(15, Math.min(600, Math.floor(+((($("order-every")||{}).value)) || 60)));
  const takeProfit = +((($("order-tp")||{}).value)) || 0;
  const stopPrice = +((($("order-sl")||{}).value)) || 0;
  const entry = +((($("order-entry")||{}).value)) || 0;
  const s = stock(stockId);
  if(!s) return alert("예약할 종목을 선택해 주세요.");
  const id = `o${Date.now()}${Math.floor(Math.random()*1000)}`;
  const account = state.tax.mode, held = accountQty(s,account);
  const priceText = isForeignStock(s) ? usdStr(limit) : won(limit);
  if(type === "dca"){
    if(limit < 10000) return alert("분할 매수 금액은 1만원 이상이어야 합니다.");
    state.orders.push({id, stockId, type:"dca", side:"buy", amount:limit, every, lastAt:state.marketSeconds, account});
    addLog(`🔁 분할 매수 예약: ${s.name} ${won(limit)} / ${every}초 · ${taxModeLabel(account)}`);
  } else if(type === "trailing"){
    if(held <= 0) return alert("현재 계좌에 보유 중인 종목만 트레일링 스톱을 걸 수 있습니다.");
    state.orders.push({id, stockId, type:"trailing", side:"sell", qty:qty||held, trail, peak:s.price, account});
    addLog(`📉 트레일링 스톱: ${s.name} ${qty||held}주 · 고점 대비 -${trail}% · ${taxModeLabel(account)}`);
  } else if(type === "oco"){
    if(qty <= 0 || takeProfit <= 0 || stopPrice <= 0) return alert("수량·익절가·손절가를 모두 입력해 주세요.");
    if(held < qty) return alert("현재 계좌의 보유 수량이 부족합니다.");
    if(!(takeProfit > stopPrice)) return alert("익절가는 손절가보다 높아야 합니다.");
    state.orders.push({id, stockId, type:"oco", side:"sell", qty, takeProfit, stopPrice, account});
    addLog(`🎯 OCO 주문: ${s.name} ${qty}주 · 익절 ${won(takeProfit)} / 손절 ${won(stopPrice)} · ${taxModeLabel(account)}`);
  } else if(type === "bracket"){
    if(qty <= 0 || entry <= 0 || takeProfit <= 0 || stopPrice <= 0) return alert("수량·진입가·익절가·손절가를 모두 입력해 주세요.");
    if(!(takeProfit > entry && entry > stopPrice)) return alert("익절가 > 진입가 > 손절가 순서로 입력해 주세요.");
    state.orders.push({id, stockId, type:"bracket", side:"buy", qty, entry, takeProfit, stopPrice, account});
    addLog(`🧩 브래킷 주문: ${s.name} ${qty}주 · 진입 ${won(entry)} 돌파 시 매수 후 OCO · ${taxModeLabel(account)}`);
  } else if(type === "stop"){
    if(qty <= 0 || limit <= 0) return alert("수량과 조건 가격을 입력해 주세요.");
    if(side === "sell" && held < qty) return alert("현재 계좌의 보유 수량이 부족합니다.");
    state.orders.push({id, stockId, type:"stop", side, qty, limit, account});
    addLog(`🛑 조건 주문: ${s.name} ${side==="buy"?"돌파 매수":"손절 매도"} ${qty}주 @ ${priceText} · ${taxModeLabel(account)}`);
  } else {
    if(qty <= 0 || limit <= 0) return alert("수량과 지정가를 올바르게 입력해 주세요.");
    if(side === "sell" && held < qty) return alert("현재 계좌의 보유 수량이 부족합니다.");
    state.orders.push({id, stockId, type:"limit", side, qty, limit, account});
    addLog(`예약 주문: ${s.name} ${side === "buy" ? "매수" : "매도"} ${qty}주 @ ${priceText} · ${taxModeLabel(account)}`);
  }
  saveGame(); portfolio(); update();
}

function cancelOrder(oid){
  const before = state.orders.length;
  state.orders = state.orders.filter(o => o.id !== oid);
  if(state.orders.length !== before) addLog("예약 주문을 취소했습니다.");
  saveGame(); portfolio();
}

// 예약 주문 체결: 지정가·조건(손절/돌파)·트레일링 스톱·분할 매수(DCA)를 처리합니다.
// 휴장 중에는 지정가·조건·트레일링이 대기하고, 분할 매수도 개장 후에만 실행됩니다.
function processOrders(){
  if(!state.orders.length) return;
  const remain = [];
  const extra = [];
  state.orders.forEach(o => {
    const s = stock(o.stockId);
    if(!s) return;
    const foreign = isForeignStock(s);
    const px = p => foreign ? usdStr(p) : won(p);
    const acct = TAX_ACCOUNTS.includes(o.account) ? o.account : state.tax.mode;
    if(o.type === "dca"){
      if(state.marketOpen && state.marketSeconds - (o.lastAt||0) >= (o.every||60)){
        const unit = s.price*(1+stockFeeRate())*(foreign?fx.usd:1);
        const qty = Math.max(0,Math.floor((o.amount||0)/unit));
        if(qty>0 && marketBuyShares(s,qty,acct)){
          o.lastAt = state.marketSeconds;
          addLog(`🔁 분할 매수 체결: ${s.name} ${qty}주 @ ${px(s.price)}`);
          notify("order","분할 매수",`${s.name} ${qty}주`);
          bumpDaily("orders");
        }
      }
      remain.push(o); return;
    }
    if(!state.marketOpen){ remain.push(o); return; }
    if(o.type === "oco"){
      if(accountQty(s,acct) < o.qty) return; // 다른 거래로 수량이 사라진 OCO는 자동 취소
      const hitTp=s.price >= o.takeProfit;
      const hitSl=s.price <= o.stopPrice;
      if(!hitTp && !hitSl){ remain.push(o); return; }
      if(marketSellShares(s,o.qty,acct)){
        addLog(`🎯 OCO ${hitTp?"익절":"손절"} 체결: ${s.name} ${o.qty}주 @ ${s.price}`);
        notify("order",hitTp?"OCO 익절 체결":"OCO 손절 체결",`${s.name} ${o.qty}주`);
        bumpDaily("orders");
      } else remain.push(o);
      return;
    }
    if(o.type === "bracket"){
      if(s.price < o.entry){ remain.push(o); return; }
      if(marketBuyShares(s,o.qty,acct)){
        extra.push({id:`o${Date.now()}${Math.floor(Math.random()*1000)}`,stockId:o.stockId,type:"oco",side:"sell",qty:o.qty,takeProfit:o.takeProfit,stopPrice:o.stopPrice,parent:o.id,account:acct});
        addLog(`🧩 브래킷 진입 돌파: ${s.name} ${o.qty}주 @ ${s.price} · OCO 자동 등록`);
        notify("order","브래킷 진입",`${s.name} ${o.qty}주 · OCO 등록`);
        bumpDaily("orders");
      } else remain.push(o);
      return;
    }
    if(o.type === "trailing"){
      o.peak = Math.max(+o.peak||0, s.price);
      const trig = (o.peak||s.price)*(1-(o.trail||5)/100);
      if(s.price > trig){ remain.push(o); return; }
      const qty = Math.min(o.qty||accountQty(s,acct), accountQty(s,acct));
      if(qty>0 && marketSellShares(s,qty,acct)){
        addLog(`📉 트레일링 스톱 매도: ${s.name} ${qty}주 @ ${px(s.price)}`);
        notify("order","트레일링 스톱",`${s.name} ${qty}주`);
        bumpDaily("orders");
      }
      return;
    }
    if(o.type === "stop"){
      const hit = o.side === "buy" ? s.price >= o.limit : s.price <= o.limit;
      if(!hit){ remain.push(o); return; }
      if(o.side === "buy"){
        if(marketBuyShares(s,o.qty,acct)){
          addLog(`🛑 돌파 매수 체결: ${s.name} ${o.qty}주 @ ${px(s.price)}`);
          notify("order","돌파 매수",`${s.name} ${o.qty}주`);
          bumpDaily("orders");
        } else remain.push(o);
      } else {
        if(accountQty(s,acct) < o.qty){ remain.push(o); return; }
        if(marketSellShares(s,o.qty,acct)){
          addLog(`🛑 손절 매도 체결: ${s.name} ${o.qty}주 @ ${px(s.price)}`);
          notify("order","손절 매도",`${s.name} ${o.qty}주`);
          bumpDaily("orders");
        }
      }
      return;
    }
    // 지정가 주문
    const hit = o.side === "buy" ? s.price <= o.limit : s.price >= o.limit;
    if(!hit){ remain.push(o); return; }
    if(o.side === "buy"){
      if(marketBuyShares(s,o.qty,acct)){
        addLog(`⏱ 예약 매수 체결: ${s.name} ${o.qty}주 @ ${px(s.price)}`);
        notify("order","지정가 매수 체결",`${s.name} ${o.qty}주`);
        bumpDaily("orders");
      } else remain.push(o);
    } else {
      if(accountQty(s,acct) < o.qty){ remain.push(o); return; }
      const p=taxPreviewFor(s,o.qty,acct);
      if(marketSellShares(s,o.qty,acct)){
        addLog(`⏱ 예약 매도 체결: ${s.name} ${o.qty}주 @ ${px(s.price)}`);
        notify("order","지정가 매도 체결",`${s.name} ${o.qty}주 · ${won(p.profitKRW)}`);
        bumpDaily("orders");
      }
    }
  });
  state.orders = remain.concat(extra);
}

// ── 세금 ────────────────────────────────────────
// 양도소득세: 일반 계좌는 연 2,500만원 공제 후 22%, ISA는 200만원 공제 후 9.9%,
// 연금저축은 매도 시점에 과세하지 않고 인출할 때 5.5%를 납부합니다.
function taxProjection(profitKRW, account){
  ensureAdvancedState();
  const t=state.tax, acct=TAX_ACCOUNTS.includes(account)?account:t.mode, profit=+profitKRW||0;
  const base={account:acct,profit,tax:0,taxable:0,carryUsed:0,deferred:0};
  if(!(profit>0)) return base;
  if(acct==="pension") return Object.assign(base,{deferred:profit});
  if(acct==="isa"){
    const gains=(+t.isaGains||0)+profit;
    const taxable=Math.max(0,Math.max(0,gains-2000000)-(+t.isaTaxed||0));
    return Object.assign(base,{tax:taxable*.099,taxable});
  }
  const realized=(+state.realizedYTD||0)+profit;
  let taxable=Math.max(0,Math.max(0,realized-TAX_GAINS_FREE)-(+state.taxedProfit||0));
  // carryLossBase는 지난 세금연도에서 넘어온 손실만 담습니다. 당해 손실은 realizedYTD에 이미 반영되어
  // 중복 차감되지 않습니다.
  const carryUsed=Math.min(taxable,Math.max(0,+t.carryLossBase||0));
  taxable=Math.max(0,taxable-carryUsed);
  return Object.assign(base,{tax:taxable*TAX_GAINS_RATE,taxable,carryUsed});
}
function settleTax(profitKRW, account){
  ensureAdvancedState();
  const t=state.tax, acct=TAX_ACCOUNTS.includes(account)?account:t.mode, profit=+profitKRW||0;
  if(!profit){ return 0; }
  // 계좌별 손익은 서로 섞지 않습니다. state.realizedYTD와 state.taxedProfit은
  // 일반 계좌 전용이고, ISA는 isaGains/isaTaxed, 연금은 pensionDeferred를 사용합니다.
  if(profit<0){
    if(acct==="general"){
      state.realizedYTD=(state.realizedYTD||0)+profit;
      t.carryLoss=Math.min(TAX_GAINS_FREE*2,t.carryLoss-profit);
    } else if(acct==="isa"){
      t.isaGains=Math.max(0,t.isaGains+profit);
    } else {
      t.pensionDeferred=Math.max(0,t.pensionDeferred+profit);
    }
    return 0;
  }
  const plan=taxProjection(profit,acct);
  if(acct==="pension"){
    t.pensionDeferred=(t.pensionDeferred||0)+profit;
    addLog(`연금저축 세금 이연: ${won(profit*.055)} (인출 시 5.5%)`);
    return 0;
  }
  if(acct==="isa"){
    t.isaGains=(t.isaGains||0)+profit;
    if(plan.taxable>0){
      const tax=plan.tax;
      t.isaTaxed=(t.isaTaxed||0)+plan.taxable;
      state.taxPaid=(state.taxPaid||0)+tax;
      t.taxPaidByAccount.isa+=tax;
      if(state.cash>=tax) state.cash-=tax; else { state.loan=(state.loan||0)+(tax-state.cash); state.cash=0; }
      addLog(`ISA 양도세 원천징수: ${won(tax)} (ISA 누적 실현손익 ${won(t.isaGains)})`);
      notify("tax","ISA 양도세",won(tax));
    }
    return plan.tax;
  }
  state.realizedYTD=(state.realizedYTD||0)+profit;
  if(plan.carryUsed>0){ t.carryLoss=Math.max(0,t.carryLoss-plan.carryUsed); t.carryLossBase=Math.max(0,t.carryLossBase-plan.carryUsed); }
  if(plan.taxable>0){
    const tax=plan.tax;
    state.taxedProfit=(state.taxedProfit||0)+plan.taxable;
    state.taxPaid=(state.taxPaid||0)+tax;
    t.taxPaidByAccount.general+=tax;
    if(state.cash>=tax){ state.cash-=tax; }
    else { state.loan=(state.loan||0)+(tax-state.cash); state.cash=0; }
    addLog(`양도세 원천징수: ${won(tax)} (연 누적 실현손익 ${won(state.realizedYTD)})`);
    notify("tax","양도세 원천징수",`${won(tax)}`);
    return tax;
  }
  return 0;
}

// ── 신용 대출 ───────────────────────────────────
function loanPolicy(){ return LOAN_POLICY[currentGrade()] || LOAN_POLICY["브론즈"]; }

function borrowLoan(){
  const pol = loanPolicy();
  if(pol.limit <= 0) return alert("대출은 실버 등급부터 이용할 수 있습니다.");
  const avail = Math.max(0, pol.limit - (state.loan || 0));
  const amt = Math.floor((+($("loan-amt") ? $("loan-amt").value : 0) || 0) / 10000) * 10000;
  if(amt <= 0) return alert("대출 금액을 입력해 주세요.");
  if(amt > avail) return alert(`대출 한도를 초과했습니다. (가능 ${won(avail)})`);
  state.loan = (state.loan || 0) + amt;
  state.loanRate = pol.rate;
  state.loanTotal = (state.loanTotal || 0) + amt;
  state.cash += amt;
  addLog(`신용 대출 실행: ${won(amt)} (연 ${(pol.rate * 100).toFixed(1)}%)`);
  saveGame(); portfolio(); update();
}

function repayLoan(){
  const loan = state.loan || 0;
  if(loan <= 0) return alert("상환할 대출이 없습니다.");
  let amt = Math.floor((+($("loan-amt") ? $("loan-amt").value : 0) || 0) / 10000) * 10000;
  amt = Math.min(amt || loan, loan, Math.floor(state.cash));
  if(amt <= 0) return alert("상환할 현금이 부족합니다.");
  state.loan = loan - amt;
  state.cash -= amt;
  if(state.loan <= 0){ state.loan = 0; state.loanRate = 0; }
  addLog(`대출 상환: ${won(amt)} (남은 잔액 ${won(state.loan)})`);
  saveGame(); portfolio(); update();
}

// 대출 전액 상환: 입력값과 무관하게 보유 현금으로 최대한 갚습니다.
function repayLoanFull(){
  const loan=state.loan||0;
  if(loan<=0) return alert("상환할 대출이 없습니다.");
  const amt=Math.min(loan,Math.floor(state.cash));
  if(amt<=0) return alert("상환할 현금이 부족합니다.");
  state.loan=loan-amt;
  state.cash-=amt;
  if(state.loan<=0){ state.loan=0; state.loanRate=0; }
  addLog(`대출 전액 상환: ${won(amt)} (남은 잔액 ${won(state.loan)})`);
  saveGame(); portfolio(); update();
}

// ── 배당·실적 발표 ───────────────────────────────
function applyShock(s, move){
  // 장중 충격도 전일 종가 ±30% 안에서만 움직입니다.
  const before=s.price;
  s.price = clampDailyPrice(s, s.price * (1 + move));
  s.lastMove = before>0?(s.price-before)/before:0;
}

function payDividends(){
  let totalKRW = 0;
  const dividendBonus=rebirthBonus("dividend",.03);
  stocks.forEach(s => {
    if(s.own <= 0) return;
    const amount = s.price * s.own * DIVIDEND_YIELD * dividendBonus;
    if(isForeignStock(s)){ state.usd += amount; totalKRW += amount * fx.usd; }
    else { state.cash += amount; totalKRW += amount; }
  });
  if(totalKRW <= 0) return;
  state.dividendTotal = (state.dividendTotal || 0) + totalKRW;
  bumpDaily("dividends");
  addLog(`💰 배당금 지급: ${won(totalKRW)}`);
  publishBreakingNews("💰 배당 지급", `보유 주식 배당금 ${won(totalKRW)}이 지급되었습니다.`);
  notify("dividend","배당금 지급",`${won(totalKRW)}`);
}

function ensureStockFundamentals(s){
  if(!s) return;
  if(!Number.isFinite(+s.revenue)||+s.revenue<=0) s.revenue=Math.max(100000000,Math.round((+s.start||s.price||1000)*10000));
  if(!Number.isFinite(+s.opProfit)||+s.opProfit<0) s.opProfit=Math.round(s.revenue*.12);
}
function earningsSurprise(target){
  if(!stocks.length) return;
  const pool=stocks.filter(s=>!isIndexFund(s));
  const s = (target&&target.id&&stock(target.id)) || (target&&target.stockId&&stock(target.stockId)) || pool[Math.floor(Math.random() * pool.length)];
  if(!s) return;
  ensureStockFundamentals(s);
  // 매출 성장률과 영업이익률 변화가 함께 주가 방향을 결정합니다.
  const revGrowth=(Math.random()-.45)*.18;
  const marginBefore=s.opProfit/Math.max(1,s.revenue);
  const marginAfter=Math.max(.005,Math.min(.45,marginBefore+(Math.random()-.5)*.06));
  const revenue=Math.max(100000000,Math.round(s.revenue*(1+revGrowth)));
  const opProfit=Math.max(0,Math.round(revenue*marginAfter));
  const opGrowth=(opProfit-s.opProfit)/Math.max(1,s.opProfit);
  const score=revGrowth*.55+opGrowth*.45;
  const beat=score>=0;
  s.revenue=revenue; s.opProfit=opProfit;
  const move=Math.max(-.15,Math.min(.15,score*.7+(beat?.005:-.005)));
  applyShock(s, move);
  publishBreakingNews("📊 실적 발표", `${s.name} ${beat?"어닝 서프라이즈":"어닝 쇼크"}! 매출 ${won(revenue)} (${pct(revGrowth)}) · 영업이익 ${won(opProfit)} (${pct(opGrowth)}) · 주가 ${pct(move)}`);
  notify("earnings","실적 발표",`${s.name} ${beat?"서프라이즈":"쇼크"} · 주가 ${pct(move)}`);
  return {stockId:s.id,name:s.name,revenue,opProfit,beat,move,at:state.marketSeconds};
}

// ── 확장 상태 보정 · 세금 로트 · 실적 캘린더 · 리스크 · 챌린지 ─────────
function ensureAdvancedState(){
  if(!Array.isArray(state.calendar)) state.calendar=[];
  if(!Array.isArray(state.disclosures)) state.disclosures=[];
  if(!state.tax || typeof state.tax!=="object") state.tax={mode:"general",carryLoss:0,carryLossBase:0,pensionDeferred:0,isaGains:0,isaTaxed:0,splitVersion:1,
    contributions:{general:0,isa:0,pension:0},taxPaidByAccount:{general:0,isa:0,pension:0},year:1,yearStart:state.marketSeconds||0};
  const t=state.tax;
  if(!TAX_ACCOUNTS.includes(t.mode)) t.mode="general";
  ["carryLoss","carryLossBase","pensionDeferred","isaGains","isaTaxed"].forEach(k=>{ t[k]=Math.max(0,+t[k]||0); });
  if(!t.contributions || typeof t.contributions!=="object") t.contributions={general:0,isa:0,pension:0};
  TAX_ACCOUNTS.forEach(k=>{ t.contributions[k]=Math.max(0,+t.contributions[k]||0); });
  if(!t.taxPaidByAccount || typeof t.taxPaidByAccount!=="object"){
    const paid=Math.max(0,+state.taxPaid||0), isaPaid=Math.min(paid,Math.max(0,+t.isaTaxed||0)*.099);
    t.taxPaidByAccount={general:paid-isaPaid,isa:isaPaid,pension:0};
  }
  TAX_ACCOUNTS.forEach(k=>{ t.taxPaidByAccount[k]=Math.max(0,+t.taxPaidByAccount[k]||0); });
  t.year=Math.max(1,Math.floor(+t.year||1));
  t.yearStart=Number.isFinite(+t.yearStart)?Math.max(0,+t.yearStart):Math.max(0,+state.marketSeconds||0);
  // 이전 버전은 ISA·연금 손익까지 realizedYTD에 합산했습니다. 한 번만 분리해
  // 기존 세이브를 불러온 뒤 일반 계좌 세금에 과거 ISA·연금 이익이 다시 잡히지 않게 합니다.
  if(t.splitVersion!==1){
    const total=+state.realizedYTD||0, other=(+t.isaGains||0)+(+t.pensionDeferred||0);
    const general=total-other;
    state.realizedYTD=total>=0?Math.max(0,general):general;
    t.splitVersion=1;
  }
  if(!state.challenge || typeof state.challenge!=="object") state.challenge={active:null,history:[],best:0,last:null};
  if(!Array.isArray(state.challenge.history)) state.challenge.history=[];
  state.challenge.best=Math.max(0,+state.challenge.best||0);
  if(!state.ui || typeof state.ui!=="object") state.ui={assetTab:"overview",mobileStock:""};
  if(typeof state.ui.mobileStock!=="string") state.ui.mobileStock="";
  if(!["base","crash","rate","fx"].includes(state.riskScenario)) state.riskScenario="base";
  return state;
}

// FIFO 세금 로트: 계좌·취득원가를 남기고, 매도할 때 해당 계좌의 오래된 로트부터 소진합니다.
function lotAccount(l){ return TAX_ACCOUNTS.includes(l&&l.account)?l.account:"general"; }
function ensureTaxLots(s){
  if(!s) return [];
  if(!Array.isArray(s.taxLots)) s.taxLots=[];
  s.taxLots=s.taxLots.filter(l=>l&&+l.qty>0).map(l=>({qty:Math.max(0,Math.floor(+l.qty||0)),price:Math.max(0,+l.price||0),at:Math.max(0,+l.at||0),account:lotAccount(l)}));
  const total=s.taxLots.reduce((a,l)=>a+l.qty,0);
  if(total<(+s.own||0)) s.taxLots.push({qty:(+s.own||0)-total,price:Math.max(0,+s.avgBuy||+s.price||0),at:0,account:"general"});
  else if(total>(+s.own||0)){
    let excess=total-(+s.own||0);
    for(let i=s.taxLots.length-1;i>=0&&excess>0;i--){
      const take=Math.min(excess,s.taxLots[i].qty);
      s.taxLots[i].qty-=take; excess-=take;
      if(s.taxLots[i].qty<=0) s.taxLots.splice(i,1);
    }
  }
  return s.taxLots;
}
function accountLots(s,account){ return ensureTaxLots(s).filter(l=>l.account===(account||state.tax.mode)); }
function accountQty(s,account){ return accountLots(s,account).reduce((a,l)=>a+l.qty,0); }
function accountAvgBuy(s,account){
  const lots=accountLots(s,account), qty=lots.reduce((a,l)=>a+l.qty,0);
  return qty>0?lots.reduce((a,l)=>a+l.qty*l.price,0)/qty:0;
}
// 매수 직후(s.own에 이미 수량이 더해진 뒤) 호출합니다. 기존 보유분의 로트가 없으면
// 평단가로 보완한 뒤 새 로트를 추가해, 같은 수량이 두 번 잡히지 않게 합니다.
function addTaxLot(s,qty,price,account){
  const n=Math.max(0,Math.floor(+qty||0));
  if(!s||!n) return;
  if(!Array.isArray(s.taxLots)) s.taxLots=[];
  s.taxLots=s.taxLots.filter(l=>l&&+l.qty>0).map(l=>({qty:Math.max(0,Math.floor(+l.qty||0)),price:Math.max(0,+l.price||0),at:Math.max(0,+l.at||0),account:lotAccount(l)}));
  const previousOwn=Math.max(0,(+s.own||0)-n);
  const total=s.taxLots.reduce((a,l)=>a+l.qty,0);
  if(total<previousOwn) s.taxLots.push({qty:previousOwn-total,price:Math.max(0,+s.avgBuy||+s.price||0),at:0,account:"general"});
  s.taxLots.push({qty:n,price:Math.max(0,+price||0),at:Math.max(0,+state.marketSeconds||0),account:TAX_ACCOUNTS.includes(account)?account:state.tax.mode});
}
function consumeTaxLots(s,qty,account){
  const acct=TAX_ACCOUNTS.includes(account)?account:state.tax.mode, lots=ensureTaxLots(s);
  let left=Math.max(0,Math.floor(+qty||0)), basis=0;
  for(let i=0;i<lots.length&&left>0;){
    const l=lots[i];
    if(l.account!==acct){ i++; continue; }
    const take=Math.min(left,l.qty);
    basis+=take*l.price; l.qty-=take; left-=take;
    if(l.qty<=0) lots.splice(i,1); else i++;
  }
  // 구버전 세이브 등 계좌 로트가 부족한 경우 평단가로 보완합니다.
  if(left>0) basis+=left*Math.max(0,+s.avgBuy||+s.price||0);
  return basis;
}
function moveTaxLots(s,qty,from,to){
  if(!s||!TAX_ACCOUNTS.includes(from)||!TAX_ACCOUNTS.includes(to)||from===to) return 0;
  let left=Math.max(0,Math.floor(+qty||0)), moved=0, lots=ensureTaxLots(s);
  for(const l of lots){
    if(left<=0) break;
    if(l.account!==from) continue;
    const take=Math.min(left,l.qty);
    if(take<=0) continue;
    if(take===l.qty){ l.account=to; }
    else { l.qty-=take; lots.push({qty:take,price:l.price,at:l.at,account:to}); }
    left-=take; moved+=take;
  }
  return moved;
}
function taxModeLabel(mode){ return mode==="isa"?"ISA 절세 계좌":mode==="pension"?"연금저축 계좌":"일반 위탁 계좌"; }
function taxAccountRealized(mode,t){
  t=t||state.tax||{};
  if(mode==="isa") return +t.isaGains||0;
  if(mode==="pension") return +t.pensionDeferred||0;
  return +state.realizedYTD||0;
}
function taxAccountLimit(mode){ return TAX_ACCOUNT_LIMITS[mode]??Infinity; }
function taxContributionUsed(mode){ const t=ensureAdvancedState().tax; return Math.max(0,+((t.contributions||{})[mode])||0); }
function taxContributionRoom(mode){
  const limit=taxAccountLimit(mode);
  return Number.isFinite(limit)?Math.max(0,limit-taxContributionUsed(mode)):Infinity;
}
function canTaxContribute(mode,amountKRW){

}
function addTaxContribution(mode,amountKRW){

}

const CALENDAR_SIZE=4;
function ensureCalendar(force){
  ensureAdvancedState();
  const pool=stocks.filter(s=>!isIndexFund(s));
  const valid=id=>!!stock(id);
  state.calendar=state.calendar.filter(e=>e&&valid(e.stockId));
  if(force || !state.calendar.length){
    state.calendar=[];
    pool.slice(0,CALENDAR_SIZE).forEach((s,i)=>{
      state.calendar.push({stockId:s.id, at:state.marketSeconds+45+i*120+((state.marketSeconds+i*7)%17), kind:"earnings"});
    });
  } else {
    const scheduled=new Set(state.calendar.map(e=>e.stockId));
    const need=Math.max(0,CALENDAR_SIZE-state.calendar.length);
    pool.filter(s=>!scheduled.has(s.id)).slice(0,need).forEach((s,i)=>{
      state.calendar.push({stockId:s.id, at:state.marketSeconds+180+i*40, kind:"earnings"});
    });
  }
  state.calendar.sort((a,b)=>a.at-b.at);
  return state.calendar;
}
function tickCalendar(){
  ensureCalendar();
  const now=state.marketSeconds;
  const due=state.calendar.filter(e=>+e.at<=now);
  if(due.length){
    state.calendar=state.calendar.filter(e=>+e.at>now);
    due.slice(0,3).forEach(e=>{ const s=stock(e.stockId); if(s) earningsSurprise(s); });
    ensureCalendar();
  }
}

// 리스크 대시보드
function maxDrawdownPct(){
  const pts=assetHistory.points||[];
  let peak=0, max=0;
  pts.forEach(p=>{ const v=Math.max(0,+p.v||0); peak=Math.max(peak,v); if(peak>0) max=Math.max(max,(peak-v)/peak); });
  return max;
}
function portfolioVolatility(){
  const pts=(assetHistory.points||[]).slice(-31);
  if(pts.length<3) return 0;
  const rets=[];
  for(let i=1;i<pts.length;i++){ const a=+pts[i-1].v||0, b=+pts[i].v||0; if(a>0) rets.push((b-a)/a); }
  if(rets.length<2) return 0;
  const mean=rets.reduce((a,b)=>a+b,0)/rets.length;
  const variance=rets.reduce((a,b)=>a+(b-mean)*(b-mean),0)/rets.length;
  return Math.sqrt(variance);
}
function topHoldingInfo(){
  const total=stockValueKRW();
  const held=stocks.filter(s=>s.own>0).map(s=>({name:s.name,value:stockPriceKRW(s)*s.own})).sort((a,b)=>b.value-a.value);
  const top=held[0]||{name:"-",value:0};
  return {top, pct:total>0?top.value/total:0, count:held.length};
}
function pairCorrelation(a,b){
  const n=Math.min((a.hist||[]).length,(b.hist||[]).length,30);
  if(n<4) return null;
  const ar=(a.hist||[]).slice(-n), br=(b.hist||[]).slice(-n);
  const ax=[], bx=[];
  for(let i=1;i<n;i++){ if(ar[i-1]>0&&br[i-1]>0){ ax.push(ar[i]/ar[i-1]-1); bx.push(br[i]/br[i-1]-1); } }
  if(ax.length<3) return null;
  const ma=ax.reduce((x,y)=>x+y,0)/ax.length, mb=bx.reduce((x,y)=>x+y,0)/bx.length;
  let cov=0, va=0, vb=0;
  for(let i=0;i<ax.length;i++){ const da=ax[i]-ma, db=bx[i]-mb; cov+=da*db; va+=da*da; vb+=db*db; }
  return va>0&&vb>0?cov/Math.sqrt(va*vb):null;
}
function topCorrelationInfo(){
  const held=stocks.filter(s=>s.own>0).slice(0,6);
  let best=null;
  for(let i=0;i<held.length;i++) for(let j=i+1;j<held.length;j++){
    const c=pairCorrelation(held[i],held[j]);
    if(c==null) continue;
    if(!best || Math.abs(c)>Math.abs(best.corr)) best={a:held[i].name,b:held[j].name,corr:c};
  }
  return best;
}
function riskMetrics(){
  const total=netAssetsKRW(), equity=stockValueKRW(), top=topHoldingInfo(), corr=topCorrelationInfo();
  return {total,equityPct:total>0?equity/total:0,debtRatio:total>0?(state.loan||0)/Math.max(1,grossAssetsKRW()):0,maxDD:maxDrawdownPct(),vol:portfolioVolatility(),top,corr};
}
function stressTest(kind){
  const total=netAssetsKRW(), equity=stockValueKRW(), company=companyValue(), estate=estateValue();
  const usdAssets=(state.usd||0)*fx.usd + stocks.filter(isForeignStock).reduce((a,s)=>a+s.price*s.own*fx.usd,0);
  const shortNotional=(state.shorts||[]).reduce((a,p)=>{ const st=stock(p.stockId); return a+(+p.entry||0)*(+p.qty||0)*(st&&isForeignStock(st)?fx.usd:1); },0);
  let delta=0, label="기준", detail="현재 상태 그대로입니다.";
  if(kind==="crash"){
    delta=-(equity+company)*.15-estate*.05+shortNotional*.15;
    label="시장 -15%"; detail="주식·기업 가치 -15%, 부동산 -5%, 공매도 포지션 +15% 완충을 가정합니다.";

  }

const CHALLENGES=[
  {id:"sprint",name:"10분 스프린트",seconds:600,target:.08,reward:2000000,desc:"현재 순자산에서 10분 안에 +8%"},

];
function ensureChallenge(){ return ensureAdvancedState().challenge; }
function challengeSpec(id){ return CHALLENGES.find(c=>c.id===id)||null; }
function challengeProgress(c){ return c&&c.startNet>0?(netAssetsKRW()-c.startNet)/c.startNet:0; }
function startChallenge(id){
  const c=ensureChallenge(), spec=challengeSpec(id);
  if(!spec) return false;
  if(c.active){ alert("이미 진행 중인 챌린지가 있습니다. 먼저 끝내거나 포기해 주세요."); return false; }
  const net=netAssetsKRW();
  if(net<=0){ alert("순자산이 0원보다 커야 챌린지를 시작할 수 있습니다."); return false; }
  c.active={id:spec.id,name:spec.name,startNet:net,target:spec.target,startsAt:state.marketSeconds,endsAt:state.marketSeconds+spec.seconds,reward:spec.reward,lastNet:net};
  c.last=null;
  addLog(`🎯 시나리오 챌린지 시작: ${spec.name} · 목표 ${pct(spec.target)}`);
  saveGame(); dashboardPage(); portfolio(); update();
  notify("mission","챌린지 시작",`${spec.name} · 목표 ${pct(spec.target)}`);
  return true;
}
function finishChallenge(status){
  const c=ensureChallenge(), a=c.active; if(!a) return false;
  const net=netAssetsKRW();
  const result={...a,status,endedAt:state.marketSeconds,finalNet:net,returnPct:challengeProgress(a)};
  if(status==="success"){
    state.cash=(state.cash||0)+(+a.reward||0);
    addLog(`🏆 챌린지 성공: ${a.name} · 보상 ${won(a.reward)}`);
    notify("mission","챌린지 성공",`${a.name} · +${won(a.reward)}`);
  } else {
    addLog(`🎯 챌린지 종료: ${a.name} · ${pct(result.returnPct)}`);
    notify("mission","챌린지 종료",`${a.name} · 목표 미달 ${pct(result.returnPct)}`);
  }
  c.history.unshift(result); c.history=c.history.slice(0,10);
  c.best=Math.max(c.best||0,result.returnPct||0);
  c.active=null; c.last=result;
  saveGame(); dashboardPage(); portfolio(); update();
  return true;
}
function cancelChallenge(){
  const c=ensureChallenge(); if(!c.active) return false;
  if(!confirm("진행 중인 챌린지를 포기할까요? 게임 진행은 초기화되지 않습니다.")) return false;
  return finishChallenge("canceled");
}
function tickChallenges(){
  const c=ensureChallenge(), a=c.active; if(!a) return;
  const net=netAssetsKRW(); a.lastNet=net;
  const target=a.startNet*(1+a.target);
  if(net>=target) finishChallenge("success");
  else if(state.marketSeconds>=a.endsAt) finishChallenge("fail");
}

  }).join("");

  const last=c.last?`<p class="muted-sm" style="margin-top:8px">최근 결과: <b>${c.last.name}</b> · ${c.last.status==="success"?"성공":c.last.status==="canceled"?"포기":"미달"} · ${pct(c.last.returnPct||0)}</p>`:"";
  return `<section class="section"><div class="section-head"><h3>시나리오 챌린지</h3><span class="pill">현재 진행에서 시작 · 초기화 없음</span></div><div class="panel"><p class="muted-sm">현재 순자산을 시작점으로 기록하고 제한 시간 안에 목표 수익률을 달성합니다. 실패해도 자산·진행은 초기화되지 않습니다.</p><div class="challenge-grid" style="margin-top:10px">${cards}</div>${progress}${last}</div></section>`;
}

  const s=stock(((($("mobile-stock")||{}).value)||(state.ui&&state.ui.mobileStock)||""));
  if(!s){ box.textContent="거래할 종목이 없습니다."; return; }
  const acct=state.tax.mode, max=maxBuyQty(s), available=accountQty(s,acct);
  const qty=Math.max(1,Math.floor(+((($("mobile-trade-qty")||{}).value)||1)||1));
  const p=taxPreviewFor(s,Math.min(qty,Math.max(1,available)),acct);
  const taxText=available>0&&p.ok?`<div>${acct==="pension"?`인출세 이연 ${won(Math.max(0,p.profitKRW*.055))}`:`예상 세금 ${won(p.tax)} · 세후 ${won(p.netKRW)}`}</div>`:"";
  box.innerHTML=`<div>${taxModeLabel(acct)} · 매수 가능 ${max.toLocaleString("ko-KR")}주 · 매도 가능 ${available.toLocaleString("ko-KR")}주</div>${taxText}`;
}
function mobileTradeSelect(id){
  ensureAdvancedState();
  if(stock(id)) state.ui.mobileStock=id;
  renderMobileTradeInfo();
}
function mobileTrade(side){
  ensureAdvancedState();
  const s=stock(((($("mobile-stock")||{}).value)||state.ui.mobileStock)||"");
  if(!s) return alert("거래할 종목을 선택해 주세요.");
  const qty=Math.floor(+((($("mobile-trade-qty")||{}).value)||0)||0);
  if(qty<=0) return alert("수량을 1주 이상 입력해 주세요.");
  if(!checkMarketOpen()) return false;
  const acct=state.tax.mode;
  if(side==="buy"){
    if(qty>maxBuyQty(s)) return alert("수수료 포함 잔고 또는 계좌 납입한도가 부족합니다.");
    const cost=s.price*(1+stockFeeRate())*qty, principalKRW=s.price*qty*(isForeignStock(s)?fx.usd:1);
    if(!canTaxContribute(acct,principalKRW)) return alert(`${taxModeLabel(acct)} 연간 납입한도가 부족합니다.`);
    if(!confirmTrade("모바일 매수",`${s.name} ${qty}주 · ${taxModeLabel(acct)}`)) return false;
    if(!marketBuyShares(s,qty,acct)) return alert("주문을 처리하지 못했습니다.");
    addLog(`📱 모바일 매수: ${s.name} ${qty}주 · ${taxModeLabel(acct)}`);
  } else {
    const available=accountQty(s,acct);
    if(qty>available) return alert(`${taxModeLabel(acct)} 보유 ${available}주까지만 매도할 수 있습니다.`);
    const p=taxPreviewFor(s,qty,acct);
    const taxNote=acct==="pension"?` · 인출세 이연 ${won(Math.max(0,p.profitKRW*.055))}`:` · 예상 세금 ${won(p.tax)} · 세후 ${won(p.netKRW)}`;
    if(!confirmTrade("모바일 매도",`${s.name} ${qty}주 · ${taxModeLabel(acct)}${taxNote}`)) return false;
    if(!marketSellShares(s,qty,acct)) return alert("주문을 처리하지 못했습니다.");
    addLog(`📱 모바일 매도: ${s.name} ${qty}주 · ${taxModeLabel(acct)}`);
  }
  state.ui.mobileStock=s.id;
  saveGame(); update(); renderMobileTradeBar();
  return true;
}

function exportSave(){
  const blob = new Blob([JSON.stringify(buildSaveData(), null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `money-playground-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
  addLog("저장 파일을 내보냈습니다.");
}

function handleImport(ev){
  const file = ev.target.files && ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      applySaveData(JSON.parse(String(reader.result)));
      saveGame(); banking(); fxPage(); portfolio(); update();
      addLog("저장 파일을 불러왔습니다.");
      alert("저장 파일을 불러왔습니다.");
    } catch(e) {
      alert("저장 파일을 읽을 수 없습니다. 형식을 확인해 주세요.");
    }
  };
  reader.readAsText(file);
  ev.target.value = "";
}

// ── 클라우드 저장·월간 리더보드 ─────────────────────────────────
const CLOUD_CREDS_KEY="mp_cloud_creds";
let CLOUD_API="";
try{
  const cm=document.querySelector('meta[name="cloud-api"]');
  CLOUD_API=(cm && cm.getAttribute ? (cm.getAttribute("content")||"") : "").trim().replace(/\/+$/,"");
}catch(e){ CLOUD_API=""; }
let cloudBoard=null, cloudBusy=false;

function cloudConfigured(){ return !!CLOUD_API; }
function setCloudApi(url){ CLOUD_API=String(url||"").trim().replace(/\/+$/,""); try{ portfolio(); }catch(e){} }
function cloudCreds(){
  try{ const v=JSON.parse(localStorage.getItem(CLOUD_CREDS_KEY)||"null"); return v&&v.playerId&&v.token?v:null; }catch(e){ return null; }
}
function setCloudCreds(v){
  try{ if(v) localStorage.setItem(CLOUD_CREDS_KEY,JSON.stringify(v)); else localStorage.removeItem(CLOUD_CREDS_KEY); }catch(e){}
}
function seasonKey(){ return new Date().toISOString().slice(0,7); }
function cloudErr(e){
  const map={no_api:"서버 주소가 설정되지 않았습니다.",unauthorized:"연결이 만료되었습니다. 다시 연결해 주세요.",nickname_taken:"이미 사용 중인 닉네임입니다.",rate_limited:"요청이 너무 많습니다. 잠시 후 다시 시도해 주세요.",bad_nickname:"닉네임은 한글/영문/숫자 2~16자입니다.",conflict:"서버에 더 최신 저장이 있습니다.",too_large:"저장 파일이 너무 큽니다.",bad_save:"서버가 저장 데이터를 거부했습니다.",bad_json:"요청 형식이 올바르지 않았습니다.",no_save:"서버에 저장된 진행이 없습니다."};
  if(e&&e.status===429) return map.rate_limited;
  if(e&&(map[e.code]||map[e.message])) return map[e.code]||map[e.message];
  return "네트워크 오류가 발생했습니다. 연결을 확인해 주세요.";
}

async function cloudCall(path,{method="GET",body,auth=true,timeout=8000}={}){
  if(!CLOUD_API) throw Object.assign(new Error("no_api"),{code:"no_api"});
  const creds=cloudCreds();
  const headers={"content-type":"application/json"};
  if(auth && creds) headers.authorization="Bearer "+creds.token;
  const ctrl=typeof AbortController!=="undefined"?new AbortController():null;
  const timer=ctrl?setTimeout(()=>ctrl.abort(),timeout):0;
  try{
    const res=await fetch(CLOUD_API+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body),signal:ctrl?ctrl.signal:undefined});
    const txt=await res.text();
    let data=null; try{ data=txt?JSON.parse(txt):null; }catch(e){}
    if(!res.ok){
      const err=new Error((data&&data.error)||("http_"+res.status));
      err.code=data&&data.error; err.status=res.status; err.data=data;
      throw err;
    }
    return data;
  } finally { if(timer) clearTimeout(timer); }
}

async function cloudRegister(){
  if(!CLOUD_API){ notify("system","클라우드","서버 주소가 설정되지 않았습니다."); return; }
  const input=document.getElementById("cloud-name");
  const nickname=String(input&&input.value||"").trim();
  if(!/^[\p{L}\p{N} ._-]{2,16}$/u.test(nickname)){ alert("닉네임은 한글/영문/숫자 2~16자로 입력해 주세요."); return; }
  if(cloudBusy) return;
  cloudBusy=true; cloudRenderPanel("연결 중…");
  try{
    const out=await cloudCall("/api/register",{method:"POST",auth:false,body:{nickname}});
    setCloudCreds({playerId:out.playerId,token:out.token,nickname:out.nickname});
    state.cloud=Object.assign({},state.cloud,{nickname:out.nickname,revision:0,lastSync:0});
    saveGame();
    cloudBusy=false;
    notify("system","클라우드 연결",`${out.nickname} 님으로 연결했습니다.`);
    await cloudUpload(false);
    await cloudRefreshBoard();
  }catch(e){
    cloudBusy=false;
    alert("연결하지 못했습니다: "+cloudErr(e));
    cloudRenderPanel();
  }
}

async function cloudUpload(force){
  if(!CLOUD_API){ notify("system","클라우드","서버 주소가 설정되지 않았습니다."); return; }
  if(!cloudCreds()){ notify("system","클라우드","먼저 닉네임으로 연결해 주세요."); return; }
  if(cloudBusy) return;
  cloudBusy=true; cloudRenderPanel("동기화 중…");
  try{
    const data=buildSaveData();
    const out=await cloudCall("/api/save",{method:"PUT",body:{data,revision:state.cloud.revision||0,force:!!force}});
    state.cloud=Object.assign({},state.cloud,{revision:out.revision,lastSync:Date.now()});
    saveGame();
    let extra="";
    try{ const s=await cloudSubmitScore(); if(s&&s.rank) extra=` · 순위 ${s.rank}위`; }catch(e){}
    cloudBusy=false;
    notify("system","클라우드 저장",`서버에 저장했습니다.${extra}`);
    await cloudRefreshBoard();
  }catch(e){
    cloudBusy=false;
    if(e.status===409){
      if(confirm("서버에 이 기기보다 최신 저장이 있습니다.\n확인을 누르면 이 기기 것으로 덮어쓰고, 취소하면 서버 저장을 내려받습니다.")) return cloudUpload(true);
      return cloudDownload();
    }
    notify("system","클라우드 저장 실패",cloudErr(e));
    cloudRenderPanel(cloudErr(e));
  }
}

async function cloudSubmitScore(){
  const out=await cloudCall("/api/score",{method:"POST",body:{season:seasonKey(),score:Math.round(totalAssetsKRW())}});
  state.cloud=Object.assign({},state.cloud,{rank:out.rank,best:out.best,season:out.season});
  saveGame();
  return out;
}

async function cloudDownload(){
  if(!CLOUD_API||!cloudCreds()||cloudBusy) return;
  if(!confirm("서버에 저장된 진행으로 이 기기를 덮어쓸까요?\n현재 진행은 사라집니다.")) return;
  cloudBusy=true; cloudRenderPanel("내려받는 중…");
  try{
    const out=await cloudCall("/api/save");
    if(!out||!out.data) throw Object.assign(new Error("no_save"),{code:"no_save"});
    applySaveData(out.data);
    state.cloud=Object.assign({},state.cloud,{revision:out.revision,lastSync:Date.now()});
    saveGame(); banking(); fxPage(); news(); portfolio(); update(); updateBell(); updateSpeedUI();
    cloudBusy=false;
    notify("system","클라우드 복원","서버 저장을 불러왔습니다.");
    await cloudRefreshBoard();
  }catch(e){
    cloudBusy=false;
    alert(e.code==="no_save"||e.status===404?"서버에 저장된 진행이 아직 없습니다.":"내려받지 못했습니다: "+cloudErr(e));
    cloudRenderPanel();
  }
}

async function cloudRefreshBoard(){
  if(!CLOUD_API||cloudBusy) return;
  try{
    const q=`/api/leaderboard?season=${encodeURIComponent(seasonKey())}&limit=10`;
    cloudBoard=await cloudCall(q,{auth:!!cloudCreds()});
    if(cloudBoard&&cloudBoard.me) state.cloud=Object.assign({},state.cloud,{rank:cloudBoard.me.rank,best:cloudBoard.me.score});
    cloudRenderPanel();
  }catch(e){ cloudRenderPanel(cloudErr(e)); }
}

function cloudSetAuto(on){
  state.cloud=Object.assign({},state.cloud,{auto:!!on});
  saveGame();
  if(on) cloudAutoTick(true);
  cloudRenderPanel();
}

function cloudUnlink(){
  if(!confirm("이 기기에서 클라우드 연결을 해제할까요?\n서버에 저장된 데이터는 남습니다.")) return;
  setCloudCreds(null);
  state.cloud=Object.assign({},state.cloud,{nickname:"",auto:false,revision:0,lastSync:0,rank:0,best:0});
  cloudBoard=null;
  saveGame();
  cloudRenderPanel();
}

function cloudAutoTick(force){
  if(!CLOUD_API||cloudBusy) return;
  if(!cloudCreds()) return;
  if(!force && !(state.cloud&&state.cloud.auto)) return;
  if(!force && Date.now()-(state.cloud.lastSync||0)<60000) return;
  if(typeof navigator!=="undefined" && navigator.onLine===false) return;
  cloudUpload(false);
}

function cloudBoot(){
  if(CLOUD_API && cloudCreds()) cloudRefreshBoard();
}

function escHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function realestatePage(){
  const rent=ESTATES.reduce((a,e)=>a+(((state.estate[e.id]||{}).qty||0)*estatePrice(e.id)*e.rent*rebirthBonus("estate",.04)),0);
  const upkeep=ESTATES.reduce((a,e)=>a+(((state.estate[e.id]||{}).qty||0)*estatePrice(e.id)*e.upkeep),0);
  const cards=ESTATES.map(e=>{
    const h=state.estate[e.id]||{qty:0,avgBuy:0}, price=estatePrice(e.id);
    const r=h.qty*price*e.rent*rebirthBonus("estate",.04), u=h.qty*price*e.upkeep;
    return `<article class="asset-card">
      <div class="asset-head"><div><b>${e.name}</b><small>${e.desc}</small></div><span class="pill">${h.qty}채</span></div>
      <div class="asset-grid"><span>현재가 <b>${won(price)}</b></span><span>월세(60초) <b>${won(r)}</b></span><span>유지비(60초) <b>${won(u)}</b></span><span>평단 <b>${h.avgBuy?won(h.avgBuy):"-"}</b></span></div>
      <div class="button-row"><button class="buy" onclick="buyEstate('${e.id}')">매수</button><button class="ghost" onclick="sellEstate('${e.id}')" ${h.qty?"":"disabled"}>매도</button><button class="ghost" onclick="openAssetDetail('estate','${e.id}')">상세</button></div>
    </article>`;
  }).join("");
  const metals=METALS.map(m=>{
    const h=state.metals[m.id]||{qty:0,avg:0}, price=metalPrice(m.id);
    return `<article class="asset-card">
      <div class="asset-head"><div><b>${m.name}</b><small>원자재 · ${m.unit} 단위</small></div><span class="pill">${h.qty}${m.unit}</span></div>
      <div class="asset-grid"><span>현재가 <b>${won(price)}</b></span><span>평가액 <b>${won(h.qty*price)}</b></span><span>평단 <b>${h.avg?won(h.avg):"-"}</b></span></div>
      <div class="button-row"><input id="metal-qty-${m.id}" type="number" min="1" step="1" value="1" class="qty-input"><button class="buy" onclick="buyMetal('${m.id}')">매수</button><button class="ghost" onclick="sellMetal('${m.id}')" ${h.qty?"":"disabled"}>매도</button><button class="ghost" onclick="openAssetDetail('metal','${m.id}')">상세</button></div>
    </article>`;
  }).join("");
  $("realestate").innerHTML=`${pageHeader("ASSETS","부동산 · 실물자산","임대 수익과 시세 차익을 함께 노리는 실물 자산입니다.",`<span class="pill">보유 평가 ${won(estateValue()+metalValue())}</span>`)}
    <section class="kpi-strip">
      <div class="metric"><small>부동산 평가</small><b>${wonShort(estateValue())}</b></div>
      <div class="metric"><small>월세 수입(60초)</small><b>${won(rent)}</b><span class="muted-sm">유지비 ${won(upkeep)}</span></div>
      <div class="metric"><small>실물자산</small><b>${wonShort(metalValue())}</b></div>
    </section>
    <section class="section"><h3>부동산</h3><div class="asset-cards">${cards}</div></section>
    <section class="section"><h3>실물자산 (금·은)</h3><div class="asset-cards">${metals}</div></section>
    <section class="section"><div class="panel muted-sm">임대 수익은 60초마다, 유지비는 같은 주기로 차감됩니다. 부동산 가격은 15초마다 변동하며, 환생의 임대 노하우 업그레이드가 월세에 적용됩니다.</div></section>`;
}

// ── 기업 경영 ───────────────────────────────────────────────
function rivalsSection(c){
  const owned=(c&&c.acquired)||{};
  const totalUpkeep=RIVALS.filter(r=>owned[r.id]).reduce((a,r)=>a+r.upkeep,0);
  const totalRisk=RIVALS.filter(r=>owned[r.id]).reduce((a,r)=>a+r.risk,0);
  const rows=RIVALS.map(r=>{
    const done=!!owned[r.id];
    return `<div class="panel" style="margin-bottom:8px">
      <div class="company-head" style="align-items:center"><div><b>${r.name}</b> <span class="pill">${won(r.cost)}</span></div><span class="pill">${done?"인수 완료":"미인수"}</span></div>
      <p class="muted-sm" style="margin:6px 0"><b class="up">이득</b> ${r.benefit}</p>
      <p class="muted-sm" style="margin:0"><b class="down">위협</b> ${r.threat}</p>
      <div class="button-row" style="margin-top:8px"><button class="${done?"ghost":"buy"}" onclick="acquireRival('${r.id}')" ${done?"disabled":""}>${done?"인수 완료":"인수하기"}</button></div>
    </div>`;
  }).join("");
  return `<section class="section"><div class="section-head"><h3>인수합병</h3><span class="pill">유지비 ${won(totalUpkeep)}/30초 · 변동성 +${(totalRisk*100).toFixed(1)}%p</span></div>
    <div class="notice">인수하면 기업 가치·매출·배당이 늘지만, <b>유지비</b>가 30초마다 현금에서 나가고 <b>기업 가치 변동성(위협)</b>도 커집니다. 유지비는 현금이 바닥나면 0원까지만 빠집니다.</div>
    ${rows}</section>`;
}

function settingRow(label,desc,control){
  return `<div class="setting-row"><div class="setting-copy"><b>${label}</b><small>${desc||""}</small></div><div class="setting-control">${control}</div></div>`;
}
function settingToggle(key,label,desc){
  return settingRow(label,desc,`<label class="toggle"><input type="checkbox" ${state.settings[key]!==false?"checked":""} onchange="setSetting('${key}',this.checked)"><span></span></label>`);
}
function notifyToggle(key,label){
  return `<label class="notify-toggle"><input type="checkbox" ${state.notify[key]!==false?"checked":""} onchange="setNotify('${key}',this.checked)"><span>${label}</span></label>`;
}
function notifySoundToggle(key,label){

}

// ── 환생 ────────────────────────────────────────────────────
function rebirthEffectText(u,nextLevel){
  switch(u.id){
    case "start": return `시작 자금 ${won(START_CASH+2000000*nextLevel)} (기본 0원)`;
    case "stock": return `주식 매도 이익 +${nextLevel*2}%`;
    case "deposit": return `예금·적금 이자 +${nextLevel*3}%`;
    case "dividend": return `배당금 +${nextLevel*3}%`;

let swUpdateReady=false, swUpdateApplied=false, swLastInput=0;
function swUpdateMarkInput(){ swLastInput=Date.now(); }
function swUpdateBusy(){
  try{
    if(typeof document==="undefined") return false;
    if(document.visibilityState && document.visibilityState!=="visible") return true; // 백그라운드 탭
    if(typeof multiTab!=="undefined" && multiTab) return true; // 다른 탭이 저장 중이라 이 탭은 저장이 잠김
    if(document.querySelector && document.querySelector("#modalRoot.on, .modal.on, dialog[open], .modal.show, .modal-backdrop")) return true; // 확인·주문·노동 창
    const el=document.activeElement, tag=(el&&el.tagName)||"";
    if(/^(INPUT|SELECT|TEXTAREA)$/.test(tag)) return true; // 주문 입력 중
    if(swLastInput && Date.now()-swLastInput<2500) return true; // 막 누른 직후
  }catch(e){}
  return false;
}
function swUpdateApply(){
  if(!swUpdateReady||swUpdateApplied) return false;
  if(swUpdateBusy()) return false;
  swUpdateApplied=true;
  try{ saveGame(); }catch(e){}
  try{ if(typeof location!=="undefined" && location.reload) location.reload(); }catch(e){}
  return true;
}
function swUpdateNotify(){ swUpdateReady=true; swUpdateApply(); }
